<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brick by Brick · 100 Days of Python</title>
  <meta name="description" content="One brick for every course day of 100 Days of Python. Lay the next stone when you finish a day.">
  <meta name="theme-color" content="#2b1b4a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236b3416'/%3E%3Crect x='3' y='5' width='26' height='9' rx='1.5' fill='%23e8bb72'/%3E%3Crect x='3' y='17' width='12' height='9' rx='1.5' fill='%23d7a45a'/%3E%3Crect x='17' y='17' width='12' height='9' rx='1.5' fill='%23e2b56e'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #3a1d0a;
      --cream: #fff3d6;
      --gold: #ffd27a;
      --sand: #d7a45a;
      --bw: 36px;
      --bh: 17px;
      --gap: 3px;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Liberation Serif", "DejaVu Serif", serif;
      background:
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(255, 236, 190, 0.45), transparent 60%),
        linear-gradient(#241538 0%, #4a2158 16%, #c2557a 34%, #f2a65a 56%, #f6d08a 72%, #e7c07a 100%);
      background-attachment: fixed;
    }

    .scenery {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
    }

    html, body { overflow-x: clip; }

    .stars {
      position: fixed;
      z-index: 0;
      inset: 0 0 55% 0;
      background-image:
        radial-gradient(1.2px 1.2px at 8% 22%, rgba(255, 250, 230, 0.9) 50%, transparent 52%),
        radial-gradient(1px 1px at 18% 48%, rgba(255, 250, 230, 0.7) 50%, transparent 52%),
        radial-gradient(1.4px 1.4px at 27% 16%, rgba(255, 250, 230, 0.85) 50%, transparent 52%),
        radial-gradient(1px 1px at 36% 38%, rgba(255, 250, 230, 0.55) 50%, transparent 52%),
        radial-gradient(1.2px 1.2px at 48% 12%, rgba(255, 250, 230, 0.75) 50%, transparent 52%),
        radial-gradient(1px 1px at 57% 30%, rgba(255, 250, 230, 0.5) 50%, transparent 52%),
        radial-gradient(1.3px 1.3px at 63% 18%, rgba(255, 250, 230, 0.8) 50%, transparent 52%),
        radial-gradient(1px 1px at 78% 42%, rgba(255, 250, 230, 0.45) 50%, transparent 52%),
        radial-gradient(1.2px 1.2px at 88% 14%, rgba(255, 250, 230, 0.7) 50%, transparent 52%),
        radial-gradient(1px 1px at 94% 34%, rgba(255, 250, 230, 0.55) 50%, transparent 52%);
    }

    .sun-wrap {
      position: fixed;
      z-index: 0;
      top: 13%;
      right: 8%;
      width: min(18vw, 132px);
      aspect-ratio: 1;
    }

    .rays {
      position: absolute;
      inset: -42%;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 214, 130, 0.38) 0deg 8deg,
        transparent 8deg 20deg
      );
      mask-image: radial-gradient(circle, #000 0 42%, transparent 68%);
      animation: spin 90s linear infinite;
    }

    .sun {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%, #fffceb 0%, #ffe7a3 32%, #ffcf6b 68%, #f2a84a 100%);
      box-shadow:
        0 0 40px 16px rgba(255, 206, 110, 0.55),
        0 0 120px 40px rgba(255, 170, 80, 0.28);
    }

    .cloud {
      position: fixed;
      z-index: 0;
      border-radius: 50%;
      background: rgba(255, 236, 214, 0.28);
      filter: blur(6px);
    }

    .cloud-a {
      width: 200px;
      height: 42px;
      top: 20%;
      left: 10%;
      animation: drift 80s ease-in-out infinite alternate;
    }

    .cloud-b {
      width: 130px;
      height: 28px;
      top: 30%;
      left: 34%;
      opacity: 0.7;
      animation: drift 100s ease-in-out infinite alternate-reverse;
    }

    .dune {
      position: fixed;
      z-index: 1;
      left: -15%;
      width: 130%;
      border-radius: 50% 50% 0 0;
    }

    .dune-back {
      bottom: 4vh;
      height: 24vh;
      background: linear-gradient(#efc98a, #e0b06a);
      opacity: 0.95;
    }

    .dune-mid {
      bottom: -6vh;
      height: 22vh;
      left: -28%;
      background: linear-gradient(#e7b56e, #d09a52);
    }

    .dune-front {
      z-index: 1;
      bottom: -14vh;
      height: 26vh;
      background: linear-gradient(#e8c07a, #c99245 70%, #c4843c);
    }

    header {
      position: relative;
      z-index: 3;
      padding: 22px 20px 0;
      text-align: center;
    }

    .back {
      position: absolute;
      left: 18px;
      top: 18px;
      color: var(--cream);
      font-size: 14px;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(58, 29, 10, 0.45);
    }

    .back:hover { color: #fff; }

    h1 {
      margin: 0;
      color: var(--cream);
      font-size: clamp(22px, 6.4vw, 56px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.05;
      text-shadow: 2px 3px 0 #6b3416, 0 10px 24px rgba(60, 16, 30, 0.28);
    }

    h1::after {
      content: "";
      display: block;
      width: min(240px, 46vw);
      height: 2px;
      margin: 10px auto 0;
      background: linear-gradient(90deg, transparent, rgba(255, 226, 154, 0.95), transparent);
    }

    .sub {
      margin: 10px auto 0;
      color: var(--cream);
      font-size: clamp(12px, 1.7vw, 18px);
      letter-spacing: 0.11em;
      line-height: 1.45;
      text-shadow: 0 1px 0 rgba(80, 30, 20, 0.45);
    }

    .stats {
      position: fixed;
      z-index: 4;
      top: 118px;
      left: 28px;
      width: min(270px, calc(100vw - 36px));
      padding: 14px 16px 12px;
      border: 1px solid rgba(255, 227, 170, 0.2);
      border-radius: 12px;
      background: rgba(40, 20, 10, 0.62);
      color: var(--cream);
      box-shadow: 0 12px 30px rgba(40, 16, 8, 0.28);
      backdrop-filter: blur(8px);
      text-align: left;
    }

    .stats p {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 15.5px;
      line-height: 1.7;
    }

    .ico {
      width: 16px;
      height: 16px;
      flex: none;
    }

    main {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 12px 6px;
    }

    .banner {
      margin: 0 0 8px;
      text-align: center;
    }

    .banner p {
      margin: 0;
      color: #fff8dc;
      font-size: clamp(22px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1.15;
      text-shadow:
        0 0 18px rgba(255, 214, 120, 0.95),
        2px 3px 0 #6b3416;
      animation: banner-in 0.7s ease both;
    }

    #pyramid {
      position: relative;
      filter: drop-shadow(0 10px 8px rgba(90, 48, 16, 0.18));
    }

    .row {
      display: flex;
      justify-content: center;
      gap: var(--gap);
      margin-top: var(--gap);
    }

    .row:first-child { margin-top: 0; }

    .cell {
      width: var(--bw);
      height: var(--bh);
      flex: none;
      position: relative;
      border-radius: 2px;
      cursor: help;
    }

    .brick {
      border: 1px dashed rgba(90, 50, 20, 0.42);
      background: rgba(255, 248, 230, 0.07);
    }

    .brick.laid {
      border: 1px solid #8a5a26;
      background: linear-gradient(180deg, #f3d7a4 0%, #e4b56e 46%, #c48a45 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 246, 220, 0.8),
        inset 0 -3px 0 rgba(90, 48, 16, 0.16);
    }

    .brick.laid::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 46%;
      height: 1px;
      background: rgba(90, 48, 16, 0.22);
    }

    .brick.newest {
      z-index: 1;
      border-color: #d4923a;
      background: linear-gradient(180deg, #fff6c8 0%, #ffd56a 42%, #f0a84a 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 240, 0.95),
        0 0 16px 4px rgba(255, 206, 110, 0.95);
    }

    .brick.just-laid {
      animation: settle 0.62s cubic-bezier(0.18, 0.85, 0.22, 1) both;
    }

    .brick.removing {
      animation: lift 0.28s ease-in forwards;
    }

    .cap {
      border-radius: 0;
      background: linear-gradient(#fff4b8, #e5b53a);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      opacity: 0.4;
    }

    body.complete .brick.laid,
    body.complete .brick.newest {
      border-color: #a87420;
      background: linear-gradient(180deg, #fff7cc 0%, #f3c75e 46%, #e0a434 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 252, 230, 0.95),
        0 0 12px rgba(255, 210, 110, 0.55);
    }

    body.complete .cap {
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(255, 214, 120, 0.95));
    }

    #pyramid::after {
      content: "";
      display: block;
      width: 78%;
      height: 16px;
      margin: 4px auto 0;
      background: radial-gradient(ellipse at center, rgba(90, 48, 16, 0.28), transparent 70%);
    }

    .actions {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(224, 181, 106, 0), rgba(212, 158, 78, 0.55) 30%, rgba(206, 148, 68, 0.92));
    }

    .lay {
      min-height: 48px;
      padding: 12px 28px;
      border: 2px solid var(--gold);
      border-radius: 8px;
      background: var(--ink);
      color: var(--gold);
      font-family: inherit;
      font-size: clamp(14px, 3.5vw, 18px);
      letter-spacing: 0.14em;
      cursor: pointer;
      box-shadow: 0 8px 0 #2a1407, 0 14px 24px rgba(58, 29, 10, 0.28);
      touch-action: manipulation;
    }

    .lay:hover:not(:disabled) { transform: translateY(-2px); }

    .lay:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2a1407, 0 6px 12px rgba(58, 29, 10, 0.25);
    }

    .lay:disabled {
      cursor: default;
      color: #fff6d8;
      border-color: #fff1c2;
      background: #6a4a16;
    }

    .undo {
      min-height: 44px;
      padding: 8px 14px;
      border: 0;
      background: transparent;
      color: #4a2810;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .undo:hover:not(:disabled) { color: #2a1407; }

    .undo:disabled {
      opacity: 0.45;
      cursor: default;
      text-decoration: none;
    }

    .back:focus-visible,
    .lay:focus-visible,
    .undo:focus-visible,
    .cell:focus-visible {
      outline: 3px solid #fff6d2;
      outline-offset: 3px;
    }

    .tip {
      position: fixed;
      z-index: 30;
      max-width: calc(100vw - 16px);
      padding: 6px 10px;
      border: 1px solid rgba(255, 210, 122, 0.5);
      border-radius: 7px;
      background: rgba(40, 20, 10, 0.94);
      color: var(--cream);
      font-size: 13.5px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(40, 16, 8, 0.35);
    }

    .motes {
      position: fixed;
      inset: 0;
      z-index: 6;
      overflow: hidden;
      pointer-events: none;
    }

    .mote {
      position: absolute;
      top: -12px;
      width: 8px;
      height: 8px;
      background: #ffe7a8;
      opacity: 0;
      animation: fall linear forwards;
    }

    .mote.dot { border-radius: 50%; background: #fff6d0; }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes drift {
      from { transform: translateX(-18px); }
      to { transform: translateX(28px); }
    }

    @keyframes settle {
      0% {
        transform: translateY(calc(var(--bh) * -3.4)) scale(1.05, 0.92);
        opacity: 0;
      }
      58% {
        transform: translateY(3px) scale(0.98, 1.06);
        opacity: 1;
      }
      78% { transform: translateY(-2px) scale(1.02, 0.98); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes lift {
      to {
        transform: translateY(calc(var(--bh) * -2.2));
        opacity: 0;
      }
    }

    @keyframes gold-pulse {
      0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 252, 230, 0.95), 0 0 8px rgba(255, 210, 110, 0.4); }
      50% { box-shadow: inset 0 1px 0 #fff, 0 0 16px rgba(255, 226, 140, 0.9); }
    }

    @keyframes banner-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translateY(108vh) rotate(220deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: no-preference) {
      body.complete .brick.laid:not(.just-laid) {
        animation: gold-pulse 2.8s ease-in-out infinite;
        animation-delay: calc(var(--day) * 16ms);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rays, .cloud, .brick.just-laid, .brick.removing, .banner p { animation: none; }
    }

    @media (max-width: 980px) {
      .back {
        position: static;
        display: inline-block;
        margin: 0 0 8px;
      }

      header { padding-top: 14px; }

      .stats {
        position: relative;
        top: auto;
        left: auto;
        width: min(460px, calc(100% - 28px));
        margin: 14px auto 0;
      }

      .sun-wrap {
        top: auto;
        bottom: 34%;
        right: 10px;
        width: 72px;
        opacity: 0.95;
      }

      .cloud-b { display: none; }

      main { justify-content: center; }
    }

    @media (max-width: 720px) {
      .sub { letter-spacing: 0.04em; padding-inline: 8px; }
    }

    @media (max-width: 420px) {
      h1 { letter-spacing: 0.06em; }
      header { padding-inline: 12px; }
      .lay { letter-spacing: 0.08em; padding-inline: 16px; }
      .stats p { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="scenery" aria-hidden="true">
    <div class="stars"></div>
    <div class="sun-wrap">
      <div class="rays"></div>
      <div class="sun"></div>
    </div>
    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
    <div class="dune dune-back"></div>
    <div class="dune dune-mid"></div>
    <div class="dune dune-front"></div>
  </div>

  <header>
    <a class="back" href="../index.html">← Arcade</a>
    <h1>BRICK BY BRICK</h1>
    <p class="sub" id="subtitle" aria-live="polite"></p>
  </header>

  <section class="stats" id="stats" aria-label="Progress"></section>

  <main>
    <div class="banner" id="banner" hidden>
      <p>PYRAMID COMPLETE</p>
    </div>
    <div id="pyramid"></div>
  </main>

  <div class="actions">
    <button class="lay" id="lay" type="button">I FINISHED A COURSE DAY</button>
    <button class="undo" id="undo" type="button">Undo last brick</button>
  </div>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <p class="sr" id="live" aria-live="polite"></p>
  <div class="motes" id="motes" aria-hidden="true"></div>

  <script>
    "use strict";

    const TOTAL = 100;
    const BASE = 13;
    const STORAGE_KEY = "brick-by-brick";
    const SEED_COUNT = 15;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const model = buildModel();
    const brickRowCount = model.rows.filter((row) => row.cells.some((cell) => cell.kind === "brick")).length;

    const subtitleEl = document.getElementById("subtitle");
    const statsEl = document.getElementById("stats");
    const pyramidEl = document.getElementById("pyramid");
    const bannerEl = document.getElementById("banner");
    const layBtn = document.getElementById("lay");
    const undoBtn = document.getElementById("undo");
    const tipEl = document.getElementById("tip");
    const liveEl = document.getElementById("live");
    const motesEl = document.getElementById("motes");

    let state = load();
    let busy = false;

    buildPyramid();
    paint();
    layout();

    layBtn.addEventListener("click", layBrick);
    undoBtn.addEventListener("click", undoBrick);
    window.addEventListener("resize", () => requestAnimationFrame(layout));
    window.addEventListener("scroll", hideTip, { passive: true });

    pyramidEl.addEventListener("pointerover", (event) => {
      const cell = event.target.closest(".cell");
      if (cell) showTip(cell);
    });
    pyramidEl.addEventListener("pointerout", (event) => {
      const cell = event.target.closest(".cell");
      if (!cell || tipEl.dataset.pin === cellId(cell)) return;
      const next = event.relatedTarget && event.relatedTarget.closest
        ? event.relatedTarget.closest(".cell")
        : null;
      if (next !== cell) hideTip();
    });
    pyramidEl.addEventListener("click", (event) => {
      const cell = event.target.closest(".cell");
      if (!cell) return;
      if (!tipEl.hidden && tipEl.dataset.pin === cellId(cell)) {
        hideTip();
        return;
      }
      showTip(cell);
      tipEl.dataset.pin = cellId(cell);
    });
    document.addEventListener("pointerdown", (event) => {
      if (!event.target.closest(".cell")) hideTip();
    });

    function buildModel() {
      // 13 + 12 + … + 1 = 91. One extra course of 12, just above the base,
      // makes 103 slots: 100 course-day bricks, and the peak (2 + 1) is the capstone.
      const bottomToTop = [];
      for (let width = BASE; width >= 1; width -= 1) bottomToTop.push(width);
      bottomToTop.splice(1, 0, BASE - 1);

      let day = 1;
      const rows = bottomToTop.map((width) => {
        const cells = [];
        for (let i = 0; i < width; i += 1) {
          if (day <= TOTAL) cells.push({ kind: "brick", day: day++ });
          else cells.push({ kind: "cap" });
        }
        return { width, cells };
      });

      const laidSlots = rows.reduce((sum, row) => sum + row.cells.filter((cell) => cell.kind === "brick").length, 0);
      if (laidSlots !== TOTAL) {
        console.error("Pyramid should hold " + TOTAL + " bricks, got " + laidSlots);
      }
      return { rows };
    }

    function buildPyramid() {
      const frag = document.createDocumentFragment();
      for (let r = model.rows.length - 1; r >= 0; r -= 1) {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        model.rows[r].cells.forEach((cell) => {
          const el = document.createElement("div");
          if (cell.kind === "cap") {
            el.className = "cell cap";
            el.dataset.kind = "cap";
            el.setAttribute("role", "img");
            el.setAttribute("aria-label", "Golden capstone");
          } else {
            el.className = "cell brick";
            el.dataset.kind = "brick";
            el.dataset.day = String(cell.day);
            el.style.setProperty("--day", String(cell.day));
            const shade = ((cell.day * 17) % 7) - 3;
            el.style.filter = "brightness(" + (1 + shade * 0.012) + ")";
          }
          rowEl.appendChild(el);
        });
        frag.appendChild(rowEl);
      }
      pyramidEl.appendChild(frag);
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return seed();
        const data = JSON.parse(raw);
        if (!data || typeof data.count !== "number" || !Array.isArray(data.dates)) return seed();
        const count = clampCount(data.count);
        const dates = data.dates.slice(0, count).map(cleanDate);
        while (dates.length < count) dates.push(null);
        return { count, dates };
      } catch (error) {
        return seed();
      }
    }

    function seed() {
      return { count: SEED_COUNT, dates: Array(SEED_COUNT).fill(null) };
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          version: 1,
          count: state.count,
          dates: state.dates
        }));
      } catch (error) {
        /* Private mode can refuse storage. The pyramid still works for this visit. */
      }
    }

    function clampCount(value) {
      if (!Number.isFinite(value)) return SEED_COUNT;
      return Math.max(0, Math.min(TOTAL, Math.floor(value)));
    }

    function cleanDate(value) {
      return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : null;
    }

    function layBrick() {
      if (busy || state.count >= TOTAL) return;
      state.count += 1;
      state.dates.push(todayISO());
      save();
      paint({ animateDay: state.count });
      layout();
      if (state.count === TOTAL) {
        announce("Pyramid complete.");
        if (!reduceMotion) celebrate();
      } else {
        announce("Laid day " + state.count + ". " + (TOTAL - state.count) + " bricks to complete the pyramid.");
      }
    }

    function undoBrick() {
      if (busy || state.count <= 0) return;
      const day = state.count;
      const brick = pyramidEl.querySelector('.brick[data-day="' + day + '"]');
      const finish = () => {
        state.count -= 1;
        state.dates.pop();
        save();
        busy = false;
        paint();
        layout();
        announce("Removed day " + day + ".");
      };
      if (!brick || reduceMotion) {
        finish();
        return;
      }
      busy = true;
      layBtn.disabled = true;
      undoBtn.disabled = true;
      brick.classList.add("removing");
      brick.classList.remove("just-laid");
      let settled = false;
      const done = () => {
        if (settled) return;
        settled = true;
        finish();
      };
      brick.addEventListener("animationend", done, { once: true });
      window.setTimeout(done, 420);
    }

    function paint(options) {
      const animateDay = options && options.animateDay;
      document.body.classList.toggle("complete", state.count === TOTAL);
      document.body.dataset.count = String(state.count);
      subtitleEl.textContent = subtitle(state.count);
      bannerEl.hidden = state.count < TOTAL;
      pyramidEl.setAttribute("aria-label", state.count + " of " + TOTAL + " bricks laid");

      pyramidEl.querySelectorAll(".brick").forEach((el) => {
        const day = Number(el.dataset.day);
        const laid = day <= state.count;
        el.classList.toggle("laid", laid);
        el.classList.toggle("newest", state.count > 0 && day === state.count);
        el.classList.remove("removing");
        const tip = tipForDay(day);
        el.dataset.tip = tip;
        el.setAttribute("aria-label", tip);
        if (animateDay === day) {
          el.classList.remove("just-laid");
          void el.offsetWidth;
          el.classList.add("just-laid");
        } else {
          el.classList.remove("just-laid");
        }
      });

      renderStats();
      layBtn.disabled = busy || state.count >= TOTAL;
      undoBtn.disabled = busy || state.count <= 0;
      layBtn.textContent = state.count >= TOTAL ? "PYRAMID COMPLETE" : "I FINISHED A COURSE DAY";
    }

    function renderStats() {
      const left = TOTAL - state.count;
      const next = state.count >= TOTAL ? "Done" : "Day " + (state.count + 1);
      const row = "Row " + currentRow(state.count) + " of " + brickRowCount;
      const streak = streakLabel(state.dates);
      const last = lastLaidLabel();
      const rows = [
        [iconBrick(), "Course days done: " + state.count],
        [iconBook(), "Next up: " + next],
        [iconFlame(), "Daily streak: " + streak.text, streak.title],
        [iconPin(), row],
        [iconCalendar(), "Last laid: " + last]
      ];
      statsEl.replaceChildren();
      rows.forEach(([icon, text, title]) => {
        const p = document.createElement("p");
        p.appendChild(icon);
        const span = document.createElement("span");
        span.textContent = text;
        p.appendChild(span);
        if (title) p.title = title;
        statsEl.appendChild(p);
      });
    }

    function subtitle(count) {
      const left = TOTAL - count;
      const words = left === 1
        ? "1 BRICK TO COMPLETE THE PYRAMID"
        : left + " BRICKS TO COMPLETE THE PYRAMID";
      return "COURSE DAY " + count + " OF 100 · " + words;
    }

    function currentRow(count) {
      if (count <= 0) return 1;
      for (let i = 0; i < model.rows.length; i += 1) {
        if (model.rows[i].cells.some((cell) => cell.day === count)) return i + 1;
      }
      return brickRowCount;
    }

    function tipForDay(day) {
      if (day > state.count) return "Day " + day + ", not laid yet";
      const iso = state.dates[day - 1];
      if (!iso) return "Day " + day + ", laid before tracking";
      return "Day " + day + ", laid " + prettyDate(iso);
    }

    function lastLaidLabel() {
      if (state.count <= 0) return "—";
      const iso = state.dates[state.count - 1];
      if (!iso) return "before tracking";
      return prettyDate(iso);
    }

    function streakLabel(dates) {
      const title = "Calendar days in a row with a course day logged.";
      const days = new Set(dates.filter(Boolean));
      if (!days.size) return { text: "0", title: title };
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let cursor = new Date(today);
      if (!days.has(toISO(cursor))) {
        cursor.setDate(cursor.getDate() - 1);
        if (!days.has(toISO(cursor))) return { text: "0", title: title };
      }
      let n = 0;
      while (days.has(toISO(cursor))) {
        n += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return { text: String(n), title: title };
    }

    function todayISO() {
      return toISO(new Date());
    }

    function toISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }

    function prettyDate(iso) {
      const parts = iso.split("-").map(Number);
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      return date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function celebrate() {
      motesEl.replaceChildren();
      const colors = ["#fff6c8", "#ffe29a", "#f0c14a", "#fff"];
      for (let i = 0; i < 42; i += 1) {
        const mote = document.createElement("div");
        mote.className = "mote" + (i % 3 === 0 ? " dot" : "");
        mote.style.left = Math.random() * 100 + "%";
        mote.style.background = colors[i % colors.length];
        mote.style.animationDuration = (2.4 + Math.random() * 1.8) + "s";
        mote.style.animationDelay = (Math.random() * 0.35) + "s";
        const size = 5 + Math.random() * 7;
        mote.style.width = size + "px";
        mote.style.height = size + "px";
        motesEl.appendChild(mote);
      }
      window.setTimeout(() => motesEl.replaceChildren(), 4600);
    }

    function announce(message) {
      liveEl.textContent = message;
    }

    function showTip(cell) {
      const text = cell.dataset.tip || cell.getAttribute("aria-label");
      if (!text) return;
      tipEl.textContent = text;
      tipEl.hidden = false;
      const rect = cell.getBoundingClientRect();
      const tipRect = tipEl.getBoundingClientRect();
      let left = rect.left + rect.width / 2 - tipRect.width / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
      let top = rect.top - tipRect.height - 8;
      if (top < 8) top = Math.min(window.innerHeight - tipRect.height - 8, rect.bottom + 8);
      tipEl.style.left = left + "px";
      tipEl.style.top = top + "px";
    }

    function hideTip() {
      tipEl.hidden = true;
      delete tipEl.dataset.pin;
    }

    function cellId(cell) {
      return cell.dataset.day || cell.dataset.kind || "cell";
    }

    function layout() {
      const narrow = window.innerWidth < 980;
      const header = document.querySelector("header");
      const actions = document.querySelector(".actions");
      const cols = BASE;
      const rowCount = model.rows.length;
      const viewW = document.documentElement.clientWidth || window.innerWidth;
      let availW = Math.min(viewW - (narrow ? 28 : 48), 780);
      if (!narrow) availW = Math.min(availW, Math.floor(viewW * 0.7));
      const gap = availW < 460 ? 2 : 3;
      let bw = Math.floor((availW - gap * (cols - 1)) / cols);
      let bh = Math.max(8, Math.round(bw * 0.46));
      const bannerSpace = state.count === TOTAL ? 52 : 0;
      const statsSpace = narrow ? statsEl.offsetHeight + 16 : 0;
      const used = header.offsetHeight + actions.offsetHeight + statsSpace + bannerSpace + 24;
      const availH = window.innerHeight - used;
      const natural = rowCount * bh + (rowCount - 1) * gap;
      if (availH > 140 && natural > availH) {
        bh = Math.floor((availH - (rowCount - 1) * gap) / rowCount);
        bw = Math.min(bw, Math.max(12, Math.round(bh / 0.42)));
      }
      if (bh < 11) {
        bh = 11;
        bw = Math.max(18, Math.min(bw, Math.floor((viewW - 24 - gap * (cols - 1)) / cols)));
      }
      document.documentElement.style.setProperty("--bw", bw + "px");
      document.documentElement.style.setProperty("--bh", bh + "px");
      document.documentElement.style.setProperty("--gap", gap + "px");
    }

    function iconBrick() {
      return svg('<rect x="1" y="1.5" width="14" height="5.2" rx="1" fill="#f0d09a"/><rect x="1" y="8.4" width="6.4" height="5.4" rx="1" fill="#e2b56e"/><rect x="8.6" y="8.4" width="6.4" height="5.4" rx="1" fill="#e8c48a"/>');
    }

    function iconBook() {
      return svg('<path fill="#8ec0ff" d="M1.6 2.2h5.2c.6 0 1 .2 1.2.7.2-.5.6-.7 1.2-.7h5.2v9.4h-4.7c-.6 0-1 .2-1.3.7-.3-.5-.7-.7-1.3-.7H1.6V2.2z"/>');
    }

    function iconFlame() {
      return svg('<path fill="#ff8a3d" d="M8 1.1s2.7 2.8 2.7 5.6c0 1-.3 1.8-.9 2.3.6-.3 1-1 1.1-1.6.8.7 1.4 1.8 1.4 3 0 2.5-1.9 4.3-4.3 4.3S3.7 12.9 3.7 10.4C3.7 7.4 5.6 5 8 1.1z"/><path fill="#ffe29a" d="M8 7.6c1 .9 1.6 1.8 1.6 2.8 0 1-.7 1.8-1.6 1.8s-1.6-.8-1.6-1.8c0-1 .6-1.9 1.6-2.8z"/>');
    }

    function iconPin() {
      return svg('<path fill="#ff7d7d" d="M8 1.2a3.8 3.8 0 0 0-3.8 3.8c0 2.9 3.8 7.6 3.8 7.6s3.8-4.7 3.8-7.6A3.8 3.8 0 0 0 8 1.2z"/><circle cx="8" cy="5" r="1.45" fill="#3a1d0a"/>');
    }

    function iconCalendar() {
      return svg('<rect x="2" y="3" width="12" height="11" rx="1.4" fill="#ffe29a"/><path d="M2 6.6h12" stroke="#6b3416" stroke-width="1.2"/><path d="M5 1.8v2.5M11 1.8v2.5" stroke="#6b3416" stroke-width="1.3" stroke-linecap="round"/>');
    }

    function svg(inner) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      el.setAttribute("viewBox", "0 0 16 16");
      el.setAttribute("aria-hidden", "true");
      el.classList.add("ico");
      el.innerHTML = inner;
      return el;
    }
  </script>
</body>
</html>
