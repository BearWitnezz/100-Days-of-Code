class, on top of Fish's own nemo.swim()."], ["How do you keep a parent's breathe() but add something extra in Fish?", "Define breathe() again in Fish, call super().breathe() first to do everything the Animal version does, then add the extra part, like printing \"doing this underwater\"."], ["Why is inheritance useful, according to the lesson?", "You can take a class that you or somebody else made and build on it without reinventing the wheel or redefining everything in that class. Next it's used to upgrade Turtle into Food and a Scoreboard."], ["How should the Food class get its turtle powers?", "Inherit from Turtle with class Food(Turtle): and call super().__init__() in Food's __init__. Don't make a turtle attribute like self.food = Turtle(); Food itself should be a souped-up turtle."], ["How do you make the food a 10 by 10 circle?", "A turtle is normally 20 by 20, so use shapesize with stretch_len=0.5 and stretch_wid=0.5 to halve both the length and the width."], ["Why set the food's speed to \"fastest\"?", "So you don't watch the animation of the food being created at the center and then moving to its spot."], ["Why pick the food's spot with random.randint(-280, 280) instead of -300 to 300?", "The 600 by 600 screen goes from -300 to 300, but food right at the edge is really hard to reach and the snake would probably just die on the wall. So stay in -280 to 280 for both x and y."], ["How does main.py detect that the snake ate the food?", "In the game loop after snake.move(), check if snake.head.distance(food) < 15. The food is 10 by 10, so 15 adds a little buffer. The lesson first printed \"nom nom nom\" to test it."], ["Why is the food's move method called refresh() and not reset()?", "reset is already a method of the Turtle class Food inherits from. refresh() is our own method that picks a new random x and y and goes there. Call self.refresh() in __init__ and food.refresh() in main.py when the head hits the food."], ["Does the food lesson make the snake grow when it eats?", "No. Growing is left until the very end of the project, together with detecting collision with the tail."], ["What is the scoreboard, and how is it built?", "A Scoreboard class in scoreboard.py that inherits from Turtle (class Scoreboard(Turtle): with super().__init__()). It keeps self.score starting at 0 and writes it on screen with self.write."], ["How should the font argument in write() be written?", "As a tuple of name, size, and style, like (\"Arial\", 24, \"normal\"), not one single string. The size is a number and the name and style are strings."], ["Why must the scoreboard turn white before it writes?", "Text keeps the color the turtle had when it was written. If it writes in black and then turns white, the text stays black and you can't see it on the black screen."], ["How do you put the score at the top center without a line or arrow?", "Before writing: hideturtle() so the arrow disappears, penup() so it doesn't draw a path, then go to x 0 and y around 270. Moving after write is too late."], ["What does increase_score() do, and where is it called?", "It adds 1 to self.score and writes the score again. main.py calls scoreboard.increase_score() inside the food-collision if, next to food.refresh()."], ["Why did the scores pile up on top of each other, and what's the fix?", "Each new score was written over the old one. Call self.clear() to wipe this turtle's previous text before writing the new score."], ["Why pull the write into an update_scoreboard() method?", "The same write line was needed in two places, __init__ and increase_score. Now both call self.update_scoreboard() instead."], ["Why make ALIGNMENT and FONT constants at the top of scoreboard.py?", "So the text settings aren't hard-coded in the body. To change something, like switching Arial to the more video-gamey Courier, you just fix it at the top."], ["How do you detect the snake hitting the wall?", "Check if snake.head's x is greater than 280 or less than -280, or its y is greater than 280 or less than -280. If any of the four is true, the snake hit the wall: set game_is_on = False to leave the while loop so the snake stops."], ["Why 280 for the wall instead of 300?", "The screen goes to 300 and -300, and 280 is just what worked after a lot of testing. It isn't perfect; with games you test it, run it, and adjust."], ["What does the scoreboard's game_over() method do?", "It goes to the center (0, 0) and writes \"GAME OVER\" with the same alignment and font as the score."], ["Why doesn't game_over() call clear() first?", "So the score written earlier stays at the top. The player sees GAME OVER and their final score."], ["What does add_segment(position) do, and how does create_snake use it?", "It holds the code that creates one segment at a given position, pulled out of the create_snake for loop. create_snake now loops the starting positions and calls self.add_segment(position)."], ["How does extend() know where to put the new segment?", "It adds a segment at the same position as the last one: self.segments[-1].position(). -1 counts from the end, so [1, 2, 3][-1] is 3, and position() is a Turtle method so it needs parentheses."], ["What changes in main.py so the snake grows?", "In the food-collision if, call snake.extend() along with food.refresh() (and the score increase)."], ["How do you detect the head hitting the tail?", "Loop through the segments, and if snake.head.distance(segment) < 10, set game_is_on = False and call scoreboard.game_over()."], ["Why does looping over every segment cause instant game over?", "The head is the first segment, so the loop checks the head's distance to itself, which is always less than 10. Skip the head: if segment == snake.head: pass, then elif for the distance check."], ["What is slicing?", "Getting a section of a list (or tuple) with square brackets and a start and end position, like piano_keys[2:5], instead of writing a loop that checks each item."], ["Why does piano_keys[2:5] give c, d, e and not f?", "Picture the positions as cuts between items: 0 is before a and 7 is after g. Slicing from cut 2 to cut 5 keeps c, d, e. The end position isn't included."], ["What do piano_keys[2:] and piano_keys[:5] give?", "Omit the end, [2:], to get everything from position 2 to the end. Omit the start, [:5], to get everything from the beginning up to position 5."], ["What does a third number in a slice do?", "It sets the increment. [2:5:2] gives c and e (every other item), and [::2] goes through the whole list taking every second item: a, c, e, g."], ["How do you reverse a list with slicing?", "Use -1 as the increment: [::-1]. It goes from the end back to the beginning."], ["Does slicing work on tuples?", "Yes, the same square-bracket slicing works. The lesson's piano tuple sliced [2:5] gave mi, fa, so."], ["How does slicing replace the if/pass in the tail check?", "Loop over the segments from position 1 to the end, for segment in snake.segments[1:]:, so the head is left out. Then one single if checks head.distance(segment) < 10."]]}, {"day": 22, "cards": [["How do you set up the Pong screen?", "Create a Screen, then screen.setup(width=800, height=600) and screen.bgcolor(\"black\"). screen.exitonclick() at the bottom keeps the window from flashing and disappearing. The lesson also sets an optional title, screen.title(\"Pong\")."], ["Why does the window need exitonclick()?", "Without it, the window flashes and disappears as soon as the program finishes."], ["How big is the right paddle, and where does it start?", "It's 20 pixels wide and 100 pixels tall, and it starts at (350, 0) on the right side of the 800-wide screen."], ["A turtle starts 20 by 20. How do you stretch it into a 20 by 100 paddle?", "shapesize(stretch_wid=5, stretch_len=1). stretch_wid is up-and-down and stretch_len is side-to-side, so a width-stretch of 5 makes it 100 tall and a length-stretch of 1 leaves it 20 wide."], ["How do the Up and Down keys move the paddle 20 pixels?", "screen.listen(), then onkey(go_up, \"Up\") and onkey(go_down, \"Down\"), with no parentheses on the function. go_up does new_y = paddle.ycor() + 20, then paddle.goto(paddle.xcor(), new_y). go_down subtracts 20 instead."], ["In go_up, why save the new y and then call goto?", "The paddle only moves if you tell it to with goto. Computing ycor() + 20 by itself just throws the number away; you have to pass the new y (and the current x) into goto. Only y changes; x stays self.xcor()."], ["How do you hide the paddle's slide-in-from-center animation?", "Call screen.tracer(0) before the paddles or ball are created, so Turtle doesn't animate them moving from the center to their spots. That has to run once, outside the loop. After animation is off, you need a loop that calls screen.update() yourself."], ["After tracer(0), how does the screen get redrawn?", "You turn on a game loop: game_is_on = True, then while game_is_on: screen.update(). The screen only redraws when you call update yourself."], ["How do you turn the paddle code into a Paddle class?", "Put it in paddle.py: class Paddle(Turtle): with super().__init__() in __init__. Replace every \"paddle.\" with \"self.\" and drop the extra Turtle() line \u2014 the paddle itself is the turtle, not a turtle stored in an attribute."], ["How do you make the two paddles in main.py?", "Import Paddle, then call the class with a position tuple: r_paddle = Paddle((350, 0)) and l_paddle = Paddle((-350, 0)). __init__ takes that position and goes there. An extra paddle is just another call, like Paddle((100, 100))."], ["Which keys move which paddle?", "Right paddle: onkey(r_paddle.go_up, \"Up\") and onkey(r_paddle.go_down, \"Down\"). Left paddle: onkey(l_paddle.go_up, \"w\") and onkey(l_paddle.go_down, \"s\"). Pass the methods with no parentheses."], ["Why is a Paddle class useful, according to the lesson?", "You can make as many paddles as you want with one line each, instead of copying all the setup code. That's the point of the refactor."], ["How is the Ball class built, and where does the ball start?", "In ball.py, class Ball(Turtle): with super().__init__(). It's a white circle (a square works too), pen up, 20 by 20, starting at (0, 0). main.py creates it with ball = Ball() below the paddles."], ["What does the ball's first move() method do?", "It goes 10 right and 10 up from where it is now: new_x = self.xcor() + 10, new_y = self.ycor() + 10, then self.goto(new_x, new_y). The game loop calls ball.move() on every refresh."], ["How does the course slow the ball down?", "Import time and put time.sleep(0.1) in the game loop, so there's a short pause between moves. (You could also move 1 pixel at a time instead of 10.)"], ["Which walls should the ball bounce off?", "Only the top and bottom. The left and right edges are paddle catches or misses, not wall bounces."], ["How do you detect that the ball hit the top or bottom wall?", "If ball.ycor() is greater than 300 or less than -300 (half of the 600-tall screen), it hit a wall. The lesson tuned that to 280 and -280 because the ball is 20 pixels wide. Then call ball.bounce() (later renamed bounce_y)."], ["Why give the ball x_move and y_move attributes instead of always adding 10?", "So a bounce can reverse one direction. In __init__, x_move = 10 and y_move = 10. move() then does new_x = self.xcor() + self.x_move and new_y = self.ycor() + self.y_move."], ["How does bounce_y flip the ball's vertical direction?", "self.y_move *= -1. That reverses whatever the current value is, so +10 becomes -10, and the next bounce turns it back to +10. Setting it to 10 * -1 would only work once."], ["Why isn't ball.distance(paddle) < 20 enough to detect a paddle hit?", "distance() measures center to center. A hit near the end of the paddle looks much farther than 20, so it wouldn't count. You also have to check that the ball has gone far enough on x to be even with the paddle."], ["What condition detects a hit on either paddle?", "If ball.distance(r_paddle) < 50 and ball.xcor() > 320, or ball.distance(l_paddle) < 50 and ball.xcor() < -320, then call ball.bounce_x(). The lesson first tried 340 / -340 and tested with print(\"Made contact\")."], ["What's the difference between bounce_y and bounce_x?", "bounce_y flips y_move, so the ball reverses up/down off a wall. bounce_x flips x_move (self.x_move *= -1), so the ball reverses left/right off a paddle. The original bounce was renamed bounce_y when paddle hits were added."], ["How do you tell that a paddle missed the ball?", "A miss means the ball went past the paddle zone. The right paddle covers 340 to 360, so if ball.xcor() > 380 the right paddle missed. If ball.xcor() < -380, the left paddle missed."], ["What does reset_position() do?", "It sends the ball back to the center with self.goto(0, 0), then calls self.bounce_x() so the ball heads toward the other player."], ["Why are the two miss checks written as separate if statements?", "Because scoring differs per side: when the right paddle misses, the left player gets a point, and the other way around."], ["How is the Scoreboard class set up?", "class Scoreboard(Turtle): with super().__init__(). It's white, pen up, and hidden (hideturtle), because it only writes. It keeps l_score and r_score, both starting at 0."], ["What does update_scoreboard() do?", "It calls self.clear(), goes to (-100, 200) and writes l_score, then goes to (100, 200) and writes r_score, both centered in Courier 80 normal: align=\"center\", font=(\"Courier\", 80, \"normal\"). It's called from __init__ and after each point."], ["Why call clear() before writing the new scores?", "Without clear(), the new number is written on top of the old one, so the scores overwrite each other."], ["Why is the ball's wait called move_speed, not speed?", "The turtle class already has a method called speed, so that name would clash. The lesson uses move_speed instead. The same idea applies to the scoreboard: name the writer update_scoreboard, not update, because Turtle already has an update method."], ["What do l_point() and r_point() do, and when does main.py call them?", "l_point() adds 1 to l_score and calls update_scoreboard(); r_point() does the same for r_score. When the right paddle misses, main.py calls scoreboard.l_point(); when the left paddle misses, it calls scoreboard.r_point()."], ["How does the ball speed up each time it hits a paddle?", "Give the ball a move_speed attribute that starts at 0.1, and sleep by time.sleep(ball.move_speed) instead of a hard-coded 0.1. In bounce_x(), also do move_speed *= 0.9, so each paddle hit shortens the wait and the ball moves faster."], ["Why set move_speed back to 0.1 in reset_position()?", "Otherwise the speed-up would keep going forever, even after a point is scored. A new serve should start slow again. Sleep also can't go negative, or time.sleep raises an error."], ["Why sleep by ball.move_speed instead of the number 0.1 once speed-up is in?", "So the pause comes from the ball. Each time bounce_x() shrinks move_speed, the loop waits a little less and the ball appears to move faster."], ["What turtle quirk does the lesson warn about with the keys?", "Holding \"w\" may only move the left paddle one step at a time, even though holding Up/Down (and even \"s\") can move continuously. It's a turtle-module bug, not a problem in your code."]]}, {"day": 23, "cards": [["What five sub-parts is the Turtle Crossing game split into?", "Moving the turtle and controlling it with the keypress; creating and moving the cars automatically across the screen; detecting a collision with a car; detecting when the turtle reaches the other side; and a scoreboard that keeps track of the level and shows game over at the end."], ["How does the player turtle move, and where does that code go?", "The turtle can only go forwards. Every time you hit the Up key, it moves forward by a set amount until it reaches the other side of the screen. That functionality belongs in the player class."], ["How should the Player class get Turtle's abilities?", "Import the Turtle class from the turtle module and have Player inherit from it. Inside __init__, call super().__init__ so the player can do everything a turtle can do, and even more."], ["How do you set the player's shape and keep it from drawing?", "Set the shape to a turtle, then call penup so it just remains a shape and doesn't draw."], ["How do you put the player at the start facing North?", "self.goto the starting position, which is a tuple (values in parentheses, separated by a comma). Then set the heading to 90 degrees so it faces North."], ["After you create a Player in main.py, where does the turtle appear?", "At the center of the bottom of the screen, facing North."], ["How do you bind the Up key to player.go_up?", "Call screen.listen, then onkey with the Up key and player.go_up. Don't put parentheses on the method, or it will run when that line is evaluated instead of only when the Up key is detected."], ["What does go_up do, and why is the distance a constant?", "It moves the player forwards by the move distance that's set in a constant. Keeping that at the top of the file means you can change how far it goes each time without digging through the code."], ["How are the cars generated and how do they travel?", "They're generated at the right edge of the screen, at a random place along the Y-axis, then they move automatically from right to left at a fixed pace. This code goes in the car manager."], ["How big are the cars, and why do they need shapesize?", "Each car is a turtle that's 20 by 40 pixels. A new turtle starts 20 by 20, so you stretch it with shapesize, which stretches along the width and the length."], ["What shapesize mistake did the lesson make, and how was it fixed?", "The first try stretched the width by 2 and the length by 1, which stretched the wrong side and made a random array of shapes. The fix is to stretch the width by 1 and the length by 2, so the cars become a rectangle moving to the left."], ["How does CarManager store the cars?", "In __init__, create a list called all_cars that starts empty. After a new_car is set up, append it with self.all_cars.append \u2014 it needs the self in front because the list is defined in the class."], ["How is a new_car's shape, pen, and color set?", "It's a turtle object created in a square shape. Call penup so it doesn't draw. Give it a random color with random.choice, passing in the COLORS constant (import the random module)."], ["Where does a new car start on the 600 by 600 screen?", "x is +300, the very right edge. y is a random_y from random.randint. The Y-axis goes from +300 to -300, but the lesson uses -250 to +250 so the turtle has empty starting and ending space instead of cars all the way at the edge."], ["What should main.py do with CarManager in the game loop?", "Create a car_manager from the CarManager class. On every screen refresh, every 0.1 seconds, tell it to create a new car and to move all the cars."], ["Why shouldn't the create method be called create_cars?", "Each call only creates one new car, so the name shouldn't be plural. At first it still created that one car every 0.1 seconds, until the later slowdown."], ["Why do you see nothing if you only create cars and then run?", "The cars are being created at the right edge, so they aren't visible on the screen yet. You have to move them across the screen."], ["What does move_cars do?", "It loops for car in self.all_cars and, for each car, moves it towards the left by the move distance. That means moving the car backwards by the starting move distance, which is five paces."], ["How do you stop a new car from being created on every 0.1-second refresh?", "Use a random_chance: a one-in-six chance, like rolling a dice. Take a random int between 1 and 6, and only create a new car if it equals 1. That comes out to about every six times the while loop runs, not exactly, because of chance \u2014 so the turtle has space to cross."], ["Does your car-manager code have to match the lesson's exactly?", "No. What matters is achieving the desired functionality of the game. There are a million ways to solve it, and as long as it works, whatever way you choose will be the best way."], ["How do you detect a collision between the player and a car?", "Inside the while loop, loop through all the cars in the car_manager. If a car's distance to the player is less than 20, there's a collision."], ["Why is the collision distance less than 20?", "The cars are 20 pixels in height by 40 pixels in width. If the player is less than 20 pixels from the center of the car, it probably means they have collided."], ["What happens in the loop when a collision is detected?", "Stop the game by turning game_is_on from True to False, which also prevents further cars from moving."], ["Why call screen.exitonclick() at the bottom?", "So the screen stays open instead of closing once the process is finished. After a crash it stops and waits for further instruction, which is when the game over text and the final level will show."], ["What is a successful crossing in Turtle Crossing?", "The player turtle reaches the finish line. The finish line's Y value is defined as 280 in a constant."], ["Besides making a method, how else could you check for a successful crossing?", "You could get hold of the player's position and figure out if it's over 280 inside main.py. The lesson creates a method instead."], ["What does is_at_finish_line return?", "True if self.ycor() is greater than 280 (the finish line Y value), which means the turtle has gone over the finish line. Any other time, it returns False."], ["What does main.py do with is_at_finish_line?", "It calls player.is_at_finish_line, and if that's True, it gets the player to go back to the starting position."], ["What does the go_to_start method do?", "It gets the player to go to the starting position, which is defined in a constant."], ["How does the lesson remove the repeated starting-position goto in Player?", "It deletes that line in __init__ and simply calls self.go_to_start() instead."], ["What does CarManager.level_up() do to the cars?", "It increases the cars' speed. car_speed starts as the starting move distance and is what determines how far each car moves backward. In level_up, self.car_speed increases by the move increment, so the speed goes up by 10 every time."], ["When the player reaches the finish line, what two things happen?", "The player goes back to the start (its original position), and the car_manager levels up the cars so they increase in speed."], ["How is the Scoreboard class set up?", "It's a subclass of Turtle: import Turtle, inherit from it, and in __init__ take everything from the superclass so the scoreboard can do everything a turtle can do. Hide the turtle (it's just a pen to draw), pull the pen up so it doesn't draw a path, and use the write method."], ["How does the scoreboard keep and show the level?", "It has a level attribute that starts at 1, and it writes that text left-aligned, using the font declared as a constant. In main.py, create the scoreboard object next to the player and the car_manager."], ["Where is the level written, and when do you call goto?", "In the top left corner. Call self.goto after penup and right before write, so you don't draw a path there. The lesson first tried -280 on x and +280 on y, which was a little too far up, then moved it down and tweaked until the position looked right."], ["What does increase_level() do, and when is it called?", "It adds 1 to self.level and then rewrites the level. Call it from main.py when the player levels up, which happens on a successful crossing."], ["Why pull the write into an update_scoreboard() method?", "The same write was needed in two places, __init__ and increase_level. Both now call self.update_scoreboard(), which writes the current level."], ["Why must update_scoreboard() clear the scoreboard first?", "Without clear(), the new level is written on top of the old one, so level 2 overwrites level 1. clear() deletes the previous text so the new text can be written cleanly."], ["What does game_over() write, and where?", "It goes to the center with self.goto(0, 0) and writes GAME OVER in all caps, with centered alignment and the default font."], ["When does main.py show GAME OVER, and why doesn't game_over() clear first?", "On a collision, set game_is_on to False and also tell the scoreboard to show the game over sequence. It doesn't clear the previous text, so the user can still see the highest level they reached."]]}, {"day": 24, "cards": [["What new attribute does the Scoreboard get for a high score?", "self.high_score, starting at 0."], ["What does reset() do instead of game_over()?", "If self.score > self.high_score, set self.high_score = self.score; then self.score = 0; then self.update_scoreboard()."], ["Why does the order in reset() matter?", "If you set score to 0 first, it can never beat the high score, so the check never triggers."], ["Why move self.clear() into update_scoreboard()?", "So it runs every update. You couldn't do this before, because game over needed the score to stay on screen."], ["What does update_scoreboard write now?", "f\"Score: {self.score} High Score: {self.high_score}\""], ["What changes in main.py on a wall hit or a tail hit?", "Delete game_is_on = False and scoreboard.game_over(); call scoreboard.reset() instead, and also call snake.reset()."], ["What does Snake.reset() do?", "Loop through the segments and seg.goto(1000, 1000) to send the old turtles off the 600x600 screen; then self.segments.clear(); then self.create_snake(); then self.head = self.segments[0]. Basically redo what __init__ does."], ["Why move the segments off screen before clearing the list?", "Clearing the list alone leaves the old turtles on the screen, so you move them off first, while you still have access to them."], ["Why doesn't a high score saved only in a variable last after you stop the program?", "Variables don't remember state between runs. Stopping and rerunning resets high_score to 0. (Like a = 3, then a = input -> 12; rerun and a is 3 again.)"], ["How do you keep the high score after you stop and rerun?", "Use Python to open, read, write, and close a file, like writing your high score in a document."], ["How do you open a file, and do you need to import anything?", "open() is built in (no import). Pass the file name as a string (include the extension), and optionally the mode."], ["What does file.read() return, and what should you do when you're done?", "It returns the file's contents as a string (all lines). Call file.close() at the end."], ["Why close a file after you open it yourself?", "An open file takes up computer resources. Python might close it later, but we don't know when or if. Like closing browser tabs."], ["How does a with open(...) as file: block change closing?", "Indent the work inside. No file.close() is needed; with closes the file once we're done. The name after as can be anything (for example file or f)."], ["Why does file.write(\"New text\") fail after a plain open()?", "Default mode is \"r\" (read-only). You get \"UnsupportedOperation: not writable\"."], ["What does mode=\"w\" do to a file that already exists?", "Write mode. It deletes all previous text and replaces it with the new text."], ["What does mode=\"a\" do?", "Append. It adds to the end without deleting, like list.append. Use \\n if you want a new line: file.write(\"\\nNew text\")."], ["How do you create a file that doesn't exist yet?", "Open it in \"w\" mode. That creates it from scratch. This only works in write mode when the file doesn't currently exist."], ["How do you read the Snake high score from data.txt?", "Put just 0 in data.txt. Then: with open(\"data.txt\") as data: self.high_score = int(data.read())"], ["Why wrap data.read() in int()?", "read() gives a string, even if the file says 0. int() turns it into a number you can increase and compare. Write int(data.read()), not int() inside read()."], ["How and when do you write the high score back to data.txt?", "Inside reset, when score > high_score: with open(\"data.txt\", mode=\"w\") as data: data.write(f\"{self.high_score}\"). You must use mode \"w\", and write() needs a string, so use an f-string."], ["Is a KeyboardInterrupt in the console a bug when you click stop?", "No. It's just from clicking stop."], ["What's the difference between a file's name and its path?", "The name is the file itself; the path is the directions to get to it, like directions on a map. Files live in folders, and folders can nest."], ["What is the root folder, and how is it written on Mac and Windows?", "The root is the origin. On a Mac it's Macintosh HD, written as a single /. On Windows it's usually the C drive (C:)."], ["What's an absolute file path?", "One that always starts from the root, so it starts with / or C:."], ["What's a relative file path, and what do ./ and .. mean?", "A path from the working directory (the folder you're currently working from). ./ means look in the current folder. .. means go one step up to the parent folder."], ["From a project folder inside work, how do you reach report.doc in work, and talk.ppt in project?", "From project, report.doc is ../report.doc (not ./report.doc). talk.ppt in the same folder is ./talk.ppt, or just talk.ppt. From work, talk.ppt is ./project/talk.ppt. The absolute path doesn't change."], ["Why did open(\"my_file.txt\") work when the file sat next to main.py?", "main.py's folder is the working directory, so a file in the same folder can be ./report.doc, or just the name (the ./ can be dropped)."], ["What error do you get if my_file.txt moves to the Desktop, and how do you fix it with a relative path from the day-24 project folder?", "FileNotFoundError. Go up two levels to the user folder, then down: \"../../Desktop/my_file.txt\". ../my_file.txt is not enough \u2014 it's missing the second ../ and the Desktop folder."], ["How do you write a Windows path in Python, even though Windows shows backslashes?", "Windows shows \\ between folders and Mac shows /, but in Python you can just write /."], ["What's the difference between an absolute path and a relative path, in one line?", "Absolute is relative to the root; relative is relative to the current working directory. Pick whichever fits the situation."], ["What is mail merging in this project?", "Take a list of names and insert each one into a letter, replacing the [name] placeholder."], ["Where do the starting files and the finished letters live?", "starting_letter.txt is inside Letters, inside Input. Each finished letter is named letter_for_<name>.txt and goes in the ReadyToSend folder inside Output. Don't move the files by hand; use directories and file paths."], ["How should the name look in a finished letter?", "The name with no space after it, just a comma."], ["How should you work when you need a method you haven't seen yet?", "Like a pro developer: find the information when you need it (Google, Stack Overflow, the hint docs) and use it on the fly."], ["What's the difference between read(), readline(), and readlines()?", "read() reads the whole file as one string. readline() reads just one line, the first one. readlines() reads every line and gives you a list."], ["What happens if you call readlines() a second time on the same open file?", "You get an empty list, []. The first call already read the file to the end, so the second call has nothing left. A file is like a tape that doesn't rewind on its own. Read once, save it, and use the variable."], ["Why does each name from readlines() have extra stuff at the end, and how do you clean it?", "Each line ends with a newline, written \\n (a backslash, not a forward slash). name.strip() strips extra spaces and newlines off the ends."], ["In with open(...) as something, where does the file name go, and what is the word after as?", "The file's name goes inside the path string in open(...). The word after as is just a short nickname for the open file, like file."], ["How many folders does ../ go up, and how many does ../../ go up?", "../ goes up one folder (the parent). ../../ goes up two."], ["What does str.replace(old, new) give back, and does it change the original string?", "A new string with old swapped for new (\"I like bananas\".replace(\"bananas\", \"apples\") gives \"I like apples\"). The original stays the same, so save the result, e.g. new_letter."], ["Does strip() remove spaces between words?", "No. It only removes spaces and newlines at the start and end, so \"  hello world  \" becomes \"hello world\"."], ["Why make PLACEHOLDER = \"[name]\" a constant at the top of Mail Merge?", "It names the exact string you want to replace in one spot, then you use letter_contents.replace(PLACEHOLDER, stripped_name)."], ["In Mail Merge, why did every letter except the last get an extra line after the name?", "Every name from readlines() ends in \\n except the last line in the file. Stripping each name fixes it."]]}, {"day": 25, "cards": [["What does CSV stand for, and how is the data written?", "Comma Separated Values, a common way to store tabular data (data that fits in a table like a spreadsheet). Each row is one set of data; values are separated by commas with no space."], ["How do you open a CSV with plain Python and put each line in a list, and what's the problem?", "with open(\"weather_data.csv\") as data_file: data = data_file.readlines(). You get a list where each item is a row string. The problem is everything is still a string joined by commas, so there's lots of cleaning to get columns."], ["How do you read a CSV with Python's built-in csv library, and what does each row look like?", "import csv; with open(\"weather_data.csv\") as data_file: data = csv.reader(data_file). Printing data shows a csv reader object; loop for row in data: print(row). Each row becomes a list of separate values, all still strings, e.g. [\"Monday\", \"12\", \"Sunny\"]."], ["How do you make a list of temperatures as ints from the csv reader?", "Temp is row[1]. Skip the column label with if row[1] != \"temp\": then temperatures.append(int(row[1])) inside the loop, and print(temperatures) after the loop."], ["Why reach for pandas instead of the csv library, and is pandas built in?", "Getting even one column with csv takes a lot of faff, and it gets painful with more columns, rows, or complex data. pandas is a Python data analysis library that's powerful for tabular data; most Python devs reach for it for any CSV. It's not built in, so it must be installed: type import pandas, hover the red line, and click Install package pandas."], ["What's the one required argument to pandas.read_csv(), and what does print(data) show?", "The path to the CSV; the rest of the arguments are optional. No open() or csv.reader is needed. print(data) shows a formatted table with column headings on top and an index for each row."], ["How do you get one column from a pandas DataFrame?", "data[\"temp\"]. pandas takes the first row as column names."], ["What are the two primary pandas data structures?", "DataFrame and Series. A DataFrame is the whole table (every sheet in Excel/Google Sheets would be one DataFrame). A Series is basically a list; a single column."], ["What does print(type(data)) and type(data[\"temp\"]) show?", "type(data) is a pandas DataFrame. type(data[\"temp\"]) is a pandas Series. day, temp, and condition are each a Series. It's a good habit to type-check objects from a new library."], ["What does data.to_dict() give you?", "A separate dictionary for each column (day, temp, condition), which you can work with like a real dictionary."], ["How do you turn a Series into a raw Python list?", "temp_list = data[\"temp\"].to_list(). Then you can do list things like len()."], ["How can you get the average temperature two ways?", "sum(temp_list) / len(temp_list) -> 17.4 (sum of values divided by the number of values = average = mean). Or data[\"temp\"].mean(), which gives the same result with less work. Series also has median, mode, and other statistics."], ["How do you get the max temperature with a Series method?", "data[\"temp\"].max() -> 24."], ["What are two ways to get a column, and what must match?", "data[\"condition\"] or data.condition. The key or attribute must match the column name exactly, including capitals. Square brackets treat the DataFrame like a dictionary (pull a column by key); the dot treats it like an object (data.attribute)."], ["How do you get a whole row, like Monday's?", "data[data.day == \"Monday\"] gets the whole Monday row. Get the column, check where its value equals Monday, then use that inside data[...]."], ["How do you get the row with the max temp?", "data[data.temp == data.temp.max()] -> Sunday, 24, Sunny. Angela prefers .temp (fewer strings)."], ["What's the difference between square brackets with a column name and square brackets with a condition?", "Square brackets with only a column name -> the whole column. Square brackets with a condition on a column -> the row."], ["Once you have a row, how do you get one value from it?", "monday = data[data.day == \"Monday\"]; monday.condition -> Sunny."], ["How do you convert Monday's temperature to Fahrenheit?", "monday.temp[0] (the first value in the series, index 0). F = C * 9 / 5 + 32, so monday_temp_F = 53.6 (Monday was 12 C)."], ["How do you create a DataFrame from scratch and save it as a CSV?", "Make a dictionary like data_dict = {\"students\": [\"Amy\", \"James\", \"Angela\"], \"scores\": [76, 56, 65]}, then data = pandas.DataFrame(data_dict). Then data.to_csv(\"new_data.csv\"); the only required input is the path."], ["What was the squirrel dataset, and what are the three Primary Fur Color values?", "The 2018 Central Park Squirrel Census from NYC Open Data, where volunteers logged every squirrel. Primary Fur Color has only three values: Gray, Cinnamon (red), and Black."], ["Why use square brackets for the fur color column?", "The column name has spaces, so use data[\"Primary Fur Color\"]."], ["How do you get the gray squirrels and count them?", "data[data[\"Primary Fur Color\"] == \"Gray\"] (spelled Gray, not Grey). grey_squirrels_count = len(grey_squirrels) -> 2473. Rows act like an iterable, so len() works."], ["How do you build squirrel_count.csv?", "Make a dictionary data_dict = {\"Fur Color\": [\"Gray\", \"Cinnamon\", \"Black\"], \"Count\": [grey_squirrels_count, red_squirrels_count, black_squirrels_count]}, then df = pandas.DataFrame(data_dict); df.to_csv(\"squirrel_count.csv\")."], ["What's the goal of the US States Game?", "A US states quiz like Sporcle's. A turtle screen shows a blank US map; the user types state names, and each correct one gets written on the map."], ["What starting files does the US States Game project have?", "50_states.csv (state name plus x, y), blank_states_img.gif, and an empty main.py."], ["What image format can Turtle use as a shape, and how do you load the blank map?", "Turtle can only use .gif images as shapes. image = \"blank_states_img.gif\", then screen.addshape(image), then turtle.shape(image). Also set up with import turtle, screen = turtle.Screen(), and screen.title(\"U.S. States Game\")."], ["What error do you get if the image file name is wrong, and what typo caused it?", "\"couldn't open file / no such file or directory\". He had typed \"state\" instead of \"states\"."], ["How do you print the x and y of a mouse click on the turtle screen?", "def get_mouse_click_coor(x, y): print(x, y); then turtle.onscreenclick(get_mouse_click_coor). It's an event listener that passes the click's x and y."], ["Why use turtle.mainloop() instead of screen.exitonclick(), and do you need the click code?", "mainloop() keeps the screen open. exitonclick() would close the window on the click. You don't actually need the click code, because the x and y for every state are already in 50_states.csv."], ["How does screen.textinput work?", "answer_state = screen.textinput(title=\"...\", prompt=\"...\"). The title goes at the top of the window and the prompt goes inside the box. It returns what the user typed."], ["What should happen for a correct guess vs a wrong guess, and does casing matter?", "A correct state gets written at its x, y. A wrong guess does nothing and the input pops up again. Casing shouldn't matter (\"Ohio\" and \"ohio\" both count). The input title tracks \"N/50 States Correct\"."], ["How do you get a list of all 50 state names, and why does it have to be a list?", "all_states = data.state.to_list(). It has to be a list to check membership with `in`."], ["When the answer is in all_states, how do you set up the turtle and get that state's row?", "Make t = turtle.Turtle(), t.hideturtle(), t.penup(). Get the row with state_data = data[data.state == answer_state]."], ["Why did t.goto(state_data.x, state_data.y) cause \"bad screen distance\"?", "A data-type mismatch: state_data.x is a pandas Series (index 34 plus value 175 for Ohio), not an int."], ["How do you get the raw x and y so goto can use them?", "state_data.x.item() and state_data.y.item(). .item() grabs the single raw value from a Series."], ["What should the turtle write, and why not state_data.state?", "t.write(answer_state) is simpler and cleaner. state_data.state writes extra junk from the Series. state_data.state.item() also works."], ["How does the game keep going until all 50 states are guessed?", "guessed_states starts as an empty list; while len(guessed_states) < 50: ... and on a correct guess, guessed_states.append(answer_state)."], ["How does the text input title show the score?", "Use an f-string: f\"{len(guessed_states)}/50 States Correct\"."], ["How do you make any casing match the title-case CSV?", "screen.textinput(...).title() makes each word start with a capital, so any casing matches."], ["How do you let the user exit the game early by typing exit?", "Inside the while loop: if answer_state == \"Exit\": break. It has to be a capital E because the answer was title-cased. break ends the while loop early."], ["After adding the exit, what line should you delete, and why?", "Delete the line that keeps the screen open, so the game actually ends and the window closes (\"process finished with exit code 0\")."], ["How do you build the list of missed states?", "missing_states = []; for state in all_states: if state not in guessed_states: missing_states.append(state). After the A states and exit, Angela's list left out the ones she guessed; the CSV had 44 states."], ["How do you save the missed states as a CSV, and what is the file called?", "new_data = pandas.DataFrame(missing_states) makes a one-column DataFrame; new_data.to_csv(\"states_to_learn.csv\")."]]}, {"day": 26, "cards": [["What is a list comprehension?", "A way to create a new list from a previous list, in one line instead of a for loop + empty list + append."], ["What's the for-loop version of adding 1 to each number in numbers = [1, 2, 3]?", "new_list = []; for n in numbers: add_1 = n + 1; new_list.append(add_1) -> [2, 3, 4]"], ["What's the keyword pattern for a list comprehension?", "new_list = [new_item for item in list]"], ["How do you write \"add 1 to each number\" as a list comprehension?", "new_numbers = [n + 1 for n in numbers] -> [2, 3, 4]"], ["What kinds of sequences can a list comprehension loop through?", "Any sequence (list, string, range, tuple), going through it in order."], ["What does [letter for letter in name] give when name = \"Angela\"?", "['A', 'n', 'g', 'e', 'l', 'a']"], ["What does [num * 2 for num in range(1, 5)] give, and why isn't 10 in the list?", "[2, 4, 6, 8]. range doesn't include 5."], ["What's the pattern for a conditional list comprehension?", "new_list = [new_item for item in list if test]"], ["Given names = [\"Alex\", \"Beth\", \"Caroline\", \"Dave\", \"Eleanor\", \"Freddie\"], what does short_names = [name for name in names if len(name) < 5] give?", "['Alex', 'Beth', 'Dave']"], ["How do you make a list of the long names in uppercase?", "long_names = [name.upper() for name in names if len(name) > 5] -> ['CAROLINE', 'ELEANOR', 'FREDDIE']"], ["Can the item name in a comprehension be anything?", "Yes (n, num, name), as long as it's used consistently in new_item and the test."], ["How do you shorten the States Game's missing_states block to one line?", "missing_states = [state for state in all_states if state not in guessed_states]. It cuts the empty list, for loop, and append (3-4 lines) that built the list to save to a CSV."], ["In that missing_states comprehension, what are the list, item, test, and new_item?", "list = all_states; item = state; test = state not in guessed_states (guessed_states gets a state each correct guess); new_item = state unchanged. Reads as: add a state to the new list, looping through all states, if that state is not in guessed states."], ["What is a dictionary comprehension, and what brackets does it use?", "It creates a new dictionary from the values in a list or a dictionary. Uses curly brackets {} instead of square brackets."], ["What's the simplest form of a dictionary comprehension?", "new_dict = {new_key: new_value for item in list} (list = any iterable: list, range, string, tuple)"], ["How do you create a new dictionary from an existing dictionary?", "new_dict = {new_key: new_value for (key, value) in dict.items()}"], ["Why does .items() need parentheses?", "It's a method, not an attribute."], ["How do you add a condition to a dictionary comprehension?", "new_dict = {new_key: new_value for (key, value) in dict.items() if test}"], ["How do you give each student in a names list a random score from 1 to 100?", "import random, then students_scores = {student: random.randint(1, 100) for student in names}"], ["How do you keep only students who scored 60 or more?", "passed_students = {student: score for (student, score) in students_scores.items() if score >= 60}"], ["In Angela's run, which students passed and which were dropped?", "Passed: Beth, Caroline, Dave, and Freddie. Alex and Eleanor were dropped."], ["How do you turn student_dict into a DataFrame, and what does the printed table show?", "student_data_frame = pandas.DataFrame(student_dict). Printed, it's a table; the first column is the index (0, 1, 2 = each row's index)."], ["What do you get if you loop a DataFrame with .items()?", "for (key, value) in student_data_frame.items(): key -> column titles, value -> data in each column. Not very useful, because it loops columns."], ["What does .iterrows() do, and what's the loop line?", "It's pandas' built-in loop that goes through each row instead of each column. for (index, row) in student_data_frame.iterrows():"], ["What does print(index) and print(row) show when you use .iterrows()?", "print(index) -> 0, 1, 2. print(row) -> each row (a student and a score)."], ["What type is each row from iterrows(), and how do you get a column's value?", "Each row is a pandas Series, so use dot notation: row.student, row.score"], ["How do you print Angela's score while looping rows?", "if row.student == \"Angela\": print(row.score) -> 56 in the lesson."], ["What's the real-life problem the NATO alphabet project solves?", "Spelling your name over the phone (E vs B, T vs C). The NATO phonetic alphabet fixes that (A = Alfa, N = November, G = Golf)."], ["What are the starting files for the NATO project?", "nato_phonetic_alphabet.csv (each letter and its code word) and main.py with the example loops from the last lesson. Read the CSV with pandas into a DataFrame."], ["What's the dictionary comprehension pattern when looping a DataFrame instead of a dict?", "{new_key: new_value for (index, row) in df.iterrows()} instead of {new_key: new_value for (key, value) in dict.items()}"], ["What is TODO 1, and why isn't to_dict() enough?", "Create a dictionary in the format {\"A\": \"Alfa\", \"B\": \"Bravo\", ...}. Keys = letters (first column), values = code words. data.to_dict() won't give this format, so use a dictionary comprehension."], ["What is TODO 2, and what should \"Thomas\" print?", "Create a list of phonetic code words from a word the user inputs. \"Thomas\" should print [\"Tango\", \"Hotel\", \"Oscar\", \"Mike\", \"Alfa\", \"Sierra\"]."], ["How do you import pandas if it isn't installed in PyCharm?", "import pandas, then install it via the squiggly line / light bulb if needed."], ["How do you read the NATO CSV into a DataFrame?", "data = pandas.read_csv(\"nato_phonetic_alphabet.csv\")"], ["What's the dictionary comprehension that builds the phonetic dictionary?", "phonetic_dict = {row.letter: row.code for (index, row) in data.iterrows()}"], ["How do you get the user's word so it matches the uppercase keys?", "word = input(\"Enter a word: \").upper(). The keys are uppercase, so case doesn't matter."], ["How do you build and print the list of code words?", "output_list = [phonetic_dict[letter] for letter in word]; print(output_list)"], ["In a dictionary comprehension, what happens if the names up front don't match the names in the loop?", "If you write {student: score for (key, value) in ...}, student and score aren't defined in the loop (key and value are), so you get a NameError. The names must match: {student: score for (student, score) in ...}."], ["How do you call .items() on a dictionary?", "Call it on the dictionary itself: student_scores.items(). dict.items(student_scores) is wrong."], ["Angela's test is \"60 or over.\" What's the condition, and why not > 60?", "Use score >= 60, which keeps everyone who scored 60 or more. > 60 would drop a score of exactly 60."], ["What does data.iterrows() give you on each pass?", "(index, row), not the letter and code columns. The letter and code live inside row, under the column names (row.letter, row.code). So {letter: code for (letter, code) in data.iterrows()} is wrong."], ["What happens if you write nato = {row.letter: row.code} inside a regular for loop?", "Each loop pass makes a brand new one-item dict, which replaces the old one, so you only end up with the last letter. Put the whole loop inside the curly braces as one dictionary comprehension."], ["Where does the closing } go in a dictionary comprehension?", "At the very end. The for (index, row) in data.iterrows() part has to stay inside the curly braces, so not {row.letter: row.code} for (index, row) in data.iterrows()."], ["In the NATO list comprehension, what's wrong with [nato for letter in word], and what's the fix?", "Each new item is the whole nato dict, not one code. Look up just this letter with square brackets: [nato[letter] for letter in word]."]]}, {"day": 27, "cards": [["What's the goal of Day 27?", "Learn the Tkinter module to build graphical user interfaces (GUIs)."], ["What were computers like before GUIs, and what's a GUI?", "Before GUIs you used a command-line OS like MS-DOS: you typed text to tell the computer what to do (like the Python console). GUIs are graphical; with a mouse, a user with little training can point and click."], ["Who made the first GUI in use, the first mouse, Ethernet, and the first object-oriented programming language?", "Xerox PARC (Palo Alto Research Center)."], ["What was an early GUI computer, and who had windows first?", "The Apple Lisa (windows you click to launch programs). The Mac had windows before Microsoft Windows."], ["How do you import Tkinter and create a window?", "Tkinter comes pre-installed, like turtle: import tkinter, then window = tkinter.Tk() (like turtle's Screen)."], ["Why does creating a window without mainloop show nothing and exit with code 0?", "The window is made, there are no more instructions, and the program ends."], ["What does window.mainloop() do, and where must it go?", "It keeps the window on screen and listens for user actions (like a built-in while True loop). It must be the very last line; everything else goes between creating the window and mainloop."], ["How do you set the window title and a minimum size?", "window.title(\"My first GUI program\") sets the text in the top bar. window.minsize(width=500, height=300) sets a minimum size; the window grows to fit its components."], ["How do you create a Label, and what's the font tuple?", "my_label = tkinter.Label(text=\"I am a label\", font=(\"Arial\", 24, \"bold\")). The font is a tuple: (name, size, style); style can be \"bold\", \"italic\", or left out."], ["Why doesn't a widget show until you pack it, and what's pack's default?", "A component doesn't show until you lay it out. my_label.pack() places it and centers it by default. pack() is a geometry manager; options include side=\"left\"/\"right\"/\"top\"/\"bottom\" and expand=True."], ["What's a keyword argument, and can you change the call order?", "With def my_function(a, b, c), you can call my_function(c=3, a=1, b=2) in any order as long as each has its keyword."], ["How do default argument values work?", "def my_function(a=1, b=2, c=3). Call my_function() to use all the defaults, or my_function(b=5) to change only b while a and c keep their defaults."], ["In turtle's write(), which argument is required, and what are arguments with defaults?", "arg has no default, so it's required: tim.write() gives \"missing 1 required positional argument\". Arguments with defaults are optional (e.g. font=(\"Times New Roman\", 80, \"bold\"))."], ["How do you write a function that takes any number of positional arguments?", "def add(*args). The * is the important part; \"args\" is just the convention (you could name it numbers)."], ["What type is args inside the function, and does position matter?", "args is a tuple of every input passed in. It can be indexed (args[0] is 3, args[1] is 5), so these are called unlimited positional arguments."], ["How do you add every number passed into *args?", "Start a running total at 0, then for n in args: total += n, and return total after the loop. add(3, 5, 6) returns 14; add(3, 5, 6, 2, 1) returns 17."], ["What's wrong with for n in args: print(sum(n))?", "You passed a single number n to sum() instead of keeping a running total (total = 0, total += n)."], ["What does **kwargs do, and what type is it?", "The double asterisk **kwargs allows any number of keyword arguments, collected into a dictionary (type(kwargs) is dict)."], ["In calculate(2, add=3, multiply=5), what is kwargs, and how do you use the values?", "kwargs is {\"add\": 3, \"multiply\": 5}. Loop with for key, value in kwargs.items() or look up kwargs[\"add\"]. Then n += kwargs[\"add\"] (2+3=5), n *= kwargs[\"multiply\"] (5*5=25)."], ["Why does Tkinter show **kw on Label and pack?", "Tkinter was ported from Tk (another technology with different syntax), so Tk's many options were turned into **kw optional keyword args. More Pythonic modules like turtle list each parameter with its default."], ["In a Car __init__ that uses **kw, what's the difference between kw[\"model\"] and kw.get(\"model\")?", "kw[\"model\"] crashes with KeyError: 'model' if model is omitted (e.g. Car(make=\"Nissan\")). kw.get(\"model\") works like kw[\"model\"], except if the key is missing it returns None instead of crashing."], ["What are the three ways to set widget options?", "(1) on init, (2) dict-style my_label[\"text\"] = \"New Text\", (3) my_label.config(text=\"New Text\") (can set multiple options)."], ["Why use from tkinter import *?", "It imports all classes so you can write Tk(), Label(), Button() without the tkinter. prefix (useful when using many widgets)."], ["How do you create a Button that runs a function when clicked, and how do you update the label?", "Button(text=\"Click Me\", command=button_clicked). command takes the function name WITHOUT parentheses. Inside button_clicked(), call my_label.config(text=\"Button Got Clicked\")."], ["What's wrong with writing if button_clicked: outside the function to change the label?", "It runs immediately at startup. if button_clicked: checks if the function exists, not if it was clicked. Put my_label.config(...) inside def button_clicked():."], ["How do you make a text input and read what's typed?", "Entry(width=10) + .pack() creates a text input box. input.get() returns the current text as a string. Calling it right after creating the Entry prints nothing because nothing is typed yet."], ["How do you put the typed Entry text into the label when the button is clicked?", "Inside button_clicked(): new_text = input.get() then my_label.config(text=new_text)."], ["How do you pre-fill an Entry or Text box with starting text?", "Use .insert(END, \"...\"). END is a Tkinter index constant."], ["How do you work with a multi-line Text widget?", "Text(height, width). .focus() puts the cursor in it; .insert(END, \"...\") adds starting text; .get(\"1.0\", END) gets text from line 1, character 0 to the end."], ["What are Spinbox and Scale, and how do you get their values?", "Spinbox is an up/down counter: tie it to command=spinbox_used and call .get(). Scale is a slider: command=... automatically passes the current value to the callback."], ["How do Checkbutton and Radiobutton keep and read their state?", "Checkbutton (on/off, 1 or 0): tie it to a Tkinter IntVar() and read with .get(). Radiobuttons: tie all of them to one IntVar(), give each a value (e.g. 1, 2), and read radio_state.get()."], ["How do you set up a Listbox and react when an item is selected?", "Loop a Python list and .insert() each item, then .bind(\"<<ListboxSelect>>\", callback) to read the current selection."], ["What are Tkinter's three layout managers, and when does a widget show?", "pack, place, and grid. A widget won't show up until it has a layout."], ["How does pack work, and what's its downside?", "It stacks widgets next to each other (default top to bottom; side=\"left\"/\"right\"/\"bottom\"). Hard to position precisely."], ["How does place work, and what's its downside?", "Exact pixel coordinates: place(x=0, y=0) (top-left is 0, 0). Great for 3 widgets, painful to manage for 50-100."], ["How does grid work, and why can column=5, row=5 still sit at the top-left?", "It divides the window into rows (horizontal) and columns (vertical), starting at 0: grid(column=0, row=0). Grid is relative to other widgets: if nothing is in 0-4, a lone widget at column=5, row=5 still goes in the top-left."], ["Can you mix grid and pack in the same program?", "No. You get an error: cannot use geometry manager pack which already has slaves managed by grid."], ["In the layout challenge, where do the label, button, new button, and entry go?", "label (column 0, row 0), button (column 1, row 1), new button (column 2, row 0), entry (column 3, row 2)."], ["How do you add padding around the window or a single widget?", "window.config(padx=..., pady=...) adds space around the window edges; my_label.config(padx=..., pady=...) adds space around a single widget."], ["What's the 3x3 grid layout for the Miles to Kilometer converter?", "miles_input Entry at column=1, row=0; \"Miles\" at column=2, row=0; \"is equal to\" at column=0, row=1; result \"0\" at column=1, row=1; \"Km\" at column=2, row=1; Calculate button at column=1, row=2."], ["What error do you get if you omit text= and write Label(\"Miles\")?", "AttributeError: 'str' object has no attribute 'tk'."], ["How does miles_to_km convert miles and update the result label?", "miles = float(miles_input.get()) (Entry text is a string; float so decimals work), km = miles * 1.609 (optionally round(km)), then kilometer_result_label.config(text=f\"{km}\"). Wire the button with command=miles_to_km (no parentheses) so it runs only on click."], ["Why does result_label.config(text=button_clicked()) at startup cause a ValueError?", "The () runs button_clicked() immediately, before anything is typed in miles_input, so float of an empty string crashes. Delete that line and put result_label.config(...) inside def button_clicked():."], ["What's wrong with result_label = miles_to_km and return result_label inside the button function?", "That rebinds a local name and returns a number; it doesn't change the widget on screen. Update the existing label with result_label.config(text=...)."]]}, {"day": 28, "cards": [["What's the goal of Day 28?", "Build a Pomodoro timer GUI in Tkinter: a tomato Canvas with countdown text, Start and Reset buttons, session titles, and check marks for finished work sessions."], ["What starting files and constants does the Pomodoro project use?", "tomato.png and main.py, with color hex constants, FONT_NAME (\"Courier\"), and WORK, SHORT_BREAK, and LONG_BREAK minutes."], ["How do you import Tkinter and create a Pomodoro window?", "from tkinter import *; window = Tk(); window.title(\"Pomodoro\"); window.mainloop()"], ["What does the Canvas widget do, and which create methods does it have?", "It layers things on top of each other (image, then text on top). It has create_image, create_text, create_rectangle, and create_oval."], ["How do you size the Canvas and center the tomato image?", "canvas = Canvas(width=200, height=224) (about the image size, 200x223). create_image(x, y, image=...) uses half the width and half the height to center it."], ["How do you pass an image to create_image?", "It needs a PhotoImage, not a filename string: tomato_img = PhotoImage(file=\"tomato.png\"), using a relative or absolute path from main.py. Then canvas.pack()."], ["How do you add padding and set the window background from a color constant?", "window.config(padx=100, pady=50) adds padding around the content. window.config(bg=YELLOW) sets the background; pass the constant without quotes."], ["How do you put the timer text on the tomato, and what are create_text's *args vs **kw?", "canvas.create_text(x, y, text=\"00:00\", fill=\"white\", font=(FONT_NAME, 35, \"bold\")). Its *args are x and y; its **kw are keyword args like text. 103, 130 centered it on the red part."], ["Where do the color constants come from, and which Canvas options are standard vs PhotoImage-specific?", "colorhunt.io palettes; hex codes stored as PINK, RED, GREEN, YELLOW. Canvas bg=YELLOW too. width, height, and bg are standard on all widgets; file is specific to PhotoImage."], ["What does highlightthickness=0 do on the Canvas, and how is it spelled?", "It removes the white border. It's one word with two t's and no underscore. Removing the border shifts things, so change x back to 100 for both the image and the text."], ["What's the difference between bg and fg on a Label?", "bg = background color; fg = foreground (text) color. Labels use fg=GREEN for green text. Label bg=YELLOW blends it into the window background."], ["Why switch the canvas from pack() to grid()?", "You can't mix pack and grid; mixing gives an error. The Pomodoro layout is about 4 rows by 3 columns."], ["How is the title label created and placed?", "title_label = Label(text=\"Timer\", fg=GREEN, bg=YELLOW, font=(FONT_NAME, 50)); title_label.grid(column=1, row=0). canvas.grid(column=1, row=1)."], ["How are the Start and Reset buttons created and placed?", "start_button = Button(text=\"Start\", highlightthickness=0); grid(column=0, row=2). reset_button = Button(text=\"Reset\", highlightthickness=0); grid(column=2, row=2). highlightthickness=0 removes the white border around buttons, the same trick as the canvas."], ["How do you add the check-mark label?", "check_marks = Label(text=\"\u2714\", fg=GREEN, bg=YELLOW); grid(column=1, row=3). Copy a check mark (e.g. from Wikipedia) and paste it as the label's text."], ["Why won't a while loop plus time.sleep work for a GUI countdown?", "tkinter is event-driven; mainloop keeps checking for events every ms. Another loop means mainloop is never reached and the program doesn't launch."], ["What does window.after do?", "window.after(ms, function, *args) waits ms milliseconds then calls function, passing any positional args. 1000 ms = 1 second. e.g. window.after(1000, say_something, 3, 5, 8) calls say_something(a, b, c) and prints 3, 5, 8."], ["How do you loop a countdown with after, and how do you stop at 0?", "count_down(count) calls window.after(1000, count_down, count - 1) inside itself. Without a check it goes into negatives; add `if count > 0:` around the after call so it stops at 0."], ["How do you change text on a canvas vs a label?", "Save the canvas text: timer_text = canvas.create_text(...), then canvas.itemconfig(timer_text, text=count). A label uses label.config(text=...). Pass count (the variable), not \"count\" (the string)."], ["How do you hook start_timer to the Start button?", "Define start_timer() in TIMER MECHANISM so it calls count_down(...). Then Button(..., command=start_timer) with no parentheses."], ["How do you show the countdown as minutes:seconds?", "count_min = math.floor(count / 60) (import math; floor = largest whole number <= x, e.g. 4.8 -> 4). count_sec = count % 60 (remainder, e.g. 245 % 60 = 5). Then canvas.itemconfig(timer_text, text=f\"{count_min}:{count_sec}\")."], ["Why does the timer show 5:0 instead of 5:00, and what's the first fix?", "count_sec = count % 60 gives 0 when there's no remainder. First fix: if count_sec == 0: count_sec = \"00\" (checks an int, then sets a string)."], ["What is dynamic typing?", "A variable's data type can change by assigning a different type of value (a = 3 is int; a = \"Hello\" is str)."], ["What does strongly typed mean, and how is Python classified compared with C, Java, and Swift?", "Python still knows each value's type and enforces it: 3 + \"4\" -> TypeError; \"Hello\" ** 2 -> TypeError; pow(\"Hello\", 3) -> TypeError. Python is strongly, dynamically typed. In C, Java, and Swift, a variable keeps one type forever."], ["How do you fix seconds under 10 showing as 9, 8, 7 instead of 09, 08, 07?", "if count_sec < 10: count_sec = f\"0{count_sec}\" (covers 00 too). Check as a number, then format as a string with an f-string."], ["What's the Pomodoro session pattern, and which reps are work vs breaks?", "25 min work, 5 min short break, repeat; after 4 work sessions, 20 min long break. Reps 1, 3, 5, 7 = work; 2, 4, 6 = short break; 8 = long break."], ["How do you make a global reps counter that start_timer can change?", "Global reps = 0. Inside start_timer: global reps, then reps += 1."], ["How do you convert the minute constants into seconds?", "work_sec = WORK_MIN * 60, short_break_sec = SHORT_BREAK_MIN * 60, long_break_sec = LONG_BREAK_MIN * 60."], ["How do you pick work vs short break vs long break, and which check has to go first?", "if reps % 8 == 0: long break; elif reps % 2 == 0: short break; else: work. The % 8 check has to go first, or rep 8 would be treated as an even short break."], ["How does the timer start the next session on its own when the count hits 0?", "In count_down, add an else (count is 0) that calls start_timer() again, which bumps reps and picks the next countdown. Put this in COUNTDOWN MECHANISM, not TIMER RESET."], ["How do you change the title text and color for each session?", "Use title_label.config: long break -> text \"Break\", fg=RED; short break -> \"Break\", fg=PINK; work -> \"Work\", fg=GREEN. Set fg on Work too, or it can stay pink after a short break."], ["When do check marks get added, and how many reps make one work session?", "The check_marks label starts empty. In count_down's else (count hit 0): start_timer() then add check marks. Every 2 reps = 1 work session. work_sessions = math.floor(reps / 2) (reps / 2 is a float; range needs a whole number)."], ["How do you build a check-mark string with one \u2714 per finished work session?", "marks = \"\"; for _ in range(work_sessions): marks += \"\u2714\"; then check_marks.config(text=marks)."], ["How do you stop the running timer when Reset is clicked?", "Save the after call: timer = window.after(1000, count_down, count - 1). timer must be global: timer = None at the top; global timer inside count_down (and reset_timer). Then window.after_cancel(timer). Hook the button with command=reset_timer (no parentheses)."], ["What should reset_timer put back on screen, and what happens if you forget to reset reps?", "canvas.itemconfig(timer_text, text=\"00:00\"); title_label.config(text=\"Timer\"); check_marks.config(text=\"\"). Also global reps; reps = 0. If you skip reps, Reset then Start jumps to Break because reps kept increasing."], ["What should the final minute constants be, and why set WORK_MIN to 1 while testing?", "WORK_MIN 25, SHORT_BREAK_MIN 5, LONG_BREAK_MIN 20 for the final version. Set WORK_MIN to 1 while testing so you can see it reach zero without waiting 25 minutes."], ["What's wrong with writing title_label.config = Label(...)?", "config is a method, so call it: title_label.config(text=\"...\", fg=...). Using = Label(...) replaces the method instead of updating the existing label, so the title never changes."], ["What's wrong with using a Label for a clickable Start or Reset control?", "Clickable controls are Button widgets, not Labels. Use Button(text=\"Start\", command=start_timer) and the same idea for Reset."], ["Why shouldn't you reuse one variable name for every widget?", "Each widget needs its own name (title_label, canvas, start_button, reset_button, check_marks) so you can place it and change it later. Reusing one name overwrites the previous widget."], ["Why use reps % 8 == 0 instead of reps == 8 for the long break?", "reps == 8 only catches the first long break. reps % 8 == 0 catches rep 8, 16, 24, and every 8th rep after."], ["What's wrong with check_marks.config(text=\"\u2714\") after every work session?", "That sets the label to one mark every time, so it never grows past one. Count the finished work sessions and build a string with that many \u2714 (marks += \"\u2714\"), then set the label to that string."], ["What's wrong with timer_text.config(text=\"00:00\") in reset_timer?", "timer_text lives on the canvas, so use canvas.itemconfig(timer_text, text=\"00:00\"), the same way count_down updates it."], ["After Reset, why might a \u2714 still show even if you set marks = \"\"?", "marks = \"\" empties the string, but the label still shows the old text until you call check_marks.config(text=marks) or text=\"\". Don't add a \u2714 back in reset_timer."], ["Why can count_down raise NameError: canvas is not defined?", "count_down was called before the canvas was created. Create the canvas first, then call count_down (for example from the Start button after the UI is set up)."]]}];
const QUIZZES=[{"day": 1, "questions": [{"q": "What does this print?\n\nfood = \"tacos\"\nprint(food)", "choices": ["food", "tacos", "\"tacos\"", "NameError"], "answer": 1, "explain": "No quotes around food, so Python looks up the variable and prints its value."}, {"q": "What is len(\"pizza\")?", "choices": ["4", "5", "6", "pizza"], "answer": 1, "explain": "Count every character: p-i-z-z-a = 5."}, {"q": "You forget the closing quote: print(\"Hello). Which error do you get?", "choices": ["NameError", "IndentationError", "SyntaxError", "TypeError"], "answer": 2, "explain": "A missing quote breaks Python's grammar, which is a SyntaxError."}, {"q": "What does print(\"Hello\" + \"John\") output?", "choices": ["Hello John", "HelloJohn", "Hello + John", "Error"], "answer": 1, "explain": "+ glues strings together exactly; it doesn't add a space."}, {"q": "Which variable name is valid?", "choices": ["user name", "2nd_place", "user_name", "print"], "answer": 2, "explain": "Use underscores instead of spaces, don't start with a number, and avoid built-in names like print."}, {"q": "In print(len(input(\"Name? \"))), which runs first?", "choices": ["print()", "len()", "input()", "They all run at once"], "answer": 2, "explain": "Python works inside out: input(), then len(), then print()."}, {"q": "What causes a NameError?", "choices": ["A missing quote", "Using a variable that was never defined (often a typo)", "A space at the start of a line", "Adding a string to a number"], "answer": 1, "explain": "Python doesn't recognize the name, usually because it's misspelled or was never created."}]}, {"day": 2, "questions": [{"q": "What is \"Hello\"[0]?", "choices": ["H", "e", "o", "Error"], "answer": 0, "explain": "Indexes start at 0, so [0] is the first character."}, {"q": "What does print(\"5\" + \"3\") output?", "choices": ["8", "53", "5 3", "TypeError"], "answer": 1, "explain": "Both are strings (in quotes), so + joins them."}, {"q": "Why does print(\"Letters: \" + len(name)) crash?", "choices": ["len() needs quotes", "You can't add a string and an int", "name isn't a string", "print can't take +"], "answer": 1, "explain": "len() returns an int. Wrap it in str() or use an f-string."}, {"q": "What is 7 // 2?", "choices": ["3.5", "3", "4", "1"], "answer": 1, "explain": "// is floor division: it drops the decimal part."}, {"q": "What is 2 + 3 * 4?", "choices": ["20", "14", "24", "9"], "answer": 1, "explain": "Multiplication happens before addition: 3 * 4 = 12, then + 2 = 14."}, {"q": "Your customer's tax rate is 8%. Which line correctly adds tax to materials?", "choices": ["materials * 8", "materials * 8 / 100", "materials * (8 / 100 + 1)", "materials + 8"], "answer": 2, "explain": "8 / 100 + 1 = 1.08. Multiplying by 1.08 adds 8% on top. Multiplying by 8 would make it 8 times as much."}, {"q": "price = 33.6. Which line prints 33.60?", "choices": ["print(round(price, 2))", "print(f\"{price:.2f}\")", "print(int(price))", "print(str(price))"], "answer": 1, "explain": "round() drops trailing zeros; :.2f always shows two decimals."}, {"q": "What does score += 5 do?", "choices": ["Sets score to 5", "Adds 5 to score", "Checks if score equals 5", "Error"], "answer": 1, "explain": "It's short for score = score + 5."}]}, {"day": 3, "questions": [{"q": "height = 120. What prints?\n\nif height > 120:\n    print(\"Ride!\")\nelse:\n    print(\"Too short\")", "choices": ["Ride!", "Too short", "Both", "Nothing"], "answer": 1, "explain": "> means strictly greater, so 120 isn't > 120. Use >= to include it."}, {"q": "Which line checks if age equals 18?", "choices": ["if age = 18:", "if age == 18:", "if age === 18:", "if age equals 18:"], "answer": 1, "explain": "= assigns a value; == compares two values."}, {"q": "What is 17 % 5?", "choices": ["3", "2", "3.4", "0"], "answer": 1, "explain": "5 goes into 17 three times (15), leaving 2."}, {"q": "Which condition is True only for even numbers?", "choices": ["number % 2 == 1", "number / 2 == 0", "number % 2 == 0", "number // 2 == 0"], "answer": 2, "explain": "Even numbers have no remainder when divided by 2."}, {"q": "What's missing here?\n\nif pipe_size >= 2\n    print(\"Use the big wrench\")", "choices": ["Quotes around 2", "A colon after the condition", "An else", "Parentheses around print"], "answer": 1, "explain": "Every if (and else) line needs a colon at the end."}, {"q": "How does Python know which lines belong inside an if block?", "choices": ["Curly braces", "They're on the same line", "Indentation", "The word end"], "answer": 2, "explain": "Lines indented under the if are inside it."}, {"q": "What does != mean?", "choices": ["Not equal to", "Equal to", "Greater than", "Assign"], "answer": 0, "explain": "!= is True when the two values are different."}, {"q": "age = 15. What prints?\n\nif age < 12:\n    print(\"$5\")\nelif age <= 18:\n    print(\"$7\")\nelse:\n    print(\"$12\")", "choices": ["$5", "$7", "$12", "$7 and $12"], "answer": 1, "explain": "15 isn't < 12, so Python moves to the elif. 15 <= 18 is True, so it prints $7 and skips the else."}, {"q": "height = 110. What prints?\n\nif height >= 120:\n    age = int(input(\"Age? \"))\n    if age <= 18:\n        print(\"$7\")\n    else:\n        print(\"$12\")\nelse:\n    print(\"Too short\")", "choices": ["$7", "$12", "Too short", "It asks for your age first"], "answer": 2, "explain": "The outer check fails, so Python never goes into the nested block. It goes straight to the outer else."}, {"q": "age = 10. What prints?\n\nif age <= 18:\n    print(\"$7\")\nelif age < 12:\n    print(\"$5\")\nelse:\n    print(\"$12\")", "choices": ["$5", "$7", "$5 and $7", "$12"], "answer": 1, "explain": "10 <= 18 is True, so Python runs the first block and skips the rest. That's why the under-12 check has to come first."}, {"q": "bill = 12. The user types y. What prints?\n\nwants_photo = input(\"Photo? y/n \")\nif wants_photo == \"y\":\n    bill += 3\nprint(f\"Bill: ${bill}\")", "choices": ["Bill: $12", "Bill: $15", "Bill: $3", "Nothing prints"], "answer": 1, "explain": "The condition is True, so bill += 3 makes it 15. The print isn't indented, so it runs either way."}, {"q": "Same code, but the user types n. What prints?\n\nwants_photo = input(\"Photo? y/n \")\nif wants_photo == \"y\":\n    bill += 3\nprint(f\"Bill: ${bill}\")", "choices": ["Bill: $12", "Bill: $15", "An error, because there's no else", "Nothing prints"], "answer": 0, "explain": "The if is skipped, so bill stays 12. You don't need an else when nothing should happen."}, {"q": "x = 15. How many lines print?\n\nif x > 10:\n    print(\"A\")\nif x > 5:\n    print(\"B\")\nif x > 1:\n    print(\"C\")", "choices": ["1 (just A)", "2", "3 (A, B, and C)", "0"], "answer": 2, "explain": "These are separate ifs, so Python checks each one. All three are True, so A, B, and C all print."}, {"q": "Same check, but written with elif. x = 15. What prints?\n\nif x > 10:\n    print(\"A\")\nelif x > 5:\n    print(\"B\")\nelif x > 1:\n    print(\"C\")", "choices": ["A", "A, B, and C", "C", "B"], "answer": 0, "explain": "With elif, Python stops at the first True condition, so only A prints."}, {"q": "a = 12. What is the result?\n\na > 10 and a < 13", "choices": ["True", "False", "12", "Error"], "answer": 0, "explain": "12 > 10 is True and 12 < 13 is True. Both are True, so and gives True."}, {"q": "a = 12. What is the result?\n\na > 15 or a < 10", "choices": ["True", "False"], "answer": 1, "explain": "Both sides are False. or is only False when both are False."}, {"q": "What is not (5 > 3)?", "choices": ["True", "False", "5", "Error"], "answer": 1, "explain": "5 > 3 is True, and not flips it to False."}, {"q": "Which condition catches ages 45 to 55, including 45 and 55?", "choices": ["age > 45 and age < 55", "age >= 45 or age <= 55", "age >= 45 and age <= 55", "not age < 45"], "answer": 2, "explain": "You need both conditions to be true, so use and with >= and <=. Using or would be true for every age."}, {"q": "A plumbing job is urgent if it's a burst pipe OR
