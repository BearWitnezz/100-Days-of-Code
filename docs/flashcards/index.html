 and if it works, your way is the best way", "You must use the same variable names", "Only the scoreboard has to match"], "answer": 1, "explain": "The walkthrough says the code doesn't have to look the same. Achieving the functionality is what counts."}, {"q": "Which check detects a collision with a car?", "choices": ["if player.xcor() > 300", "if the car's distance to the player is less than 20", "if player.distance(car) < 50 and player.ycor() > 280", "if car.xcor() == player.xcor()"], "answer": 1, "explain": "Loop through the cars in the car_manager. Cars are 20 tall by 40 wide, so less than 20 pixels from the car's center probably means a hit."}, {"q": "How do you stop the game after a collision?", "choices": ["Call screen.bye()", "Turn game_is_on from True to False", "Raise an error", "Hide the player"], "answer": 1, "explain": "Setting game_is_on to False leaves the while loop, which also prevents further cars from moving."}, {"q": "Why call screen.exitonclick() at the bottom?", "choices": ["It starts the game loop", "So the screen stays open instead of closing when the process finishes", "It binds the Up key", "It clears the scoreboard"], "answer": 1, "explain": "After a crash the window stays open and waits, which is when game over and the final level will show."}, {"q": "What counts as a successful crossing?", "choices": ["The player reaches x = 280 on the right edge of the screen", "The player turtle reaches the finish line, whose Y value is defined as 280 in a constant", "The player collides with a car", "The player reaches y = 300, the very top edge of the screen"], "answer": 1, "explain": "A successful crossing is reaching the finish line. That Y value is 280, stored in a constant."}, {"q": "How does is_at_finish_line decide the turtle is at the finish line?", "choices": ["It returns True if self.xcor() is greater than 280", "It returns True if self.ycor() is greater than 280, otherwise False", "It returns True if the player's distance to (0, 280) is less than 20", "It always returns True after go_up is called"], "answer": 1, "explain": "The method checks self.ycor() against the finish line Y of 280. If the turtle has gone over it, it returns True; any other time it returns False."}, {"q": "You could check in main.py whether the player's position is over 280. What does the lesson do instead?", "choices": ["It only checks in main.py and then ends the game", "It creates an is_at_finish_line method on the player. If that returns True, the player goes back to the starting position.", "It creates a level_up method on the player", "It checks the scoreboard's Y position"], "answer": 1, "explain": "The lesson says you could check the position in main.py or make a method, and it chooses a method named is_at_finish_line. When that's True, main.py sends the player back to the start."}, {"q": "What does go_to_start do, and how does the lesson remove the repeated goto?", "choices": ["It sets the heading to 90 and does not use a constant", "It sends the player to the starting-position constant. The repeated goto line in __init__ is deleted and replaced with a call to self.go_to_start().", "It only runs from main.py and hides the turtle", "It moves the player forward by the move distance"], "answer": 1, "explain": "go_to_start uses the starting-position constant. Because __init__ already had that same goto, the lesson deletes that line and calls self.go_to_start() instead."}, {"q": "What does level_up() do to car_speed?", "choices": ["Sets car_speed back to the starting move distance", "Increases self.car_speed by the move increment, so the cars go 10 faster each time", "Multiplies car_speed by 0.9", "Adds 1 to the number of cars"], "answer": 1, "explain": "car_speed starts as the starting move distance and controls how far each car moves backward. The move increment raises it by 10 on each level up."}, {"q": "When the player reaches the finish line, what happens?", "choices": ["The game ends immediately", "The player goes back to the start, and the car_manager levels up the cars so they speed up", "Only the scoreboard changes; the cars stay the same speed", "The cars reset to the right edge and stay the same speed"], "answer": 1, "explain": "A successful crossing returns the player to its original position and calls level_up so the cars get faster. The scoreboard increase comes in the next lesson."}, {"q": "How should the Scoreboard class be set up?", "choices": ["self.scoreboard = Turtle() and leave the arrow visible", "Subclass Turtle, hide the turtle, pull the pen up, and use write", "Inherit from Player", "Write first, then penup and goto"], "answer": 1, "explain": "The scoreboard inherits from Turtle so it can do everything a turtle can. It's hidden and used only as a pen, with penup so it doesn't draw a path."}, {"q": "Where does the lesson first place the level text, and when do you call goto?", "choices": ["Center at (0, 0); goto after write", "Top left, first try -280, +280; goto after penup and right before write so it doesn't draw a path", "Bottom right at (280, -280)", "Top center at (0, 280); no goto is needed"], "answer": 1, "explain": "The text is left-aligned with the font constant. +280 was a little too far up, so the lesson moved it down and tweaked the position."}, {"q": "Why pull the write into update_scoreboard(), and why clear first?", "choices": ["Turtle requires that method name; clear is optional", "__init__ and increase_level both need the same write; without clear(), level 2 is written on top of level 1", "So the cars can read the level; clear moves the turtle home", "clear() is only for game_over"], "answer": 1, "explain": "Both places call self.update_scoreboard(), which clears the previous text and then writes the current level."}, {"q": "What does increase_level() do?", "choices": ["Resets level to 1 and clears the screen", "Adds 1 to self.level and then rewrites the level (by calling update_scoreboard)", "Only writes GAME OVER", "Speeds up the cars"], "answer": 1, "explain": "main.py should call it when the player levels up, which happens on a successful crossing. Speeding up the cars is car_manager.level_up()."}, {"q": "What does game_over() do, and why skip clear()?", "choices": ["It goes to (0, 0) and writes GAME OVER in all caps, centered, with the default font. It doesn't clear, so the user can still see the highest level they reached.", "It clears the level, then writes \"game over\" at the top left", "It writes GAME OVER at (-280, 280) and hides the cars", "It calls home() and then clear()"], "answer": 0, "explain": "On a collision, set game_is_on to False and also show the game over sequence. Leaving the old text means the final level stays on screen."}]}, {"day": 24, "questions": [{"q": "In reset(), which order actually updates the high score?", "choices": ["Set self.score = 0 first, then compare it to self.high_score", "If self.score > self.high_score, set self.high_score = self.score; then self.score = 0; then update the scoreboard", "Call game_over() first, then set both scores to 0", "Only set self.high_score = 0, because resetting the score also resets the high score"], "answer": 1, "explain": "If you zero the score first, it can never beat the high score, so the check never triggers and the high score never updates."}, {"q": "Why do you send each snake segment to (1000, 1000) before calling clear() on the list?", "choices": ["clear() moves them there automatically, so the goto is just a backup", "The screen is 1000 by 1000, so that's the corner of the window", "Clearing the list alone leaves the old turtles on the 600x600 screen; move them off first, while you still have access to them", "You have to hide them with hideturtle() before you can clear the list"], "answer": 2, "explain": "The list is just your access to those turtle objects. If you clear it first, the old snakes stay visible on the screen."}, {"q": "On a wall hit or a tail hit, what should main.py do once high scores are in?", "choices": ["Set game_is_on to False and call scoreboard.game_over()", "Call only snake.reset(), and leave the score as it is", "Delete game_is_on = False and scoreboard.game_over(); call scoreboard.reset() and snake.reset() instead", "Restart the whole Python file with a new open() call"], "answer": 2, "explain": "The game keeps running. reset() on both the scoreboard and the snake starts a new try and keeps the high score on screen."}, {"q": "Why does a high score stored only in self.high_score go back to 0 when you stop and rerun the program?", "choices": ["Turtle always wipes numeric attributes at exit", "Variables don't remember state between runs, so high_score is created at 0 again", "You forgot to call file.close(), so the value is thrown away mid-run", "int() turns the score back into 0 on the next launch"], "answer": 1, "explain": "It's the same as a = 3, then a = input -> 12; rerun and a is 3 again. A file is what remembers the high score."}, {"q": "You open a file with file = open(\"my_file.txt\") and then call file.write(\"New text\"). What happens, and why?", "choices": ["It appends the text, because write always adds to the end", "It creates a new file called New text", "It fails with \"UnsupportedOperation: not writable\", because the default mode is \"r\" (read-only)", "It replaces the contents, because open() defaults to write mode"], "answer": 2, "explain": "Plain open() is read-only. You need mode=\"w\" to replace the text, or mode=\"a\" to append."}, {"q": "What's the difference between mode=\"w\" and mode=\"a\"?", "choices": ["\"w\" deletes all previous text and replaces it; \"a\" adds to the end without deleting, like list.append", "\"w\" appends, and \"a\" overwrites", "They do the same thing, but \"a\" is only for .txt files", "\"w\" is read-only, and \"a\" is the only mode that can create a file"], "answer": 0, "explain": "Use \\n with append if you want the new text on its own line: file.write(\"\\nNew text\")."}, {"q": "How do you create a file that doesn't exist yet?", "choices": ["Call file.create(\"new_file.txt\")", "Open it in \"r\" mode; Python will make it if it's missing", "Open it in \"w\" mode. That creates it from scratch, but only in write mode when the file doesn't currently exist", "You have to make the file by hand in Notepad first; Python cannot create files"], "answer": 2, "explain": "Opening a missing file in write mode creates it from scratch. That's why letter_for_<name>.txt can be written without making each file first."}, {"q": "data.txt holds 0. How do you turn that into a high_score you can compare and increase?", "choices": ["self.high_score = data.read(int())", "self.high_score = int(data.read())", "self.high_score = data.read(), because read() already returns a number", "self.high_score = str(data.read())"], "answer": 1, "explain": "read() gives a string, even if the file says 0. int() goes around the result: int(data.read()), not int() inside read()."}, {"q": "When and how do you write the new high score into data.txt?", "choices": ["At the top of __init__, with the default read mode", "Inside reset, when score > high_score, with mode=\"w\", and write a string such as f\"{self.high_score}\"", "After game_over(), using mode=\"a\" so old high scores stay in the file as a list", "Whenever the score increases, with file.write(self.high_score) and no mode"], "answer": 1, "explain": "You must use mode \"w\" or it won't let you write. write() needs a string, so turn the number into one with an f-string."}, {"q": "A KeyboardInterrupt appears in the console after you click stop. Is that a bug?", "choices": ["Yes \u2014 it means data.txt was not closed", "Yes \u2014 the high score was not saved", "No. It's just from clicking stop.", "Only if you opened the file in \"w\" mode"], "answer": 2, "explain": "The lesson flags this so you don't chase it as an error in the high-score code."}, {"q": "From a project folder inside work, what is the relative path to report.doc, which lives in work (the parent)?", "choices": ["./report.doc", "../report.doc", ".../report.doc", "../../report.doc"], "answer": 1, "explain": "../ goes up one folder to the parent. ./report.doc would look in the current (project) folder. .../ is not a valid step."}, {"q": "my_file.txt was moved to the Desktop. From the day-24 project folder, which relative path reaches it?", "choices": ["../my_file.txt", "./Desktop/my_file.txt", "../../Desktop/my_file.txt", "Desktop/my_file.txt"], "answer": 2, "explain": "Go up two levels to the user folder, then down into Desktop. ../my_file.txt is missing the second ../ and the Desktop folder."}, {"q": "Windows shows backslashes between folders. What should you write in a Python path?", "choices": ["You must copy the backslashes exactly, or the path will fail", "You can just write /, even on Windows", "You have to use os.sep, or open() will crash", "Only raw strings with \\\\ are allowed on Windows"], "answer": 1, "explain": "Windows shows \\ and Mac shows /, but in Python you can just write /."}, {"q": "What's the difference between an absolute path and a relative path?", "choices": ["Absolute is relative to the root (starts with / or C:); relative is relative to the current working directory", "Absolute paths only work on Mac, and relative paths only work on Windows", "Relative paths always start with /, and absolute paths start with ./", "There is no difference once the file is open"], "answer": 0, "explain": "Pick whichever fits the situation. main.py's folder is the working directory, so a file next to it can just be the name."}, {"q": "In the Mail Merge project, where does each finished letter go, and what is it named?", "choices": ["Next to main.py, named <name>.docx", "In Input/Letters/, named starting_letter.txt, overwriting the template each time", "In Output/ReadyToSend/, named letter_for_<name>.txt", "In the Names folder, named invited_names.txt"], "answer": 2, "explain": "starting_letter.txt stays inside Letters, inside Input. You don't move files by hand; you use directories and file paths."}, {"q": "In a finished letter, how should the name look before the comma?", "choices": ["The name, then a space, then the comma, like \"Dear Aang ,\"", "The name with no space after it, just a comma", "The placeholder [name], left as-is", "The name in all caps, then two spaces"], "answer": 1, "explain": "That's the example's final shape: the name, then a comma, with no extra space."}, {"q": "What's the difference between read(), readline(), and readlines()?", "choices": ["They all return the same list of lines; the names are interchangeable", "read() reads the whole file as one string; readline() reads just the first line; readlines() reads every line and gives you a list", "readline() reads the whole file, and read() reads one character", "readlines() returns one string, and read() returns a list"], "answer": 1, "explain": "For the starting letter you want the whole thing as one string, so use read(). For the names list, use readlines()."}, {"q": "You save names.readlines() into a variable, then call names.readlines() again. What does the second call give back?", "choices": ["The same list of names again", "An empty list, [], because the first call already read the file to the end", "A single string of all the names", "An error, because you can't call readlines() twice"], "answer": 1, "explain": "A file is like a tape that doesn't rewind on its own. Read it once, save it, and loop over the variable."}, {"q": "Each name from readlines() prints with a blank line after it. What's stuck to the end, and how do you clean it off?", "choices": ["A space; use replace(\" \", \"\")", "A forward slash n (/n); use name.remove(\"/n\")", "A newline, written \\n (a backslash); use name.strip()", "A comma; use name.split(\",\")"], "answer": 2, "explain": "readlines() keeps the newline at the end of each line. strip() takes extra spaces and newlines off the ends, so \"Dear Aang,\" has no gap before the comma."}, {"q": "You want to write letter_for_Aang.txt. Which part goes in open(), and what is the word after as?", "choices": ["open() gets only the folder path, and the word after as is the file name letter_for_<name>.txt", "The file's name goes inside the path string in open(...). The word after as is just a nickname for the open file, like file", "as must be the full path, and open() takes only the mode", "Both open() and as should get the same full path"], "answer": 1, "explain": "Example: with open(f\"./Output/ReadyToSend/letter_for_{clean_name}.txt\", mode=\"w\") as file: then file.write(...)."}, {"q": "How many folders do ../ and ../../ go up?", "choices": ["../ goes up two folders, and ../../ goes up one", "../ goes up one folder (the parent), and ../../ goes up two", "Both go up one folder; the extra dots are optional", "../ means the current folder, and ../../ means the parent"], "answer": 1, "explain": "./ is the current folder. .. is one step up. Two levels up is ../../."}, {"q": "Why move self.clear() into update_scoreboard() once the high score is in?", "choices": ["So it runs every update. You couldn't do this before, because game over needed the score to stay on screen", "clear() is required before every write(), or Turtle crashes", "So game_over() can still show the final score in the center", "So the high score is deleted each time the score increases"], "answer": 0, "explain": "With reset() instead of game over, the scoreboard is rewritten on every update, so clear() belongs there."}, {"q": "What's a with open(\"my_file.txt\") as file: block for, and does the name after as matter?", "choices": ["It keeps the file open forever; the name after as has to be the file's real name", "It indents the work inside and closes the file when you're done. No file.close() is needed. The name after as can be anything", "It's only for write mode, and as file is required spelling", "It rewinds the file so a second readlines() still works"], "answer": 1, "explain": "The name is just a nickname (file, f, data). with closes the file once the block finishes, so you don't have to remember close()."}, {"q": "What is an absolute file path?", "choices": ["Any path that starts with ./", "One that always starts from the root, so it starts with / or C:", "A path that only works if the file is next to main.py", "The file name by itself, with no folders"], "answer": 1, "explain": "The root is the origin: / on a Mac (Macintosh HD), usually C: on Windows. A relative path starts from the working directory instead."}, {"q": "What does \"I like bananas\".replace(\"bananas\", \"apples\") give back?", "choices": ["Nothing, it changes the string in place", "\"I like apples\" as a new string", "\"apples\"", "An error, strings can't change"], "answer": 1, "explain": "replace() returns a new string. Save it in a variable to use it."}, {"q": "What does \"  hot water  \".strip() give?", "choices": ["\"hotwater\"", "\"hot water\"", "\"  hot water\"", "[\"hot\", \"water\"]"], "answer": 1, "explain": "strip() only trims the ends. The space between words stays."}]}, {"day": 25, "questions": [{"q": "What does CSV stand for, and how are the values in each row written?", "choices": ["Comma Separated Values; values are separated by commas with no space", "Column Sorted Values; values are separated by tabs", "Comma Separated Values; values are separated by commas and a space", "Cell Spread Values; each row is one long string with no separators"], "answer": 0, "explain": "CSV is a common way to store tabular data. Each row is one set of data, and the values are separated by commas with no space."}, {"q": "You open a CSV with data_file.readlines(). What do you get, and what's the problem?", "choices": ["A pandas DataFrame with column headings already set", "A list of row strings still joined by commas, so there's lots of cleaning to get columns", "A csv reader object you can loop through", "A list of lists of ints, ready to use"], "answer": 1, "explain": "readlines() puts each line in a list, but every item is still one string. That's why the built-in csv library, and later pandas, are useful."}, {"q": "What does each row from csv.reader look like?", "choices": ["A single string like \"Monday,12,Sunny\"", "A pandas Series", "A list of separate values, all still strings, e.g. [\"Monday\", \"12\", \"Sunny\"]", "A dictionary with the column names as keys"], "answer": 2, "explain": "Printing data itself shows a csv reader object. Looping for row in data prints each row as a list of strings."}, {"q": "How do you add each temperature as an int, without also adding the header?", "choices": ["temperatures.append(row[1]) for every row, including the header", "if row[1] != \"temp\": temperatures.append(int(row[1]))", "temperatures.append(int(row[0])), and the header is skipped automatically", "int(row) then append, because csv.reader already skips the first row"], "answer": 1, "explain": "Temp is row[1]. Printing row[1] also prints the column label \"temp\", so skip that row, then convert with int()."}, {"q": "What's the one required argument to pandas.read_csv()?", "choices": ["A file object from open()", "The column name you want", "The path to the CSV", "A csv.reader object"], "answer": 2, "explain": "The path is required; the rest of the arguments are optional. No open() or csv.reader is needed."}, {"q": "What are the two primary pandas data structures?", "choices": ["DataFrame is the whole table; Series is a single column (basically a list)", "Series is the whole table; DataFrame is one cell", "They're two names for the same thing", "DataFrame is only for Excel; Series is only for CSV"], "answer": 0, "explain": "print(type(data)) shows a DataFrame. type(data[\"temp\"]) shows a Series. day, temp, and condition are each a Series."}, {"q": "How do you turn the temp column into a raw Python list?", "choices": ["data.to_dict()", "data[\"temp\"].to_list()", "list(data)", "data[\"temp\"].mean()"], "answer": 1, "explain": "temp_list = data[\"temp\"].to_list() gives a raw Python list, so you can do list things like len()."}, {"q": "Which of these gives the average of the temp column?", "choices": ["Only data[\"temp\"].max()", "data[\"temp\"].to_list() by itself", "Both sum(temp_list) / len(temp_list) and data[\"temp\"].mean() -> 17.4", "data.to_dict(), then divide by 7"], "answer": 2, "explain": "Sum of the values divided by the number of values is the average, also called the mean. The Series method does the same work with less code."}, {"q": "How do you get the condition column, and what must match?", "choices": ["data[\"condition\"] or data.condition; the name must match exactly, including capitals", "Only data.get(\"Condition\"); capitals are ignored", "data.row(\"condition\")", "condition(data), which is a built-in pandas function"], "answer": 0, "explain": "Square brackets treat the DataFrame like a dictionary. The dot treats it like an object. A capital C needs a capital C too."}, {"q": "How do you get the whole Monday row?", "choices": ["data[\"Monday\"]", "data.day.Monday", "data[data.day == \"Monday\"]", "data.to_list()[\"Monday\"]"], "answer": 2, "explain": "Get the column, check where its value equals Monday, then use that condition inside data[...]."}, {"q": "What's the difference between data[\"temp\"] and data[data.temp == data.temp.max()]?", "choices": ["A column name alone gives the whole column; a condition gives the row (Sunday, 24, Sunny)", "They both give the same Series of all temps", "The first gives a row, and the second gives a column", "The second crashes because you can't compare a column to max()"], "answer": 0, "explain": "Square brackets with only a column name -> the whole column. Square brackets with a condition on a column -> the row. Angela prefers .temp because it uses fewer strings."}, {"q": "How do you convert Monday's 12 C to Fahrenheit?", "choices": ["monday.temp.mean(), then F = C + 32", "monday.temp[0], then F = C * 9 / 5 + 32, which is 53.6", "int(monday), then F = C * 9 / 5", "monday.condition, then F = C * 5 / 9 + 32"], "answer": 1, "explain": "monday.temp[0] is the first value in the series (index 0). The formula matches Google's converter: 12 C is 53.6 F."}, {"q": "How do you make a new DataFrame from a dictionary and save it as a CSV?", "choices": ["data_dict.to_csv(\"new_data.csv\")", "pandas.read_csv(data_dict)", "data = pandas.DataFrame(data_dict); data.to_csv(\"new_data.csv\") (the path is the only required input)", "open(\"new_data.csv\").write(data_dict)"], "answer": 2, "explain": "pandas.DataFrame(data_dict) builds the table, for example from students and scores. to_csv only needs the path."}, {"q": "Why use square brackets for the Primary Fur Color column?", "choices": ["The column name has spaces, so use data[\"Primary Fur Color\"]", "pandas never allows the dot notation", "Square brackets are required for every column", "The column is a row, so you have to use a condition"], "answer": 0, "explain": "A heading with spaces can't be used as data.Primary Fur Color. Square brackets take the full name as a key."}, {"q": "How do you count the gray squirrels, and how is the color spelled?", "choices": ["data[\"Grey\"].count() -> 2473", "data.Primary_Fur_Color.mean()", "data[data[\"Primary Fur Color\"] == \"Gray\"]; len(...) -> 2473. Spelled Gray, not Grey.", "len(data) gives 2473 gray squirrels automatically"], "answer": 2, "explain": "Rows act like an iterable, so len() works on the filtered table. The dataset spells it Gray."}, {"q": "How do you build squirrel_count.csv?", "choices": ["A dictionary of Fur Color and Count, then pandas.DataFrame(data_dict) and df.to_csv(\"squirrel_count.csv\")", "data.to_csv(\"squirrel_count.csv\") on the full census file", "Print the three counts and save them by hand", "csv.reader, then write each color as a row string"], "answer": 0, "explain": "The dictionary has Fur Color: Gray, Cinnamon, Black and Count: the three len() results. DataFrame plus to_csv makes the new file."}, {"q": "What image format can Turtle use as a shape?", "choices": ["Only .png", "Only .gif", ".jpg or .png", "Any image file"], "answer": 1, "explain": "The blank map is blank_states_img.gif because Turtle can only use .gif images as shapes."}, {"q": "How do you put blank_states_img.gif on the screen?", "choices": ["turtle.open(image)", "screen.bgpic is the only way, and it must be a .png", "screen.addshape(image), then turtle.shape(image)", "screen.textinput(image)"], "answer": 2, "explain": "Set image = \"blank_states_img.gif\", add it as a shape, then set the turtle's shape to that image. Also use turtle.Screen() and screen.title(\"U.S. States Game\")."}, {"q": "Why use turtle.mainloop() instead of screen.exitonclick() while you're clicking for coordinates?", "choices": ["mainloop() keeps the screen open; exitonclick() would close the window on the click", "mainloop() closes the window as soon as the map loads", "They do the same thing", "exitonclick() is required or the clicks aren't recorded"], "answer": 0, "explain": "You don't actually need the click code anyway, because the x and y for every state are already in 50_states.csv."}, {"q": "In screen.textinput(title=\"...\", prompt=\"...\"), where does each string go, and what comes back?", "choices": ["The prompt is the window title, and it returns True or False", "The title goes at the top of the window, the prompt goes inside the box, and it returns what the user typed", "Both strings go inside the box, and it returns a pandas Series", "The title is printed in the console, and it returns the x, y of the state"], "answer": 1, "explain": "Save it as answer_state = screen.textinput(...). Later the title becomes something like \"N/50 States Correct\"."}, {"q": "Why does all_states have to be a list?", "choices": ["So pandas can write it to the map", "Because to_csv only accepts lists", "So you can check membership with `in`: if answer_state in all_states", "So .item() can pull the state name"], "answer": 2, "explain": "all_states = data.state.to_list(). Then you can check whether the user's answer is one of the 50 states."}, {"q": "t.goto(state_data.x, state_data.y) causes \"bad screen distance\". Why, and what's the fix?", "choices": ["x and y are strings, so use int(state_data)", "The turtle is hidden, so goto fails until you show it", "You must use screen.goto, not t.goto", "state_data.x is a pandas Series (e.g. index 34 plus value 175 for Ohio), not an int. Use state_data.x.item() and state_data.y.item()."], "answer": 3, "explain": ".item() grabs the single raw value from a Series so goto gets a real number, not the index-plus-value Series."}, {"q": "What should the turtle write for a correct state, and why not state_data.state?", "choices": ["t.write(answer_state). state_data.state writes extra junk from the Series (state_data.state.item() also works).", "t.write(state_data), which prints the whole row", "t.write(all_states), so every state appears at once", "You don't write the name; you stamp the turtle's shape"], "answer": 0, "explain": "answer_state is already title-cased and is cleaner than pulling the name back out of the row."}, {"q": "How does the input title show the score, and when does the loop stop?", "choices": ["The title is always \"Guess the State\", and the loop runs 50 times even after a win", "The title is f\"{len(guessed_states)}/50 States Correct\", and the loop is while len(guessed_states) < 50", "The title uses len(all_states), and the loop is for state in data", "The title is the prompt, and the loop stops after the first wrong guess"], "answer": 1, "explain": "On a correct guess, append the answer to guessed_states. A wrong guess does nothing, and the input pops up again."}, {"q": "The user types \"ohio\" or \"OHIO\". How does it still match the CSV?", "choices": ["pandas ignores casing automatically", "Use .lower() on the CSV column", "screen.textinput(...).title() makes each word start with a capital, so it matches the title-case CSV", "You have to type it in title case or it won't count"], "answer": 2, "explain": "The states in the CSV are title case. .title() on the user's answer means any casing still counts, as long as the spelling is right."}, {"q": "The user types \"exit\". How do you quit and save the missed states?", "choices": ["if answer_state == \"exit\": continue, then data.to_csv(\"50_states.csv\")", "Type \"quit\" (lowercase) and call screen.exitonclick()", "break if the answer is wrong, then write guessed_states to the CSV", "if answer_state == \"Exit\": break (capital E because of .title()). Then build missing_states from the states not in guessed_states, and pandas.DataFrame(missing_states).to_csv(\"states_to_learn.csv\")"], "answer": 3, "explain": "break ends the while loop early. Delete the line that keeps the screen open so the window closes. The new file is a one-column DataFrame of the missed states."}]}, {"day": 26, "questions": [{"q": "What is a list comprehension?", "choices": ["A way to create a new list from a previous list, in one line instead of a for loop + empty list + append", "A way to change a list in place without creating a new one", "A method on a list that appends every item automatically", "A loop that can only run on dictionaries"], "answer": 0, "explain": "It replaces the empty list, for loop, and append with one line: new_list = [new_item for item in list]."}, {"q": "What's the keyword pattern for a list comprehension?", "choices": ["new_list = {new_item for item in list}", "new_list = [new_item for item in list]", "new_list = [for item in list: new_item]", "new_list = (item, new_item) in list"], "answer": 1, "explain": "Square brackets, with the new item first, then for item in list. Curly braces would make a dictionary (or set) comprehension."}, {"q": "numbers = [1, 2, 3]. What does [n + 1 for n in numbers] give?", "choices": ["[1, 2, 3]", "[1, 2, 3, 4]", "[2, 3, 4]", "[0, 1, 2]"], "answer": 2, "explain": "That's the one-line version of the for loop that did add_1 = n + 1 and appended it, ates = {state: state for state in all_states if state not in guessed_states}"], "answer": 0, "explain": "The list is all_states, the item is state, the test is state not in guessed_states, and the new item is state unchanged. It cuts the empty list, for loop, and append."}, {"q": "What is a dictionary comprehension, and what brackets does it use?", "choices": ["It creates a new list from a dictionary, using square brackets []", "It creates a new dictionary from the values in a list or a dictionary, using curly brackets {}", "It updates a dictionary in place, using parentheses ()", "It's the same as a list comprehension, just with .items() added"], "answer": 1, "explain": "The simplest form is new_dict = {new_key: new_value for item in list}. The 'list' can be any iterable: a list, range, string, or tuple."}, {"q": "How do you create a new dictionary from an existing dictionary?", "choices": ["{new_key: new_value for item in dict}", "[new_key: new_value for (key, value) in dict]", "{new_key: new_value for (key, value) in dict.items()}", "{key, value in dict.items()}"], "answer": 2, "explain": "Loop with dict.items() to get each key and value, then use those to build the new key and new value."}, {"q": "Why does .items() need parentheses?", "choices": ["It's a method, not an attribute", "Parentheses turn it into a list", "Without them, Python thinks items is the new key", "They are optional; dict.items works the same"], "answer": 0, "explain": "Call it as dict.items(), not as an attribute named items."}, {"q": "How do you give each student in a names list a random score from 1 to 100?", "choices": ["{student: random.randint(1, 100) for student in names} with no import", "import random, then {student: random.randint(1, 100) for student in names}", "{random.randint(1, 100): student for student in names}", "[student: random.randint(1, 100) for student in names]"], "answer": 1, "explain": "This is the simplest form, looping through a list. You need to import random first  braces because nato is a dictionary", "You have to loop with .iterrows() again", "It works, because Python looks up the letter automatically", "Each new item is the whole nato dict, not one code. Look up this letter with square brackets: [nato[letter] for letter in word]"], "answer": 3, "explain": "The list comprehension pattern is [new_item for item in list]. Here the new item should be that letter's code, nato[letter]."}, {"q": "The user types \"Thomas\". What should print?", "choices": ["[\"tango\", \"hotel\", \"oscar\", \"mike\", \"alfa\", \"sierra\"]", "[\"Tango\", \"Hotel\", \"Oscar\", \"Mike\", \"Alfa\", \"Sierra\"]", "{\"T\": \"Tango\", \"H\": \"Hotel\", \"O\": \"Oscar\", \"M\": \"Mike\", \"A\": \"Alfa\", \"S\": \"Sierra\"}", "\"Tango Hotel Oscar Mike Alfa Sierra\""], "answer": 1, "explain": "TODO 2 is a list of the phonetic code words for each letter in the word the user types, then you print that list."}]}, {"day": 27, "questions": [{"q": "What's the goal of Day 27?", "choices": ["Learn the turtle module to draw in a playpen", "Learn the Tkinter module to build graphical user interfaces (GUIs)", "Learn how to use the Python console as a command-line OS", "Learn list and dictionary comprehensions"], "answer": 1, "explain": "The day's goal is to learn the Tkinter module to build GUIs, not just console or turtle programs."}, {"q": "Who made the first GUI in use, the first mouse, Ethernet, and the first object-oriented programming language?", "choices": ["Apple, with the Lisa", "Microsoft, with Windows", "Xerox PARC (Palo Alto Research Center)", "Bill Gates, after suing Apple"], "answer": 2, "explain": "Xerox PARC made the first GUI in use, the first mouse, Ethernet, and the first object-oriented programming language. The Mac had windows before Microsoft Windows."}, {"q": "You create a window with window = tkinter.Tk() and run the file, but you never call mainloop. What happens?", "choices": ["The window stays on screen and waits for clicks", "Python raises a SyntaxError", "The window is made, there are no more instructions, and the program ends (exit code 0)", "Tkinter automatically starts a mainloop for you"], "answer": 2, "explain": "Without mainloop, the window is created and then the program ends, so nothing stays on screen."}, {"q": "What does window.mainloop() do, and where must it go?", "choices": ["It draws the first Label, and it can go anywhere", "It keeps the window on screen and listens for user actions (like a built-in while True loop), and it must be the very last line", "It sets the title and minimum size, and it goes right after import tkinter", "It packs every widget, and it goes before you create the window"], "answer": 1, "explain": "mainloop keeps the window open and listening. Everything else goes between creating the window and that last line."}, {"q": "How do you create a Label with a 24-point bold Arial font?", "choices": ["my_label = tkinter.Label(text=\"I am a label\", font=(\"Arial\", 24, \"bold\"))", "my_label = tkinter.Label(\"I am a label\", \"Arial\", 24, \"bold\")", "my_label = tkinter.Label(text=\"I am a label\", font=\"Arial 24 bold\")", "my_label = Label(font=Arial, size=24, style=bold)"], "answer": 0, "explain": "The font is a tuple: (name, size, style). Style can be \"bold\", \"italic\", or left out."}, {"q": "You create a Label but never pack, place, or grid it. What do you see?", "choices": ["The label appears centered at the top", "The label appears at x=0, y=0", "The widget doesn't show, because a component doesn't show until you lay it out", "Tkinter raises a KeyError"], "answer": 2, "explain": "A widget won't show up until it has a layout. my_label.pack() places it and centers it by default."}, {"q": "def my_function(a=1, b=2, c=3). What does my_function(b=5) do?", "choices": ["It errors, because a and c weren't passed", "It sets a, b, and c all to 5", "It changes only b to 5, while a and c keep their defaults", "It ignores the defaults and requires all three arguments"], "ans let sel=new Set(['all']),list=[],i=0,seen=new Set();
const ck=k=>k.day+'|'+k.q;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/ \/ (?=<code>)/g,'<br>');
function buildDays(){const d=document.getElementById('days');d.innerHTML='';
 const mk=(label,key)=>{const b=document.createElement('button');b.textContent=label;b.className=sel.has(key)?'on':'';
  b.onclick=()=>{if(key==='all'){sel=new Set(['all'])}else{sel.delete('all');sel.has(key)?sel.delete(key):sel.add(key);if(!sel.size)sel.add('all')}buildDays();load()};d.appendChild(b)};
 mk('All days','all');DECKS.forEach(x=>mk('Day '+x.day,x.day));}
function load(){list=[];DECKS.forEach(x=>{if(sel.has('all')||sel.has(x.day))x.cards.forEach(c=>list.push({day:x.day,q:c[0],a:c[1]}))});i=0;show();}
function show(){const c=document.getElementById('card');c.classList.remove('flipped');
 if(!list.length){q.innerHTML='No cards yet';a.innerHTML='';return}
 const k=list[i];setTimeout(()=>{a.innerHTML=fmt(k.a)},150);q.innerHTML=fmt(k.q);
 tagF.textContent=tagB.textContent='Day '+k.day;
 count.textContent=`Card ${i+1} of ${list.length}`;bar.style.width=((i+1)/list.length*100)+'%';upd();}
function flip(){const c=document.getElementById('card');c.classList.toggle('flipped');if(c.classList.contains('flipped')&&list.length){seen.add(ck(list[i]));upd()}}
function upd(){done.textContent='Reviewed '+list.filter(k=>seen.has(ck(k))).length+' of '+list.length+' cards (a card counts once you flip it)'}
function resetDone(){seen=new Set();upd()}
function markAll(){list.forEach(k=>seen.add(ck(k)));upd()}
function copyDone(){const n=list.filter(k=>seen.has(ck(k))).length,days=sel.has('all')?'all days':'Day '+[...sel].sort((a,b)=>a-b).join(', ');const s=`Flashcards (${days}): ${n}/${list.length} reviewed\n`;navigator.clipboard.writeText(s).then(()=>alert('Copied! Paste it into the chat with Practice Coach.'),()=>prompt('Copy this:',s));}
function move(n){if(!list.length)return;i=(i+n+list.length)%list.length;show()}
function shuffle(){for(let j=list.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[list[j],list[r]]=[list[r],list[j]]}i=0;show()}
document.addEventListener('keydown',e=>{if(mode!=='f')return;if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key===' '){e.preventDefault();flip()}else if(e.key.toLowerCase()==='s')shuffle()});
let mode='f',qd=null,qi=0,qs=[],picked=null;
function tab(m){mode=m;tabF.className=m==='f'?'on':'';tabQ.className=m==='q'?'on':'';
 flashView.classList.toggle('hidden',m!=='f');days.classList.toggle('hidden',m!=='f');quizView.classList.toggle('hidden',m!=='q');
 sub.textContent=m==='f'?'Click the card (or press Space) to flip it':'Pick a day and test yourself';if(m==='q')quizDays();}
function best(d){return localStorage.getItem('best-day-'+d)}
function quizDays(){qdays.innerHTML='';if(!QUIZZES.length){quiz.innerHTML='<div class="qtext">No quizzes yet.</div>';return}
 QUIZZES.forEach(z=>{const b=document.createElement('button');b.className=qd===z.day?'on':'';
  const bs=best(z.day);b.innerHTML='Day '+z.day+(bs?'<span class="best">best '+bs+'</span>':'');b.onclick=()=>startQuiz(z.day);qdays.appendChild(b)});
 if(qd===null)startQuiz(QUIZZES[QUIZZES.length-1].day);}
function startQuiz(d){qd=d;qi=0;qs=[];quizDays();renderQ();}
function qtext(s){const parts=s.split('\n\n');let h='<div>'+fmt(parts[0])+'</div>';if(parts.length>1)h+='<pre>'+esc(parts.slice(1).join('\n\n'))+'</pre>';return h}
function renderQ(){const z=QUIZZES.find(x=>x.day===qd),Q=z.questions;picked=null;
 if(qi>=Q.length)return results(z);const k=Q[qi];
 let h=`<div class="qhead"><span>Day ${qd} pop quiz</span><span>Question ${qi+1} of ${Q.length}</span></div><div class="qtext">${qtext(k.q)}</div>`;
 k.choices.forEach((c,n)=>h+=`<button class="choice" onclick="pick(${n})">${String.fromCharCode(65+n)}. ${esc(c)}</button>`);
 h+='<div id="fb"></div><div class="qnav"><button id="nxt" class="hidden" onclick="qi++;renderQ()">Next &rarr;</button></div>';quiz.innerHTML=h;}
function pick(n){if(picked!==null)return;picked=n;const k=QUIZZES.find(x=>x.day===qd).questions[qi],ok=n===k.answer;
 const bs=quiz.querySelectorAll('.choice');bs.forEach((b,j)=>{b.disabled=true;if(j===k.answer)b.classList.add('right');else if(j===n)b.classList.add('wrong')});
 qs.push({q:k.q,ok,yours:k.choices[n],right:k.choices[k.answer]});
 fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct!':'Not quite.'}</b> ${fmt(k.explain||'')}</div>`;nxt.classList.remove('hidden');}
function results(z){const right=qs.filter(x=>x.ok).length,tot=qs.length,pct=right+'/'+tot;
 const prev=best(z.day);if(!prev||right>parseInt(prev))localStorage.setItem('best-day-'+z.day,pct);
 const misses=qs.filter(x=>!x.ok);let h=`<div class="qhead"><span>Day ${z.day} results</span><span></span></div><div class="score">${pct}</div>`;
 h+=`<div style="text-align:center;color:var(--muted);margin:6px 0 16px">${right===tot?'Perfect score!':right>=tot*.7?'Nice work. Review the misses below.':'Worth another pass on these.'}</div>`;
 misses.forEach(m=>h+=`<div class="miss">${qtext(m.q)}<div style="margin-top:6px">Your answer: <b>${esc(m.yours)}</b><br>Correct: <b>${esc(m.right)}</b></div></div>`);
 h+='<div class="qnav"><button class="ghost" onclick="copyRes()">Copy results for Practice Coach</button><button onclick="startQuiz(qd)">Retake</button></div>';
 quiz.innerHTML=h;quizDays();}
