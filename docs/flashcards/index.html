 there's no water. Which line is right?", "choices": ["if burst_pipe and no_water:", "if burst_pipe or no_water:", "if not burst_pipe:", "if burst_pipe == no_water:"], "answer": 1, "explain": "Either one alone makes the job urgent, so use or. and would require both at once."}]}, {"day": 4, "questions": [{"q": "What can random.randint(1, 6) return?", "choices": ["1 through 5", "1 through 6", "0 through 6", "Any decimal between 1 and 6"], "answer": 1, "explain": "randint includes both ends, so 1 and 6 can both come up."}, {"q": "Which value can random.random() NEVER return?", "choices": ["0", "0.5", "0.999", "1"], "answer": 3, "explain": "random.random() includes 0 but stops just below 1."}, {"q": "What's wrong with this code?\n\nnumber = random.randint(1, 10)\nprint(number)", "choices": ["randint should be RandInt", "It's missing import random at the top", "The range should be 0 to 10", "Nothing"], "answer": 1, "explain": "You need import random before Python knows what random means. Without it you get a NameError."}, {"q": "What prints?\n\ntools = [\"wrench\", \"plunger\", \"snake\"]\nprint(tools[1])", "choices": ["wrench", "plunger", "snake", "Error"], "answer": 1, "explain": "Index 0 is wrench, so index 1 is plunger."}, {"q": "jobs = [\"drain\", \"leak\"]. Which line adds \"water heater\" to the end?", "choices": ["jobs + \"water heater\"", "jobs[2] = \"water heater\"", "jobs.append(\"water heater\")", "jobs.extend(\"water heater\")"], "answer": 2, "explain": "append() adds one item to the end. jobs[2] = ... would crash because there's no index 2 yet."}, {"q": "Which line safely prints the last item in tools?", "choices": ["print(tools[len(tools)])", "print(tools[len(tools) - 1])", "print(tools[len(tools) + 1])", "print(tools[0])"], "answer": 1, "explain": "The last index is always len - 1. tools[-1] works too. Using len(tools) alone causes an IndexError."}, {"q": "What's wrong with this line?\n\nchoice = input(\"Left or Right? \".lower())", "choices": ["input() can't take a prompt", ".lower() is on the prompt string, not on what input() returns", "You need import string first", "Nothing"], "answer": 1, "explain": "The dot attaches to whatever sits right before it. Here that's the prompt text. Put .lower() after the whole input(...) call so it lowercases the player's answer."}, {"q": "Why does this fail when the user types 65?\n\nage = input(\"Age? \")\nif age >= 65:\n    print(\"Senior\")", "choices": ["65 is too big for a comparison", "input() returns a string, so you must convert before comparing to a number", "You need elif instead of if", "Nothing, it works"], "answer": 1, "explain": "input() always returns a string. Convert with int(age) or int(input(...)) before a numeric comparison."}]}, {"day": 5, "questions": [{"q": "What prints?\n\ntools = [\"wrench\", \"plunger\", \"snake\"]\nfor tool in tools:\n    print(tool)", "choices": ["wrench, plunger, snake (one per line)", "[\"wrench\", \"plunger\", \"snake\"] three times", "tool, tool, tool", "Only snake"], "answer": 0, "explain": "The loop variable tool holds one item at a time, so each item prints once, in order."}, {"q": "How many times does \"Done\" print?\n\njobs = [\"drain\", \"leak\", \"heater\"]\nfor job in jobs:\n    print(job)\nprint(\"Done\")", "choices": ["0", "1", "3", "4"], "answer": 1, "explain": "print(\"Done\") is not indented, so it's outside the loop and runs once after the loop finishes."}, {"q": "How many times does \"Done\" print now?\n\njobs = [\"drain\", \"leak\", \"heater\"]\nfor job in jobs:\n    print(job)\n    print(\"Done\")", "choices": ["0", "1", "3", "6"], "answer": 2, "explain": "Now print(\"Done\") is indented inside the loop, so it runs once per item: 3 times."}, {"q": "What's the last number printed?\n\nfor number in range(1, 10):\n    print(number)", "choices": ["1", "9", "10", "11"], "answer": 1, "explain": "The end of range is exclusive. range(1, 10) stops before 10, so the last number is 9."}, {"q": "What prints?\n\nfor number in range(0, 10, 3):\n    print(number)", "choices": ["0 3 6 9", "3 6 9", "0 3 6", "1 4 7 10"], "answer": 0, "explain": "Start at 0 and step by 3: 0, 3, 6, 9. The next would be 12, which is past the end."}, {"q": "What prints?\n\ntotal = 0\nfor price in [100, 250, 75]:\n    total += price\nprint(total)", "choices": ["75", "100", "425", "[100, 250, 75]"], "answer": 2, "explain": "total is an accumulator: 0 + 100 = 100, + 250 = 350, + 75 = 425."}, {"q": "nr_letters is 4. How many letters end up in password?\n\npassword = \"\"\nfor i in range(nr_letters):\n    password += random.choice(letters)", "choices": ["1", "3", "4", "5"], "answer": 2, "explain": "range(4) runs 4 times (i = 0, 1, 2, 3), and each pass adds one random letter."}, {"q": "letters = [\"a\", \"b\", \"c\", \"d\", \"e\"] and nr_letters is 3. What does this give?\n\nletters[nr_letters]", "choices": ["3 random letters", "\"d\" (one item at index 3)", "\"c\"", "An IndexError"], "answer": 1, "explain": "Square brackets grab one item at that position. Index 3 is \"d\". To get 3 random letters you need a loop with random.choice."}]}, {"day": 6, "questions": [{"q": "What is the difference between these two lines?\n\ndef fix_leak():\nfix_leak()", "choices": ["They do the same thing", "The first defines (writes the recipe); the second calls (runs it)", "The first calls the function; the second defines it", "The second line is an error"], "answer": 1, "explain": "def writes the recipe. The name plus parentheses runs it."}, {"q": "What prints when you run this file?\n\ndef greet():\n    print(\"Hello\")\n    print(\"Bye\")", "choices": ["Hello then Bye", "Nothing", "greet", "An error"], "answer": 1, "explain": "def only stores the recipe. Nothing runs until you call greet()."}, {"q": "What prints when you run this file?\n\ndef tools():\n    print(\"wrench\")\n    if 3 > 5:\n        print(\"plunger\")\n    print(\"tape\")\nprint(\"done\")\ntools()", "choices": ["wrench, plunger, tape, done", "done, wrench, tape", "wrench, tape, done", "done, wrench, plunger, tape"], "answer": 1, "explain": "print(\"done\") is outside the function and runs first. Then tools() runs its body: wrench, skip plunger (it's inside the if, and 3 > 5 is False), then tape."}, {"q": "What does this print, and why does it stop?\n\ncount = 3\nwhile count > 0:\n    count -= 1\n    print(count)", "choices": ["3, 2, 1 \u2014 stops when count is 0", "2, 1, 0 \u2014 stops because 0 > 0 is False", "3, 2, 1, 0 \u2014 stops after printing 0", "It never stops"], "answer": 1, "explain": "count drops by 1 before each print, so it prints 2, 1, 0. Then the check 0 > 0 is False and the loop ends."}, {"q": "What does this Reeborg code do?\n\nwhile not at_goal():\n    move()", "choices": ["Moves once, then stops", "Never moves, because at_goal() starts False", "Keeps moving until the robot is on the goal", "Moves exactly as many times as there are squares in the world"], "answer": 2, "explain": "not flips the check: keep looping while you are NOT at the goal. Once at_goal() is True, not at_goal() is False and the loop stops."}, {"q": "You need to check pressure on each of 5 fittings in a list. Later, you need to keep pumping until a tank reads empty, but you don't know how long that takes. Which loops fit best?", "choices": ["while for the fittings, for for the tank", "for for the fittings, while for the tank", "for for both", "while for both, always"], "answer": 1, "explain": "for = each item in a list or a known count. while = repeat until a condition changes when you don't know how many times."}, {"q": "Why does this loop never stop?\n\ngallons = 10\nwhile gallons > 0:\n    print(gallons)", "choices": ["gallons > 0 is always False", "print() can't be used in a while loop", "gallons never changes, so gallons > 0 stays True forever", "The loop needs a for instead"], "answer": 2, "explain": "Nothing inside the loop changes gallons. Add something like gallons -= 1 so the condition can eventually become False."}, {"q": "In the maze, the robot starts in an open area with no walls nearby and runs the right-hand rule loop. What goes wrong, and what's a fix?\n\nwhile not at_goal():\n    if right_is_clear():\n        turn_right()\n        move()\n    elif front_is_clear():\n        move()\n    else:\n        turn_left()", "choices": ["Nothing goes wrong; the right-hand rule always works", "It crashes because turn_right() isn't built in, so delete it", "Right is always clear, so it circles a small square forever; first walk straight to a wall, then turn_left(), so a wall is on its right", "It moves too fast; add more move() calls"], "answer": 2, "explain": "With nothing to hug, right_is_clear() is always True, so it loops in a square. Walking to a wall and turning left puts a wall on the right before the loop starts."}]}, {"day": 7, "questions": [{"q": "What prints?\n\nprint(\"t\" in \"tee\")\nprint(\"x\" in [\"elbow\", \"tee\"])", "choices": ["True then True", "True then False", "False then True", "An error"], "answer": 1, "explain": "\"t\" is a letter in \"tee\". In a list, in checks whole items, and \"x\" isn't an item."}, {"q": "How many times does \"Guess!\" print?\n\ngame_over = False\nturns = 0\nwhile not game_over:\n    print(\"Guess!\")\n    turns += 1\n    if turns == 3:\n        game_over = True", "choices": ["0", "2", "3", "Forever"], "answer": 2, "explain": "Three passes run. After the third, game_over is True, so not game_over is False and the loop stops."}, {"q": "The player typed \"a\". What prints?\n\nguess = \"a\"\nfor guess in \"pipe\":\n    print(\"checking\")\nprint(guess)", "choices": ["a", "pipe", "e", "p"], "answer": 2, "explain": "The for loop overwrites guess each pass. It ends holding the last letter, \"e\". Your typed letter is gone, so use a different loop name like letter."}, {"q": "What prints on the second pass?\n\ndisplay = \"\"\nfor turn in range(2):\n    for letter in \"ab\":\n        display += \"_\"\n    print(display)", "choices": ["__", "____", "_", "ab"], "answer": 1, "explain": "display was only reset once, before the loop, so turn 2 adds two more blanks: ____. Put display = \"\" inside the outer loop."}, {"q": "What prints?\n\nlives = 0\nwon = True\nif won:\n    print(\"You win!\")\nelif lives == 0:\n    print(\"You lose!\")", "choices": ["You win!", "You lose!", "You win! then You lose!", "Nothing"], "answer": 0, "explain": "Only one branch of an if/elif chain runs. The first one matched, so the elif is skipped even though lives == 0 is true."}, {"q": "Which fix makes BOTH checks run every turn?", "choices": ["Use two separate if statements", "Add another elif", "Swap the order inside the elif chain", "Use else instead of elif"], "answer": 0, "explain": "Separate ifs are each checked on their own. Use elif only when you want exactly one choice."}, {"q": "The player guesses \"z\" (wrong) twice. How many lives are left?\n\nlives = 6\nguessed_letters = []\nfor guess in [\"z\", \"z\"]:\n    if guess not in \"drain\" and guess not in guessed_letters:\n        lives -= 1\n    guessed_letters.append(guess)\nprint(lives)", "choices": ["4", "5", "6", "0"], "answer": 1, "explain": "The first \"z\" costs a life and goes into guessed_letters. The second \"z\" is already in the list, so no life is lost: 5."}, {"q": "stages holds 7 pictures. stages[0] is the full hanged man and stages[6] is the empty gallows. With lives = 2, which picture shows?\n\nprint(stages[lives])", "choices": ["The third picture from the start (stages[2])", "The second picture (stages[1])", "The empty gallows", "An error"], "answer": 0, "explain": "Lists count from 0, so stages[2] is the third item. Fewer lives means a lower index and more of the drawing."}]}, {"day": 8, "questions": [{"q": "Decoding \"de\" with a shift of 3 gives \"ah\" instead of \"ab\". What's wrong?\n\nfor letter in original_text:\n    if encode_or_decode == \"decode\":\n        shift_amount *= -1\n    ...", "choices": ["The % 26 is missing", "The sign flip is inside the for loop, so it flips on every letter", "The shift should be 26", "alphabet is in the wrong order"], "answer": 1, "explain": "Inside the loop the shift goes -3, then +3, then -3... so every other letter goes the wrong way. Flip it once, above the loop."}, {"q": "In this code, which is the parameter and which is the argument?\n\ndef fix_leak(pipe):\n    print(f\"Fixing the {pipe}\")\n\nfix_leak(\"elbow\")", "choices": ["pipe is the parameter, \"elbow\" is the argument", "\"elbow\" is the parameter, pipe is the argument", "Both are parameters", "fix_leak is the parameter, \"elbow\" is the argument"], "answer": 0, "explain": "The parameter is the name in the def (the empty slot). The argument is the actual value you pass in the call."}, {"q": "What prints?\n\ndef greet_with(name, location):\n    print(f\"{name} lives in {location}\")\n\ngreet_with(\"Fresno\", \"John\")", "choices": ["John lives in Fresno", "Fresno lives in John", "An error, because the order is wrong", "name lives in location"], "answer": 1, "explain": "Positional arguments match by order: name gets \"Fresno\" and location gets \"John\". Python doesn't know it's nonsense."}, {"q": "Which call prints \"John lives in Fresno\" with the same function?\n\ndef greet_with(name, location):\n    print(f\"{name} lives in {location}\")", "choices": ["greet_with(\"Fresno\", \"John\")", "greet_with(location=\"Fresno\", name=\"John\")", "greet_with(name, location)", "greet_with(\"John\" + \"Fresno\")"], "answer": 1, "explain": "Keyword arguments go to the parameter you name, so order doesn't matter."}, {"q": "What prints?\n\nprint(2 + 25 % 26)", "choices": ["1", "27", "25", "An error"], "answer": 1, "explain": "% runs before +, just like *. So it's 2 + 25 = 27. Write (2 + 25) % 26 to get 1."}, {"q": "alphabet is the list of 26 lowercase letters. You want the position of \"c\" so you can shift it. Which line is right?\n\nletter = \"c\"\nshift_amount = 3", "choices": ["alphabet.index(shift_amount)", "alphabet.index(letter)", "alphabet[letter]", "alphabet.index(3)"], "answer": 1, "explain": ".index() takes the value you're looking for (the letter) and gives back its position. The shift is a count you add afterward."}, {"q": "Which line gives the shifted letter and wraps \"z\" + 3 around to \"c\"?\n\nposition = alphabet.index(letter)", "choices": ["alphabet[position + shift_amount % 26]", "alphabet[(position + shift_amount) % 26]", "alphabet[position] + shift_amount", "alphabet.index(position + shift_amount)"], "answer": 1, "explain": "Add first, then wrap: (25 + 3) % 26 is 2, which is \"c\". Without the parentheses, % only applies to shift_amount and you go past the end of the list."}, {"q": "What does this return for \"hi 5!\" with a shift of 1?\n\nfor letter in text:\n    if letter not in alphabet:\n        output += letter\n    else:\n        output += alphabet[(alphabet.index(letter) + 1) % 26]", "choices": ["\"ij 6!\"", "\"ij 5!\"", "\"ij\"", "An error on the space"], "answer": 1, "explain": "The space, 5 and ! aren't in alphabet, so they're added as-is. Only letters get shifted."}]}, {"day": 9, "questions": [{"q": "What does this print?\n\ntravel_log = {\"France\": [\"Paris\", \"Lille\", \"Dijon\"]}\nprint(travel_log[\"France\"][1])", "choices": ["Paris", "Lille", "France", "An error"], "answer": 1, "explain": "travel_log[\"France\"] gives the list, then [1] picks the second city: Lille."}, {"q": "What happens if you misspell the key?\n\nprogramming_dictionary[\"bug\"]", "choices": ["It returns None", "It returns an empty string", "KeyError", "IndexError"], "answer": 2, "explain": "Wrong or missing keys raise KeyError. Lists give IndexError for a bad index; dictionaries give KeyError for a bad key."}, {"q": "What does this loop print?\n\ncolors = {\"red\": 1, \"blue\": 2}\nfor key in colors:\n    print(key)", "choices": ["1 then 2", "red then blue", "(\"red\", 1) then (\"blue\", 2)", "An error"], "answer": 1, "explain": "for key in a dictionary walks the keys only. Use colors[key] if you also want each value."}, {"q": "What prints?\n\nnested_list = [\"A\", \"B\", [\"C\", \"D\"]]\nprint(nested_list[2][1])", "choices": ["B", "C", "D", "An error"], "answer": 2, "explain": "nested_list[2] is the inner list [\"C\", \"D\"], and [1] picks D."}, {"q": "Which line prints Stuttgart?\n\ntravel_log = {\n    \"Germany\": {\n        \"cities_visited\": [\"Berlin\", \"Hamburg\", \"Stuttgart\"],\n    },\n}", "choices": ["travel_log[\"Germany\"][2]", "travel_log[\"Germany\"][\"cities_visited\"][2]", "travel_log[\"cities_visited\"][\"Germany\"][2]", "travel_log[2][\"Germany\"][\"cities_visited\"]"], "answer": 1, "explain": "Go one layer at a time: country key, then inner key, then list index."}, {"q": "How do you add a new entry or change an existing one?\n\nprogramming_dictionary = {\"Bug\": \"An error...\"}", "choices": ["programming_dictionary.append(\"Loop\", \"...\")", "programming_dictionary[\"Loop\"] = \"The action of doing something over and over again.\"", "programming_dictionary.add(\"Loop\")", "programming_dictionary + {\"Loop\": \"...\"}"], "answer": 1, "explain": "Same syntax for both: dict[key] = value. If the key exists, the value is replaced; if not, a new entry is created."}, {"q": "This is meant to find the highest bid, but it prints a total. What's wrong?\n\nbids = {\"Ann\": 50, \"Bob\": 30}\nhighest_bid = 0\nfor bidder in bids:\n    highest_bid += bids[bidder]\nprint(highest_bid)", "choices": ["It should loop over bids.values()", "+= adds every bid; it should compare with if bids[bidder] > highest_bid:", "highest_bid should start at \"\"", "bidder holds the bid, not the name"], "answer": 1, "explain": "+= always adds, so you get 80. To keep the biggest, compare (if bids[bidder] > highest_bid:) and then set highest_bid = bids[bidder]."}, {"q": "Only some bids end up in the dictionary. Where should bids[name] = price go?\n\nwhile bidding:\n    name = input(\"Name? \")\n    price = int(input(\"Bid? \"))\n    other = input(\"Other bidders? \")\n    if other == \"no\":\n        bidding = False\n    else:\n        bids[name] = price", "choices": ["Inside the else, where it is now", "Inside the if, before bidding = False", "In the main body of the loop, before the if/else, so it runs for every bidder", "After the while loop ends"], "answer": 2, "explain": "Inside one branch it only runs sometimes; here the last bidder (who says \"no\") is never saved. Put it in the loop body so every pass saves a bid."}]}, {"day": 10, "questions": [{"q": "What is output?\n\ndef my_function():\n    result = 3 * 2\n    return result\n\noutput = my_function()", "choices": ["None", "6", "\"result\"", "3 * 2 as text"], "answer": 1, "explain": "return hands back the value of result (6), and that value replaces the call my_function()."}, {"q": "What does this print?\n\ndef add(a, b):\n    print(a + b)\n\ntotal = add(2, 3)\nprint(total)", "choices": ["5 then 5", "5 then None", "None then 5", "An error"], "answer": 1, "explain": "add() prints 5 but returns nothing, so total is None. print only shows a value; return is what hands it back for your code to store."}, {"q": "What does this print?\n\nprint(\"aNGela YU\".title())", "choices": ["ANGELA YU", "angela yu", "Angela Yu", "AnGeLa Yu"], "answer": 2, "explain": ".title() capitalizes the first letter of each word and lowercases the rest, giving back a new string."}, {"q": "What does this print?\n\ndef function_1(text):\n    return text + text\n\ndef function_2(text):\n    return text.title()\n\nprint(function_2(function_1(\"hello\")))", "choices": ["HelloHello", "Hellohello", "hellohello", "Hello hello"], "answer": 1, "explain": "The inner call runs first: function_1 gives \"hellohello\". Then .title() sees one word and capitalizes only its first letter: \"Hellohello\"."}, {"q": "Which line stores the number of characters in \"Angela\" so you can use it later?", "choices": ["len(\"Angela\")", "num_char = print(len(\"Angela\"))", "num_char = len(\"Angela\")", "num_char == len(\"Angela\")"], "answer": 2, "explain": "len() returns 6 and = stores it. print() returns None, so the second option stores None, and == only compares."}, {"q": "What does this print?\n\ndef format_name(f_name, l_name):\n    return f\"{f_name.title()} {l_name.title()}\"\n    print(\"Done\")\n\nprint(format_name(\"john\", \"SMITH\"))", "choices": ["Done then John Smith", "John Smith then Done", "John Smith", "john SMITH"], "answer": 2, "explain": "return ends the function right away, so the print(\"Done\") line after it never runs."}, {"q": "This should return the highest bid but returns a total. Which fix is right?\n\ndef find_highest(bids):\n    highest = 0\n    for bidder in bids:\n        highest += bids[bidder]\n    return highest", "choices": ["Change return highest to print(highest)", "Replace the += line with: if bids[bidder] > highest: highest = bids[bidder]", "Start highest at \"\"", "Move return highest inside the for loop"], "answer": 1, "explain": "+= adds every bid together. To keep the biggest, compare and replace. And keep return after the loop, or it would stop on the first bidder."}, {"q": "What does this print?\n\ndef check(name):\n    if name == \"\":\n        return\n    return name.title()\n\nprint(check(\"\"))", "choices": ["Nothing at all", "None", "An error", "\"\""], "answer": 1, "explain": "The empty return ends the function early and gives back None, so print shows None."}, {"q": "Where does a docstring go?", "choices": ["Above the def line", "On the first indented line right after the def line", "At the end of the function", "Anywhere inside the function"], "answer": 1, "explain": "The docstring is the first indented line after def ...:, written in triple quotes."}, {"q": "What does this print?\n\ndef is_leap(year):\n    if year % 4 == 0:\n        return True\n    return False\n\nprint(is_leap(2024))", "choices": ["False", "True", "None", "2024"], "answer": 1, "explain": "2024 % 4 == 0, so the first return runs and ends the function with True."}, {"q": "math = {\"+\": add, \"-\": subtract}. What does math[\"+\"](2, 3) do?", "choices": ["Prints \"+\"", "Looks up the add function and calls it with 2 and 3, giving 5", "Gives a KeyError", "Adds \"+\" to 2 and 3"], "answer": 1, "explain": "The key gets the function, then (2, 3) calls it. Same idea as the calculator."}, {"q": "In the calculator, why add result = new_result at the end of each loop pass?", "choices": ["To print the answer", "So the next calculation builds on the latest answer", "To stop the loop", "It isn't needed"], "answer": 1, "explain": "Without it, every pass keeps using the old result (5+3, *2, *2 gives 16 instead of 32)."}]}, {"day": 11, "questions": [{"q": "What does this do?\n\nuser_cards = [5, 6]\nuser_cards += 7", "choices": ["Adds 7 to the end of the list", "Gives TypeError: 'int' object is not iterable", "Adds 7 to each card", "Makes the list [12]"], "answer": 1, "explain": "+= on a list is shorthand for extend(), which needs a list. For one item use append()."}, {"q": "What does this print?\n\nprint(sum([11, 10]))", "choices": ["21", "[11, 10]", "2", "Blackjack"], "answer": 0, "explain": "sum() adds up all the items of an iterable."}, {"q": "Which check is a real Blackjack?", "choices": ["sum(cards) == 21", "sum(cards) == 21 and len(cards) == 2", "sum(cards) > 21", "11 in cards"], "answer": 1, "explain": "Blackjack is 21 on exactly two cards (an Ace and a 10). Drawing to 21 later doesn't count."}, {"q": "cards = [11, 5, 10]. Which lines fix the Ace when the score is over 21?", "choices": ["cards.remove(11) then cards.append(1)", "cards.remove(10)", "cards.append(11)", "sum(cards) = 21"], "answer": 0, "explain": "remove(11) deletes the first 11, then append(1) adds the Ace back as a 1. Recalculate the score after."}, {"q": "cards = [11, 11, 9]. What does cards.index(11) give?", "choices": ["0", "1", "2", "[0, 1]"], "answer": 0, "explain": ".index() finds only the FIRST match, so the second 11 is missed."}, {"q": "Why do you get an error if you call calculate_score(cards) on a line above its def?", "choices": ["Python reads top to bottom, so the function isn't defined yet", "The function needs a return", "cards must be a string", "Functions can't be called twice"], "answer": 0, "explain": "A function must be defined above the line that calls it."}, {"q": "The dealer loop is `while computer_score != 0 and computer_score < 17:`. Why the != 0 part?", "choices": ["0 means Blackjack, and 0 is less than 17, so without it the dealer would keep drawing", "0 means the dealer busted", "It stops the loop at 17", "It's not needed"], "answer": 0, "explain": "Blackjack is signalled by 0. Without the check, the dealer would draw on a Blackjack."}, {"q": "Why start computer_score = -1 before the loop instead of 0?", "choices": ["0 already means Blackjack", "-1 is faster", "0 gives a SyntaxError", "Python needs a negative number"], "answer": 0, "explain": "0 is the Blackjack signal, so use an obviously-wrong value like -1. It also makes debugging easier."}, {"q": "In compare(), the first branches are `if u_score == c_score` then `elif c_score == 0`. Why is the Blackjack check above `u_score > c_score`?", "choices": ["if/elif/else is checked top to bottom and the first match returns, so order matters", "Python sorts conditions", "It makes the code run faster", "It doesn't matter"], "answer": 0, "explain": "A Blackjack score of 0 would lose a greater-than comparison, so it must be checked first."}, {"q": "What does this print?\n\nx = 5\nif x > 3:\n    print(\"A\")\nif x > 1:\n    print(\"B\")", "choices": ["A", "B", "A then B", "Nothing"], "answer": 2, "explain": "Two separate ifs both run. With elif only the first match would run, so it would print just A."}, {"q": "What does 'Shadows the name from outer scope' warn about?", "choices": ["A function parameter reuses the name of an outer variable like user_score", "The variable is never used", "The loop never ends", "The function has no return"], "answer": 0, "explain": "Rename the parameter (u_score) with Refactor > Rename, which changes every use in that scope."}, {"q": "The Blackjack game is wrapped in def play_game(). A variable `play` made inside it is used outside, and Python says it is undefined. Why?", "choices": ["A variable made inside a function isn't visible outside it (scope)", "play is a reserved word", "Functions can't use variables", "The loop skipped it"], "answer": 0, "explain": "Scope: names created inside a function only exist inside that function."}]}, {"day": 12, "questions": [{"q": "What does this print?\n\nenemies = 1\ndef increase_enemies():\n    enemies = 2\nincrease_enemies()\nprint(enemies)", "choices": ["1", "2", "NameError", "None"], "answer": 0, "explain": "The function creates a new local enemies. The global one is unchanged."}, {"q": "What happens?\n\ndef drink_potion():\n    potion_strength = 2\ndrink_potion()\nprint(potion_strength)", "choices": ["Prints 2", "Prints None", "NameError: name 'potion_strength' is not defined", "Prints 0"], "answer": 2, "explain": "potion_strength has local scope, so it doesn't exist outside the function."}, {"q": "What does this print?\n\nplayer_health = 10\ndef drink_potion():\n    print(player_health)\ndrink_potion()", "choices": ["10", "NameError", "None", "0"], "answer": 0, "explain": "A global variable can be read from inside a function."}, {"q": "Which one of these has global scope?", "choices": ["A variable defined inside a function", "A variable defined outside every function", "A variable defined inside a nested function", "A function parameter"], "answer": 1, "explain": "Defined at the top level means not inside another function."}, {"q": "Does Python have block scope?", "choices": ["Yes, every indented block is a new scope", "Yes, but only for loops", "No, if/while/for blocks don't create a new scope", "Only inside functions"], "answer": 2, "explain": "A variable made in an if/while/for block is still usable outside that block."}, {"q": "What does this print?\n\ngame_level = 3\nif game_level < 5:\n    new_enemy = \"Skeleton\"\nprint(new_enemy)", "choices": ["Skeleton", "NameError", "None", "3"], "answer": 0, "explain": "No block scope, so new_enemy is available outside the if block."}, {"q": "The same code, but wrapped in a function, with print(new_enemy) outside it. What happens?", "choices": ["Prints Skeleton", "NameError", "Prints None", "Prints 3"], "answer": 1, "explain": "Inside a function, the variable has local scope and can't be seen outside."}, {"q": "What do you write to change a global variable inside a function?", "choices": ["global enemies", "local enemies", "public enemies", "enemies = global"], "answer": 0, "explain": "global enemies tells the function to use the global variable."}, {"q": "Which is the better way to increase a global enemies count?", "choices": ["Use global inside the function", "Return enemies + 1 and save it: enemies = increase_enemies()", "Make two variables with the same name", "Use a block scope"], "answer": 1, "explain": "Using return avoids modifying globals inside functions."}, {"q": "Which name follows the convention for a global constant?", "choices": ["pi", "Pi", "PI", "pI"], "answer": 2, "explain": "Constants are written in ALL UPPERCASE with underscores."}, {"q": "How do you silence the 'might be referenced before assignment' warning?", "choices": ["Create the variable before the if block, e.g. new_enemy = \"\"", "Delete the if", "Put the variable inside a function", "Use global"], "answer": 0, "explain": "Initialize the variable before the block, or ignore the warning if you know your code."}, {"q": "If drink_potion() is defined inside game(), where can you call it?", "choices": ["Anywhere in the file", "Only inside game()", "Only at the top level", "Nowhere"], "answer": 1, "explain": "It has local scope inside game()."}]}, {"day": 13, "questions": [{"q": "What does this print?\n\nfor i in range(1, 4):\n    print(i)", "choices": ["1 2 3 4", "1 2 3", "0 1 2 3", "1 2 3 (on one line)"], "answer": 1, "explain": "range stops before the end number, so it prints 1, 2, 3, each on its own line."}, {"q": "Which numbers can random.randint(1, 6) return?", "choices": ["1 to 5", "0 to 6", "1 to 6", "0 to 5"], "answer": 2, "explain": "randint includes both end numbers."}, {"q": "Why does this sometimes crash?\n\ndice = ['1','2','3','4','5','6']\nn = random.randint(1, 6)\nprint(dice[n])", "choices": ["randint can return 0", "When n is 6, index 6 doesn't exist", "The list has strings", "print can't show lists"], "answer": 1, "explain": "Indexes go 0 to 5, so dice[6] is an IndexError."}, {"q": "What prints when year = 1994?\n\nif year > 1980 and year < 1994:\n    print('Millennial')\nelif year > 1994:\n    print('Gen Z')", "choices": ["Millennial", "Gen Z", "Nothing", "An error"], "answer": 2, "explain": "Both conditions are False for 1994 itself, so nothing prints."}, {"q": "What error does int('twelve') raise?", "choices": ["TypeError", "NameError", "ValueError", "IndexError"], "answer": 2, "explain": "The text can't be turned into a whole number, so it's a ValueError."}, {"q": "Where does the risky line go?\n\n____:\n    age = int(input('Age? '))\nexcept ValueError:\n    print('Please type a number.')", "choices": ["if", "try", "while", "def"], "answer": 1, "explain": "The risky code goes under try:, and except handles the error."}, {"q": "What's the bug?\n\nage = 12\nprint('You are {age} years old')", "choices": ["age should be a string", "Missing f before the string", "Wrong quotes", "print needs a comma"], "answer": 1, "explain": "Without the f, Python prints {age} literally. It's a bug with no error message."}, {"q": "x = 0, then this line runs:\n\nx == 5\n\nWhat is x now?", "choices": ["5", "0", "True", "False"], "answer": 1, "explain": "== only compares, giving False. It doesn't change x."}, {"q": "In a debugger, which button runs just the next line without going inside functions?", "choices": ["Step Into", "Step Out", "Step Over", "Resume"], "answer": 2, "explain": "Step Over runs the next line as one step."}, {"q": "Why does b_list end up with only one item?\n\nfor item in a_list:\n    new_item = item * 2\nb_list.append(new_item)", "choices": ["append only takes one item", "The append is outside the loop", "item * 2 is wrong", "b_list wasn't defined"], "answer": 1, "explain": "The append runs once, after the loop, with the last value. Indent it into the loop."}]}, {"day": 14, "questions": [{"q": "What does this give back?\n\ndef check_answer(guess, a, b):\n    if a > b:\n        return guess == 'a'\n    else:\n        return guess == 'b'\n\ncheck_answer('b', 200, 700)", "choices": ["True", "False", "'b'", "700"], "answer": 0, "explain": "200 > 700 is False, so the else runs: 'b' == 'b' is True."}, {"q": "In the call check_answer('a', 500, 300), what does the parameter b hold?", "choices": ["'a'", "500", "300", "Nothing"], "answer": 2, "explain": "Arguments fill parameters in order: guess='a', a=500, b=300."}, {"q": "What does this print?\n\naccount = {'name': 'Ann', 'follower_count': 90}\nprint(account['follower_count'])", "choices": ["follower_count", "Ann", "90", "An error"], "answer": 2, "explain": "The key goes in square brackets and you get its value, 90."}, {"q": "What does random.choice(data) do?", "choices": ["Picks a random number", "Picks one random item from the list", "Shuffles the list", "Picks two items"], "answer": 1, "explain": "choice returns one item from the list you give it."}, {"q": "Where should score = 0 go so the score keeps adding up?\n\n# spot 1\nwhile not game_over:\n    # spot 2\n    if is_correct:\n        score += 1", "choices": ["Spot 1, before the loop", "Spot 2, inside the loop", "After the loop", "Inside the if"], "answer": 0, "explain": "Before the loop it runs once. Inside, it would reset to 0 every round."}, {"q": "What does this loop do?\n\nwhile account_a == account_b:\n    account_b = random.choice(data)", "choices": ["Runs forever", "Keeps re-picking B until it's different from A", "Picks A again", "Runs exactly once"], "answer": 1, "explain": "It only repeats while they match, so it stops once B is different."}, {"q": "How does this game loop end?\n\ngame_over = False\nwhile not game_over:\n    ...\n    else:\n        game_over = True", "choices": ["When score hits 10", "When game_over becomes True", "It never ends", "When the user types 'b'"], "answer": 1, "explain": "not True is False, so the while condition fails and the loop stops."}, {"q": "Day 13 review: why does dice[6] crash on a 6-item list?", "choices": ["Lists start at 1", "Indexes go 0 to 5", "6 is a string", "randint is broken"], "answer": 1, "explain": "A 6-item list's indexes are 0 to 5, so 6 is an IndexError."}]}, {"day": 15, "questions": [{"q": "What does this print?\n\nMENU = {'latte': {'ingredients': {'milk': 150}, 'cost': 2.5}}\nprint(MENU['latte']['ingredients']['milk'])", "choices": ["latte", "150", "2.5", "An error"], "answer": 1, "explain": "Each bracket goes one level deeper: latte -> ingredients -> milk = 150."}, {"q": "How many times is the coin question asked for a drink with 3 ingredients?\n\nfor item in order_ingredients:\n    if order_ingredients[item] > resources[item]:\n        print('Sorry')\n    payment = process_coins()", "choices": ["0", "1", "3", "Forever"], "answer": 2, "explain": "It's indented inside the for loop, so it runs every pass. Move it after the loop to ask once."}, {"q": "water is short, coffee is fine. What is is_enough at the end?\n\nis_enough = False\nfor item in ['water', 'coffee']:\n    if order[item] > resources[item]:\n        is_enough = False\n    is_enough = True", "choices": ["True", "False", "An error", "None"], "answer": 0, "explain": "The last line resets it to True every pass, hiding the water shortage. Start True and only flip to False in the if."}, {"q": "Which version correctly checks resources?", "choices": ["is_enough = True before the loop; is_enough = False inside the if", "is_enough = False before; True inside the if", "is_enough = True inside the loop every pass", "No flag needed"], "answer": 0, "explain": "Set True once, and only a shortage flips it to False. Nothing sets it back."}, {"q": "What's the problem here?\n\nprocess_coins()\ntotal = process_coins()", "choices": ["Nothing", "The user is asked for coins twice and the first result is thrown away", "total is always 0", "It's a syntax error"], "answer": 1, "explain": "Each call runs the function. Call it once and save it: total = process_coins()."}, {"q": "What does this return when water is short?\n\ndef is_resource_sufficient(order_ingredients):\n    for item in order_ingredients:\n        if order_ingredients[item] > resources[item]:\n            return False\n    return True", "choices": ["True", "False", "None", "It keeps looping"], "answer": 1, "explain": "return False runs as soon as a shortage is found. return True only runs after every item passed."}, {"q": "What does this print?\n\nresources = {'water': 300, 'milk': 200}\nfor key in resources:\n    print(key, resources[key])", "choices": ["water milk", "300 200", "water 300 then milk 200", "An error"], "answer": 2, "explain": "key is the name and resources[key] is its value, printed with a space between."}, {"q": "What is round(3.14159, 2)?", "choices": ["3.1", "3.14", "3.15", "3"], "answer": 1, "explain": "Rounds to 2 decimal places: 3.14."}, {"q": "Day 14 review: this buggy code gives back what for answers ['a','b'] and guesses ['a','a']?\n\ndef count_correct(answers, guesses):\n    count = 0\n    for i in range(len(answers)):\n        if answers[i] == guesses[i]:\n            count += 1\n    return count\n\nprint(count_correct(['a','b'], ['a','a']))", "choices": ["0", "1", "2", "Nothing prints"], "answer": 1, "explain": "Only the first pair matches, so count is 1. And print() is what shows the returned value."}, {"q": "bids = {'Ann': 50, 'Bob': 80}. Inside for bidder in bids, which compares the bid amount?", "choices": ["if bidder > highest_bid", "if bids[bidder] > highest_bid", "if bids > highest_bid", "if 'bidder' > highest_bid"], "answer": 1, "explain": "bidder is the key (a name). bids[bidder] is the value (the amount)."}]}, {"day": 16, "questions": [{"q": "What is a class?", "choices": ["One object", "A blueprint for making objects", "A variable", "A package"], "answer": 1, "explain": "A class is the blueprint; objects are built from it."}, {"q": "Which name follows the class naming style?", "choices": ["car_blueprint", "carBlueprint", "CarBlueprint", "CARBLUEPRINT"], "answer": 2, "explain": "Classes use PascalCase."}, {"q": "What does this do?\n\ntimmy = Turtle()", "choices": ["Imports turtle", "Creates a new Turtle object called timmy", "Draws a line", "Errors"], "answer": 1, "explain": "The parentheses construct a new object."}, {"q": "Which line calls a method?", "choices": ["my_screen.canvheight", "car.speed", "timmy.forward(100)", "Turtle"], "answer": 2, "explain": "Methods have parentheses; attributes don't."}, {"q": "A module is one file. A package is...", "choices": ["One function", "Lots of files bundled for a purpose", "A class", "A variable"], "answer": 1, "explain": "Packages bundle many files."}, {"q": "Which needs installing before you can import it?", "choices": ["turtle", "prettytable", "Neither", "Both"], "answer": 1, "explain": "Turtle is preloaded; PyPI packages like prettytable must be installed."}, {"q": "What does this set?\n\ntable.align = \"l\"", "choices": ["Center align", "Right align", "Left align", "Adds a column"], "answer": 2, "explain": "l = left, c = center (default), r = right."}, {"q": "In the OOP Coffee Machine, which call is right?", "choices": ["menu.find_drink(get_items)", "menu.find_drink(order_name=user_choice)", "menu.find_drink()", "menu.find_drink(drink.cost)"], "answer": 1, "explain": "Pass what the user typed, not the whole menu."}, {"q": "Which is right for taking payment?", "choices": ["money_machine.make_payment(drink)", "money_machine.make_payment(drink.cost)", "money_machine.make_payment(user_choice)", "money_machine.make_payment()"], "answer": 1, "explain": "make_payment wants the price, drink.cost."}, {"q": "What does result hold?\n\nresult = coffee_maker.make_coffee(drink)", "choices": ["The coffee", "True", "None", "drink"], "answer": 2, "explain": "make_coffee doesn't return anything, so you get None. Just call it."}, {"q": "Where should drink = menu.find_drink(...) go?", "choices": ["Before the while loop", "Inside the loop, after input()", "After the loop", "In menu.py"], "answer": 1, "explain": "It needs this round's user_choice, so it goes after input() each pass."}]}, {"day": 17, "questions": [{"q": "q is a Question object. How do you get its text?", "choices": ["q[\"text\"]", "q.text", "q.text()", "text(q)"], "answer": 1, "explain": "Objects use dot-notation attributes, not dict keys. That was one of your Day 17 misses."}, {"q": "How should QuizBrain get the question list?", "choices": ["from main import question_bank inside quiz_brain", "As an __init__ parameter: self.question_list = q_list", "Read question_data from data.py directly", "Hardcode 12 questions"], "answer": 1, "explain": "Pass it in: quiz = QuizBrain(question_bank). Don't import question_bank into quiz_brain."}, {"q": "Best still_has_questions body?", "choices": ["return False", "return self.question_number < len(self.question_list)", "if True: return True", "return len(self.question_list)"], "answer": 1, "explain": "The comparison itself is True/False. Never hardcode return False."}, {"q": "Which loop keeps the quiz going?", "choices": ["while QuizBrain(question_bank).still_has_questions():", "while quiz.still_has_questions:", "while quiz.still_has_questions():", "has = quiz.still_has_questions()\nwhile has:"], "answer": 2, "explain": "Use the existing quiz object, call with (), and check every loop so it updates."}, {"q": "In def __init__(self, user_id, username), what is self?", "choices": ["The class name", "The object being created", "The first argument you pass", "A global variable"], "answer": 1, "explain": "self is the actual object being initialized. Attribute lines need self."}, {"q": "When is __init__ called?", "choices": ["Only once per class", "Every time a new object is created", "When a method is called", "Never automatically"], "answer": 1, "explain": "The constructor runs for each new object."}, {"q": "follow does user.followers += 1 and self.following += 1. After user_1.follow(user_2), user_2.followers is:", "choices": ["0", "1", "2", "Error"], "answer": 1, "explain": "user_2 is the one being followed, so its followers go up by 1."}, {"q": "Switching data to Open Trivia DB, which file needs the key-name changes?", "choices": ["quiz_brain.py", "question_model.py", "main.py", "All of them"], "answer": 2, "explain": "Only main.py knows the data format; QuizBrain stays untouched (modularity)."}]}, {"day": 18, "questions": [{"q": "Which range includes every side count from 3 through 10?", "choices": ["range(3, 10)", "range(3, 11)", "range(10, 3)", "range(11)"], "answer": 1, "explain": "The stop is excluded. Stop at 11 to include 10."}, {"q": "Why does range(360 / size_of_gap) fail, even when size_of_gap is 5?", "choices": ["A circle cannot have a 5-degree gap.", "range needs a string.", "360 / 5 returns a float; use range(int(360 / size_of_gap)).", "The gap must always be 10."], "answer": 2, "explain": "Division gives 72.0, but range needs an integer. int() makes it 72."}, {"q": "r, g, and b hold one extracted color. Which call adds it as ONE tuple?", "choices": ["rgb_colors.append((r, g, b))", "rgb_colors.append(r, g, b)", "rgb_colors = (r, g, b)", "rgb_colors.append(\"r, g, b\")"], "answer": 0, "explain": "The inner parentheses make one RGB tuple; append adds that one item."}, {"q": "In the lesson's Hirst loop, when should the row-change movements run?", "choices": ["After every dot.", "Before every forward(50).", "Only after all 100 dots.", "After each tenth dot: if dot_count % 10 == 0."], "answer": 3, "explain": "Finish the ten-dot row first, then move up and return to the left."}, {"q": "number_of_dots = 100. Which range paints all 100 dots when counting from 1?", "choices": ["range(1, number_of_dots)", "range(1, number_of_dots + 1)", "range(100, number_of_dots)", "range(1, number_of_dots - 1)"], "answer": 1, "explain": "range stops before its upper limit. Adding 1 includes dot number 100."}, {"q": "How do you draw dots without connecting lines or a visible turtle arrow?", "choices": ["Use pendown() and showturtle().", "Remove all forward() calls.", "Use penup() and hideturtle(); dot() still draws dots.", "Use color(\"white\") for every dot."], "answer": 2, "explain": "penup stops the travel lines, not the dots. hideturtle hides the arrow."}, {"q": "rgb = (30, 60, 90). What happens with rgb[0] = 100?", "choices": ["rgb becomes (100, 60, 90).", "A new list is created.", "The tuple becomes empty.", "TypeError: a tuple does not support item assignment."], "answer": 3, "explain": "Tuples are immutable. Convert to a list if you need to edit items."}, {"q": "Before using (133, 164, 202) as a turtle color, which setting is needed?", "choices": ["turtle.colormode(255)", "tim.pensize(255)", "tim.speed(255)", "turtle.colormode(1)"], "answer": 0, "explain": "Set colormode on the turtle module so it accepts components from 0 to 255."}, {"q": "Tim faces East (heading 0). Which call makes him face North directly?", "choices": ["tim.right(90)", "tim.setheading(180)", "tim.setheading(90)", "tim.heading(90)"], "answer": 2, "explain": "North is heading 90. setheading sets a direction; heading() reads it."}, {"q": "What turning angle belongs in draw_shape(5)?", "choices": ["90 degrees", "72 degrees: 360 / 5", "5 degrees", "100 degrees"], "answer": 1, "explain": "Divide the full turn, 360 degrees, by the number of sides."}]}, {"day": 19, "questions": [{"q": "Which line makes the space bar run move_forwards when it is pressed?", "choices": ["screen.onkey(fun=move_forwards(), key=\"space\")", "screen.onkey(fun=move_forwards, key=\"space\")", "move_forwards(screen.onkey)", "screen.onkey(key=\"space\")"], "answer": 1, "explain": "Pass the name with no (). onkey calls it later, when space is pressed."}, {"q": "What goes wrong with fun=move_forwards()?", "choices": ["Nothing; it is the same", "It runs the function right away instead of handing it to onkey", "It moves Tim backwards", "It makes the screen listen"], "answer": 1, "explain": "() calls the function there and then. onkey needs the function itself."}, {"q": "What does screen.listen() do?", "choices": ["Moves the turtle", "Closes the window on click", "Makes the screen start waiting for events like key presses", "Clears all drawings"], "answer": 2, "explain": "Without listening, key presses aren't picked up."}, {"q": "calculator(n1, n2, func) has return func(n1, n2). What is calculator(2, 3, add)?", "choices": ["5", "6", "add", "An error, functions can't be inputs"], "answer": 0, "explain": "func is add, so it runs add(2, 3) and returns 5."}, {"q": "Why is calculator a higher order function?", "choices": ["It returns a big number", "It takes another function as an input and calls it", "It uses a while loop", "It is defined last"], "answer": 1, "explain": "A higher order function works with other functions."}, {"q": "Why does Etch-A-Sketch use four separate movement functions?", "choices": ["Python only allows four functions", "onkey takes a function with no arguments, so you can't pass the distance or angle in", "Each key needs its own screen", "Functions can only be used once"], "answer": 1, "explain": "One no-argument function per key: forwards, backwards, turn left, turn right."}, {"q": "Tim's heading is 90 (North). Which turns him LEFT by 10?", "choices": ["tim.setheading(tim.heading() - 10)", "tim.setheading(tim.heading() + 10)", "tim.forward(10)", "tim.right(10)"], "answer": 1, "explain": "Adding to the heading turns left (counterclockwise). tim.left(10) also works."}, {"q": "Which clear keeps the turtle but removes its drawings?", "choices": ["screen.clear()", "tim.clear()", "screen.exitonclick()", "tim.home()"], "answer": 1, "explain": "The screen's clear wipes everything, including the turtle."}, {"q": "Pressing C runs tim.clear() then tim.home(), and a line appears on the way back. What fixes it?", "choices": ["Call home twice", "penup before home, pendown after", "Use screen.clear() instead", "Remove clear"], "answer": 1, "explain": "With the pen up, moving home leaves no line."}, {"q": "timmy and tommy are both made with Turtle(). timmy.color(\"green\") runs. What is tommy's color?", "choices": ["Green too", "Unchanged; they are separate instances", "Purple automatically", "An error"], "answer": 1, "explain": "Each instance has its own state; changing one doesn't change the other."}, {"q": "Which describes an object's state?", "choices": ["The name of its class", "Its attribute values and what it's doing at that moment", "The file it is saved in", "The number of objects made"], "answer": 1, "explain": "E.g. timmy green and moving, tommy purple and standing still."}, {"q": "Why use keyword arguments like onkey(fun=move_forwards, key=\"space\")?", "choices": ["They make code run faster", "They make clear which value is which in a method you didn't write", "They are required for every function", "They call the function now"], "answer": 1, "explain": "Especially useful when the order of the inputs has no meaning."}, {"q": "The window is setup(width=500, height=400). Where is the right edge on the x-axis?", "choices": ["x = 500", "x = 250", "x = 200", "x = 400"], "answer": 1, "explain": "The center is 0, so x runs from -250 to 250."}, {"q": "What does screen.textinput(title=..., prompt=...) give back?", "choices": ["A number", "The string the user typed", "A Turtle", "Nothing"], "answer": 1, "explain": "Like input(), it returns text you can save in user_bet."}, {"q": "Why use goto(x=-230, y=y_positions[turtle_index]) for each turtle?", "choices": ["To make them draw", "Same x for a fair start, a different y for each turtle", "To change their color", "To speed them up"], "answer": 1, "explain": "Only the y changes, so they line up at the start without overlapping."}, {"q": "Why does is_race_on start as False?", "choices": ["So the race never runs", "So the while loop doesn't start before the user has bet", "Because while loops need False", "To hide the turtles"], "answer": 1, "explain": "It becomes True once user_bet exists."}, {"q": "Which values can random.randint(0, 10) return?", "choices": ["0 to 9", "1 to 10", "0 to 10", "Only even numbers"], "answer": 2, "explain": "randint includes both ends."}, {"q": "After the setup loop, why is all_turtles needed?", "choices": ["To store the colors", "To keep hold of every turtle instance so the race can loop through and move each", "To make one big turtle", "Lists make turtles faster"], "answer": 1, "explain": "for turtle in all_turtles moves each instance by its own random distance."}, {"q": "In the lesson, the right edge is 250 and the turtle is 40 pixels wide. Why check xcor() > 230?", "choices": ["230 is the default speed", "Subtract half the turtle's width (20) so the race ends when it reaches the line, not after overshooting", "The screen is 230 wide", "It's a random number"], "answer": 1, "explain": "250 - 20 = 230."}, {"q": "print(turtle.color()) shows two colors. What are they?", "choices": ["The x and y", "The pen color and the fill color", "Old and new colors", "Two different turtles"], "answer": 1, "explain": "Use pencolor() when you only want the pen color."}, {"q": "Which line checks whether the user won?", "choices": ["if winning_color = user_bet:", "if winning_color == user_bet:", "if user_bet():", "if turtle == user_bet:"], "answer": 1, "explain": "== compares the two strings."}, {"q": "The winner is found and is_race_on is set to False. What stops?", "choices": ["Nothing; the race keeps going", "The while loop, the next time it checks is_race_on", "Python immediately closes", "Only the losing turtles"], "answer": 1, "explain": "The while condition is now False, so no more race steps run."}]}, {"day": 20, "questions": [{"q": "Which line sets the snake window to 600 by 600?", "choices": ["screen.setup(600)", "screen.setup(width=600, height=600)", "screen.title(600, 600)", "screen.bgcolor(600, 600)"], "answer": 1, "explain": "Keyword arguments make clear which number is width and which is height."}, {"q": "Which pair makes a black window titled My Snake Game?", "choices": ["screen.color(\"black\") and screen.name(\"My Snake Game\")", "screen.bgcolor(\"black\") and screen.title(\"My Snake Game\")", "screen.tracer(0) and screen.update()", "screen.setup(\"black\") and screen.listen(\"My Snake Game\")"], "answer": 1, "explain": "bgcolor sets the background; title sets the text at the top of the window."}, {"q": "A new square turtle is 20 pixels wide. Where should the three starting segments go?", "choices": ["(0, 0), (20, 0), (40, 0)", "(0, 0), (-20, 0), (-40, 0)", "(0, 0), (0, -20), (0, -40)", "(-20, 0), (0, 0), (20, 0)"], "answer": 1, "explain": "Each segment sits 20 pixels to the left of the last, with no overlap and no gaps."}, {"q": "When you create a segment, why call penup() before goto?", "choices": ["So the turtle moves faster", "So it doesn't draw a line as it moves to its position", "So tracer stays on", "So the square turns white"], "answer": 1, "explain": "Without penup, each turtle leaves a line. You only want to see the square pieces."}, {"q": "tracer is set to 0 and the while loop is running, but you never call update(). What do you see?", "choices": ["The snake moving piece by piece", "A black screen, because the display never refreshes", "An error, because update is required to start the loop", "The snake appearing one segment at a time at (0, 0)"], "answer": 1, "explain": "tracer(0) turns animation off. Nothing new shows until update() redraws the screen."}, {"q": "Where should screen.update() and time.sleep(0.1) go so the snake looks like one piece?", "choices": ["Inside the for loop, after each segment moves", "Outside the for loop, after every segment has moved", "Only once, before the while loop starts", "Inside create_snake(), before penup()"], "answer": 1, "explain": "Refresh once per step, after the whole snake has moved, then sleep 0.1 seconds."}, {"q": "You forward(20) every segment, then turn the head left. What happens?", "choices": ["The whole snake turns together", "The head turns, but the body keeps going forward, because the segments aren't linked", "The snake stops", "Only the tail turns"], "answer": 1, "explain": "Each segment keeps its own heading, so the head leaves the body behind."}, {"q": "How does the reverse loop move the body, and what happens to the head?", "choices": ["range(0, len(segments), 1) moves every segment forward, including the head", "range(len(segments) - 1, 0, -1) moves each segment to the one in front; then segments[0] moves forward outside the loop", "Only segments[0] moves; the body stays still", "The loop includes index 0 and also calls forward on the head"], "answer": 1, "explain": "Start at the last index, stop before 0, then move the head forward separately."}, {"q": "Why does range(start=2, stop=0, step=-1) fail?", "choices": ["Negative steps aren't allowed", "range comes from C and takes no keyword arguments", "2 is too small", "You must import range first"], "answer": 1, "explain": "Write the numbers in order: range(len(segments) - 1, 0, -1)."}, {"q": "Inside the Snake class, which line appends a new segment to the snake's list?", "choices": ["segments.append(new_segment)", "self.segments.append(new_segment)", "Snake.append(new_segment)", "self.append(new_segment)"], "answer": 1, "explain": "segments is an attribute, so you must use self.segments."}, {"q": "Why is MOVE_DISTANCE = 20 written at the top of snake.py?", "choices": ["Python requires every number to be a constant", "So you can tweak how far each step is from the top, without digging through the code", "So the screen can read the speed", "So onkey can use it as a key name"], "answer": 1, "explain": "The same idea applies to STARTING_POSITIONS and the direction constants."}, {"q": "Where should self.head = self.segments[0] go, and why?", "choices": ["At the very top of the file, before the class", "After create_snake() has built the segments; if you do it before, the list is empty", "Inside the while loop each time the snake moves", "Before self.segments = [], so the head exists first"], "answer": 1, "explain": "Getting index 0 from an empty list will error. Then use self.head in move() and the direction methods."}, {"q": "Which line makes the Up arrow run snake.up when it is pressed?", "choices": ["screen.onkey(fun=snake.up(), key=\"Up\")", "screen.onkey(fun=snake.up, key=\"Up\")", "screen.onkey(fun=up, key=Up)", "snake.up(screen.onkey)"], "answer": 1, "explain": "Pass the method with no (). onkey calls it later, when the key is pressed."}, {"q": "What key string does onkey use for the up arrow?", "choices": ["\"up\"", "\"Up\"", "\"UP\"", "\"arrow_up\""], "answer": 1, "explain": "The lesson uses \"Up\", \"Down\", \"Left\", and \"Right\" with an uppercase first letter."}, {"q": "The turtle starts facing East at heading 0, counting counterclockwise. What is DOWN?", "choices": ["90", "180", "270", "360"], "answer": 2, "explain": "UP is 90 (North), LEFT is 180, DOWN is 270 (South), and RIGHT is 0."}, {"q": "In the no-reverse check, why must you write self.head.heading() and not self.head.heading?", "choices": ["heading is a constant, not a method", "heading is a method, so without () you don't get the current direction number", "Parentheses make the snake move faster", "setheading needs the name without parentheses"], "answer": 1, "explain": "The head is a turtle, and heading() returns its 360-degree direction."}, {"q": "The snake is going down. Which check correctly allows it to turn up only when that is not a reverse?", "choices": ["if self.head.heading() == DOWN: self.head.setheading(UP)", "if self.head.heading() != DOWN: self.head.setheading(UP)", "if self.head.heading != DOWN: self.head.setheading(UP)", "self.head.setheading(UP) with no if check"], "answer": 1, "explain": "Only set heading to UP when the current heading isn't DOWN. Same idea for the other three directions."}, {"q": "You hit the stop button and the console shows a KeyboardInterrupt or traceback. What does the lesson say?", "choices": ["The Snake class is broken and must be rewritten", "That's normal for now, because there's no game-over sequence yet", "You forgot screen.exitonclick()", "tracer(0) must be turned back on"], "answer": 1, "explain": "The only way to stop the snake at this stage is the stop button. Check that it still moves like before."}, {"q": "A new Turtle is created and then told to goto(-40, 0). Where does it exist first?", "choices": ["At (-40, 0) immediately", "At the center, (0, 0), then it is moved", "Off the screen until update()", "At (-20, 0)"], "answer": 1, "explain": "That's why you can see each piece appear at the center unless tracer is off."}, {"q": "How should the Snake class name and a constant like the step size be written?", "choices": ["snake and move_distance", "Snake and MOVE_DISTANCE", "SNAKE and MoveDistance", "Snake and moveDistance"], "answer": 1, "explain": "Class names are PascalCase. Constants are ALL_CAPS with underscores, at the top of the file."}]}, {"day": 21, "questions": [{"q": "Which line makes Fish inherit from Animal?", "choices": ["class Fish: Animal", "class Fish(Animal):", "class Animal(Fish):", "class Fish = Animal()"], "answer": 1, "explain": "The parent class goes in parentheses after the child class name."}, {"q": "What does super().__init__() do inside Fish's __init__?", "choices": ["Creates a new Animal object stored in self.animal", "Runs Animal's initializer so Fish gets Animal's attributes and methods", "Deletes Fish's own methods", "Makes Animal inherit from Fish"], "answer": 1, "explain": "super refers to the superclass, so this initializes everything the superclass has in Fish."}, {"q": "Fish redefines breathe() as super().breathe() and then prints \"doing this underwater\". What does nemo.breathe() print?", "choices": ["Only \"doing this underwater\"", "Only \"Inhale, exhale\"", "\"Inhale, exhale\" then \"doing this underwater\"", "\"doing this underwater\" then \"Inhale, exhale\""], "answer": 2, "explain": "super().breathe() runs the parent's version first, then Fish adds its own twist."}, {"q": "How should the Food class get Turtle's abilities?", "choices": ["self.food = Turtle() in __init__", "class Food(Turtle): plus super().__init__()", "import Food from turtle", "class Turtle(Food):"], "answer": 1, "explain": "Food should be a turtle itself, so it inherits from Turtle and calls the superclass initializer."}, {"q": "A turtle is 20 by 20. How does the lesson make the food 10 by 10?", "choices": ["shapesize(stretch_len=2, stretch_wid=2)", "shapesize(stretch_len=0.5, stretch_wid=0.5)", "shape(\"10x10\")", "speed(\"fastest\")"], "answer": 1, "explain": "Stretching length and width by 0.5 halves the size."}, {"q": "Why does the food use speed(\"fastest\")?", "choices": ["So the snake moves faster", "So you don't see the food animate from the center to its spot", "So the food changes color", "So the food stays 10 by 10"], "answer": 1, "explain": "Without it, you'd watch the food get created at the center and then move."}, {"q": "Why pick the food's x and y with random.randint(-280, 280)?", "choices": ["The screen only goes to 280", "Food at the very edge is hard to reach and the snake would probably die on the wall", "randint can't go past 280", "The scoreboard is at 300"], "answer": 1, "explain": "The screen goes to 300, but staying in from the edge keeps the food reachable."}, {"q": "Which check detects the snake eating the food?", "choices": ["if snake.head == food:", "if food.distance() < 15:", "if snake.head.distance(food) < 15:", "if snake.head.distance(food) > 15:"], "answer": 2, "explain": "distance measures from the head to the food turtle; within 15 pixels counts as a collision."}, {"q": "Why name the food's move method refresh() instead of reset()?", "choices": ["reset only works on screens", "reset is already a Turtle method that Food inherits", "refresh is required by Python", "reset would grow the snake"], "answer": 1, "explain": "The lesson warns not to write reset, because Turtle already has a method with that name."}, {"q": "Which font argument works with write()?", "choices": ["font=\"Arial 24 normal\"", "font=(\"Arial\", 24, \"normal\")", "font=[Arial, 24, normal]", "font=\"Arial\", 24, \"normal\""], "answer": 1, "explain": "font expects a tuple of name, size, and style, not one string."}, {"q": "The scoreboard writes, then calls self.color(\"white\"). What do you see on the black screen?", "choices": ["White score at the top", "Nothing, because the text was already written in black", "A white arrow only", "The score in blue"], "answer": 1, "explain": "Color has to be set before write; changing it afterward doesn't change text already written."}, {"q": "Why add penup() before the scoreboard moves to the top?", "choices": ["So the score is bold", "So it doesn't draw a line on its way there", "So the score resets", "So the turtle hides"], "answer": 1, "explain": "Without penup the turtle draws its path as it moves."}, {"q": "New scores keep landing on top of old ones. What fixes it?", "choices": ["Call self.clear() before writing the new score", "Call self.reset() after writing", "Make the font smaller", "Call self.hideturtle() again"], "answer": 0, "explain": "clear() wipes the scoreboard turtle's old text so the new score doesn't overlap."}, {"q": "Why did the lesson pull ALIGNMENT and FONT out as constants?", "choices": ["Python requires constants for write()", "So text settings aren't hard-coded in the body and are easy to change at the top", "So the score starts at 0", "So the scoreboard inherits from Turtle"], "answer": 1, "explain": "Switching Arial to Courier becomes a one-line change at the top of the file."}, {"q": "Which condition detects the snake hitting the wall?", "choices": ["x > 280 and x < -280 and y > 280 and y < -280", "x > 280 or x < -280 or y > 280 or y < -280", "x > 300 or y > 300", "x < 280 or y < 280"], "answer": 1, "explain": "Any one of the four sides being crossed means the wall was hit, so the checks are joined with or."}, {"q": "What does game_is_on = False do after a wall hit?", "choices": ["Restarts the game", "Exits the while loop so the snake stops", "Clears the score", "Moves the snake to (0, 0)"], "answer": 1, "explain": "The while loop runs only while game_is_on is True."}, {"q": "Why does game_over() not call clear() before writing GAME OVER?", "choices": ["clear() would also stop the snake", "So the final score stays visible at the top", "clear() only works in __init__", "GAME OVER needs to overlap the score"], "answer": 1, "explain": "The player sees GAME OVER in the center and their final score at the top."}, {"q": "Where does extend() put the new segment?", "choices": ["At (0, 0)", "At self.segments[0].position()", "At self.segments[-1].position()", "At self.segments[-1].position"], "answer": 2, "explain": "-1 is the last segment, and position() is a method so it needs parentheses."}, {"q": "The tail check loops through every segment and gets game over instantly. Why?", "choices": ["The distance should be 15", "The head is the first segment, so it's checking the head's distance to itself", "extend() adds too many segments", "game_is_on starts as False"], "answer": 1, "explain": "The head's distance to itself is less than 10, so you have to skip the head."}, {"q": "With piano_keys = [\"a\", \"b\", \"c\", \"d\", \"e\", \"f\", \"g\"], what is piano_keys[2:5]?", "choices": ["c, d, e, f", "b, c, d", "c, d, e", "d, e, f"], "answer": 2, "explain": "Slicing goes from cut 2 to cut 5; the end position isn't included."}, {"q": "Which slice reverses the piano_keys list?", "choices": ["piano_keys[-1]", "piano_keys[::2]", "piano_keys[::-1]", "piano_keys[7:0]"], "answer": 2, "explain": "An increment of -1 walks from the end back to the beginning."}, {"q": "Which loop checks every segment except the head with a single if?", "choices": ["for segment in snake.segments:", "for segment in snake.segments[1:0]:", "for segment in snake.segments[1:]:", "for segment in snake.segments[:1]:"], "answer": 2, "explain": "[1:] starts at position 1 and, with the end omitted, goes to the end, leaving out the head."}]}, {"day": 22, "questions": [{"q": "Which setup gives the Pong window the lesson uses?", "choices": ["screen.setup(width=600, height=600) and a white background", "screen.setup(width=800, height=600) and screen.bgcolor(\"black\")", "screen.setup(800) only", "screen.title(\"Pong\") is enough; setup is optional"], "answer": 1, "explain": "The screen is 800 wide by 600 tall with a black background. Title is optional; exitonclick keeps the window open."}, {"q": "What happens if you leave off screen.exitonclick()?", "choices": ["The paddles won't move", "The score starts at 1", "The window flashes and disappears", "The ball bounces forever"], "answer": 2, "explain": "Without exitonclick, the window closes as soon as the program finishes."}, {"q": "A turtle starts 20 by 20. Which call makes a 20-wide, 100-tall paddle?", "choices": ["shapesize(stretch_len=5, stretch_wid=1)", "shapesize(stretch_wid=5, stretch_len=5)", "shapesize(stretch_wid=5, stretch_len=1)", "shape(\"20x100\")"], "answer": 2, "explain": "stretch_wid is up-and-down and stretch_len is side-to-side, so wid=5 makes it 100 tall and len=1 leaves it 20 wide."}, {"q": "Which onkey line correctly binds go_up to the Up key?", "choices": ["screen.onkey(go_up(), \"Up\")", "screen.onkey(go_up, \"Up\")", "screen.onkey(\"go_up\", \"Up\")", "screen.onkey(go_up, Up)"], "answer": 1, "explain": "Pass the function with no parentheses, or it runs once immediately instead of waiting for the key."}, {"q": "go_up computes new_y = self.ycor() + 20. What else is needed so the paddle actually moves?", "choices": ["Nothing; changing new_y moves it automatically", "self.ycor = new_y", "self.goto(self.xcor(), new_y)", "self.forward(20)"], "answer": 2, "explain": "The new y is just a number until you pass it (and the current x) to goto."}, {"q": "Where should screen.tracer(0) go so you don't see turtles slide in from the center?", "choices": ["Inside the game loop, after screen.update()", "Once, after the paddles and ball are created", "Once, before the paddles and ball are created, and outside the loop", "Inside Paddle.__init__"], "answer": 2, "explain": "It has to be on before the turtles are made and sent to their spots, and it should run only once, not every loop pass."}, {"q": "After tracer(0), how does the screen get redrawn?", "choices": ["It still redraws automatically", "Call screen.update() in a while game_is_on loop", "Call exitonclick() again", "Set bgcolor to black a second time"], "answer": 1, "explain": "Turning animation off means you have to update the screen yourself each pass of the game loop."}, {"q": "How should the Paddle class get Turtle's abilities?", "choices": ["self.paddle = Turtle() inside __init__", "class Paddle(Turtle): plus super().__init__()", "class Turtle(Paddle):", "import Paddle from turtle"], "answer": 1, "explain": "The paddle itself should be a turtle, so it inherits from Turtle and calls the superclass initializer. Don't store a second Turtle in an attribute."}, {"q": "Which line makes a right paddle at (350, 0)?", "choices": ["r_paddle = Paddle.goto(350, 0)", "r_paddle = Paddle((350, 0))", "r_paddle = Paddle.goto((350, 0))", "r_paddle = Paddle[350, 0]"], "answer": 1, "explain": "You make an object by calling the class and passing the position tuple into __init__."}, {"q": "After the refactor, which keys move the left paddle?", "choices": ["Up and Down", "a and d", "w and s", "Left and Right"], "answer": 2, "explain": "The left paddle uses w for go_up and s for go_down. Up and Down stay on the right paddle."}, {"q": "Which walls should the ball bounce off?", "choices": ["All four edges", "Only the left and right", "Only the top and bottom", "None; only paddles bounce the ball"], "answer": 2, "explain": "Top and bottom are wall bounces. Left and right are paddle catches or misses."}, {"q": "The lesson tunes the top and bottom bounce to which y values, and why?", "choices": ["300 and -300, the exact edge of the 600-tall screen", "280 and -280, because the ball is 20 pixels wide", "350 and -350, where the paddles sit", "0 and 600"], "answer": 1, "explain": "Half of 600 is 300, but 280 lets the 20-pixel ball turn around just before the edge."}, {"q": "y_move is 10, then bounce_y runs twice. Which line flips the direction both times?", "choices": ["self.y_move = 10 * -1", "self.y_move *= -1", "self.y_move = 10", "self.y_move += -1"], "answer": 1, "explain": "Multiplying the current value by -1 flips it every time: 10, then -10, then 10 again. 10 * -1 stays -10 on the second bounce."}, {"q": "Why isn't ball.distance(r_paddle) < 20 enough to detect a paddle hit?", "choices": ["distance() only works on the food turtle", "distance() measures center to center, so a hit near the paddle's end looks farther than 20", "The paddle is only 10 pixels wide", "distance() always returns 0"], "answer": 1, "explain": "You also need an x check so a hit at the edge still counts once the ball is even with the paddle."}, {"q": "Which condition detects a hit on the right paddle (after the lesson's tuning)?", "choices": ["ball.distance(r_paddle) < 20", "ball.xcor() > 320 only", "ball.distance(r_paddle) < 50 and ball.xcor() > 320", "ball.distance(r_paddle) < 50 or ball.xcor() > 320"], "answer": 2, "explain": "Both parts are required: close enough to the paddle and far enough right. The left side uses distance < 50 and x < -320."}, {"q": "What's the difference between bounce_y and bounce_x?", "choices": ["bounce_y flips x_move; bounce_x flips y_move", "bounce_y flips y_move (walls); bounce_x flips x_move (paddles)", "They do the same thing", "bounce_x only resets the ball to the center"], "answer": 1, "explain": "Walls reverse the vertical step; paddle hits reverse the horizontal step."}, {"q": "The right paddle covers x 340 to 360. When has it missed the ball?", "choices": ["ball.xcor() > 320", "ball.xcor() > 380", "ball.ycor() > 280", "ball.distance(r_paddle) < 50"], "answer": 1, "explain": "Past 380 the ball has gone beyond the paddle zone, so it's a miss and the ball should reset."}, {"q": "What does reset_position() do?", "choices": ["Only calls self.goto(0, 0)", "Goes to (0, 0), then calls bounce_x() so the ball serves toward the other player", "Sets x_move to -10 every time so it always goes left", "Only speeds the ball up"], "answer": 1, "explain": "Center first, then flip x so the next serve heads the other way. Hard-coding -10 would always serve left."}, {"q": "Why are the right-miss and left-miss checks separate if statements?", "choices": ["Python can't put two conditions in one if", "Scoring differs per side: a right miss is a point for the left player, and the other way around", "Otherwise the ball won't bounce on the walls", "tracer(0) requires two ifs"], "answer": 1, "explain": "Each miss awards a point to a different player, so the lesson keeps the checks separate."}, {"q": "The right paddle misses the ball. Who scores, and which method runs?", "choices": ["The right player, scoreboard.r_point()", "The left player, scoreboard.l_point()", "Both players, update_scoreboard() only", "Nobody; just reset the ball"], "answer": 1, "explain": "When the right paddle misses, the left player gets the point."}, {"q": "New scores keep landing on top of old ones. What fixes it?", "choices": ["Call self.clear() before writing the new scores", "Call self.reset() after writing", "Make the font smaller", "Name the method update instead of update_scoreboard"], "answer": 0, "explain": "clear() wipes the scoreboard turtle's old text so the new numbers don't overlap."}, {"q": "Why is the ball's wait named move_speed, not speed, and how does a paddle hit speed the ball up?", "choices": ["speed is a Turtle method, so the lesson uses move_speed; bounce_x does move_speed *= 0.9", "The name doesn't matter; bounce_x does time.sleep += 0.1", "move_speed is a method that calls time.sleep(0.1)", "You add 0.1 to move_speed on each hit to go faster"], "answer": 0, "explain": "Don't reuse Turtle's speed (or update) name. A smaller sleep makes the ball faster, so bounce_x multiplies move_speed by 0.9, and reset_position puts it back to 0.1."}]}, {"day": 23, "questions": [{"q": "What five sub-parts does the lesson split Turtle Crossing into?", "choices": ["Move the turtle, bounce off walls, keep a timer, add a second player, and a high-score file", "Move the turtle with a keypress, create and move the cars, detect a collision, detect reaching the other side, and a scoreboard with level and game over", "Only the player class and the scoreboard", "Create the cars first, then the player, then the screen setup"], "answer": 1, "explain": "The capstone is broken into those five parts: keypress movement, cars, collision, reaching the other side, and a level/game-over scoreboard."}, {"q": "How does the player turtle move?", "choices": ["It can go in all four directions with the arrow keys", "It can only go forwards; each press of the Up key moves it forward by a set amount", "It moves automatically toward the top of the screen", "Left and Right rotate it, and Up moves it"], "answer": 1, "explain": "The lesson's first step is Up-key movement only, and the turtle only goes forwards, until it reaches the other side."}, {"q": "How should the Player class get Turtle's abilities?", "choices": ["self.player = Turtle() inside __init__", "class Player(Turtle): plus super().__init__()", "class Turtle(Player):", "import Player from turtle"], "answer": 1, "explain": "Player inherits from Turtle and calls the superclass initializer so it can do everything a turtle can do, and even more."}, {"q": "Which setup puts the player at the start facing North?", "choices": ["self.goto the starting position (a tuple) and set the heading to 90 degrees", "self.heading(0) and goto the center of the screen", "Only shape(\"turtle\") is needed; it already faces North", "setheading(180) so it faces the oncoming cars"], "answer": 0, "explain": "The starting position is a tuple passed to goto, and North is 90 degrees. After you create the Player, it shows up at the center of the bottom of the screen."}, {"q": "Which onkey line correctly binds go_up to the Up key?", "choices": ["screen.onkey(player.go_up(), \"Up\")", "screen.onkey(player.go_up, \"Up\")", "screen.onkey(\"player.go_up\", \"Up\")", "screen.onkey(player.go_up, Up)"], "answer": 1, "explain": "Pass the method with no parentheses, or it runs when that line is evaluated instead of only when the Up key is detected."}, {"q": "Why is the player's move distance stored in a constant?", "choices": ["Turtle requires a constant for forward()", "So you can change how far it goes by editing the top of the file instead of digging through the code", "The constant is required for onkey to work", "So the cars can read the player's speed"], "answer": 1, "explain": "go_up moves the player forwards by that constant. Keeping it at the top makes later changes easy."}, {"q": "A turtle starts 20 by 20. After the lesson's shapesize fix, how do you make a 20 by 40 car?", "choices": ["Stretch the width by 2 and the length by 1", "Stretch the width by 1 and the length by 2", "Stretch both width and length by 2", "shape(\"20x40\")"], "answer": 1, "explain": "The first try (width 2, length 1) stretched the wrong side and made a random array of shapes. The fix is width 1, length 2, so the cars are a rectangle moving left."}, {"q": "What is all_cars, and how do you add a new car to it?", "choices": ["A tuple of colors; use all_cars += new_car", "An empty list created in __init__; append with self.all_cars.append because the list is defined in the class", "A Screen method; call screen.all_cars()", "A constant at the top of main.py"], "answer": 1, "explain": "CarManager starts all_cars as an empty list and appends each new_car. It needs self in front because the list lives on the class."}, {"q": "Where does a new car start, and what y range does the lesson use?", "choices": ["(0, 0), with y from -300 to 300", "x = +300 (the right edge), y from random.randint between -250 and +250", "x = -300, y from -300 to 300", "x = +300 and y exactly 0"], "answer": 1, "explain": "The 600 by 600 screen's Y-axis goes from +300 to -300, but -250 to +250 leaves the turtle some starting and ending space."}, {"q": "What does move_cars do?", "choices": ["It deletes cars that reach the left edge", "It loops for car in self.all_cars and moves each car backwards by the starting move distance (five paces)", "It moves the cars forward by 10", "It only moves the newest car"], "answer": 1, "explain": "Moving backwards sends the cars toward the left. Without this, cars created at the right edge never become visible."}, {"q": "How does the lesson cut down how often new cars appear?", "choices": ["Put time.sleep(1) inside the create method", "A random_chance: a random int from 1 to 6, and only create a car if it equals 1 (about one in six times, like a dice)", "Create a car only when the player moves", "Create exactly one car per level"], "answer": 1, "explain": "Creating a car on every 0.1-second refresh made crossing impossible. A 1-in-6 chance is about every six loop passes, not exactly, because of chance."}, {"q": "Does your car-manager code have to look the same as the lesson's?", "choices": ["Yes, or the game won't run", "No. What matters is the desired functionality; there are a million ways,
