<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Days of Code: Flashcards</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--accent:#38bdf8;--accent2:#a78bfa;--text:#e2e8f0;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at top,#1e3a5f,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:28px 0 4px;font-size:1.8rem;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-bottom:18px}
.days{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;max-width:900px}
.days button,.controls button{background:var(--panel);color:var(--text);border:1px solid #334155;border-radius:999px;padding:8px 16px;font-size:.95rem;cursor:pointer;transition:.15s}
.days button:hover,.controls button:hover{border-color:var(--accent)}
.days button.on{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:600}
.scene{width:min(640px,92vw);height:360px;perspective:1200px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:36px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.35rem;line-height:1.5;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.front{background:linear-gradient(135deg,#1e293b,#273449);border:2px solid var(--accent)}
.back{background:linear-gradient(135deg,#2e1065,#1e293b);border:2px solid var(--accent2);transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:20px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.hint{position:absolute;bottom:14px;font-size:.8rem;color:var(--muted)}
code{background:rgba(148,163,184,.18);color:#fde68a;padding:2px 7px;border-radius:6px;font-family:Consolas,"Cascadia Code",monospace;font-size:.92em}
.controls{display:flex;gap:10px;margin:22px 0 8px;flex-wrap:wrap;justify-content:center}
.controls .primary{background:var(--accent);color:#0f172a;font-weight:600;border-color:var(--accent)}
.count{color:var(--muted);margin-bottom:6px}
.bar{width:min(640px,92vw);height:6px;background:#334155;border-radius:3px;overflow:hidden;margin-bottom:30px}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.keys{color:var(--muted);font-size:.8rem;margin-bottom:30px}
.tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:999px;margin-bottom:18px;border:1px solid #334155}
.tabs button{background:none;border:none;color:var(--muted);padding:9px 24px;border-radius:999px;font-size:1rem;cursor:pointer;font-weight:600}
.tabs button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0f172a}
#flashView{display:flex;flex-direction:column;align-items:center}
#quizView{display:flex;flex-direction:column;align-items:center}
.hidden{display:none!important}
.quiz{width:min(680px,92vw);background:linear-gradient(135deg,#1e293b,#273449);border:2px solid var(--accent2);border-radius:20px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.45);margin-bottom:30px}
.qtext{font-size:1.25rem;line-height:1.5;margin-bottom:20px}
pre{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:14px 16px;font-family:Consolas,"Cascadia Code",monospace;font-size:1rem;color:#fde68a;text-align:left;white-space:pre;overflow-x:auto}
.choice{display:block;width:100%;text-align:left;background:#0f172a;border:1px solid #334155;color:var(--text);padding:13px 16px;border-radius:12px;margin:8px 0;font-size:1.05rem;cursor:pointer;font-family:Consolas,"Segoe UI",monospace;transition:.15s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{background:#14532d;border-color:#22c55e}
.choice.wrong{background:#7f1d1d;border-color:#ef4444}
.choice:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 16px;border-radius:12px;line-height:1.5}
.fb.ok{background:rgba(34,197,94,.15);border:1px solid #22c55e}
.fb.no{background:rgba(239,68,68,.15);border:1px solid #ef4444}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.qnav{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.qnav button{background:var(--accent);color:#0f172a;border:none;border-radius:999px;padding:10px 22px;font-weight:600;font-size:1rem;cursor:pointer}
.qnav button.ghost{background:var(--panel);color:var(--text);border:1px solid #334155}
.score{font-size:3rem;font-weight:700;text-align:center;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.miss{background:#0f172a;border-left:3px solid #ef4444;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.5}
.best{color:var(--muted);font-size:.8rem;margin-left:4px}
</style></head><body>
<h1>100 Days of Code <span>Python</span></h1>
<div class="sub" id="sub">Click the card (or press Space) to flip it</div>
<div class="tabs"><button id="tabF" class="on" onclick="tab('f')">Flashcards</button><button id="tabQ" onclick="tab('q')">Pop Quiz</button></div>
<div class="days" id="days"></div>
<div id="flashView">
<div class="scene" onclick="flip()"><div class="card" id="card">
  <div class="face front"><div class="tag" id="tagF"></div><div id="q"></div><div class="hint">Question</div></div>
  <div class="face back"><div class="tag" id="tagB"></div><div id="a"></div><div class="hint">Answer</div></div>
</div></div>
<div class="controls">
  <button onclick="move(-1)">&larr; Prev</button>
  <button class="primary" onclick="flip()">Flip</button>
  <button onclick="move(1)">Next &rarr;</button>
  <button onclick="shuffle()">&#x1F500; Shuffle</button>
</div>
<div class="count" id="count"></div>
<div class="bar"><div id="bar"></div></div>
<div class="keys">Keys: &larr; / &rarr; to move, Space to flip, S to shuffle</div>
</div>
<div id="quizView" class="hidden"><div class="days" id="qdays"></div><div class="quiz" id="quiz"></div></div>
<script>
const DECKS=[{"day": 1, "cards": [["How do you output text to the console in Python?", "`print()` with the text inside the parentheses, e.g. `print(\"Hello world!\")`"], ["What is a string?", "A piece of text in quotes, a \"string of characters\". The quotes tell Python it's text, not code."], ["What do the double quotes around text do?", "They mark the beginning and end of a string."], ["What does `Process finished with exit code 0` mean?", "The code ran successfully with no issues."], ["What error do you get if you forget a closing quote?", "A SyntaxError."], ["What is syntax highlighting and how does it help?", "The editor colors code by type; wrong colors (e.g. a parenthesis turning string-green) hint at a mistake."], ["What does the caret (^) in an error message show?", "Roughly where in the line Python found the problem."], ["In PyCharm, red vs yellow squiggly underline?", "Red = error, yellow = warning (usually a style issue)."], ["What is PEP 8?", "Python's official style guide for writing clean code."], ["What PEP 8 warning appeared in lesson 6 and how do you fix it?", "No new line at end of file; press Enter after the last line."], ["Where do you go first when you get an error you don't understand?", "Copy the error message into Google; Stack Overflow usually has the answer."], ["What does `\\n` do inside a string?", "Starts a new line, so one print() can output multiple lines."], ["Is the new-line character a backslash or a forward slash?", "Backslash: `\\n`."], ["What is string concatenation?", "Joining strings end to end with `+`."], ["What does `print(\"Hello\" + \"Angela\")` output?", "`HelloAngela` (no space is added automatically)."], ["Give one way to output `Hello Angela` using concatenation.", "`\"Hello\" + \" \" + \"Angela\"` (or put the space inside either string)."], ["What causes an IndentationError?", "An unexpected space or tab at the start of a line of code."], ["SyntaxError vs IndentationError?", "SyntaxError = broken grammar (e.g. missing quote). IndentationError = unexpected leading space/tab."], ["Do spaces inside quotes cause errors?", "No, they're part of the string."], ["What PEP 8 warning does `print (\"Hi\")` give?", "Whitespace before '('. Remove the space."], ["Why learn the errors shown after Run rather than editor squiggles?", "Run errors come from Python itself and are the same in any editor; squiggles are editor-specific."], ["What is debugging?", "Finding and fixing errors (bugs) so code runs as expected."], ["What does the `input()` function do?", "Lets the user type data into the program; it returns what they typed as a string."], ["What is the text inside `input(\"...\")` called?", "The prompt, a hint shown to the user about what to type."], ["How can you tell PyCharm is waiting for input?", "No \"Process finished\" line yet, the stop button is active, and play becomes rerun."], ["When `input()` runs, what happens to that part of the code?", "The whole input(...) call is replaced by whatever the user typed."], ["In `print(\"Hello \" + input(\"Name? \"))`, what do the two closing `))` do?", "The first closes input(, the second closes print(."], ["Which runs first: the inner `input()` or the outer `print()`?", "The inner input() runs first; its result is then printed."], ["Write a line that greets the user by name with an exclamation mark.", "`print(\"Hello \" + input(\"What is your name? \") + \"!\")`"], ["What symbol makes a line a comment in Python?", "`#` (hash/pound sign). Python ignores everything after it on that line."], ["Keyboard shortcut to comment/uncomment a line in PyCharm on Windows?", "Ctrl + / (Cmd + / on Mac)."], ["What is Thonny useful for?", "A free editor whose Debug / Step into buttons show Python evaluating code step by step."], ["What is a variable?", "A name that stores a piece of data so you can refer to it later."], ["What does `=` do in `name = \"Jack\"`?", "Assigns the value on the right (\"Jack\") to the variable on the left (name)."], ["How do you save the user's input so you can use it later?", "Assign it to a variable: `name = input(\"What is your name? \")`"], ["`print(name)` vs `print(\"name\")`?", "print(name) prints the variable's value; print(\"name\") prints the literal word name."], ["`name = \"Jack\"`, `print(name)`, `name = \"Angela\"`, `print(name)`. What prints?", "Jack, then Angela. A variable holds its latest value at each moment."], ["Why is it called a \"variable\"?", "Its value can change (vary) when you reassign it."], ["What does `len()` do?", "Returns the number of characters in a string."], ["What is `len(\"Hello world!\")`?", "12 (the space and ! count)."], ["One line to print how many characters are in the user's name?", "`print(len(input(\"What is your name? \")))`"], ["In what order does `print(len(input()))` run?", "Inside out: input(), then len(), then print()."], ["Rewrite `print(len(input(\"Name? \")))` with variables `username` and `length`.", "`username = input(\"Name? \")` / `length = len(username)` / `print(length)`"], ["Why use variables even when one line would work?", "Each step is labeled, so code is more readable and easier to break into parts."], ["How should you phrase a search when you're stuck?", "What you want to do + the language, e.g. \"how to find the length of a string python\"."], ["What's the most important rule for naming variables?", "Make them readable, so the name explains what the data is (username, not n)."], ["How do you separate words in a Python variable name?", "With an underscore: `user_name`. Spaces aren't allowed."], ["What happens if a variable name has a space, like `user name = ...`?", "SyntaxError."], ["Can a variable name contain numbers?", "Yes, but not at the start: `length1` is fine, `1length` is a SyntaxError."], ["Why shouldn't you name a variable `print` or `input`?", "They're built-in function names; it's confusing, breaks syntax highlighting, and is bad practice."], ["What causes a NameError?", "Using a variable name that was never defined, usually a typo (e.g. `nama` instead of `name`)."], ["Does Python spell-check variable names?", "No. Any valid name works as long as you spell it exactly the same every time."], ["Valid or invalid: `user_name`, `2nd_place`, `length2`, `my name`?", "Valid: user_name, length2. Invalid: 2nd_place (starts with a number), my name (has a space)."], ["If `food = \"tacos\"`, what does `print(food)` show vs `print(\"food\")`?", "print(food) shows tacos (the value). print(\"food\") shows the word food."], ["What is `len(\"pizza\")`?", "5 (p-i-z-z-a). Count every character."]]}, {"day": 2, "cards": [["What error do you get from `len(12345)` and why?", "TypeError. len() works on strings (and other sequences), not on integers."], ["What are the four basic data types covered on Day 2?", "str (string), int (integer), float, and bool (boolean)."], ["What is subscripting?", "Pulling out one character from a string with square brackets, e.g. \"Hello\"[0]."], ["What does `\"Hello\"[0]` give you, and why not 1?", "H. Programmers count from 0, so the first character is index 0."], ["What does `\"Hello\"[-1]` give you?", "o (the last character). Negative indices count from the end."], ["What does `print(\"123\" + \"345\")` output?", "123345. Both are strings, so + concatenates."], ["What does `print(123 + 345)` output?", "468. Both are integers, so + adds."], ["How do you write a large integer so it's easier to read?", "Use underscores: `1_000_000` (Python ignores them)."], ["What is a float?", "A number with a decimal point, e.g. 3.14159."], ["What are the two Boolean values, and how are they written?", "True and False, capital T/F, no quotes."], ["Is `\"123\"` an integer or a string?", "A string, because it's in quotes."], ["Why does `len(12345)` raise a TypeError?", "len() expects a Sized object like a string, not an integer."], ["What does `type(\"Hello\")` return?", "`<class 'str'>`"], ["What do `type(123)`, `type(3.14)`, and `type(True)` return?", "`<class 'int'>`, `<class 'float'>`, `<class 'bool'>`"], ["What is type conversion / type casting?", "Changing a value from one data type to another, e.g. int(\"123\") or str(5)."], ["How do you convert a string to an integer?", "`int(\"123\")`"], ["How do you convert a number to a string?", "`str(123)`"], ["What does `int(\"123\") + int(\"456\")` equal?", "579 (they become ints, so + adds)."], ["What error does `int(\"ABC\")` raise?", "ValueError (invalid literal for int)."], ["Why does `print(\"Letters: \" + len(name))` fail?", "len() returns an int; you can't concatenate str + int. Wrap with str()."], ["Fix: print the length of a name after an input prompt.", "`name = input(\"Name?\")` then `print(\"Letters: \" + str(len(name)))`"], ["What symbol is multiplication in Python?", "`*` (asterisk), not \u00d7."], ["What symbol is division in Python?", "`/` (forward slash)."], ["What does `6 / 3` return, and what type is it?", "`2.0`, a float. Regular division always returns a float."], ["What does `5 // 3` return?", "`1` (floor division drops the decimal; result is an int)."], ["What does `2 ** 3` mean?", "2 to the power of 3, which is 8."], ["What does PEMDAS stand for?", "Parentheses, Exponents, Multiplication, Division, Addition, Subtraction."], ["Between `*` and `/`, which happens first?", "They're equal priority; the one furthest left runs first."], ["What is `3 * 3 + 3 / 3 - 3`?", "`7.0`"], ["How do you make `3 * 3 + 3 / 3 - 3` equal 3?", "Add parentheses: `3 * (3 + 3) / 3 - 3`"], ["What does `int(30.85)` give?", "30. It chops off the decimals (doesn't round)."], ["What does `round(30.85)` give?", "31. Normal rounding to the nearest whole number."], ["How do you round `bmi` to 2 decimal places?", "`round(bmi, 2)`"], ["What does `score += 1` mean?", "score = score + 1 (add 1 to its current value)."], ["Name the four shorthand assignment operators.", "`+=`, `-=`, `*=`, `/=`"], ["What is an f-string?", "A string with f before the quotes; variables go in {curly braces} and are converted to text automatically."], ["Write an f-string that prints `Your score is 5` using a variable `score`.", "`print(f\"Your score is {score}\")`"], ["Why use an f-string instead of `\"Score: \" + str(score)`?", "No manual str() conversion or + signs; you can mix ints, floats, and bools in one string easily."], ["How do you turn a 12% tip into a multiplier?", "`12 / 100 + 1` = 1.12"], ["Why use `float(input(...))` for a bill but `int(input(...))` for people?", "Money can have decimals; number of people is a whole number."], ["How do you always show 2 decimals (33.60, not 33.6) in an f-string?", "`f\"{value:.2f}\"`"]]}, {"day": 3, "cards": [["What is an if / else statement?", "Code that runs one block if a condition is True, and another block (else) if it's False."], ["What two things must every `if` and `else` line end with / be followed by?", "A colon `:`, then an indented block of code."], ["How does Python know which lines belong inside an if block?", "Indentation. Indented lines under the if are inside it."], ["Where does `else` go relative to `if`?", "At the same indentation level as its if; they're a pair."], ["`height = 120`. Does `if height > 120:` run the if block or the else?", "The else. `>` doesn't include 120; use `>=` to include it."], ["What's the difference between `>` and `>=`?", "`>` means strictly greater; `>=` also includes the equal value."], ["What does `!=` mean?", "Not equal to."], ["What's the difference between `=` and `==`?", "`=` assigns a value to a variable; `==` checks if two values are equal."], ["What happens if you write `if height = 120:`?", "SyntaxError. A condition needs `==`, which gives True or False."], ["Write an if/else that prints \"Ride!\" if `height` is at least 120, otherwise \"Too short\".", "`if height >= 120:` / `    print(\"Ride!\")` / `else:` / `    print(\"Too short\")`"], ["What does the `%` (modulo) operator do?", "Gives the remainder after dividing one number by another."], ["What is `10 % 3`?", "1 (3 goes into 10 three times with 1 left over)."], ["What is `10 % 5`?", "0 (divides evenly, no remainder)."], ["How do you check if a number is even?", "`if number % 2 == 0:` (even numbers have no remainder when divided by 2)."], ["What does `number % 2` give for an odd number?", "1"], ["What is a nested if statement?", "An if/else placed inside another if block (indented one more level). The inner check only runs if the outer condition is True."], ["In the rollercoaster code, when is the age question asked?", "Only if the height check passed (it's nested inside the `if height >= 120:` block)."], ["What does `elif` stand for, and when do you use it?", "\"Else if.\" Use it when there are more than two possibilities."], ["If several `if`/`elif` conditions are True, which block runs?", "Only the first True one, top to bottom. The rest are skipped."], ["How many `elif`s can you have between `if` and `else`?", "As many as you need."], ["`age = 10`. With `if age < 12:` / `elif age <= 18:` / `else:`, which block runs?", "The `if age < 12:` block ($5). Python stops at the first True condition."], ["Why must `if age < 12` come before `elif age <= 18`?", "Order matters. If `<= 18` came first, a 10-year-old would match it and never reach the under-12 price."], ["if/elif/else vs several separate `if`s: how many blocks can run?", "if/elif/else runs only one block (the first True). Separate `if`s are each checked, so several can run."], ["When should you use separate `if`s instead of `elif`?", "When the conditions are independent of each other, like asking about a photo no matter what ticket someone has."], ["Why is `bill = 0` created before the age checks?", "So a variable exists that each branch can set and the photo check can add to later."], ["What does `bill += 3` do?", "Adds 3 to the current bill: same as `bill = bill + 3`."], ["Does every `if` need an `else`?", "No. If nothing should happen when the condition is False, leave the else off."], ["Why is the photo question lined up with the age `if`, not indented under `else`?", "So it's asked for every age, after the ticket price is set, not only for adults."], ["What are Python's three logical operators?", "`and`, `or`, `not`"], ["When is `A and B` True?", "Only when both A and B are True."], ["When is `A or B` False?", "Only when both A and B are False."], ["What does `not` do?", "Flips a condition: `not True` is False, `not False` is True."], ["`a = 12`. Is `a > 15 and a < 13` True or False?", "False. `a > 15` is False, and `and` needs both to be True."], ["`a = 12`. Is `a > 10 or a < 10` True or False?", "True. `or` only needs one side to be True."], ["Write a condition for ages 45 to 55, inclusive.", "`age >= 45 and age <= 55` (or the shorter `45 <= age <= 55`)"], ["What is the Python Console in PyCharm good for?", "Testing single lines of code and seeing results right away, separate from your files."]]}, {"day": 4, "cards": [["Why do computers need a special method to make random numbers?", "They're deterministic (same steps, same result), so they use math called a pseudorandom number generator."], ["What is Python's pseudorandom number generator called?", "The Mersenne Twister."], ["What line do you need before you can use `random.randint()`?", "`import random`"], ["What does `random.randint(1, 10)` return?", "A random whole number from 1 to 10, including both 1 and 10."], ["Write a line that stores a random whole number from 1 to 6 in `dice`.", "`dice = random.randint(1, 6)`"], ["What range does `random.random()` give?", "A float from 0 up to but not including 1 (0 can show up, 1 never does)."], ["Why does `random.random()` need `()` if it takes no inputs?", "Parentheses are what actually run (call) a function, even with nothing inside."], ["In `random.random()`, what's the difference between the two words `random`?", "The first is the module; the second is the function inside it."], ["How do you get a random float from 0 up to (not including) 10?", "`random.random() * 10`"], ["What does `random.uniform(1, 10)` return?", "A random float between 1 and 10 (it may or may not ever hit exactly 10 because of rounding)."], ["What is a module?", "A separate .py file of code you can import and reuse in other files."], ["Why do programmers split code into modules?", "Big programs are easier to understand, and different people can work on different parts."], ["You made `my_module.py` with `pi = 3.14`. How do you print it from main.py?", "`import my_module` then `print(my_module.pi)`"], ["How do you write a random coin flip?", "`if random.randint(0, 1) == 0:` print \"Heads\", `else:` print \"Tails\"."], ["What is a list in Python?", "A data structure that stores many related items, in order, in one variable."], ["How do you write a list?", "Square brackets with items separated by commas: `[\"Cherry\", \"Apple\", \"Pear\"]`"], ["Can a list hold different data types?", "Yes. It can mix strings, numbers, booleans, and more."], ["`fruits = [\"Cherry\", \"Apple\", \"Pear\"]`. What is `fruits[0]`?", "\"Cherry\". Lists start counting at 0."], ["Why does the first item have index 0?", "The index is an offset from the start, and the first item is 0 steps away."], ["What does `fruits[-1]` give you?", "The last item in the list."], ["How do you change the second item in `fruits` to \"Mango\"?", "`fruits[1] = \"Mango\"`"], ["What does `append()` do?", "Adds one item to the end of a list: `fruits.append(\"Kiwi\")`"], ["`append()` vs `extend()`?", "append() adds one item; extend() adds every item from another list: `fruits.extend([\"Kiwi\", \"Lime\"])`"], ["Do you need to memorize every list function?", "No. Know what's possible, then look up the details in the docs or Google."], ["What does `len()` return for a list?", "The number of items in it, e.g. 50 for the list of US states."], ["A list has 50 items. What is the last valid index?", "49 (always len - 1, because counting starts at 0)."], ["What error do you get from `my_list[50]` when the list has 50 items?", "IndexError: list index out of range."], ["What is an off-by-one error?", "Being one step off, like using `len(list)` as an index instead of `len(list) - 1`."], ["What is a nested list?", "A list that contains other lists, e.g. `dirty_dozen = [fruits, vegetables]`."], ["If `fruits` has 7 items and `vegetables` has 5, what is `len([fruits, vegetables])`?", "2. The outer list holds two items, which are the two lists."], ["What does `random.choice(my_list)` do?", "Returns a random item from the list."], ["How do you write a string that spans several lines (like ASCII art)?", "Use triple quotes: `'''...'''` or `\"\"\"...\"\"\"`."], ["If the player types \"2\", how do you use it to pull scissors out of `choices = [rock, paper, scissors]`?", "Convert it to an int first: `choices[int(player)]`"]]}, {"day": 5, "cards": [["What is a loop?", "Doing something over and over instead of writing the same code many times."], ["What does a for loop with a list do?", "Runs the indented body once for each item in the list, in order."], ["Write the for-loop pattern for a list named `fruits`.", "`for fruit in fruits:` then an indented body."], ["In `for fruit in fruits:`, what is `fruit`?", "The loop variable \u2014 it holds one list item at a time."], ["Does the loop variable hold the whole list?", "No. Each iteration it gets the next single item."], ["How many times does a for loop run over a list?", "Once per item in the list."], ["Where must the loop body sit?", "Indented under the `for` line."], ["What happens to code indented inside the for loop?", "It runs once for every item in the list."], ["What happens to code written at the same indent as `for` (outside the loop)?", "It runs once, after the loop finishes."], ["Can the body of a for loop have more than one statement?", "Yes. Every indented line runs for each item."], ["`fruits = [\"Apple\", \"Peach\", \"Pear\"]` then `for fruit in fruits: print(fruit)`. What prints?", "Apple, then Peach, then Pear (one per line)."], ["In the fruit pie example, why does both `print(fruit)` and `print(fruit + \" pie\")` run for Apple before Peach?", "Both lines are indented inside the loop, so the whole block runs for each item before moving on."], ["What does range() do in a for loop?", "It generates a sequence of numbers to loop over (not just lists)."], ["Does printing range(...) alone show the numbers?", "No. range() alone isn't useful when printed; use it with a for loop."], ["In `for number in range(1, 10):`, what numbers print?", "1 through 9 (end is exclusive)."], ["How do you make range include 10 starting from 1?", "`range(1, 11)` \u2014 end must be one past the last number you want."], ["What is the default step for range()?", "+1 (counts up by one each time)."], ["What does `range(1, 11, 3)` produce?", "1, 4, 7, 10."], ["How do you sum 1 through 100 with a for loop and range?", "`total = 0` then `for number in range(1, 101): total += number` (or `total = total + number`); print total \u2192 5050."], ["What does `total += number` mean?", "Same as `total = total + number` \u2014 add the current number into the running total."], ["How do you build a string one piece at a time in a loop?", "Start with an empty string, `password = \"\"`, then add a piece each pass: `password += random.choice(letters)`."], ["What's the difference between `letters[4]` and `random.choice(letters)`?", "`letters[4]` always gives the one item at index 4; `random.choice(letters)` gives one random item from the list."], ["How many times does `for i in range(5):` run, and what values does `i` take?", "5 times: i is 0, 1, 2, 3, 4 (starts at 0, stops before 5)."], ["Why doesn't `random.choice(letters[nr_letters])` give nr_letters random letters?", "`letters[nr_letters]` picks one item at that index, and one random.choice call returns just one thing. Use a loop: `for i in range(nr_letters):`."]]}, {"day": 6, "cards": [["How do you spot a function call in Python?", "A name followed by parentheses, e.g. print(), len(), my_function()."], ["Can you save a function's result in a variable?", "Yes. Example: num_char = len(\"Hello\") then print(num_char) gives 5."], ["What keyword starts a function definition?", "def"], ["Write the pattern to define a function named my_function.", "def my_function(): then an indented body."], ["What four pieces does a function definition need?", "def, a name, parentheses (), a colon :, then an indented body."], ["What is the difference between defining and calling a function?", "Define writes the recipe (def ...); call runs it (name())."], ["Why does defining a function alone print nothing when you run the file?", "def only stores the recipe. You must call the function with name() to run the body."], ["What happens when a function is called?", "The program jumps to the definition, runs the indented body top to bottom, then returns to where it was called and continues."], ["Why use functions?", "Less repetition (don't retype the same steps) and more readable code."], ["Write a turn_around function using turn_left().", "def turn_around(): then turn_left() twice (indented)."], ["How do you define turn_right() if only turn_left() exists?", "def turn_right(): then turn_left() three times."], ["In the square challenge, why define turn_right()?", "So you can write fewer, clearer lines (~8) instead of repeating turn_left() many times (~14)."], ["What makes a line part of a function's body?", "Indenting it (usually 4 spaces) under the def ...: line."], ["What happens to a non-indented line after a function definition?", "It is outside the function; it runs on its own when the file runs, not when the function is called."], ["How much indent for a line inside an if that is inside a function?", "Two levels \u2014 8 spaces (4 for the function + 4 for the if)."], ["What does PEP 8 recommend for indentation?", "Use spaces, 4 per indent level (not tabs)."], ["Can you mix tabs and spaces for indentation in Python 3?", "No. Python 3 does not allow mixing tabs and spaces in one file."], ["What File Explorer analogy fits indentation?", "Blocks are like folders; indented code lives \"inside\" the folder."], ["In def my_function(): then 4-space print(\"Hello\") then left-edge print(\"World\") \u2014 which line runs only when you call my_function()?", "print(\"Hello\") \u2014 print(\"World\") is outside and runs on its own."], ["What does a while loop do?", "Keeps repeating its indented block as long as a condition is True; stops when the condition is False."], ["When does a while loop check its condition?", "At the top, before each pass through the body."], ["In the Hurdle 1 counter example (start at 6, while > 0, jump then -= 1 and print), what prints and why does it stop?", "Prints 5,4,3,2,1,0 then stops because 0 > 0 is False."], ["What does x -= 1 mean?", "Shorthand for x = x - 1."], ["Write a while loop that jumps until the robot is on the flag (at_goal).", "while not at_goal(): then indented jump(). (not flips True/False; while at_goal() != True: also works but reads less like English.)"], ["When do you use for vs while?", "for when you know how many times / each item in a list or range; while when you repeat until a condition changes and don't know how many times."], ["What causes an infinite while loop, and how do you debug it?", "The condition never becomes False (e.g. while 5 > 3:). Stop the program; print the condition (or its variables) to see if it ever changes."], ["What is the right-hand rule for escaping the Reeborg maze?", "Keep a wall on your right: if right is clear, turn right and move; elif front is clear, move; else turn left. Repeat."], ["What outer loop drives the maze solution, and why while instead of for?", "while not at_goal(): \u2014 you don't know how many steps it will take, so you repeat until the robot reaches the flag."], ["Why did the maze robot loop forever in an open area with no walls nearby?", "right_is_clear() was always True, so it kept turning right and moving in a small square and never reached the goal (infinite loop)."], ["How do you fix the open-area infinite loop in the maze?", "Before the wall-following loop, walk straight until you hit a wall (while front_is_clear(): move()), then turn_left() so the wall is on the robot's right."]]}, {"day": 7, "cards": [["What does the in operator do?", "Gives True/False: is this item in that string or list? e.g. \"a\" in \"abyss\" is True; \"_\" not in display means no blanks are left."], ["How does a game_over flag drive the Hangman loop?", "Set game_over = False, loop with while not game_over:, and set game_over = True when the player wins or loses."], ["Why reset display = \"\" at the top of the while loop?", "So it's rebuilt fresh each turn. If you only set it once before the loop, every turn adds more letters on top and it keeps growing."], ["Why not write for guess in chosen_word: when guess holds the player's letter?", "The for loop overwrites its loop variable every pass, so the player's guess gets lost. Use a different name like letter."], ["if/elif vs separate ifs for win and lose checks?", "Only one branch of an if/elif chain runs. Independent checks (win, lose) need separate ifs so both get checked."], ["How do you stop a repeated wrong guess costing another life?", "Keep a guessed_letters list: check if guess in guessed_letters, only take a life when guess not in guessed_letters, and .append(guess) each turn."], ["How do you use a list that lives in another file?", "from hangman_words import word_list \u2014 then use word_list by its plain name."], ["What does stages[lives] do in Hangman?", "Picks the ASCII picture by list index. With 6 lives you get stages[6] (empty gallows); at 0 lives, stages[0] (full drawing)."]]}, {"day": 8, "cards": [["Why give a function inputs?", "So it can do the same steps with different data each call \u2014 same recipe, different ingredients."], ["How do you define a function that takes a name?", "def greet_with_name(name): then an indented body that uses name (e.g. print(f\"Hello {name}\"))."], ["What happens to the value when you call greet_with_name(\"Angela\")?", "\"Angela\" is stored in the parameter name for that call \u2014 like name = \"Angela\" inside the function."], ["Parameter vs argument?", "Parameter = the name in the def (name). Argument = the actual value passed in the call (\"Angela\")."], ["What does greet_with_name(\"Jack\") print?", "Hello Jack / How do you do Jack?"], ["How do you define a function with multiple parameters?", "Separate them with commas in the def: def greet_with(name, location):"], ["What does a positional argument mean?", "Matched to parameters by order \u2014 first arg \u2192 first param, second \u2192 second, etc."], ["What does greet_with(\"Nowhere\", \"Jack Bauer\") print if def is greet_with(name, location)?", "Hello Nowhere / What is it like in Jack Bauer? (swapped \u2014 order mismatch)"], ["How do keyword arguments work?", "Name each one in the call, e.g. greet_with(location=\"London\", name=\"Angela\"). Order doesn't matter because values go by name."], ["How does % 26 wrap the Caesar shift around?", "Add first, then wrap: (position + shift_amount) % 26. \"z\" (25) + 3 = 28, and 28 % 26 = 2, which is \"c\"."], ["Why must shift_amount *= -1 go above the for loop?", "Inside the loop it flips on every letter (back, forward, back...), so every other letter shifts the wrong way. Do once-only steps before the loop."], ["How do you pass spaces, numbers and symbols through the cipher unchanged?", "if letter not in alphabet: output_text += letter, else do the shift. .index() would crash on them otherwise."], ["How do you restart a whole program?", "reset = True, then while reset: ask the inputs, call the function, ask \"yes\" to go again, and set reset = False on \"no\"."]]}];
const QUIZZES=[{"day": 1, "questions": [{"q": "What does this print?\n\nfood = \"tacos\"\nprint(food)", "choices": ["food", "tacos", "\"tacos\"", "NameError"], "answer": 1, "explain": "No quotes around food, so Python looks up the variable and prints its value."}, {"q": "What is len(\"pizza\")?", "choices": ["4", "5", "6", "pizza"], "answer": 1, "explain": "Count every character: p-i-z-z-a = 5."}, {"q": "You forget the closing quote: print(\"Hello). Which error do you get?", "choices": ["NameError", "IndentationError", "SyntaxError", "TypeError"], "answer": 2, "explain": "A missing quote breaks Python's grammar, which is a SyntaxError."}, {"q": "What does print(\"Hello\" + \"John\") output?", "choices": ["Hello John", "HelloJohn", "Hello + John", "Error"], "answer": 1, "explain": "+ glues strings together exactly; it doesn't add a space."}, {"q": "Which variable name is valid?", "choices": ["user name", "2nd_place", "user_name", "print"], "answer": 2, "explain": "Use underscores instead of spaces, don't start with a number, and avoid built-in names like print."}, {"q": "In print(len(input(\"Name? \"))), which runs first?", "choices": ["print()", "len()", "input()", "They all run at once"], "answer": 2, "explain": "Python works inside out: input(), then len(), then print()."}, {"q": "What causes a NameError?", "choices": ["A missing quote", "Using a variable that was never defined (often a typo)", "A space at the start of a line", "Adding a string to a number"], "answer": 1, "explain": "Python doesn't recognize the name, usually because it's misspelled or was never created."}]}, {"day": 2, "questions": [{"q": "What is \"Hello\"[0]?", "choices": ["H", "e", "o", "Error"], "answer": 0, "explain": "Indexes start at 0, so [0] is the first character."}, {"q": "What does print(\"5\" + \"3\") output?", "choices": ["8", "53", "5 3", "TypeError"], "answer": 1, "explain": "Both are strings (in quotes), so + joins them."}, {"q": "Why does print(\"Letters: \" + len(name)) crash?", "choices": ["len() needs quotes", "You can't add a string and an int", "name isn't a string", "print can't take +"], "answer": 1, "explain": "len() returns an int. Wrap it in str() or use an f-string."}, {"q": "What is 7 // 2?", "choices": ["3.5", "3", "4", "1"], "answer": 1, "explain": "// is floor division: it drops the decimal part."}, {"q": "What is 2 + 3 * 4?", "choices": ["20", "14", "24", "9"], "answer": 1, "explain": "Multiplication happens before addition: 3 * 4 = 12, then + 2 = 14."}, {"q": "Your customer's tax rate is 8%. Which line correctly adds tax to materials?", "choices": ["materials * 8", "materials * 8 / 100", "materials * (8 / 100 + 1)", "materials + 8"], "answer": 2, "explain": "8 / 100 + 1 = 1.08. Multiplying by 1.08 adds 8% on top. Multiplying by 8 would make it 8 times as much."}, {"q": "price = 33.6. Which line prints 33.60?", "choices": ["print(round(price, 2))", "print(f\"{price:.2f}\")", "print(int(price))", "print(str(price))"], "answer": 1, "explain": "round() drops trailing zeros; :.2f always shows two decimals."}, {"q": "What does score += 5 do?", "choices": ["Sets score to 5", "Adds 5 to score", "Checks if score equals 5", "Error"], "answer": 1, "explain": "It's short for score = score + 5."}]}, {"day": 3, "questions": [{"q": "height = 120. What prints?\n\nif height > 120:\n    print(\"Ride!\")\nelse:\n    print(\"Too short\")", "choices": ["Ride!", "Too short", "Both", "Nothing"], "answer": 1, "explain": "> means strictly greater, so 120 isn't > 120. Use >= to include it."}, {"q": "Which line checks if age equals 18?", "choices": ["if age = 18:", "if age == 18:", "if age === 18:", "if age equals 18:"], "answer": 1, "explain": "= assigns a value; == compares two values."}, {"q": "What is 17 % 5?", "choices": ["3", "2", "3.4", "0"], "answer": 1, "explain": "5 goes into 17 three times (15), leaving 2."}, {"q": "Which condition is True only for even numbers?", "choices": ["number % 2 == 1", "number / 2 == 0", "number % 2 == 0", "number // 2 == 0"], "answer": 2, "explain": "Even numbers have no remainder when divided by 2."}, {"q": "What's missing here?\n\nif pipe_size >= 2\n    print(\"Use the big wrench\")", "choices": ["Quotes around 2", "A colon after the condition", "An else", "Parentheses around print"], "answer": 1, "explain": "Every if (and else) line needs a colon at the end."}, {"q": "How does Python know which lines belong inside an if block?", "choices": ["Curly braces", "They're on the same line", "Indentation", "The word end"], "answer": 2, "explain": "Lines indented under the if are inside it."}, {"q": "What does != mean?", "choices": ["Not equal to", "Equal to", "Greater than", "Assign"], "answer": 0, "explain": "!= is True when the two values are different."}, {"q": "age = 15. What prints?\n\nif age < 12:\n    print(\"$5\")\nelif age <= 18:\n    print(\"$7\")\nelse:\n    print(\"$12\")", "choices": ["$5", "$7", "$12", "$7 and $12"], "answer": 1, "explain": "15 isn't < 12, so Python moves to the elif. 15 <= 18 is True, so it prints $7 and skips the else."}, {"q": "height = 110. What prints?\n\nif height >= 120:\n    age = int(input(\"Age? \"))\n    if age <= 18:\n        print(\"$7\")\n    else:\n        print(\"$12\")\nelse:\n    print(\"Too short\")", "choices": ["$7", "$12", "Too short", "It asks for your age first"], "answer": 2, "explain": "The outer check fails, so Python never goes into the nested block. It goes straight to the outer else."}, {"q": "age = 10. What prints?\n\nif age <= 18:\n    print(\"$7\")\nelif age < 12:\n    print(\"$5\")\nelse:\n    print(\"$12\")", "choices": ["$5", "$7", "$5 and $7", "$12"], "answer": 1, "explain": "10 <= 18 is True, so Python runs the first block and skips the rest. That's why the under-12 check has to come first."}, {"q": "bill = 12. The user types y. What prints?\n\nwants_photo = input(\"Photo? y/n \")\nif wants_photo == \"y\":\n    bill += 3\nprint(f\"Bill: ${bill}\")", "choices": ["Bill: $12", "Bill: $15", "Bill: $3", "Nothing prints"], "answer": 1, "explain": "The condition is True, so bill += 3 makes it 15. The print isn't indented, so it runs either way."}, {"q": "Same code, but the user types n. What prints?\n\nwants_photo = input(\"Photo? y/n \")\nif wants_photo == \"y\":\n    bill += 3\nprint(f\"Bill: ${bill}\")", "choices": ["Bill: $12", "Bill: $15", "An error, because there's no else", "Nothing prints"], "answer": 0, "explain": "The if is skipped, so bill stays 12. You don't need an else when nothing should happen."}, {"q": "x = 15. How many lines print?\n\nif x > 10:\n    print(\"A\")\nif x > 5:\n    print(\"B\")\nif x > 1:\n    print(\"C\")", "choices": ["1 (just A)", "2", "3 (A, B, and C)", "0"], "answer": 2, "explain": "These are separate ifs, so Python checks each one. All three are True, so A, B, and C all print."}, {"q": "Same check, but written with elif. x = 15. What prints?\n\nif x > 10:\n    print(\"A\")\nelif x > 5:\n    print(\"B\")\nelif x > 1:\n    print(\"C\")", "choices": ["A", "A, B, and C", "C", "B"], "answer": 0, "explain": "With elif, Python stops at the first True condition, so only A prints."}, {"q": "a = 12. What is the result?\n\na > 10 and a < 13", "choices": ["True", "False", "12", "Error"], "answer": 0, "explain": "12 > 10 is True and 12 < 13 is True. Both are True, so and gives True."}, {"q": "a = 12. What is the result?\n\na > 15 or a < 10", "choices": ["True", "False"], "answer": 1, "explain": "Both sides are False. or is only False when both are False."}, {"q": "What is not (5 > 3)?", "choices": ["True", "False", "5", "Error"], "answer": 1, "explain": "5 > 3 is True, and not flips it to False."}, {"q": "Which condition catches ages 45 to 55, including 45 and 55?", "choices": ["age > 45 and age < 55", "age >= 45 or age <= 55", "age >= 45 and age <= 55", "not age < 45"], "answer": 2, "explain": "You need both conditions to be true, so use and with >= and <=. Using or would be true for every age."}, {"q": "A plumbing job is urgent if it's a burst pipe OR there's no water. Which line is right?", "choices": ["if burst_pipe and no_water:", "if burst_pipe or no_water:", "if not burst_pipe:", "if burst_pipe == no_water:"], "answer": 1, "explain": "Either one alone makes the job urgent, so use or. and would require both at once."}]}, {"day": 4, "questions": [{"q": "What can random.randint(1, 6) return?", "choices": ["1 through 5", "1 through 6", "0 through 6", "Any decimal between 1 and 6"], "answer": 1, "explain": "randint includes both ends, so 1 and 6 can both come up."}, {"q": "Which value can random.random() NEVER return?", "choices": ["0", "0.5", "0.999", "1"], "answer": 3, "explain": "random.random() includes 0 but stops just below 1."}, {"q": "What's wrong with this code?\n\nnumber = random.randint(1, 10)\nprint(number)", "choices": ["randint should be RandInt", "It's missing import random at the top", "The range should be 0 to 10", "Nothing"], "answer": 1, "explain": "You need import random before Python knows what random means. Without it you get a NameError."}, {"q": "What prints?\n\ntools = [\"wrench\", \"plunger\", \"snake\"]\nprint(tools[1])", "choices": ["wrench", "plunger", "snake", "Error"], "answer": 1, "explain": "Index 0 is wrench, so index 1 is plunger."}, {"q": "jobs = [\"drain\", \"leak\"]. Which line adds \"water heater\" to the end?", "choices": ["jobs + \"water heater\"", "jobs[2] = \"water heater\"", "jobs.append(\"water heater\")", "jobs.extend(\"water heater\")"], "answer": 2, "explain": "append() adds one item to the end. jobs[2] = ... would crash because there's no index 2 yet."}, {"q": "Which line safely prints the last item in tools?", "choices": ["print(tools[len(tools)])", "print(tools[len(tools) - 1])", "print(tools[len(tools) + 1])", "print(tools[0])"], "answer": 1, "explain": "The last index is always len - 1. tools[-1] works too. Using len(tools) alone causes an IndexError."}, {"q": "What's wrong with this line?\n\nchoice = input(\"Left or Right? \".lower())", "choices": ["input() can't take a prompt", ".lower() is on the prompt string, not on what input() returns", "You need import string first", "Nothing"], "answer": 1, "explain": "The dot attaches to whatever sits right before it. Here that's the prompt text. Put .lower() after the whole input(...) call so it lowercases the player's answer."}, {"q": "Why does this fail when the user types 65?\n\nage = input(\"Age? \")\nif age >= 65:\n    print(\"Senior\")", "choices": ["65 is too big for a comparison", "input() returns a string, so you must convert before comparing to a number", "You need elif instead of if", "Nothing, it works"], "answer": 1, "explain": "input() always returns a string. Convert with int(age) or int(input(...)) before a numeric comparison."}]}, {"day": 5, "questions": [{"q": "What prints?\n\ntools = [\"wrench\", \"plunger\", \"snake\"]\nfor tool in tools:\n    print(tool)", "choices": ["wrench, plunger, snake (one per line)", "[\"wrench\", \"plunger\", \"snake\"] three times", "tool, tool, tool", "Only snake"], "answer": 0, "explain": "The loop variable tool holds one item at a time, so each item prints once, in order."}, {"q": "How many times does \"Done\" print?\n\njobs = [\"drain\", \"leak\", \"heater\"]\nfor job in jobs:\n    print(job)\nprint(\"Done\")", "choices": ["0", "1", "3", "4"], "answer": 1, "explain": "print(\"Done\") is not indented, so it's outside the loop and runs once after the loop finishes."}, {"q": "How many times does \"Done\" print now?\n\njobs = [\"drain\", \"leak\", \"heater\"]\nfor job in jobs:\n    print(job)\n    print(\"Done\")", "choices": ["0", "1", "3", "6"], "answer": 2, "explain": "Now print(\"Done\") is indented inside the loop, so it runs once per item: 3 times."}, {"q": "What's the last number printed?\n\nfor number in range(1, 10):\n    print(number)", "choices": ["1", "9", "10", "11"], "answer": 1, "explain": "The end of range is exclusive. range(1, 10) stops before 10, so the last number is 9."}, {"q": "What prints?\n\nfor number in range(0, 10, 3):\n    print(number)", "choices": ["0 3 6 9", "3 6 9", "0 3 6", "1 4 7 10"], "answer": 0, "explain": "Start at 0 and step by 3: 0, 3, 6, 9. The next would be 12, which is past the end."}, {"q": "What prints?\n\ntotal = 0\nfor price in [100, 250, 75]:\n    total += price\nprint(total)", "choices": ["75", "100", "425", "[100, 250, 75]"], "answer": 2, "explain": "total is an accumulator: 0 + 100 = 100, + 250 = 350, + 75 = 425."}, {"q": "nr_letters is 4. How many letters end up in password?\n\npassword = \"\"\nfor i in range(nr_letters):\n    password += random.choice(letters)", "choices": ["1", "3", "4", "5"], "answer": 2, "explain": "range(4) runs 4 times (i = 0, 1, 2, 3), and each pass adds one random letter."}, {"q": "letters = [\"a\", \"b\", \"c\", \"d\", \"e\"] and nr_letters is 3. What does this give?\n\nletters[nr_letters]", "choices": ["3 random letters", "\"d\" (one item at index 3)", "\"c\"", "An IndexError"], "answer": 1, "explain": "Square brackets grab one item at that position. Index 3 is \"d\". To get 3 random letters you need a loop with random.choice."}]}, {"day": 6, "questions": [{"q": "What is the difference between these two lines?\n\ndef fix_leak():\nfix_leak()", "choices": ["They do the same thing", "The first defines (writes the recipe); the second calls (runs it)", "The first calls the function; the second defines it", "The second line is an error"], "answer": 1, "explain": "def writes the recipe. The name plus parentheses runs it."}, {"q": "What prints when you run this file?\n\ndef greet():\n    print(\"Hello\")\n    print(\"Bye\")", "choices": ["Hello then Bye", "Nothing", "greet", "An error"], "answer": 1, "explain": "def only stores the recipe. Nothing runs until you call greet()."}, {"q": "What prints when you run this file?\n\ndef tools():\n    print(\"wrench\")\n    if 3 > 5:\n        print(\"plunger\")\n    print(\"tape\")\nprint(\"done\")\ntools()", "choices": ["wrench, plunger, tape, done", "done, wrench, tape", "wrench, tape, done", "done, wrench, plunger, tape"], "answer": 1, "explain": "print(\"done\") is outside the function and runs first. Then tools() runs its body: wrench, skip plunger (it's inside the if, and 3 > 5 is False), then tape."}, {"q": "What does this print, and why does it stop?\n\ncount = 3\nwhile count > 0:\n    count -= 1\n    print(count)", "choices": ["3, 2, 1 \u2014 stops when count is 0", "2, 1, 0 \u2014 stops because 0 > 0 is False", "3, 2, 1, 0 \u2014 stops after printing 0", "It never stops"], "answer": 1, "explain": "count drops by 1 before each print, so it prints 2, 1, 0. Then the check 0 > 0 is False and the loop ends."}, {"q": "What does this Reeborg code do?\n\nwhile not at_goal():\n    move()", "choices": ["Moves once, then stops", "Never moves, because at_goal() starts False", "Keeps moving until the robot is on the goal", "Moves exactly as many times as there are squares in the world"], "answer": 2, "explain": "not flips the check: keep looping while you are NOT at the goal. Once at_goal() is True, not at_goal() is False and the loop stops."}, {"q": "You need to check pressure on each of 5 fittings in a list. Later, you need to keep pumping until a tank reads empty, but you don't know how long that takes. Which loops fit best?", "choices": ["while for the fittings, for for the tank", "for for the fittings, while for the tank", "for for both", "while for both, always"], "answer": 1, "explain": "for = each item in a list or a known count. while = repeat until a condition changes when you don't know how many times."}, {"q": "Why does this loop never stop?\n\ngallons = 10\nwhile gallons > 0:\n    print(gallons)", "choices": ["gallons > 0 is always False", "print() can't be used in a while loop", "gallons never changes, so gallons > 0 stays True forever", "The loop needs a for instead"], "answer": 2, "explain": "Nothing inside the loop changes gallons. Add something like gallons -= 1 so the condition can eventually become False."}, {"q": "In the maze, the robot starts in an open area with no walls nearby and runs the right-hand rule loop. What goes wrong, and what's a fix?\n\nwhile not at_goal():\n    if right_is_clear():\n        turn_right()\n        move()\n    elif front_is_clear():\n        move()\n    else:\n        turn_left()", "choices": ["Nothing goes wrong; the right-hand rule always works", "It crashes because turn_right() isn't built in, so delete it", "Right is always clear, so it circles a small square forever; first walk straight to a wall, then turn_left(), so a wall is on its right", "It moves too fast; add more move() calls"], "answer": 2, "explain": "With nothing to hug, right_is_clear() is always True, so it loops in a square. Walking to a wall and turning left puts a wall on the right before the loop starts."}]}, {"day": 7, "questions": [{"q": "What prints?\n\nprint(\"t\" in \"tee\")\nprint(\"x\" in [\"elbow\", \"tee\"])", "choices": ["True then True", "True then False", "False then True", "An error"], "answer": 1, "explain": "\"t\" is a letter in \"tee\". In a list, in checks whole items, and \"x\" isn't an item."}, {"q": "How many times does \"Guess!\" print?\n\ngame_over = False\nturns = 0\nwhile not game_over:\n    print(\"Guess!\")\n    turns += 1\n    if turns == 3:\n        game_over = True", "choices": ["0", "2", "3", "Forever"], "answer": 2, "explain": "Three passes run. After the third, game_over is True, so not game_over is False and the loop stops."}, {"q": "The player typed \"a\". What prints?\n\nguess = \"a\"\nfor guess in \"pipe\":\n    print(\"checking\")\nprint(guess)", "choices": ["a", "pipe", "e", "p"], "answer": 2, "explain": "The for loop overwrites guess each pass. It ends holding the last letter, \"e\". Your typed letter is gone, so use a different loop name like letter."}, {"q": "What prints on the second pass?\n\ndisplay = \"\"\nfor turn in range(2):\n    for letter in \"ab\":\n        display += \"_\"\n    print(display)", "choices": ["__", "____", "_", "ab"], "answer": 1, "explain": "display was only reset once, before the loop, so turn 2 adds two more blanks: ____. Put display = \"\" inside the outer loop."}, {"q": "What prints?\n\nlives = 0\nwon = True\nif won:\n    print(\"You win!\")\nelif lives == 0:\n    print(\"You lose!\")", "choices": ["You win!", "You lose!", "You win! then You lose!", "Nothing"], "answer": 0, "explain": "Only one branch of an if/elif chain runs. The first one matched, so the elif is skipped even though lives == 0 is true."}, {"q": "Which fix makes BOTH checks run every turn?", "choices": ["Use two separate if statements", "Add another elif", "Swap the order inside the elif chain", "Use else instead of elif"], "answer": 0, "explain": "Separate ifs are each checked on their own. Use elif only when you want exactly one choice."}, {"q": "The player guesses \"z\" (wrong) twice. How many lives are left?\n\nlives = 6\nguessed_letters = []\nfor guess in [\"z\", \"z\"]:\n    if guess not in \"drain\" and guess not in guessed_letters:\n        lives -= 1\n    guessed_letters.append(guess)\nprint(lives)", "choices": ["4", "5", "6", "0"], "answer": 1, "explain": "The first \"z\" costs a life and goes into guessed_letters. The second \"z\" is already in the list, so no life is lost: 5."}, {"q": "stages holds 7 pictures. stages[0] is the full hanged man and stages[6] is the empty gallows. With lives = 2, which picture shows?\n\nprint(stages[lives])", "choices": ["The third picture from the start (stages[2])", "The second picture (stages[1])", "The empty gallows", "An error"], "answer": 0, "explain": "Lists count from 0, so stages[2] is the third item. Fewer lives means a lower index and more of the drawing."}]}, {"day": 8, "questions": [{"q": "Decoding \"de\" with a shift of 3 gives \"ah\" instead of \"ab\". What's wrong?\n\nfor letter in original_text:\n    if encode_or_decode == \"decode\":\n        shift_amount *= -1\n    ...", "choices": ["The % 26 is missing", "The sign flip is inside the for loop, so it flips on every letter", "The shift should be 26", "alphabet is in the wrong order"], "answer": 1, "explain": "Inside the loop the shift goes -3, then +3, then -3... so every other letter goes the wrong way. Flip it once, above the loop."}, {"q": "In this code, which is the parameter and which is the argument?\n\ndef fix_leak(pipe):\n    print(f\"Fixing the {pipe}\")\n\nfix_leak(\"elbow\")", "choices": ["pipe is the parameter, \"elbow\" is the argument", "\"elbow\" is the parameter, pipe is the argument", "Both are parameters", "fix_leak is the parameter, \"elbow\" is the argument"], "answer": 0, "explain": "The parameter is the name in the def (the empty slot). The argument is the actual value you pass in the call."}, {"q": "What prints?\n\ndef greet_with(name, location):\n    print(f\"{name} lives in {location}\")\n\ngreet_with(\"Fresno\", \"John\")", "choices": ["John lives in Fresno", "Fresno lives in John", "An error, because the order is wrong", "name lives in location"], "answer": 1, "explain": "Positional arguments match by order: name gets \"Fresno\" and location gets \"John\". Python doesn't know it's nonsense."}, {"q": "Which call prints \"John lives in Fresno\" with the same function?\n\ndef greet_with(name, location):\n    print(f\"{name} lives in {location}\")", "choices": ["greet_with(\"Fresno\", \"John\")", "greet_with(location=\"Fresno\", name=\"John\")", "greet_with(name, location)", "greet_with(\"John\" + \"Fresno\")"], "answer": 1, "explain": "Keyword arguments go to the parameter you name, so order doesn't matter."}, {"q": "What prints?\n\nprint(2 + 25 % 26)", "choices": ["1", "27", "25", "An error"], "answer": 1, "explain": "% runs before +, just like *. So it's 2 + 25 = 27. Write (2 + 25) % 26 to get 1."}, {"q": "alphabet is the list of 26 lowercase letters. You want the position of \"c\" so you can shift it. Which line is right?\n\nletter = \"c\"\nshift_amount = 3", "choices": ["alphabet.index(shift_amount)", "alphabet.index(letter)", "alphabet[letter]", "alphabet.index(3)"], "answer": 1, "explain": ".index() takes the value you're looking for (the letter) and gives back its position. The shift is a count you add afterward."}, {"q": "Which line gives the shifted letter and wraps \"z\" + 3 around to \"c\"?\n\nposition = alphabet.index(letter)", "choices": ["alphabet[position + shift_amount % 26]", "alphabet[(position + shift_amount) % 26]", "alphabet[position] + shift_amount", "alphabet.index(position + shift_amount)"], "answer": 1, "explain": "Add first, then wrap: (25 + 3) % 26 is 2, which is \"c\". Without the parentheses, % only applies to shift_amount and you go past the end of the list."}, {"q": "What does this return for \"hi 5!\" with a shift of 1?\n\nfor letter in text:\n    if letter not in alphabet:\n        output += letter\n    else:\n        output += alphabet[(alphabet.index(letter) + 1) % 26]", "choices": ["\"ij 6!\"", "\"ij 5!\"", "\"ij\"", "An error on the space"], "answer": 1, "explain": "The space, 5 and ! aren't in alphabet, so they're added as-is. Only letters get shifted."}]}];
let sel=new Set(['all']),list=[],i=0;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/ \/ (?=<code>)/g,'<br>');
function buildDays(){const d=document.getElementById('days');d.innerHTML='';
 const mk=(label,key)=>{const b=document.createElement('button');b.textContent=label;b.className=sel.has(key)?'on':'';
  b.onclick=()=>{if(key==='all'){sel=new Set(['all'])}else{sel.delete('all');sel.has(key)?sel.delete(key):sel.add(key);if(!sel.size)sel.add('all')}buildDays();load()};d.appendChild(b)};
 mk('All days','all');DECKS.forEach(x=>mk('Day '+x.day,x.day));}
function load(){list=[];DECKS.forEach(x=>{if(sel.has('all')||sel.has(x.day))x.cards.forEach(c=>list.push({day:x.day,q:c[0],a:c[1]}))});i=0;show();}
function show(){const c=document.getElementById('card');c.classList.remove('flipped');
 if(!list.length){q.innerHTML='No cards yet';a.innerHTML='';return}
 const k=list[i];setTimeout(()=>{a.innerHTML=fmt(k.a)},150);q.innerHTML=fmt(k.q);
 tagF.textContent=tagB.textContent='Day '+k.day;
 count.textContent=`Card ${i+1} of ${list.length}`;bar.style.width=((i+1)/list.length*100)+'%';}
function flip(){document.getElementById('card').classList.toggle('flipped')}
function move(n){if(!list.length)return;i=(i+n+list.length)%list.length;show()}
function shuffle(){for(let j=list.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[list[j],list[r]]=[list[r],list[j]]}i=0;show()}
document.addEventListener('keydown',e=>{if(mode!=='f')return;if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key===' '){e.preventDefault();flip()}else if(e.key.toLowerCase()==='s')shuffle()});
let mode='f',qd=null,qi=0,qs=[],picked=null;
function tab(m){mode=m;tabF.className=m==='f'?'on':'';tabQ.className=m==='q'?'on':'';
 flashView.classList.toggle('hidden',m!=='f');days.classList.toggle('hidden',m!=='f');quizView.classList.toggle('hidden',m!=='q');
 sub.textContent=m==='f'?'Click the card (or press Space) to flip it':'Pick a day and test yourself';if(m==='q')quizDays();}
function best(d){return localStorage.getItem('best-day-'+d)}
function quizDays(){qdays.innerHTML='';if(!QUIZZES.length){quiz.innerHTML='<div class="qtext">No quizzes yet.</div>';return}
 QUIZZES.forEach(z=>{const b=document.createElement('button');b.className=qd===z.day?'on':'';
  const bs=best(z.day);b.innerHTML='Day '+z.day+(bs?'<span class="best">best '+bs+'</span>':'');b.onclick=()=>startQuiz(z.day);qdays.appendChild(b)});
 if(qd===null)startQuiz(QUIZZES[QUIZZES.length-1].day);}
function startQuiz(d){qd=d;qi=0;qs=[];quizDays();renderQ();}
function qtext(s){const parts=s.split('\n\n');let h='<div>'+fmt(parts[0])+'</div>';if(parts.length>1)h+='<pre>'+esc(parts.slice(1).join('\n\n'))+'</pre>';return h}
function renderQ(){const z=QUIZZES.find(x=>x.day===qd),Q=z.questions;picked=null;
 if(qi>=Q.length)return results(z);const k=Q[qi];
 let h=`<div class="qhead"><span>Day ${qd} pop quiz</span><span>Question ${qi+1} of ${Q.length}</span></div><div class="qtext">${qtext(k.q)}</div>`;
 k.choices.forEach((c,n)=>h+=`<button class="choice" onclick="pick(${n})">${String.fromCharCode(65+n)}. ${esc(c)}</button>`);
 h+='<div id="fb"></div><div class="qnav"><button id="nxt" class="hidden" onclick="qi++;renderQ()">Next &rarr;</button></div>';quiz.innerHTML=h;}
function pick(n){if(picked!==null)return;picked=n;const k=QUIZZES.find(x=>x.day===qd).questions[qi],ok=n===k.answer;
 const bs=quiz.querySelectorAll('.choice');bs.forEach((b,j)=>{b.disabled=true;if(j===k.answer)b.classList.add('right');else if(j===n)b.classList.add('wrong')});
 qs.push({q:k.q,ok,yours:k.choices[n],right:k.choices[k.answer]});
 fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct!':'Not quite.'}</b> ${fmt(k.explain||'')}</div>`;nxt.classList.remove('hidden');}
function results(z){const right=qs.filter(x=>x.ok).length,tot=qs.length,pct=right+'/'+tot;
 const prev=best(z.day);if(!prev||right>parseInt(prev))localStorage.setItem('best-day-'+z.day,pct);
 const misses=qs.filter(x=>!x.ok);let h=`<div class="qhead"><span>Day ${z.day} results</span><span></span></div><div class="score">${pct}</div>`;
 h+=`<div style="text-align:center;color:var(--muted);margin:6px 0 16px">${right===tot?'Perfect score!':right>=tot*.7?'Nice work. Review the misses below.':'Worth another pass on these.'}</div>`;
 misses.forEach(m=>h+=`<div class="miss">${qtext(m.q)}<div style="margin-top:6px">Your answer: <b>${esc(m.yours)}</b><br>Correct: <b>${esc(m.right)}</b></div></div>`);
 h+='<div class="qnav"><button class="ghost" onclick="copyRes()">Copy results for Practice Coach</button><button onclick="startQuiz(qd)">Retake</button></div>';
 quiz.innerHTML=h;quizDays();}
function copyRes(){const right=qs.filter(x=>x.ok).length;let s=`Day ${qd} pop quiz: ${right}/${qs.length}\n`;
 qs.filter(x=>!x.ok).forEach(m=>s+=`MISSED: ${m.q.replace(/\n+/g,' | ')} -> I said "${m.yours}", correct is "${m.right}"\n`);
 navigator.clipboard.writeText(s).then(()=>alert('Copied! Paste it into the chat with Practice Coach.'),()=>prompt('Copy this:',s));}
buildDays();load();
</script></body></html>
