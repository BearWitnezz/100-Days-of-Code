 also want each value."}, {"q": "What prints?\n\nnested_list = [\"A\", \"B\", [\"C\", \"D\"]]\nprint(nested_list[2][1])", "choices": ["B", "C", "D", "An error"], "answer": 2, "explain": "nested_list[2] is the inner list [\"C\", \"D\"], and [1] picks D."}, {"q": "Which line prints Stuttgart?\n\ntravel_log = {\n    \"Germany\": {\n        \"cities_visited\": [\"Berlin\", \"Hamburg\", \"Stuttgart\"],\n    },\n}", "choices": ["travel_log[\"Germany\"][2]", "travel_log[\"Germany\"][\"cities_visited\"][2]", "travel_log[\"cities_visited\"][\"Germany\"][2]", "travel_log[2][\"Germany\"][\"cities_visited\"]"], "answer": 1, "explain": "Go one layer at a time: country key, then inner key, then list index."}, {"q": "How do you add a new entry or change an existing one?\n\nprogramming_dictionary = {\"Bug\": \"An error...\"}", "choices": ["programming_dictionary.append(\"Loop\", \"...\")", "programming_dictionary[\"Loop\"] = \"The action of doing something over and over again.\"", "programming_dictionary.add(\"Loop\")", "programming_dictionary + {\"Loop\": \"...\"}"], "answer": 1, "explain": "Same syntax for both: dict[key] = value. If the key exists, the value is replaced; if not, a new entry is created."}, {"q": "This is meant to find the highest bid, but it prints a total. What's wrong?\n\nbids = {\"Ann\": 50, \"Bob\": 30}\nhighest_bid = 0\nfor bidder in bids:\n    highest_bid += bids[bidder]\nprint(highest_bid)", "choices": ["It should loop over bids.values()", "+= adds every bid; it should compare with if bids[bidder] > highest_bid:", "highest_bid should start at \"\"", "bidder holds the bid, not the name"], "answer": 1, "explain": "+= always adds, so you get 80. To keep the biggest, compare (if bids[bidder] > highest_bid:) and then set highest_bid = bids[bidder]."}, {"q": "Only some bids end up in the dictionary. Where should bids[name] = price go?\n\nwhile bidding:\n    name = input(\"Name? \")\n    price = int(input(\"Bid? \"))\n    other = input(\"Other bidders? \")\n    if other == \"no\":\n        bidding = False\n    else:\n        bids[name] = price", "choices": ["Inside the else, where it is now", "Inside the if, before bidding = False", "In the main body of the loop, before the if/else, so it runs for every bidder", "After the while loop ends"], "answer": 2, "explain": "Inside one branch it only runs sometimes; here the last bidder (who says \"no\") is never saved. Put it in the loop body so every pass saves a bid."}]}, {"day": 10, "questions": [{"q": "What is output?\n\ndef my_function():\n    result = 3 * 2\n    return result\n\noutput = my_function()", "choices": ["None", "6", "\"result\"", "3 * 2 as text"], "answer": 1, "explain": "return hands back the value of result (6), and that value replaces the call my_function()."}, {"q": "What does this print?\n\ndef add(a, b):\n    print(a + b)\n\ntotal = add(2, 3)\nprint(total)", "choices": ["5 then 5", "5 then None", "None then 5", "An error"], "answer": 1, "explain": "add() prints 5 but returns nothing, so total is None. print only shows a value; return is what hands it back for your code to store."}, {"q": "What does this print?\n\nprint(\"aNGela YU\".title())", "choices": ["ANGELA YU", "angela yu", "Angela Yu", "AnGeLa Yu"], "answer": 2, "explain": ".title() capitalizes the first letter of each word and lowercases the rest, giving back a new string."}, {"q": "What does this print?\n\ndef function_1(text):\n    return text + text\n\ndef function_2(text):\n    return text.title()\n\nprint(function_2(function_1(\"hello\")))", "choices": ["HelloHello", "Hellohello", "hellohello", "Hello hello"], "answer": 1, "explain": "The inner call runs first: function_1 gives \"hellohello\". Then .title() sees one word and capitalizes only its first letter: \"Hellohello\"."}, {"q": "Which line stores the number of characters in \"Angela\" so you can use it later?", "choices": ["len(\"Angela\")", "num_char = print(len(\"Angela\"))", "num_char = len(\"Angela\")", "num_char == len(\"Angela\")"], "answer": 2, "explain": "len() returns 6 and = stores it. print() returns None, so the second option stores None, and == only compares."}, {"q": "What does this print?\n\ndef format_name(f_name, l_name):\n    return f\"{f_name.title()} {l_name.title()}\"\n    print(\"Done\")\n\nprint(format_name(\"john\", \"SMITH\"))", "choices": ["Done then John Smith", "John Smith then Done", "John Smith", "john SMITH"], "answer": 2, "explain": "return ends the function right away, so the print(\"Done\") line after it never runs."}, {"q": "This should return the highest bid but returns a total. Which fix is right?\n\ndef find_highest(bids):\n    highest = 0\n    for bidder in bids:\n        highest += bids[bidder]\n    return highest", "choices": ["Change return highest to print(highest)", "Replace the += line with: if bids[bidder] > highest: highest = bids[bidder]", "Start highest at \"\"", "Move return highest inside the for loop"], "answer": 1, "explain": "+= adds every bid together. To keep the biggest, compare and replace. And keep return after the loop, or it would stop on the first bidder."}, {"q": "What does this print?\n\ndef check(name):\n    if name == \"\":\n        return\n    return name.title()\n\nprint(check(\"\"))", "choices": ["Nothing at all", "None", "An error", "\"\""], "answer": 1, "explain": "The empty return ends the function early and gives back None, so print shows None."}, {"q": "Where does a docstring go?", "choices": ["Above the def line", "On the first indented line right after the def line", "At the end of the function", "Anywhere inside the function"], "answer": 1, "explain": "The docstring is the first indented line after def ...:, written in triple quotes."}, {"q": "What does this print?\n\ndef is_leap(year):\n    if year % 4 == 0:\n        return True\n    return False\n\nprint(is_leap(2024))", "choices": ["False", "True", "None", "2024"], "answer": 1, "explain": "2024 % 4 == 0, so the first return runs and ends the function with True."}, {"q": "math = {\"+\": add, \"-\": subtract}. What does math[\"+\"](2, 3) do?", "choices": ["Prints \"+\"", "Looks up the add function and calls it with 2 and 3, giving 5", "Gives a KeyError", "Adds \"+\" to 2 and 3"], "answer": 1, "explain": "The key gets the function, then (2, 3) calls it. Same idea as the calculator."}, {"q": "In the calculator, why add result = new_result at the end of each loop pass?", "choices": ["To print the answer", "So the next calculation builds on the latest answer", "To stop the loop", "It isn't needed"], "answer": 1, "explain": "Without it, every pass keeps using the old result (5+3, *2, *2 gives 16 instead of 32)."}]}, {"day": 11, "questions": [{"q": "What does this do?\n\nuser_cards = [5, 6]\nuser_cards += 7", "choices": ["Adds 7 to the end of the list", "Gives TypeError: 'int' object is not iterable", "Adds 7 to each card", "Makes the list [12]"], "answer": 1, "explain": "+= on a list is shorthand for extend(), which needs a list. For one item use append()."}, {"q": "What does this print?\n\nprint(sum([11, 10]))", "choices": ["21", "[11, 10]", "2", "Blackjack"], "answer": 0, "explain": "sum() adds up all the items of an iterable."}, {"q": "Which check is a real Blackjack?", "choices": ["sum(cards) == 21", "sum(cards) == 21 and len(cards) == 2", "sum(cards) > 21", "11 in cards"], "answer": 1, "explain": "Blackjack is 21 on exactly two cards (an Ace and a 10). Drawing to 21 later doesn't count."}, {"q": "cards = [11, 5, 10]. Which lines fix the Ace when the score is over 21?", "choices": ["cards.remove(11) then cards.append(1)", "cards.remove(10)", "cards.append(11)", "sum(cards) = 21"], "answer": 0, "explain": "remove(11) deletes the first 11, then append(1) adds the Ace back as a 1. Recalculate the score after."}, {"q": "cards = [11, 11, 9]. What does cards.index(11) give?", "choices": ["0", "1", "2", "[0, 1]"], "answer": 0, "explain": ".index() finds only the FIRST match, so the second 11 is missed."}, {"q": "Why do you get an error if you call calculate_score(cards) on a line above its def?", "choices": ["Python reads top to bottom, so the function isn't defined yet", "The function needs a return", "cards must be a string", "Functions can't be called twice"], "answer": 0, "explain": "A function must be defined above the line that calls it."}, {"q": "The dealer loop is `while computer_score != 0 and computer_score < 17:`. Why the != 0 part?", "choices": ["0 means Blackjack, and 0 is less than 17, so without it the dealer would keep drawing", "0 means the dealer busted", "It stops the loop at 17", "It's not needed"], "answer": 0, "explain": "Blackjack is signalled by 0. Without the check, the dealer would draw on a Blackjack."}, {"q": "Why start computer_score = -1 before the loop instead of 0?", "choices": ["0 already means Blackjack", "-1 is faster", "0 gives a SyntaxError", "Python needs a negative number"], "answer": 0, "explain": "0 is the Blackjack signal, so use an obviously-wrong value like -1. It also makes debugging easier."}, {"q": "In compare(), the first branches are `if u_score == c_score` then `elif c_score == 0`. Why is the Blackjack check above `u_score > c_score`?", "choices": ["if/elif/else is checked top to bottom and the first match returns, so order matters", "Python sorts conditions", "It makes the code run faster", "It doesn't matter"], "answer": 0, "explain": "A Blackjack score of 0 would lose a greater-than comparison, so it must be checked first."}, {"q": "What does this print?\n\nx = 5\nif x > 3:\n    print(\"A\")\nif x > 1:\n    print(\"B\")", "choices": ["A", "B", "A then B", "Nothing"], "answer": 2, "explain": "Two separate ifs both run. With elif only the first match would run, so it would print just A."}, {"q": "What does 'Shadows the name from outer scope' warn about?", "choices": ["A function parameter reuses the name of an outer variable like user_score", "The variable is never used", "The loop never ends", "The function has no return"], "answer": 0, "explain": "Re
