<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Days of Code: Flashcards</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--accent:#38bdf8;--accent2:#a78bfa;--text:#e2e8f0;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at top,#1e3a5f,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{margin:28px 0 4px;font-size:1.8rem;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-bottom:18px}
.days{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;max-width:900px}
.days button,.controls button{background:var(--panel);color:var(--text);border:1px solid #334155;border-radius:999px;padding:8px 16px;font-size:.95rem;cursor:pointer;transition:.15s}
.days button:hover,.controls button:hover{border-color:var(--accent)}
.days button.on{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:600}
.scene{width:min(640px,92vw);height:360px;perspective:1200px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:36px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.35rem;line-height:1.5;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.front{background:linear-gradient(135deg,#1e293b,#273449);border:2px solid var(--accent)}
.back{background:linear-gradient(135deg,#2e1065,#1e293b);border:2px solid var(--accent2);transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:20px;font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.hint{position:absolute;bottom:14px;font-size:.8rem;color:var(--muted)}
code{background:rgba(148,163,184,.18);color:#fde68a;padding:2px 7px;border-radius:6px;font-family:Consolas,"Cascadia Code",monospace;font-size:.92em}
.controls{display:flex;gap:10px;margin:22px 0 8px;flex-wrap:wrap;justify-content:center}
.controls .primary{background:var(--accent);color:#0f172a;font-weight:600;border-color:var(--accent)}
.count{color:var(--muted);margin-bottom:6px}
.bar{width:min(640px,92vw);height:6px;background:#334155;border-radius:3px;overflow:hidden;margin-bottom:30px}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.keys{color:var(--muted);font-size:.8rem;margin-bottom:30px}
.tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:999px;margin-bottom:18px;border:1px solid #334155}
.tabs button{background:none;border:none;color:var(--muted);padding:9px 24px;border-radius:999px;font-size:1rem;cursor:pointer;font-weight:600}
.tabs button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0f172a}
#flashView{display:flex;flex-direction:column;align-items:center}
#quizView{display:flex;flex-direction:column;align-items:center}
.hidden{display:none!important}
.quiz{width:min(680px,92vw);background:linear-gradient(135deg,#1e293b,#273449);border:2px solid var(--accent2);border-radius:20px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.45);margin-bottom:30px}
.qtext{font-size:1.25rem;line-height:1.5;margin-bottom:20px}
pre{background:#0b1220;border:1px solid #334155;border-radius:10px;padding:14px 16px;font-family:Consolas,"Cascadia Code",monospace;font-size:1rem;color:#fde68a;text-align:left;white-space:pre;overflow-x:auto}
.choice{display:block;width:100%;text-align:left;background:#0f172a;border:1px solid #334155;color:var(--text);padding:13px 16px;border-radius:12px;margin:8px 0;font-size:1.05rem;cursor:pointer;font-family:Consolas,"Segoe UI",monospace;transition:.15s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{background:#14532d;border-color:#22c55e}
.choice.wrong{background:#7f1d1d;border-color:#ef4444}
.choice:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 16px;border-radius:12px;line-height:1.5}
.fb.ok{background:rgba(34,197,94,.15);border:1px solid #22c55e}
.fb.no{background:rgba(239,68,68,.15);border:1px solid #ef4444}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.qnav{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.qnav button{background:var(--accent);color:#0f172a;border:none;border-radius:999px;padding:10px 22px;font-weight:600;font-size:1rem;cursor:pointer}
.qnav button.ghost{background:var(--panel);color:var(--text);border:1px solid #334155}
.score{font-size:3rem;font-weight:700;text-align:center;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.miss{background:#0f172a;border-left:3px solid #ef4444;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.5}
.best{color:var(--muted);font-size:.8rem;margin-left:4px}
</style></head><body>
<h1>100 Days of Code <span>Python</span></h1>
<div class="sub" id="sub">Click the card (or press Space) to flip it</div>
<div class="tabs"><button id="tabF" class="on" onclick="tab('f')">Flashcards</button><button id="tabQ" onclick="tab('q')">Pop Quiz</button></div>
<div class="days" id="days"></div>
<div id="flashView">
<div class="scene" onclick="flip()"><div class="card" id="card">
  <div class="face front"><div class="tag" id="tagF"></div><div id="q"></div><div class="hint">Question</div></div>
  <div class="face back"><div class="tag" id="tagB"></div><div id="a"></div><div class="hint">Answer</div></div>
</div></div>
<div class="controls">
  <button onclick="move(-1)">&larr; Prev</button>
  <button class="primary" onclick="flip()">Flip</button>
  <button onclick="move(1)">Next &rarr;</button>
  <button onclick="shuffle()">&#x1F500; Shuffle</button>
</div>
<div class="controls">
  <button class="ghost" onclick="copyDone()">Copy completion for Practice Coach</button>
  <button onclick="markAll()">Mark all as reviewed</button>
  <button onclick="resetDone()">Reset progress</button>
</div>
<div class="count" id="done"></div>
<div class="count" id="count"></div>
<div class="bar"><div id="bar"></div></div>
<div class="keys">Keys: &larr; / &rarr; to move, Space to flip, S to shuffle</div>
</div>
<div id="quizView" class="hidden"><div class="days" id="qdays"></div><div class="quiz" id="quiz"></div></div>
<script>
const DECKS=[{"day": 1, "cards": [["How do you output text to the console in Python?", "`print()` with the text inside the parentheses, e.g. `print(\"Hello world!\")`"], ["What is a string?", "A piece of text in quotes, a \"string of characters\". The quotes tell Python it's text, not code."], ["What do the double quotes around text do?", "They mark the beginning and end of a string."], ["What error do you get if you forget a closing quote?", "A SyntaxError."], ["What does the caret (^) in an error message show?", "Roughly where in the line Python found the problem."], ["What is PEP 8?", "Python's official style guide for writing clean code."], ["You're stuck on an error you don't understand. What do you do?", "Google it: paste the error message, or search what you want + the language (e.g. \"how to find the length of a string python\"). Stack Overflow usually has the answer."], ["What does `\\n` do inside a string?", "Starts a new line, so one print() can output multiple lines. It's a backslash (`\\n`), not a forward slash."], ["What is string concatenation?", "Joining strings end to end with `+`."], ["What does `print(\"Hello\" + \"Angela\")` output?", "`HelloAngela` (no space is added automatically)."], ["Give one way to output `Hello Angela` using concatenation.", "`\"Hello\" + \" \" + \"Angela\"` (or put the space inside either string)."], ["SyntaxError vs IndentationError?", "SyntaxError = broken grammar (e.g. missing quote). IndentationError = an unexpected space or tab at the start of a line."], ["Do spaces inside quotes cause errors?", "No, they're part of the string."], ["What is debugging?", "Finding and fixing errors (bugs) so code runs as expected."], ["What does the `input()` function do?", "Lets the user type data into the program; it returns what they typed as a string."], ["What is the text inside `input(\"...\")` called?", "The prompt, a hint shown to the user about what to type."], ["When `input()` runs, what happens to that part of the code?", "The whole input(...) call is replaced by whatever the user typed."], ["In `print(\"Hello \" + input(\"Name? \"))`, what do the two closing `))` do?", "The first closes input(, the second closes print(."], ["Write a line that greets the user by name with an exclamation mark.", "`print(\"Hello \" + input(\"What is your name? \") + \"!\")`"], ["What symbol makes a line a comment in Python?", "`#` (hash/pound sign). Python ignores everything after it on that line."], ["What is a variable?", "A name that stores a piece of data so you can refer to it later."], ["What does `=` do in `name = \"Jack\"`?", "Assigns the value on the right (\"Jack\") to the variable on the left (name)."], ["How do you save the user's input so you can use it later?", "Assign it to a variable: `name = input(\"What is your name? \")`"], ["`name = \"Jack\"`, `print(name)`, `name = \"Angela\"`, `print(name)`. What prints?", "Jack, then Angela. A variable holds its latest value at each moment."], ["Why is it called a \"variable\"?", "Its value can change (vary) when you reassign it."], ["What does `len()` do?", "Returns the number of characters in a string."], ["What is `len(\"Hello world!\")`?", "12 (the space and ! count)."], ["One line to print how many characters are in the user's name?", "`print(len(input(\"What is your name? \")))`"], ["In what order does `print(len(input()))` run?", "Inside out: input() first, then len(), then print(). The innermost call runs first and its result is passed outward."], ["Rewrite `print(len(input(\"Name? \")))` with variables `username` and `length`.", "`username = input(\"Name? \")` / `length = len(username)` / `print(length)`"], ["Why use variables even when one line would work?", "Each step is labeled, so code is more readable and easier to break into parts."], ["What's the most important rule for naming variables?", "Make them readable, so the name explains what the data is (username, not n)."], ["How do you separate words in a Python variable name?", "With an underscore: `user_name`. Spaces aren't allowed."], ["What happens if a variable name has a space, like `user name = ...`?", "SyntaxError."], ["Can a variable name contain numbers?", "Yes, but not at the start: `length1` is fine, `1length` is a SyntaxError."], ["Why shouldn't you name a variable `print` or `input`?", "They're built-in function names; it's confusing, breaks syntax highlighting, and is bad practice."], ["What causes a NameError?", "Using a variable name that was never defined, usually a typo (e.g. `nama` instead of `name`)."], ["Does Python spell-check variable names?", "No. Any valid name works as long as you spell it exactly the same every time."], ["Valid or invalid: `user_name`, `2nd_place`, `length2`, `my name`?", "Valid: user_name, length2. Invalid: 2nd_place (starts with a number), my name (has a space)."], ["If `food = \"tacos\"`, what does `print(food)` show vs `print(\"food\")`?", "print(food) shows tacos (the variable's value). print(\"food\") shows the literal word food. No quotes = variable; quotes = text."], ["What is `len(\"pizza\")`?", "5 (p-i-z-z-a). Count every character."]]}, {"day": 2, "cards": [["What error do you get from `len(12345)` and why?", "TypeError. len() works on strings (and other sequences), not on integers."], ["What are the four basic data types covered on Day 2?", "str (string), int (integer), float, and bool (boolean)."], ["What is subscripting?", "Pulling out one character from a string with square brackets, e.g. \"Hello\"[0]."], ["What does `\"Hello\"[0]` give you, and why not 1?", "H. Programmers count from 0, so the first character is index 0."], ["What does `\"Hello\"[-1]` give you?", "o (the last character). Negative indices count from the end."], ["What does `print(\"123\" + \"345\")` output?", "123345. Both are strings, so + concatenates."], ["What does `print(123 + 345)` output?", "468. Both are integers, so + adds."], ["How do you write a large integer so it's easier to read?", "Use underscores: `1_000_000` (Python ignores them)."], ["What is a float?", "A number with a decimal point, e.g. 3.14159."], ["What are the two Boolean values, and how are they written?", "True and False, capital T/F, no quotes."], ["Is `\"123\"` an integer or a string?", "A string, because it's in quotes."], ["What does `type(\"Hello\")` return?", "`<class 'str'>`"], ["What do `type(123)`, `type(3.14)`, and `type(True)` return?", "`<class 'int'>`, `<class 'float'>`, `<class 'bool'>`"], ["What is type conversion / type casting?", "Changing a value from one data type to another, e.g. int(\"123\") or str(5)."], ["How do you convert a string to an integer?", "`int(\"123\")`"], ["How do you convert a number to a string?", "`str(123)`"], ["What does `int(\"123\") + int(\"456\")` equal?", "579 (they become ints, so + adds)."], ["What error does `int(\"ABC\")` raise?", "ValueError (invalid literal for int)."], ["Why does `print(\"Letters: \" + len(name))` fail?", "len() returns an int; you can't concatenate str + int. Wrap with str()."], ["Fix: print the length of a name after an input prompt.", "`name = input(\"Name?\")` then `print(\"Letters: \" + str(len(name)))`"], ["What symbol is multiplication in Python?", "`*` (asterisk), not \u00d7."], ["What symbol is division in Python?", "`/` (forward slash)."], ["What does `6 / 3` return, and what type is it?", "`2.0`, a float. Regular division always returns a float."], ["What does `5 // 3` return?", "`1` (floor division drops the decimal; result is an int)."], ["What does `2 ** 3` mean?", "2 to the power of 3, which is 8."], ["What does PEMDAS stand for?", "Parentheses, Exponents, Multiplication, Division, Addition, Subtraction."], ["Between `*` and `/`, which happens first?", "They're equal priority; the one furthest left runs first."], ["What is `3 * 3 + 3 / 3 - 3`?", "`7.0`"], ["How do you make `3 * 3 + 3 / 3 - 3` equal 3?", "Add parentheses: `3 * (3 + 3) / 3 - 3`"], ["What does `int(30.85)` give?", "30. It chops off the decimals (doesn't round)."], ["What does `round(30.85)` give?", "31. Normal rounding to the nearest whole number."], ["How do you round `bmi` to 2 decimal places?", "`round(bmi, 2)`"], ["What does `score += 1` mean?", "score = score + 1 (add 1 to its current value)."], ["Name the four shorthand assignment operators.", "`+=`, `-=`, `*=`, `/=`"], ["What is an f-string?", "A string with f before the quotes; variables go in {curly braces} and are converted to text automatically."], ["Write an f-string that prints `Your score is 5` using a variable `score`.", "`print(f\"Your score is {score}\")`"], ["Why use an f-string instead of `\"Score: \" + str(score)`?", "No manual str() conversion or + signs; you can mix ints, floats, and bools in one string easily."], ["How do you turn a 12% tip into a multiplier?", "`12 / 100 + 1` = 1.12"], ["Why use `float(input(...))` for a bill but `int(input(...))` for people?", "Money can have decimals; number of people is a whole number."], ["How do you always show 2 decimals (33.60, not 33.6) in an f-string?", "`f\"{value:.2f}\"`"]]}, {"day": 3, "cards": [["What is an if / else statement?", "Code that runs one block if a condition is True, and another block (else) if it's False."], ["What two things must every `if` and `else` line end with / be followed by?", "A colon `:`, then an indented block of code."], ["How does Python know which lines belong inside an if block?", "Indentation. Indented lines under the if are inside it."], ["Where does `else` go relative to `if`?", "At the same indentation level as its if; they're a pair."], ["`height = 120`. Does `if height > 120:` run the if block or the else?", "The else. `>` doesn't include 120; use `>=` to include it."], ["What's the difference between `>` and `>=`?", "`>` means strictly greater; `>=` also includes the equal value."], ["What does `!=` mean?", "Not equal to."], ["What's the difference between `=` and `==`?", "`=` assigns a value to a variable; `==` checks if two values are equal."], ["What happens if you write `if height = 120:`?", "SyntaxError. A condition needs `==`, which gives True or False."], ["Write an if/else that prints \"Ride!\" if `height` is at least 120, otherwise \"Too short\".", "`if height >= 120:` / `    print(\"Ride!\")` / `else:` / `    print(\"Too short\")`"], ["What does the `%` (modulo) operator do?", "Gives the remainder after dividing one number by another."], ["What is `10 % 3`?", "1 (3 goes into 10 three times with 1 left over)."], ["What is `10 % 5`?", "0 (divides evenly, no remainder)."], ["How do you check if a number is even?", "`if number % 2 == 0:` (even numbers have no remainder when divided by 2)."], ["What does `number % 2` give for an odd number?", "1"], ["What is a nested if statement?", "An if/else placed inside another if block (indented one more level). The inner check only runs if the outer condition is True."], ["In the rollercoaster code, when is the age question asked?", "Only if the height check passed (it's nested inside the `if height >= 120:` block)."], ["What does `elif` stand for, and when do you use it?", "\"Else if.\" Use it when there are more than two possibilities."], ["If several `if`/`elif` conditions are True, which block runs?", "Only the first True one, top to bottom. The rest are skipped."], ["How many `elif`s can you have between `if` and `else`?", "As many as you need."], ["`age = 10`. With `if age < 12:` / `elif age <= 18:` / `else:`, which block runs?", "The `if age < 12:` block ($5). Python stops at the first True condition."], ["Why must `if age < 12` come before `elif age <= 18`?", "Order matters. If `<= 18` came first, a 10-year-old would match it and never reach the under-12 price."], ["if/elif/else vs several separate `if`s: how many blocks can run?", "if/elif/else runs only one block (the first True). Separate `if`s are each checked, so several can run."], ["When should you use separate `if`s instead of `elif`?", "When the conditions are independent of each other, like asking about a photo no matter what ticket someone has."], ["Why is `bill = 0` created before the age checks?", "So a variable exists that each branch can set and the photo check can add to later."], ["What does `bill += 3` do?", "Adds 3 to the current bill: same as `bill = bill + 3`."], ["Does every `if` need an `else`?", "No. If nothing should happen when the condition is False, leave the else off."], ["Why is the photo question lined up with the age `if`, not indented under `else`?", "So it's asked for every age, after the ticket price is set, not only for adults."], ["What are Python's three logical operators?", "`and`, `or`, `not`"], ["When is `A and B` True?", "Only when both A and B are True."], ["When is `A or B` False?", "Only when both A and B are False."], ["What does `not` do?", "Flips a condition: `not True` is False, `not False` is True."], ["`a = 12`. Is `a > 15 and a < 13` True or False?", "False. `a > 15` is False, and `and` needs both to be True."], ["`a = 12`. Is `a > 10 or a < 10` True or False?", "True. `or` only needs one side to be True."], ["Write a condition for ages 45 to 55, inclusive.", "`age >= 45 and age <= 55` (or the shorter `45 <= age <= 55`)"]]}, {"day": 4, "cards": [["Why do computers need a special method to make random numbers?", "They're deterministic (same steps, same result), so they use math called a pseudorandom number generator."], ["What is Python's pseudorandom number generator called?", "The Mersenne Twister."], ["What line do you need before you can use `random.randint()`?", "`import random`"], ["What does `random.randint(1, 10)` return?", "A random whole number from 1 to 10, including both 1 and 10."], ["Write a line that stores a random whole number from 1 to 6 in `dice`.", "`dice = random.randint(1, 6)`"], ["What range does `random.random()` give?", "A float from 0 up to but not including 1 (0 can show up, 1 never does)."], ["Why does `random.random()` need `()` if it takes no inputs?", "Parentheses are what actually run (call) a function, even with nothing inside."], ["In `random.random()`, what's the difference between the two words `random`?", "The first is the module; the second is the function inside it."], ["How do you get a random float from 0 up to (not including) 10?", "`random.random() * 10`"], ["What does `random.uniform(1, 10)` return?", "A random float between 1 and 10 (it may or may not ever hit exactly 10 because of rounding)."], ["What is a module?", "A separate .py file of code you can import and reuse in other files."], ["Why do programmers split code into modules?", "Big programs are easier to understand, and different people can work on different parts."], ["You made `my_module.py` with `pi = 3.14`. How do you print it from main.py?", "`import my_module` then `print(my_module.pi)`"], ["How do you write a random coin flip?", "`if random.randint(0, 1) == 0:` print \"Heads\", `else:` print \"Tails\"."], ["What is a list in Python?", "A data structure that stores many related items, in order, in one variable."], ["How do you write a list?", "Square brackets with items separated by commas: `[\"Cherry\", \"Apple\", \"Pear\"]`"], ["Can a list hold different data types?", "Yes. It can mix strings, numbers, booleans, and more."], ["`fruits = [\"Cherry\", \"Apple\", \"Pear\"]`. What is `fruits[0]`?", "\"Cherry\". Lists start counting at 0."], ["Why does the first item have index 0?", "The index is an offset from the start, and the first item is 0 steps away."], ["What does `fruits[-1]` give you?", "The last item in the list."], ["How do you change the second item in `fruits` to \"Mango\"?", "`fruits[1] = \"Mango\"`"], ["What does `append()` do?", "Adds one item to the end of a list: `fruits.append(\"Kiwi\")`"], ["`append()` vs `extend()`?", "append() adds one item; extend() adds every item from another list: `fruits.extend([\"Kiwi\", \"Lime\"])`"], ["Do you need to memorize every list function?", "No. Know what's possible, then look up the details in the docs or Google."], ["What does `len()` return for a list?", "The number of items in it, e.g. 50 for the list of US states."], ["A list has 50 items. What is the last valid index?", "49 (always len - 1, because counting starts at 0)."], ["What error do you get from `my_list[50]` when the list has 50 items?", "IndexError: list index out of range."], ["What is an off-by-one error?", "Being one step off, like using `len(list)` as an index instead of `len(list) - 1`."], ["What is a nested list?", "A list that contains other lists, e.g. `dirty_dozen = [fruits, vegetables]`."], ["If `fruits` has 7 items and `vegetables` has 5, what is `len([fruits, vegetables])`?", "2. The outer list holds two items, which are the two lists."], ["What does `random.choice(my_list)` do?", "Returns a random item from the list."], ["How do you write a string that spans several lines (like ASCII art)?", "Use triple quotes: `'''...'''` or `\"\"\"...\"\"\"`."], ["If the player types \"2\", how do you use it to pull scissors out of `choices = [rock, paper, scissors]`?", "Convert it to an int first: `choices[int(player)]`"]]}, {"day": 5, "cards": [["What is a loop?", "Doing something over and over instead of writing the same code many times."], ["What does a for loop with a list do?", "Runs the indented body once for each item in the list, in order."], ["Write the for-loop pattern for a list named `fruits`.", "`for fruit in fruits:` then an indented body."], ["In `for fruit in fruits:`, what is `fruit`?", "The loop variable \u2014 it holds one list item at a time."], ["Does the loop variable hold the whole list?", "No. Each iteration it gets the next single item."], ["How many times does a for loop run over a list?", "Once per item in the list."], ["Where must the loop body sit?", "Indented under the `for` line."], ["What happens to code indented inside the for loop?", "It runs once for every item in the list."], ["What happens to code written at the same indent as `for` (outside the loop)?", "It runs once, after the loop finishes."], ["Can the body of a for loop have more than one statement?", "Yes. Every indented line runs for each item."], ["`fruits = [\"Apple\", \"Peach\", \"Pear\"]` then `for fruit in fruits: print(fruit)`. What prints?", "Apple, then Peach, then Pear (one per line)."], ["In the fruit pie example, why does both `print(fruit)` and `print(fruit + \" pie\")` run for Apple before Peach?", "Both lines are indented inside the loop, so the whole block runs for each item before moving on."], ["What does range() do in a for loop?", "It generates a sequence of numbers to loop over (not just lists)."], ["Does printing range(...) alone show the numbers?", "No. range() alone isn't useful when printed; use it with a for loop."], ["In `for number in range(1, 10):`, what numbers print?", "1 through 9 (end is exclusive)."], ["How do you make range include 10 starting from 1?", "`range(1, 11)` \u2014 end must be one past the last number you want."], ["What is the default step for range()?", "+1 (counts up by one each time)."], ["What does `range(1, 11, 3)` produce?", "1, 4, 7, 10."], ["How do you sum 1 through 100 with a for loop and range?", "`total = 0` then `for number in range(1, 101): total += number` (or `total = total + number`); print total \u2192 5050."], ["What does `total += number` mean?", "Same as `total = total + number` \u2014 add the current number into the running total."], ["How do you build a string one piece at a time in a loop?", "Start with an empty string, `password = \"\"`, then add a piece each pass: `password += random.choice(letters)`."], ["What's the difference between `letters[4]` and `random.choice(letters)`?", "`letters[4]` always gives the one item at index 4; `random.choice(letters)` gives one random item from the list."], ["How many times does `for i in range(5):` run, and what values does `i` take?", "5 times: i is 0, 1, 2, 3, 4 (starts at 0, stops before 5)."], ["Why doesn't `random.choice(letters[nr_letters])` give nr_letters random letters?", "`letters[nr_letters]` picks one item at that index, and one random.choice call returns just one thing. Use a loop: `for i in range(nr_letters):`."]]}, {"day": 6, "cards": [["How do you spot a function call in Python?", "A name followed by parentheses, e.g. print(), len(), my_function()."], ["Can you save a function's result in a variable?", "Yes. Example: num_char = len(\"Hello\") then print(num_char) gives 5."], ["What keyword starts a function definition?", "def"], ["Write the pattern to define a function named my_function.", "def my_function(): then an indented body."], ["What four pieces does a function definition need?", "def, a name, parentheses (), a colon :, then an indented body."], ["What is the difference between defining and calling a function?", "Define writes the recipe (def ...); call runs it (name())."], ["Why does defining a function alone print nothing when you run the file?", "def only stores the recipe. You must call the function with name() to run the body."], ["What happens when a function is called?", "The program jumps to the definition, runs the indented body top to bottom, then returns to where it was called and continues."], ["Why use functions?", "Less repetition (don't retype the same steps) and more readable code."], ["Write a turn_around function using turn_left().", "def turn_around(): then turn_left() twice (indented)."], ["How do you define turn_right() if only turn_left() exists?", "def turn_right(): then turn_left() three times."], ["In the square challenge, why define turn_right()?", "So you can write fewer, clearer lines (~8) instead of repeating turn_left() many times (~14)."], ["What makes a line part of a function's body?", "Indenting it (usually 4 spaces) under the def ...: line."], ["What happens to a non-indented line after a function definition?", "It is outside the function; it runs on its own when the file runs, not when the function is called."], ["How much indent for a line inside an if that is inside a function?", "Two levels \u2014 8 spaces (4 for the function + 4 for the if)."], ["What does PEP 8 recommend for indentation?", "Use spaces, 4 per indent level (not tabs)."], ["Can you mix tabs and spaces for indentation in Python 3?", "No. Python 3 does not allow mixing tabs and spaces in one file."], ["What File Explorer analogy fits indentation?", "Blocks are like folders; indented code lives \"inside\" the folder."], ["In def my_function(): then 4-space print(\"Hello\") then left-edge print(\"World\") \u2014 which line runs only when you call my_function()?", "print(\"Hello\") \u2014 print(\"World\") is outside and runs on its own."], ["What does a while loop do?", "Keeps repeating its indented block as long as a condition is True; stops when the condition is False."], ["When does a while loop check its condition?", "At the top, before each pass through the body."], ["In the Hurdle 1 counter example (start at 6, while > 0, jump then -= 1 and print), what prints and why does it stop?", "Prints 5,4,3,2,1,0 then stops because 0 > 0 is False."], ["What does x -= 1 mean?", "Shorthand for x = x - 1."], ["Write a while loop that jumps until the robot is on the flag (at_goal).", "while not at_goal(): then indented jump(). (not flips True/False; while at_goal() != True: also works but reads less like English.)"], ["When do you use for vs while?", "for when you know how many times / each item in a list or range; while when you repeat until a condition changes and don't know how many times."], ["What causes an infinite while loop, and how do you debug it?", "The condition never becomes False (e.g. while 5 > 3:). Stop the program; print the condition (or its variables) to see if it ever changes."], ["What is the right-hand rule for escaping the Reeborg maze?", "Keep a wall on your right: if right is clear, turn right and move; elif front is clear, move; else turn left. Repeat."], ["What outer loop drives the maze solution, and why while instead of for?", "while not at_goal(): \u2014 you don't know how many steps it will take, so you repeat until the robot reaches the flag."], ["Why did the maze robot loop forever in an open area with no walls nearby?", "right_is_clear() was always True, so it kept turning right and moving in a small square and never reached the goal (infinite loop)."], ["How do you fix the open-area infinite loop in the maze?", "Before the wall-following loop, walk straight until you hit a wall (while front_is_clear(): move()), then turn_left() so the wall is on the robot's right."]]}, {"day": 7, "cards": [["What does the in operator do?", "Gives True/False: is this item in that string or list? e.g. \"a\" in \"abyss\" is True; \"_\" not in display means no blanks are left."], ["How does a game_over flag drive the Hangman loop?", "Set game_over = False, loop with while not game_over:, and set game_over = True when the player wins or loses."], ["Why reset display = \"\" at the top of the while loop?", "So it's rebuilt fresh each turn. If you only set it once before the loop, every turn adds more letters on top and it keeps growing."], ["Why not write for guess in chosen_word: when guess holds the player's letter?", "The for loop overwrites its loop variable every pass, so the player's guess gets lost. Use a different name like letter."], ["if/elif vs separate ifs for win and lose checks?", "Only one branch of an if/elif chain runs. Independent checks (win, lose) need separate ifs so both get checked."], ["How do you stop a repeated wrong guess costing another life?", "Keep a guessed_letters list: check if guess in guessed_letters, only take a life when guess not in guessed_letters, and .append(guess) each turn."], ["How do you use a list that lives in another file?", "from hangman_words import word_list \u2014 then use word_list by its plain name."], ["What does stages[lives] do in Hangman?", "Picks the ASCII picture by list index. With 6 lives you get stages[6] (empty gallows); at 0 lives, stages[0] (full drawing)."]]}, {"day": 8, "cards": [["Why give a function inputs?", "So it can do the same steps with different data each call \u2014 same recipe, different ingredients."], ["How do you define a function that takes a name?", "def greet_with_name(name): then an indented body that uses name (e.g. print(f\"Hello {name}\"))."], ["What happens to the value when you call greet_with_name(\"Angela\")?", "\"Angela\" is stored in the parameter name for that call \u2014 like name = \"Angela\" inside the function."], ["Parameter vs argument?", "Parameter = the name in the def (name). Argument = the actual value passed in the call (\"Angela\")."], ["What does greet_with_name(\"Jack\") print?", "Hello Jack / How do you do Jack?"], ["How do you define a function with multiple parameters?", "Separate them with commas in the def: def greet_with(name, location):"], ["What does a positional argument mean?", "Matched to parameters by order \u2014 first arg \u2192 first param, second \u2192 second, etc."], ["What does greet_with(\"Nowhere\", \"Jack Bauer\") print if def is greet_with(name, location)?", "Hello Nowhere / What is it like in Jack Bauer? (swapped \u2014 order mismatch)"], ["How do keyword arguments work?", "Name each one in the call, e.g. greet_with(location=\"London\", name=\"Angela\"). Order doesn't matter because values go by name."], ["How does % 26 wrap the Caesar shift around?", "Add first, then wrap: (position + shift_amount) % 26. \"z\" (25) + 3 = 28, and 28 % 26 = 2, which is \"c\"."], ["Why must shift_amount *= -1 go above the for loop?", "Inside the loop it flips on every letter (back, forward, back...), so every other letter shifts the wrong way. Do once-only steps before the loop."], ["How do you pass spaces, numbers and symbols through the cipher unchanged?", "if letter not in alphabet: output_text += letter, else do the shift. .index() would crash on them otherwise."], ["How do you restart a whole program?", "reset = True, then while reset: ask the inputs, call the function, ask \"yes\" to go again, and set reset = False on \"no\"."]]}, {"day": 9, "cards": [["What is a dictionary in Python?", "A collection of key: value pairs, written in curly braces, e.g. {\"Bug\": \"An error...\"}."], ["How do you get a value out of a dictionary?", "Square brackets with the key, e.g. programming_dictionary[\"Bug\"]."], ["What error do you get for a key that doesn't exist (e.g. a typo)?", "KeyError."], ["How do you add or edit an entry?", "dict[key] = value. If the key exists, it's replaced; if not, a new entry is added."], ["How do you make an empty dictionary, or wipe one?", "Assign empty curly braces: my_dict = {}."], ["What does 'for key in my_dict:' loop through?", "Only the keys. Use my_dict[key] to get each value."], ["What is nesting?", "Putting a list or dictionary inside another list or dictionary."], ["travel_log = {\"France\": [\"Paris\", \"Lille\", \"Dijon\"]}. How do you print Lille?", "travel_log[\"France\"][1]. The key gets the list, then the index picks the item."], ["nested_list = [\"A\", \"B\", [\"C\", \"D\"]]. How do you print D?", "nested_list[2][1]"], ["How do you reach a list item inside a dictionary inside a dictionary?", "Chain brackets one layer at a time: outer key, inner key, index, e.g. travel_log[\"Germany\"][\"cities_visited\"][2]."], ["How do you find the highest bid in a dictionary?", "Start highest_bid = 0, loop for bidder in bids:, and if bids[bidder] > highest_bid: set highest_bid and winner = bidder. Compare, don't use +=."], ["Where does bids[name] = price go in the auction loop?", "In the main body of the while loop so it runs for every bidder, not inside the yes/no if/else. Announce the winner after the loop."]]}, {"day": 10, "cards": [["What does return do in a function?", "Sends a value back as the function's output. That value replaces the function call in your code."], ["def my_function(): return 3 * 2. What is output = my_function()?", "6"], ["What does \"aNGela YU\".title() give?", "\"Angela Yu\". First letter of each word capitalized, the rest lowercase."], ["print vs return?", "print only shows text on screen. return hands the value back so your code can store or reuse it."], ["What does function_2(function_1(\"hello\")) do?", "Runs function_1 first. Its returned output becomes the input to function_2 (chaining)."], ["What happens to code written after a return line in a function?", "It never runs. return ends the function right there."], ["Can a function have more than one return?", "Yes. Whichever return runs first ends the function."], ["What is an early return?", "Checking for bad input (e.g. if f_name == \"\" or l_name == \"\":) and returning before the rest of the function runs."], ["What does an empty return give back, and what prints if you print it?", "None. Better to return a meaningful message so you can tell what went wrong."], ["What is a docstring?", "Documentation for your own function: text in triple quotes (\"\"\"...\"\"\") that shows up when you call the function, like the built-in help for len()."], ["Where does a docstring go?", "The first indented line right after the def line (after the colon)."], ["How is a docstring different from a normal string?", "It can span multiple lines; a normal quoted string can't break across lines."], ["Best way to write a multi-line comment?", "Write the lines, highlight them, and press Ctrl + / (Cmd + / on Mac). Python's guidance is to avoid triple-quote comments."]]}, {"day": 11, "cards": [["In the Blackjack solution, what does deal_card() do?", "Holds the cards list [11, 2, 3 ... 10, 10, 10, 10] (11 = Ace), picks one with random.choice(cards), and returns it. Its docstring shows when you hover over the function."], ["How do you deal 2 cards to the user without a middleman variable?", "for _ in range(2): user_cards.append(deal_card()). The underscore is used because the loop variable isn't needed."], ["user_cards += new_card (new_card is an int) gives TypeError: 'int' object is not iterable. Why, and what's the fix?", "+= on a list is shorthand for extend(), which needs an iterable (a list). To add a single item, use append()."], ["What does sum() do, and how does calculate_score signal a Blackjack?", "sum() adds up all the items of an iterable. If sum == 21 and len(cards) == 2 (an Ace and a 10), it returns 0 to signal Blackjack."], ["Why is drawing to 21 on a third card NOT a Blackjack?", "Real Blackjack is 21 on the first two cards only. That's why the check needs len(cards) == 2 as well as sum == 21."], ["What is the Ace rule in calculate_score, and what must you do after changing the list?", "If 11 is in cards and sum(cards) > 21: cards.remove(11), then cards.append(1). remove() deletes the first match. Then recalculate the score."], ["John's Ace fix used cards[cards.index(11)] = 1 in a while loop. What's the catch with .index()?", "It finds only the FIRST match, so with two Aces you have to repeat it and recheck the score each time."], ["Why must a function be defined above the line that calls it?", "Python reads top to bottom, so the def has to come first. Like having the tool on the truck before the job."], ["Why do the starting cards get dealt above the while loop?", "Code inside a loop runs every trip. Dealing inside it would hand out fresh starting cards on every pass."], ["What does `while computer_score != 0 and computer_score < 17:` do?", "The dealer keeps drawing until reaching 17 or more, but never on a Blackjack. 0 is less than 17, so it needs the != 0 check."], ["Why start user_score and computer_score at -1 before the loop?", "So the names exist even if the loop is skipped. Can't use 0 because 0 means Blackjack. -1 is obviously wrong, which helps debugging."], ["Why is the Blackjack check (score 0) above u_score > c_score in compare()? And how do two ifs differ from if/elif?", "if/elif/else is checked top to bottom and the first match returns, so order matters. Two separate ifs both run; elif joins a chain so only one runs."], ["What does the warning 'Shadows the name from outer scope' mean, and how do you fix it?", "A function parameter reuses the name of an outer variable (user_score). Rename it (u_score, c_score) with Refactor > Rename; unrelated names stay untouched."], ["A variable is made inside a function. Can you use it outside? (John's `play` undefined bug)", "No. It only exists inside the function (scope), like a shutoff valve behind a wall you can't reach from the next room."], ["How does the game restart, and where does the logo come from?", "while input(\"...Type 'y' or 'n': \") == \"y\": clears with print(\"\\n\" * 20), then calls play_game(). The logo is imported with from art import logo and printed at the start of each game."], ["What's a good habit while building a big project like Blackjack?", "Test your code regularly as you go, so a problem is easier to locate."]]}, {"day": 12, "cards": [["What is scope?", "Where a name (variable or function) can be seen and used. Apple tree analogy: one inside a fence is only for you, one by the sidewalk is free for all."], ["What is local scope?", "A variable created inside a function only exists inside that function, within its 'walls'."], ["What error do you get printing a variable that was created inside a function from outside it?", "A NameError, e.g. \"name 'potion_strength' is not defined\"."], ["What is global scope?", "A variable defined at the top level (not inside any function). It is available everywhere in the file, including inside functions however deeply nested."], ["What does 'top level' mean for a global variable?", "Not inside another function. It doesn't mean physically at the top of the file."], ["What is a namespace?", "Anything you give a name to (a variable, a function) has a namespace, and that name is only valid in certain scopes."], ["If drink_potion() is defined inside game(), where can you call it?", "Only inside game(). It has local scope within game()."], ["Does Python have block scope for if, while and for blocks?", "No. A variable created inside an if/while/for block is still available outside it, with the scope of the enclosing function (or global if there is no function)."], ["Inside a function, a variable is created in an if block. Can you use it outside the if block? Outside the function?", "Yes outside the if block (same function scope). No outside the function."], ["What does the linter warning 'local variable might be referenced before assignment' mean, and how do you fix it?", "The if block might not run, so the variable would never be created. Fix: create it before the block, e.g. new_enemy = \"\" (or ignore the warning if you know your code better)."], ["A function does enemies = 2 where enemies is also a global. Does the global change?", "No. It creates a brand new local variable with the same name. The global stays the same (e.g. prints 2 inside, 1 outside)."], ["What do you write inside a function to modify a global variable?", "global enemies (the name of the global) at the start of the function, so enemies += 1 changes the global."], ["Why do people say to avoid modifying global variables?", "It's confusing and bug-prone: the variable could have been created anywhere, days earlier, and you'd change it independent of that. Reading a global is fine."], ["What is a better way than 'global' to change a global value from a function?", "Use return: return enemies + 1, then save it outside: enemies = increase_enemies()."], ["What is a global constant and how do you name it?", "A global value you never plan to change, like PI or a URL. Named in ALL UPPERCASE with underscores as a reminder not to modify it."]]}, {"day": 13, "cards": [["What is debugging?", "The process of finding and removing bugs (mistakes) from your code."], ["Who found the first documented computer bug?", "Grace Hopper's team: a real moth taped into her notebook, found in a relay."], ["Debugging tip 1: describe the problem. What should you ask yourself?", "What is the code doing, what is it meant to do, and what assumptions am I making?"], ["Why does `for i in range(1, 20): if i == 20:` never fire?", "range stops before the end number, so i only goes up to 19. Use range(1, 21)."], ["Debugging tip 2: reproduce the bug. Why does it matter?", "A bug that only shows sometimes is hard to fix. Find when it happens and make it happen every time."], ["Does `random.randint(1, 6)` include 6?", "Yes. randint includes both end numbers, unlike range."], ["Why does `dice_images[randint(1, 6)]` sometimes crash?", "A 6 gives IndexError: list index out of range, because a 6-item list's indexes are 0 to 5."], ["Two fixes for the dice IndexError?", "randint(0, 5), or keep randint(1, 6) and use dice_images[dice_num - 1]."], ["Debugging tip 3: play computer. What does it mean?", "Go through the code line by line with a real value and work out what each condition evaluates to."], ["Why does 1994 print nothing with `year > 1980 and year < 1994` / `elif year > 1994`?", "Neither condition catches 1994 itself. Fix with year <= 1994 (or >= in the second)."], ["Console error you don't understand: what do you do?", "Copy the general part of the message (not your own values) and Google it with \"Python\"."], ["What does a try / except block do?", "Runs risky code under try:, and if that error happens, runs the except block instead of crashing."], ["Which line goes in the try block for an age input?", "age = int(input(\"How old are you?\")), since int() crashes on words."], ["What error does int(\"twelve\") raise?", "ValueError (invalid literal for int())."], ["Why does print(\"You are {age}\") show {age} instead of the number?", "It's missing the f. It needs to be an f-string. No error is shown, so it's a quiet bug."], ["Debugging tip 5: print is your friend. How do you use it?", "Print variables before the final result to see which one isn't what you expected."], ["What's the difference between = and ==?", "= assigns a value. == compares and gives True or False without changing anything."], ["What does `x == 5` do if x is 0?", "Gives False, and x stays 0."], ["What is a breakpoint?", "A marker you click in the gutter so a debug run pauses at that line."], ["Step Over vs Step Into vs Step Into My Code?", "Step Over runs the next line. Step Into goes inside any function (even library ones). Step Into My Code only goes into your own functions."], ["What does Step Out do?", "Leaves the function you stepped into and goes back to the code that called it."], ["Why did only one number end up in b_list in the mutate() example?", "b_list.append(new_item) was outside the for loop, so it ran once with the last value. Indent it into the loop."], ["Final debugging tips?", "Take a break, ask a friend, run your code often, fix one bug at a time, and search Stack Overflow before asking."]]}, {"day": 14, "cards": [["What does `random.choice(data)` do?", "Picks one random item from the list data."], ["In Higher Lower, what does `data` hold?", "A list of dictionaries. Each dictionary is one account with name, description, country and follower_count."], ["How do you get the follower count out of `account`?", "account[\"follower_count\"], using the key in square brackets."], ["What does `format_account(account)` give back?", "A string like \"name, description, country\", made with an f-string and returned."], ["What does `return guess == \"a\"` give back?", "True if guess is \"a\", otherwise False. The comparison itself is the answer."], ["Trace it: `check_answer(\"a\", 500, 300)`. What comes back?", "guess=\"a\", a_followers=500, b_followers=300. 500 > 300, so it returns \"a\" == \"a\", which is True."], ["Trace it: `check_answer(\"a\", 100, 900)`. What comes back?", "100 > 900 is False, so the else runs: \"a\" == \"b\", which is False."], ["Why does `score = 0` go before the while loop?", "So it's set once. Inside the loop it would reset to 0 every round."], ["What does `while not game_over:` mean?", "Keep looping as long as game_over is False. Setting it to True ends the loop."], ["After a right answer, why do we do `account_a = account_b`?", "The winner (B) moves into the A spot, and then a new B is picked."], ["How does the game stop A and B from being the same account?", "while account_a == account_b: account_b = random.choice(data) keeps re-picking B until it's different."], ["Why add `.lower()` to the input?", "So \"A\" and \"a\" both match the check."], ["What does `print(\"\\n\" * 20)` do?", "Prints 20 blank lines to push old text off the screen."]]}, {"day": 15, "cards": [["What do you do in PyCharm instead of an online editor?", "Write and run Python on your own computer: make a project, add a .py file, press Run, and read output in the console at the bottom."], ["How do you get the milk a latte needs from MENU?", "MENU[\"latte\"][\"ingredients\"][\"milk\"]. Each set of square brackets goes one dictionary deeper."], ["How do you get a drink's price from MENU?", "MENU[drink][\"cost\"]."], ["How does the coffee machine turn off?", "is_on = True before the loop, while is_on:, and typing \"off\" sets is_on = False so the loop stops."], ["How do you print every key and its value in resources?", "for key in resources: print(key, resources[key]). key is the name, resources[key] is the amount."], ["Why not write resources[\"water\"] inside the ingredient loop?", "It hard-codes one item. Use the loop variable (resources[item]) so it works for every ingredient."], ["How do you total the coins?", "quarters * 0.25 + dimes * 0.10 + nickels * 0.05 + pennies * 0.01."], ["What does round(2.3456, 2) give?", "2.35. It rounds to 2 decimal places, good for money."], ["The coin question repeated once per ingredient. Why, and what's the fix?", "It was inside the for item loop, so it ran every pass. Move it after the loop so it runs once per order."], ["Flag check: what should is_enough start as, and when does it change?", "Start True before the loop. Flip to False only inside the if that finds a shortage."], ["Why is \"start False, set True at the bottom of each pass\" broken?", "A later ingredient that IS enough sets it back to True, hiding the earlier shortage."], ["What's wrong with calling process_coins() on one line and then total = process_coins()?", "The first call's result is thrown away and the user is asked for coins twice. Call it once and save it."], ["In is_resource_sufficient, where do return False and return True go?", "return False inside the if (found a shortage). return True after the loop, once every item passed."], ["Inside is_resource_sufficient(order_ingredients), what should the loop go over?", "The parameter order_ingredients, not MENU[user_choice]. Use what was passed in."], ["Does a function's return value show up on screen by itself?", "No. In a script you need print(my_func()) or save it in a variable and use it."], ["In bids = {\"Ann\": 50}, inside for bidder in bids, what's the bid amount?", "bids[bidder] (50). bidder is the key (\"Ann\"); compare the value, not the key."]]}, {"day": 16, "cards": [["In OOP, what are attributes and methods?", "Attributes are what an object has (like variables). Methods are what it does (functions that belong to it)."], ["What's the difference between a class and an object?", "A class is the blueprint. An object is one thing built from it (an instance), like Henry and Betty both made from a waiter class."], ["How do you name a class vs a variable or function?", "Classes use PascalCase (CarBlueprint). Variables and functions use snake_case (my_screen)."], ["What do the parentheses do in car = CarBlueprint()?", "They construct (create) a new object from the class and save it in car."], ["turtle.Turtle() vs from turtle import Turtle?", "With import turtle you write turtle.Turtle(). With from turtle import Turtle you can just write Turtle()."], ["How do you read an attribute vs call a method on an object?", "Attribute: object.attribute, e.g. my_screen.canvheight. Method: object.method(), e.g. car.stop()."], ["What does my_screen.exitonclick() do?", "Keeps the turtle window open until you click on it."], ["What's a module vs a package?", "A module is one file of code. A package is lots of files someone wrote, bundled together for a purpose."], ["What is PyPI?", "The Python Package Index: packages shared by the Python community that you can install and use."], ["How do you install a package like PrettyTable in PyCharm?", "Preferences (File > Settings on Windows) > Project > Project Interpreter > + > search PrettyTable > Install. Turtle is preloaded, PyPI packages are not."], ["How do you add a column to a PrettyTable?", "table.add_column(\"Pokemon Name\", [\"Pikachu\", \"Squirtle\", \"Charmander\"]): a field name string, then a list of data. Keep lists in the same order so rows match."], ["How do you left-align a PrettyTable, and what's the default?", "table.align = \"l\" (set it like a variable). Default is \"c\" (center); \"r\" is right."], ["In the docs, what do the M, F and C icons mean?", "M = method, F = attribute/field, C = class."], ["What's the point of the Steve Jobs hotel dry-cleaning story?", "You just call hotel.dry_clean() and trust it. You don't need to know how a class works inside, only how to use it (read the docs)."], ["In the OOP Coffee Machine, what do you pass to menu.find_drink?", "The user's choice (order_name=user_choice), not the whole menu from get_items. And call it inside the loop, after input()."], ["What do you pass to money_machine.make_payment?", "drink.cost (the price), not the whole drink object."], ["Why not write make_coffee = coffee_maker.make_coffee(drink)?", "make_coffee doesn't return anything, so the variable would just hold None. Just call it: coffee_maker.make_coffee(drink)."]]}, {"day": 17, "cards": [["How do you create your own class in Python?", "class User: then an indented body. It's a colon (:) after the name, not a semicolon."], ["What happens if a class or function body is empty, and how do you fix it?", "You get an \"Indent Expected\" error. Put pass in the body; it just continues to the next line."], ["PascalCase vs camelCase vs snake_case?", "PascalCase: every word capitalized (classes, e.g. User). camelCase: first word lowercase, later words capitalized (rare in Python). snake_case: all lowercase with underscores (pretty much everything else)."], ["What is an attribute, and how can you add one to an object?", "A variable associated with an object. Dot notation: user_1.id = \"001\". Doing that one by one for every object is repetitive and typo-prone."], ["What is a constructor, and what is it called in Python?", "The part of the blueprint that says what happens when an object is constructed (initialized). In Python it's the special __init__ function (two underscores each side)."], ["When does __init__ run?", "Every time a new object is created from the class. A print inside it runs once per object."], ["What is self in __init__?", "The actual object being created/initialized. Extra parameters go after self, and the data passed in sets the attributes."], ["Write an __init__ that sets id and username from parameters.", "def __init__(self, user_id, username):     self.id = user_id     self.username = username Then user_1 = User(\"001\", \"angela\") does it in 1 line instead of 3."], ["Once __init__ has parameters, what happens with User()?", "Error: missing 2 required positional arguments. You must pass them when creating the object."], ["How do you give every object a default attribute value?", "Set it in __init__ without a parameter, e.g. self.followers = 0. Every object starts at 0."], ["What's a method, and what must its first parameter be?", "A function attached to an object (what it does). The first parameter is always self so it knows which object called it, e.g. def enter_race_mode(self): self.seats = 2."], ["After user_1.follow(user_2), what are the followers/following counts?", "user_1: followers 0, following 1. user_2: followers 1, following 0. (follow does user.followers += 1 and self.following += 1.)"], ["In the Quiz Game, what does the Question class hold?", "text and answer: def __init__(self, q_text, q_answer): self.text = q_text; self.answer = q_answer. E.g. Question(\"2 + 3 = 5\", \"True\")."], ["How do you build question_bank in main.py?", "question_bank = []; for question in question_data: make Question(question[\"text\"], question[\"answer\"]) and question_bank.append(new_question)."], ["Why does next_question increase question_number after grabbing the current question?", "Lists start at index 0, so grab self.question_list[self.question_number] first, then += 1. The prompt then shows Q.1, not Q.0."], ["What's the simplest still_has_questions?", "return self.question_number < len(self.question_list). The comparison itself is True/False, so no if/else needed. Never hardcode return False."], ["How do you keep asking questions until the quiz ends?", "while quiz.still_has_questions(): quiz.next_question(). Use the existing quiz object, call the method with (), and check it in the while line so it updates every loop."], ["How should QuizBrain get the question list?", "As an __init__ parameter: self.question_list = q_list, with quiz = QuizBrain(question_bank) in main.py. Don't import question_bank into quiz_brain."], ["Question object: question[\"text\"] or question.text?", "question.text. Dict keys are for dictionaries; objects use dot-notation attributes."], ["Why is switching to Open Trivia DB data easy (modularity)?", "Only main.py knows the data format (now question[\"question\"] and question[\"correct_answer\"]). QuizBrain is untouched; it doesn't care where data comes from."]]}, {"day": 18, "cards": [["How do you create a turtle and keep its window open until a click?", "from turtle import Turtle, Screen; tim = Turtle(); screen = Screen(). Put screen.exitonclick() after the drawing code, at the bottom."], ["Do you need to memorize every turtle method? What should you do when stuck?", "Look up the task with Python and Stack Overflow in your search, then read the relevant method in the official documentation to understand its inputs and behavior."], ["How do you change Tim's shape and color?", "tim.shape(\"turtle\") changes its appearance; tim.color(\"red\") sets its pen and fill color. Use the docs to check supported shapes and color names."], ["What do tim.forward(100) and tim.right(90) do?", "forward(100) moves 100 paces in the current direction. right(90) turns clockwise by 90 degrees; from East, that faces South."], ["import turtle vs from turtle import Turtle: how do you create Tim?", "import turtle: tim = turtle.Turtle(). With from turtle import Turtle: tim = Turtle(). The from-import form avoids repeating the module name."], ["How does an import alias work, and why avoid import *?", "import turtle as t lets you write t.Turtle(). from turtle import * imports everything, making it hard to see where names came from; prefer explicit imports."], ["Why can turtle import immediately, while an external package may need installing?", "turtle comes with the Python standard library. External packages such as colorgram must be installed before you import them; otherwise you can get \"No module named ...\"."], ["What is the project virtual environment, and what is the pip install caution?", "The .venv is a per-project sandbox for Python and packages, not a global software install. pip install can target the wrong environment; install into the environment your project uses, as with PyCharm's project interpreter."], ["How does draw_shape(num_sides) draw a regular polygon?", "Calculate angle = 360 / num_sides once. Repeat num_sides times: tim.forward(100), then tim.right(angle). A pentagon turns 72 degrees each time."], ["Which range draws shapes with 3 through 10 sides, and why?", "range(3, 11). The start is included but the stop is excluded, so the values are 3 through 10."], ["What headings give the four random-walk directions?", "0 = East, 90 = North, 180 = West, 270 = South. Use tim.setheading(random.choice([0, 90, 180, 270])) and move a fixed distance each step."], ["How do you make the random-walk line thicker and animate faster?", "tim.pensize(15) sets the pen width (width is another name for it). tim.speed(\"fastest\") speeds up drawing; set these before the repeated steps."], ["How is a tuple different from a list, and how do you read a tuple item?", "A tuple such as (1, 3, 8) is ordered like a list but immutable: its items cannot be reassigned or removed. Read with my_tuple[2] (8). Use list(my_tuple) if you need an editable list."], ["What must you set before using turtle RGB values from 0 to 255?", "Call turtle.colormode(255) on the module (or t.colormode(255) if aliased). Colors can then use (r, g, b) with each component from 0 to 255."], ["How does random_color() produce an RGB tuple?", "Set r, g, and b with separate random.randint(0, 255) calls, then return (r, g, b). Use tim.color(random_color()) to apply the returned color."], ["Which methods draw and tilt the circles in a spirograph?", "tim.circle(100) draws a circle of radius 100. tim.heading() reads the current direction; tim.setheading(tim.heading() + size_of_gap) changes it before the next circle."], ["What loop count does the spirograph use, and why is int() needed?", "range(int(360 / size_of_gap)). Division returns a float even when it divides cleanly, but range needs an integer. A 5-degree gap gives 72 circles."], ["What does colorgram.extract need, and what does it give you?", "An image filename and the number of colors, e.g. colorgram.extract(\"image.jpg\", 30). It returns color objects to loop over; use their rgb components to build the turtle palette."], ["How do you append one extracted RGB color as a tuple?", "For each color: r = color.rgb.r; g = color.rgb.g; b = color.rgb.b; then rgb_colors.append((r, g, b)). The inner parentheses group the three values as one tuple."], ["Why remove near-white colors and comment out the colorgram extraction afterward?", "Near-white RGB components are close to 255 and often come from the image background. Remove those shades, keep the useful palette as color_list, and comment out extraction so it need not run every time."], ["What are the Hirst painting requirements and the dot-drawing calls?", "Draw 10 by 10 dots (100 total), size 20, moving 50 paces between centers. Use tim.dot(20, random.choice(color_list)) and tim.forward(50). tim.penup() prevents connecting lines; tim.hideturtle() hides the arrow."], ["In the lesson's Hirst solution, when and how does Tim move to a new row?", "After every tenth dot: if dot_count % 10 == 0. Face 90 and move 50; face 180 and move 500; face 0 again. Use range(1, number_of_dots + 1) to include the hundredth dot."]]}, {"day": 19, "cards": [["What is an event listener, and what does screen.listen() do?", "Code that waits for something the user does, like pressing a key. screen.listen() tells the turtle screen to start listening and waiting for those events."], ["How do you make the space bar move Tim forward 10 paces?", "def move_forwards(): tim.forward(10). Then screen.listen() and screen.onkey(fun=move_forwards, key=\"space\"). Add screen.exitonclick() so the window stays open."], ["What kind of function does onkey expect, and which keys can you use?", "A function with no arguments, plus a key: a letter like \"a\" or a key symbol like \"space\", \"Up\", or \"Down\"."], ["Why write fun=move_forwards and not fun=move_forwards()?", "move_forwards() runs the function right there and then. move_forwards (no parentheses) hands the function over, so onkey can run it later, only when the key is pressed."], ["When you pass a function into another function, what do you write?", "Only its name, without parentheses, e.g. function_a(function_b)."], ["What is a higher order function?", "A function that works with other functions, e.g. one that takes another function as an input and uses it inside its body. onkey is one."], ["How does the lesson's calculator(n1, n2, func) work?", "Inside, it calls the function passed in: return func(n1, n2). calculator(2, 3, add) gives 5; calculator(2, 3, multiply) gives 6."], ["Why use keyword arguments like onkey(fun=..., key=...)?", "For methods you didn't write, keywords make clear which value is which, especially when the order of the inputs has no meaning."], ["What are the Etch-A-Sketch controls?", "W forwards, S backwards, A turns counterclockwise (left), D turns clockwise (right), C clears the drawing and puts the turtle back in the center."], ["Why does Etch-A-Sketch need four separate movement functions?", "onkey only takes a function with no arguments, so you can't pass a distance or angle in. Each key gets its own: move_forwards, move_backwards, turn_left, turn_right."], ["Two ways to turn Tim left by 10 degrees?", "tim.setheading(tim.heading() + 10) or tim.left(10). Adding to the heading turns left (0 = East, 90 = North). For right: subtract 10, or tim.right(10)."], ["tim.clear() vs screen.clear(): which does Etch-A-Sketch use?", "tim.clear(). The turtle's clear deletes only that turtle's drawings. The screen's clear deletes everything on screen, including the turtle."], ["How does the C key send Tim back to the center without drawing a line?", "tim.clear(), then tim.penup(), tim.home() (moves to the origin in the middle), then tim.pendown() ready for the next drawing."], ["What should you do when you can't find a method like home or clear?", "Read through the turtle docs patiently. Add one piece at a time, run the code, check it does what you want, and fix it if not."], ["What does a class (blueprint) define, and how many objects can it make?", "What an object has (attributes) and what it can do (methods). You can construct as many objects as you need from it, e.g. timmy, tommy, jenny."], ["What is an instance?", "One object built from a class. timmy and tommy are both instances of Turtle, and each works completely independently of the other."], ["What is an object's state?", "Its attribute values and what it is doing at a given moment. timmy's color can be green while tommy's is purple; timmy can be moving while tommy stands still."], ["What is the upcoming turtle race idea?", "Several separate Turtle instances, each with its own state, racing independently to see who reaches the finish line first."], ["How do you set the race window to 500 wide and 400 high, and why use keywords?", "screen.setup(width=500, height=400). Keywords make it clear which number is the width and which is the height to someone reading your code."], ["How do you ask the user for their bet in a popup?", "user_bet = screen.textinput(title=\"Make your bet\", prompt=\"Which turtle will win the race? Enter a color: \"). It returns the typed string, like input(). numinput is for numbers."], ["In a 500 x 400 turtle window, what are the x and y ranges?", "The center is (0, 0). x goes from -250 (left edge) to 250 (right edge); y from -200 (bottom) to 200 (top). Each is half the width or height."], ["In the 500 x 400 window, what is the point halfway right and halfway up?", "(125, 100): half of 250 is 125 and half of 200 is 100."], ["Which method moves a turtle straight to a spot, and why use it over backward?", "goto(x, y). With several turtles, backward would send them all to the same place; goto lets each go to its own position."], ["Why did the lesson start turtles at x = -230 instead of -250?", "At -250 the turtle sits on the very edge and can't be seen. Shifting it right a little keeps it visible at the start."], ["How do you create a turtle that already has the turtle shape and won't draw lines?", "new_turtle = Turtle(shape=\"turtle\"), then new_turtle.penup(). The pen is never put down because only the turtles moving matters."], ["How does the setup loop give six turtles their own color and start?", "for turtle_index in range(0, 6): new_turtle.color(colors[turtle_index]) and new_turtle.goto(x=-230, y=y_positions[turtle_index]). y_positions = [-70, -40, -10, 20, 50, 80]; same x so nobody gets a head start."], ["Why start with is_race_on = False and set it True after the bet?", "So the while loop doesn't start while the user is still choosing. if user_bet: is_race_on = True, then while is_race_on: runs the race."], ["Why put each turtle in all_turtles, and why rename tim to new_turtle?", "Each loop makes a separate instance; all_turtles.append(new_turtle) keeps hold of all of them so you can move each later. They're individual turtles, so tim no longer fits."], ["What range can random.randint(0, 10) give?", "Any whole number from 0 to 10. randint includes both ends."], ["How does each race step move the turtles by different amounts?", "Inside while is_race_on: for turtle in all_turtles: rand_distance = random.randint(0, 10); turtle.forward(rand_distance). Each turtle gets its own random distance."], ["How does the race check for a winner, and why 230?", "if turtle.xcor() > 230. The right edge is 250; in the lesson the turtle is 40 pixels wide, so subtract half its width (20)."], ["turtle.color() vs turtle.pencolor() when reading a color?", "color() with no input returns two values, the pen color and the fill color. pencolor() returns just the pen color, so winning_color = turtle.pencolor()."], ["How does the race say whether you won?", "if winning_color == user_bet: print that you've won and the winning color; else: print that you've lost and the winning color."], ["How does the race stop after a winner?", "Inside the if, set is_race_on = False. The while loop checks it next time and stops, so the remaining turtles don't keep nudging forward and create more winners."], ["How does the race show instances and state?", "All six turtles come from the Turtle class but are separate instances with different state: their own color, y position, and distance moved."]]}, {"day": 20, "cards": [["How do you set the snake window to 600 by 600 and keep it open?", "Create a Screen, then screen.setup(width=600, height=600). Keyword arguments make clear which number is width and which is height. screen.exitonclick() at the bottom keeps the window from disappearing."], ["How do you make the window black and title it My Snake Game?", "screen.bgcolor(\"black\") and screen.title(\"My Snake Game\"). The title shows at the top of the window."], ["How big is each snake segment, and what should it look like?", "Each is a Turtle with shape \"square\", 20 pixels wide by 20 pixels tall, and colored white so it shows up on the black background."], ["Why set a new square's color to white?", "A new turtle is black by default. On a black screen you won't see it until you change its color to white."], ["Where do the three starting segments go, and why those coordinates?", "(0, 0), (-20, 0), and (-40, 0). Each one sits 20 pixels to the left of the last so they line up with no overlap and no gaps."], ["How do you create the three segments with a loop instead of copied code?", "Make a starting_positions list of tuples: (0, 0), (-20, 0), (-40, 0). Then for position in starting_positions: create a white square turtle and goto(position)."], ["Why keep the segments in a list and append each new one?", "So you can organize them and loop through all of them later to move the snake. Start with segments = [] and append each segment after you create it."], ["Why call penup() before goto when you create a segment?", "Without it, each turtle draws a line as it moves. penup() stops the drawing so you only see the square pieces."], ["Why can you see a new segment appear at (0, 0) before it jumps to its start position?", "A new Turtle is created at the center (0, 0) first, then moved with goto. That animation shows unless you turn it off."], ["What do screen.tracer(0) and screen.update() do?", "tracer(0) turns screen animation off. The display stays unchanged until you call update(), which refreshes and redraws the screen when you want."], ["What do you see if tracer is off and you never call update()?", "Just a black screen. The while loop can be running, but nothing appears until update() refreshes the screen."], ["How is update() like an old CRT TV or a GIF?", "A CRT painted one full picture, then started the next frame at the top. A GIF is many still images played quickly. You move the snake, then call update() to show the next picture."], ["Where should update() and time.sleep() go so the snake looks like one piece?", "Outside the for loop, after every segment has moved. Then the screen refreshes once per step. time.sleep(0.1) after that gives a reasonable speed."], ["What goes wrong if you just forward(20) every segment, then turn the head?", "The segments aren't linked. The head changes heading, but the body keeps moving in its old direction, so the head leaves the body behind."], ["How should the snake move so the tail follows the head?", "Work from the back: the last segment goes to where the second-to-last is, that one goes to the one in front, and so on. Then, outside the loop, the head (segments[0]) moves forward 20 paces."], ["How do you write that reverse loop so it still works if the snake gets longer?", "for seg_num in range(len(segments) - 1, 0, -1). Start at the last index (length minus 1), stop before 0, and step -1. new_x and new_y come from segments[seg_num - 1].xcor() and ycor(); then that segment goto those coordinates."], ["Why can't you call range(start=..., stop=..., step=...) with those names?", "range comes from the C language, not pure Python, so it takes no keyword arguments. Write the three numbers in order: range(len(segments) - 1, 0, -1)."], ["What is the goal of moving the snake into its own class?", "Put all snake appearance and behavior in a Snake class in snake.py. main.py just creates snake = Snake() and calls snake.move() in the loop. The program should behave exactly the same; only the organization changes."], ["How should class names and constants be written?", "Class names are PascalCase, like Snake. Constants are ALL_CAPS with underscores, e.g. STARTING_POSITIONS and MOVE_DISTANCE = 20, and they live at the top of the file."], ["What happens in Snake's __init__ and create_snake()?", "__init__ sets self.segments = [] and calls create_snake(). create_snake() loops through STARTING_POSITIONS, makes each segment, and appends it to self.segments. snake.py needs from turtle import Turtle."], ["Why write self.segments inside the class, not just segments?", "segments is an attribute of the snake object. Inside the class you must use self to refer to it, including when you append a segment and when you move."], ["Why put MOVE_DISTANCE = 20 at the top as a constant?", "So you can tweak the game (a different start position, or a bigger step) from the top of the file, without digging through the body of the code."], ["Why might the console show a KeyboardInterrupt or traceback when you hit stop?", "There's no game-over sequence yet, so the only way to stop the snake is the stop button. Those red messages are normal. What matters is that the snake still moves like it did before the refactor."], ["How do you bind the arrow keys so they steer the snake?", "After snake = Snake(), call screen.listen(), then onkey with fun=snake.up and key=\"Up\", and the same for \"Down\", \"Left\", and \"Right\". Pass the methods without parentheses so they run later, when the key is pressed. The snake keeps moving forward; the keys only change its direction."], ["What heading numbers are up, down, left, and right?", "Headings go counterclockwise from 0, which is East. UP is 90 (North), LEFT is 180, DOWN is 270 (South), and RIGHT is 0."], ["When should you set self.head = self.segments[0], and why?", "After create_snake() has built the segments. If you do it before, the list is still empty and getting index 0 will error. Then use self.head in move() and in the direction methods."], ["How do the up, down, left, and right methods turn the snake?", "They call setheading on the head, e.g. self.head.setheading(UP). Only the head's heading changes; the body follows because each segment keeps stepping into the position in front."], ["Why put pass in empty methods like down, left, and right while you test up?", "Python doesn't allow a completely empty function. pass lets those methods exist so the program can run while you try one direction first."], ["How do you stop the snake from reversing into itself?", "Only set the new heading if the head isn't already going the opposite way. Example: if self.head.heading() != DOWN: self.head.setheading(UP). Same idea for the other three directions."], ["Why write heading() with parentheses, not just self.head.heading?", "heading is a method on the turtle (the head is the first segment). Without (), you don't get the current direction number, so the no-reverse check won't work."], ["What direction constants go at the top, and why use them?", "UP = 90, DOWN = 270, LEFT = 180, and RIGHT = 0. Use them in setheading and in the != checks so those numbers live in one place."]]}, {"day": 21, "cards": [["What is class inheritance?", "Taking an existing class and building on top of it instead of starting from scratch. A Pastry Chef can inherit what a Chef already knows how to do (bake, stir, measure) and then add extras like kneading dough or whisking eggs."], ["What two kinds of things can a class inherit from another class?", "Appearance and behavior. Appearance means attributes (like the same eyes as your mother), and behavior means methods (like chopping tomatoes the same way your dad does)."], ["How do you make a Fish class inherit from an Animal class?", "Put the parent class in parentheses after the class name: class Fish(Animal):"], ["What does super().__init__() do inside the Fish class's __init__?", "It runs the initializer of the superclass (Animal), so everything made from Fish gets all of Animal's attributes and methods. super refers to the superclass."], ["After Fish inherits from Animal, what can nemo = Fish() do that it couldn't before?", "It can call nemo.breathe() and print \"Inhale, exhale\", and print(nemo.num_eyes) gives 2. Both come from the Animal super
