class, on top of Fish's own nemo.swim()."], ["How do you keep a parent's breathe() but add something extra in Fish?", "Define breathe() again in Fish, call super().breathe() first to do everything the Animal version does, then add the extra part, like printing \"doing this underwater\"."], ["Why is inheritance useful, according to the lesson?", "You can take a class that you or somebody else made and build on it without reinventing the wheel or redefining everything in that class. Next it's used to upgrade Turtle into Food and a Scoreboard."], ["How should the Food class get its turtle powers?", "Inherit from Turtle with class Food(Turtle): and call super().__init__() in Food's __init__. Don't make a turtle attribute like self.food = Turtle(); Food itself should be a souped-up turtle."], ["How do you make the food a 10 by 10 circle?", "A turtle is normally 20 by 20, so use shapesize with stretch_len=0.5 and stretch_wid=0.5 to halve both the length and the width."], ["Why set the food's speed to \"fastest\"?", "So you don't watch the animation of the food being created at the center and then moving to its spot."], ["Why pick the food's spot with random.randint(-280, 280) instead of -300 to 300?", "The 600 by 600 screen goes from -300 to 300, but food right at the edge is really hard to reach and the snake would probably just die on the wall. So stay in -280 to 280 for both x and y."], ["How does main.py detect that the snake ate the food?", "In the game loop after snake.move(), check if snake.head.distance(food) < 15. The food is 10 by 10, so 15 adds a little buffer. The lesson first printed \"nom nom nom\" to test it."], ["Why is the food's move method called refresh() and not reset()?", "reset is already a method of the Turtle class Food inherits from. refresh() is our own method that picks a new random x and y and goes there. Call self.refresh() in __init__ and food.refresh() in main.py when the head hits the food."], ["Does the food lesson make the snake grow when it eats?", "No. Growing is left until the very end of the project, together with detecting collision with the tail."], ["What is the scoreboard, and how is it built?", "A Scoreboard class in scoreboard.py that inherits from Turtle (class Scoreboard(Turtle): with super().__init__()). It keeps self.score starting at 0 and writes it on screen with self.write."], ["How should the font argument in write() be written?", "As a tuple of name, size, and style, like (\"Arial\", 24, \"normal\"), not one single string. The size is a number and the name and style are strings."], ["Why must the scoreboard turn white before it writes?", "Text keeps the color the turtle had when it was written. If it writes in black and then turns white, the text stays black and you can't see it on the black screen."], ["How do you put the score at the top center without a line or arrow?", "Before writing: hideturtle() so the arrow disappears, penup() so it doesn't draw a path, then go to x 0 and y around 270. Moving after write is too late."], ["What does increase_score() do, and where is it called?", "It adds 1 to self.score and writes the score again. main.py calls scoreboard.increase_score() inside the food-collision if, next to food.refresh()."], ["Why did the scores pile up on top of each other, and what's the fix?", "Each new score was written over the old one. Call self.clear() to wipe this turtle's previous text before writing the new score."], ["Why pull the write into an update_scoreboard() method?", "The same write line was needed in two places, __init__ and increase_score. Now both call self.update_scoreboard() instead."], ["Why make ALIGNMENT and FONT constants at the top of scoreboard.py?", "So the text settings aren't hard-coded in the body. To change something, like switching Arial to the more video-gamey Courier, you just fix it at the top."], ["How do you detect the snake hitting the wall?", "Check if snake.head's x is greater than 280 or less than -280, or its y is greater than 280 or less than -280. If any of the four is true, the snake hit the wall: set game_is_on = False to leave the while loop so the snake stops."], ["Why 280 for the wall instead of 300?", "The screen goes to 300 and -300, and 280 is just what worked after a lot of testing. It isn't perfect; with games you test it, run it, and adjust."], ["What does the scoreboard's game_over() method do?", "It goes to the center (0, 0) and writes \"GAME OVER\" with the same alignment and font as the score."], ["Why doesn't game_over() call clear() first?", "So the score written earlier stays at the top. The player sees GAME OVER and their final score."], ["What does add_segment(position) do, and how does create_snake use it?", "It holds the code that creates one segment at a given position, pulled out of the create_snake for loop. create_snake now loops the starting positions and calls self.add_segment(position)."], ["How does extend() know where to put the new segment?", "It adds a segment at the same position as the last one: self.segments[-1].position(). -1 counts from the end, so [1, 2, 3][-1] is 3, and position() is a Turtle method so it needs parentheses."], ["What changes in main.py so the snake grows?", "In the food-collision if, call snake.extend() along with food.refresh() (and the score increase)."], ["How do you detect the head hitting the tail?", "Loop through the segments, and if snake.head.distance(segment) < 10, set game_is_on = False and call scoreboard.game_over()."], ["Why does looping over every segment cause instant game over?", "The head is the first segment, so the loop checks the head's distance to itself, which is always less than 10. Skip the head: if segment == snake.head: pass, then elif for the distance check."], ["What is slicing?", "Getting a section of a list (or tuple) with square brackets and a start and end position, like piano_keys[2:5], instead of writing a loop that checks each item."], ["Why does piano_keys[2:5] give c, d, e and not f?", "Picture the positions as cuts between items: 0 is before a and 7 is after g. Slicing from cut 2 to cut 5 keeps c, d, e. The end position isn't included."], ["What do piano_keys[2:] and piano_keys[:5] give?", "Omit the end, [2:], to get everything from position 2 to the end. Omit the start, [:5], to get everything from the beginning up to position 5."], ["What does a third number in a slice do?", "It sets the increment. [2:5:2] gives c and e (every other item), and [::2] goes through the whole list taking every second item: a, c, e, g."], ["How do you reverse a list with slicing?", "Use -1 as the increment: [::-1]. It goes from the end back to the beginning."], ["Does slicing work on tuples?", "Yes, the same square-bracket slicing works. The lesson's piano tuple sliced [2:5] gave mi, fa, so."], ["How does slicing replace the if/pass in the tail check?", "Loop over the segments from position 1 to the end, for segment in snake.segments[1:]:, so the head is left out. Then one single if checks head.distance(segment) < 10."]]}];
const QUIZZES=[{"day": 1, "questions": [{"q": "What does this print?\n\nfood = \"tacos\"\nprint(food)", "choices": ["food", "tacos", "\"tacos\"", "NameError"], "answer": 1, "explain": "No quotes around food, so Python looks up the variable and prints its value."}, {"q": "What is len(\"pizza\")?", "choices": ["4", "5", "6", "pizza"], "answer": 1, "explain": "Count every character: p-i-z-z-a = 5."}, {"q": "You forget the closing quote: print(\"Hello). Which error do you get?", "choices": ["NameError", "IndentationError", "SyntaxError", "TypeError"], "answer": 2, "explain": "A missing quote breaks Python's grammar, which is a SyntaxError."}, {"q": "What does print(\"Hello\" + \"John\") output?", "choices": ["Hello John", "HelloJohn", "Hello + John", "Error"], "answer": 1, "explain": "+ glues strings together exactly; it doesn't add a space."}, {"q": "Which variable name is valid?", "choices": ["user name", "2nd_place", "user_name", "print"], "answer": 2, "explain": "Use underscores instead of spaces, don't start with a number, and avoid built-in names like print."}, {"q": "In print(len(input(\"Name? \"))), which runs first?", "choices": ["print()", "len()", "input()", "They all run at once"], "answer": 2, "explain": "Python works inside out: input(), then len(), then print()."}, {"q": "What causes a NameError?", "choices": ["A missing quote", "Using a variable that was never defined (often a typo)", "A space at the start of a line", "Adding a string to a number"], "answer": 1, "explain": "Python doesn't recognize the name, usually because it's misspelled or was never created."}]}, {"day": 2, "questions": [{"q": "What is \"Hello\"[0]?", "choices": ["H", "e", "o", "Error"], "answer": 0, "explain": "Indexes start at 0, so [0] is the first character."}, {"q": "What does print(\"5\" + \"3\") output?", "choices": ["8", "53", "5 3", "TypeError"], "answer": 1, "explain": "Both are strings (in quotes), so + joins them."}, {"q": "Why does print(\"Letters: \" + len(name)) crash?", "choices": ["len() needs quotes", "You can't add a string and an int", "name isn't a string", "print can't take +"], "answer": 1, "explain": "len() returns an int. Wrap it in str() or use an f-string."}, {"q": "What is 7 // 2?", "choices": ["3.5", "3", "4", "1"], "answer": 1, "explain": "// is floor division: it drops the decimal part."}, {"q": "What is 2 + 3 * 4?", "choices": ["20", "14", "24", "9"], "answer": 1, "explain": "Multiplication happens before addition: 3 * 4 = 12, then + 2 = 14."}, {"q": "Your customer's tax rate is 8%. Which line correctly adds tax to materials?", "choices": ["materials * 8", "materials * 8 / 100", "materials * (8 / 100 + 1)", "materials + 8"], "answer": 2, "explain": "8 / 100 + 1 = 1.08. Multiplying by 1.08 adds 8% on top. Multiplying by 8 would make it 8 times as much."}, {"q": "price = 33.6. Which line prints 33.60?", "choices": ["print(round(price, 2))", "print(f\"{price:.2f}\")", "print(int(price))", "print(str(price))"], "answer": 1, "explain": "round() drops trailing zeros; :.2f always shows two decimals."}, {"q": "What does score += 5 do?", "choices": ["Sets score to 5", "Adds 5 to score", "Checks if score equals 5", "Error"], "answer": 1, "explain": "It's short for score = score + 5."}]}, {"day": 3, "questions": [{"q": "height = 120. What prints?\n\nif height > 120:\n    print(\"Ride!\")\nelse:\n    print(\"Too short\")", "choices": ["Ride!", "Too short", "Both", "Nothing"], "answer": 1, "explain": "> means strictly greater, so 120 isn't > 120. Use >= to include it."}, {"q": "Which line checks if age equals 18?", "choices": ["if age = 18:", "if age == 18:", "if age === 18:", "if age equals 18:"], "answer": 1, "explain": "= assigns a value; == compares two values."}, {"q": "What is 17 % 5?", "choices": ["3", "2", "3.4", "0"], "answer": 1, "explain": "5 goes into 17 three times (15), leaving 2."}, {"q": "Which condition is True only for even numbers?", "choices": ["number % 2 == 1", "number / 2 == 0", "number % 2 == 0", "number // 2 == 0"], "answer": 2, "explain": "Even numbers have no remainder when divided by 2."}, {"q": "What's missing here?\n\nif pipe_size >= 2\n    print(\"Use the big wrench\")", "choices": ["Quotes around 2", "A colon after the condition", "An else", "Parentheses around print"], "answer": 1, "explain": "Every if (and else) line needs a colon at the end."}, {"q": "How does Python know which lines belong inside an if block?", "choices": ["Curly braces", "They're on the same line", "Indentation", "The word end"], "answer": 2, "explain": "Lines indented under the if are inside it."}, {"q": "What does != mean?", "choices": ["Not equal to", "Equal to", "Greater than", "Assign"], "answer": 0, "explain": "!= is True when the two values are different."}, {"q": "age = 15. What prints?\n\nif age < 12:\n    print(\"$5\")\nelif age <= 18:\n    print(\"$7\")\nelse:\n    print(\"$12\")", "choices": ["$5", "$7", "$12", "$7 and $12"], "answer": 1, "explain": "15 isn't < 12, so Python moves to the elif. 15 <= 18 is True, so it prints $7 and skips the else."}, {"q": "height = 110. What prints?\n\nif height >= 120:\n    age = int(input(\"Age? \"))\n    if age <= 18:\n        print(\"$7\")\n    else:\n        print(\"$12\")\nelse:\n    print(\"Too short\")", "choices": ["$7", "$12", "Too short", "It asks for your age first"], "answer": 2, "explain": "The outer check fails, so Python never goes into the nested block. It goes straight to the outer else."}, {"q": "age = 10. What prints?\n\nif age <= 18:\n    print(\"$7\")\nelif age < 12:\n    print(\"$5\")\nelse:\n    print(\"$12\")", "choices": ["$5", "$7", "$5 and $7", "$12"], "answer": 1, "explain": "10 <= 18 is True, so Python runs the first block and skips the rest. That's why the under-12 check has to come first."}, {"q": "bill = 12. The user types y. What prints?\n\nwants_photo = input(\"Photo? y/n \")\nif wants_photo == \"y\":\n    bill += 3\nprint(f\"Bill: ${bill}\")", "choices": ["Bill: $12", "Bill: $15", "Bill: $3", "Nothing prints"], "answer": 1, "explain": "The condition is True, so bill += 3 makes it 15. The print isn't indented, so it runs either way."}, {"q": "Same code, but the user types n. What prints?\n\nwants_photo = input(\"Photo? y/n \")\nif wants_photo == \"y\":\n    bill += 3\nprint(f\"Bill: ${bill}\")", "choices": ["Bill: $12", "Bill: $15", "An error, because there's no else", "Nothing prints"], "answer": 0, "explain": "The if is skipped, so bill stays 12. You don't need an else when nothing should happen."}, {"q": "x = 15. How many lines print?\n\nif x > 10:\n    print(\"A\")\nif x > 5:\n    print(\"B\")\nif x > 1:\n    print(\"C\")", "choices": ["1 (just A)", "2", "3 (A, B, and C)", "0"], "answer": 2, "explain": "These are separate ifs, so Python checks each one. All three are True, so A, B, and C all print."}, {"q": "Same check, but written with elif. x = 15. What prints?\n\nif x > 10:\n    print(\"A\")\nelif x > 5:\n    print(\"B\")\nelif x > 1:\n    print(\"C\")", "choices": ["A", "A, B, and C", "C", "B"], "answer": 0, "explain": "With elif, Python stops at the first True condition, so only A prints."}, {"q": "a = 12. What is the result?\n\na > 10 and a < 13", "choices": ["True", "False", "12", "Error"], "answer": 0, "explain": "12 > 10 is True and 12 < 13 is True. Both are True, so and gives True."}, {"q": "a = 12. What is the result?\n\na > 15 or a < 10", "choices": ["True", "False"], "answer": 1, "explain": "Both sides are False. or is only False when both are False."}, {"q": "What is not (5 > 3)?", "choices": ["True", "False", "5", "Error"], "answer": 1, "explain": "5 > 3 is True, and not flips it to False."}, {"q": "Which condition catches ages 45 to 55, including 45 and 55?", "choices": ["age > 45 and age < 55", "age >= 45 or age <= 55", "age >= 45 and age <= 55", "not age < 45"], "answer": 2, "explain": "You need both conditions to be true, so use and with >= and <=. Using or would be true for every age."}, {"q": "A plumbing job is urgent if it's a burst pipe OR there's no water. Which line is right?", "choices": ["if burst_pipe and no_water:", "if burst_pipe or no_water:", "if not burst_pipe:", "if burst_pipe == no_water:"], "answer": 1, "explain": "Either one alone makes the job urgent, so use or. and would require both at once."}]}, {"day": 4, "questions": [{"q": "What can random.randint(1, 6) return?", "choices": ["1 through 5", "1 through 6", "0 through 6", "Any decimal between 1 and 6"], "answer": 1, "explain": "randint includes both ends, so 1 and 6 can both come up."}, {"q": "Which value can random.random() NEVER return?", "choices": ["0", "0.5", "0.999", "1"], "answer": 3, "explain": "random.random() includes 0 but stops just below 1."}, {"q": "What's wrong with this code?\n\nnumber = random.randint(1, 10)\nprint(number)", "choices": ["randint should be RandInt", "It's missing import random at the top", "The range should be 0 to 10", "Nothing"], "answer": 1, "explain": "You need import random before Python knows what random means. Without it you get a NameError."}, {"q": "What prints?\n\ntools = [\"wrench\", \"plunger\", \"snake\"]\nprint(tools[1])", "choices": ["wrench", "plunger", "snake", "Error"], "answer": 1, "explain": "Index 0 is wrench, so index 1 is plunger."}, {"q": "jobs = [\"drain\", \"leak\"]. Which line adds \"water heater\" to the end?", "choices": ["jobs + \"water heater\"", "jobs[2] = \"water heater\"", "jobs.append(\"water heater\")", "jobs.extend(\"water heater\")"], "answer": 2, "explain": "append() adds one item to the end. jobs[2] = ... would crash because there's no index 2 yet."}, {"q": "Which line safely prints the last item in tools?", "choices": ["print(tools[len(tools)])", "print(tools[len(tools) - 1])", "print(tools[len(tools) + 1])", "print(tools[0])"], "answer": 1, "explain": "The last index is always len - 1. tools[-1] works too. Using len(tools) alone causes an IndexError."}, {"q": "What's wrong with this line?\n\nchoice = input(\"Left or Right? \".lower())", "choices": ["input() can't take a prompt", ".lower() is on the prompt string, not on what input() returns", "You need import string first", "Nothing"], "answer": 1, "explain": "The dot attaches to whatever sits right before it. Here that's the prompt text. Put .lower() after the whole input(...) call so it lowercases the player's answer."}, {"q": "Why does this fail when the user types 65?\n\nage = input(\"Age? \")\nif age >= 65:\n    print(\"Senior\")", "choices": ["65 is too big for a comparison", "input() returns a string, so you must convert before comparing to a number", "You need elif instead of if", "Nothing, it works"], "answer": 1, "explain": "input() always returns a string. Convert with int(age) or int(input(...)) before a numeric comparison."}]}, {"day": 5, "questions": [{"q": "What prints?\n\ntools = [\"wrench\", \"plunger\", \"snake\"]\nfor tool in tools:\n    print(tool)", "choices": ["wrench, plunger, snake (one per line)", "[\"wrench\", \"plunger\", \"snake\"] three times", "tool, tool, tool", "Only snake"], "answer": 0, "explain": "The loop variable tool holds one item at a time, so each item prints once, in order."}, {"q": "How many times does \"Done\" print?\n\njobs = [\"drain\", \"leak\", \"heater\"]\nfor job in jobs:\n    print(job)\nprint(\"Done\")", "choices": ["0", "1", "3", "4"], "answer": 1, "explain": "print(\"Done\") is not indented, so it's outside the loop and runs once after the loop finishes."}, {"q": "How many times does \"Done\" print now?\n\njobs = [\"drain\", \"leak\", \"heater\"]\nfor job in jobs:\n    print(job)\n    print(\"Done\")", "choices": ["0", "1", "3", "6"], "answer": 2, "explain": "Now print(\"Done\") is indented inside the loop, so it runs once per item: 3 times."}, {"q": "What's the last number printed?\n\nfor number in range(1, 10):\n    print(number)", "choices": ["1", "9", "10", "11"], "answer": 1, "explain": "The end of range is exclusive. range(1, 10) stops before 10, so the last number is 9."}, {"q": "What prints?\n\nfor number in range(0, 10, 3):\n    print(number)", "choices": ["0 3 6 9", "3 6 9", "0 3 6", "1 4 7 10"], "answer": 0, "explain": "Start at 0 and step by 3: 0, 3, 6, 9. The next would be 12, which is past the end."}, {"q": "What prints?\n\ntotal = 0\nfor price in [100, 250, 75]:\n    total += price\nprint(total)", "choices": ["75", "100", "425", "[100, 250, 75]"], "answer": 2, "explain": "total is an accumulator: 0 + 100 = 100, + 250 = 350, + 75 = 425."}, {"q": "nr_letters is 4. How many letters end up in password?\n\npassword = \"\"\nfor i in range(nr_letters):\n    password += random.choice(letters)", "choices": ["1", "3", "4", "5"], "answer": 2, "explain": "range(4) runs 4 times (i = 0, 1, 2, 3), and each pass adds one random letter."}, {"q": "letters = [\"a\", \"b\", \"c\", \"d\", \"e\"] and nr_letters is 3. What does this give?\n\nletters[nr_letters]", "choices": ["3 random letters", "\"d\" (one item at index 3)", "\"c\"", "An IndexError"], "answer": 1, "explain": "Square brackets grab one item at that position. Index 3 is \"d\". To get 3 random letters you need a loop with random.choice."}]}, {"day": 6, "questions": [{"q": "What is the difference between these two lines?\n\ndef fix_leak():\nfix_leak()", "choices": ["They do the same thing", "The first defines (writes the recipe); the second calls (runs it)", "The first calls the function; the second defines it", "The second line is an error"], "answer": 1, "explain": "def writes the recipe. The name plus parentheses runs it."}, {"q": "What prints when you run this file?\n\ndef greet():\n    print(\"Hello\")\n    print(\"Bye\")", "choices": ["Hello then Bye", "Nothing", "greet", "An error"], "answer": 1, "explain": "def only stores the recipe. Nothing runs until you call greet()."}, {"q": "What prints when you run this file?\n\ndef tools():\n    print(\"wrench\")\n    if 3 > 5:\n        print(\"plunger\")\n    print(\"tape\")\nprint(\"done\")\ntools()", "choices": ["wrench, plunger, tape, done", "done, wrench, tape", "wrench, tape, done", "done, wrench, plunger, tape"], "answer": 1, "explain": "print(\"done\") is outside the function and runs first. Then tools() runs its body: wrench, skip plunger (it's inside the if, and 3 > 5 is False), then tape."}, {"q": "What does this print, and why does it stop?\n\ncount = 3\nwhile count > 0:\n    count -= 1\n    print(count)", "choices": ["3, 2, 1 \u2014 stops when count is 0", "2, 1, 0 \u2014 stops because 0 > 0 is False", "3, 2, 1, 0 \u2014 stops after printing 0", "It never stops"], "answer": 1, "explain": "count drops by 1 before each print, so it prints 2, 1, 0. Then the check 0 > 0 is False and the loop ends."}, {"q": "What does this Reeborg code do?\n\nwhile not at_goal():\n    move()", "choices": ["Moves once, then stops", "Never moves, because at_goal() starts False", "Keeps moving until the robot is on the goal", "Moves exactly as many times as there are squares in the world"], "answer": 2, "explain": "not flips the check: keep looping while you are NOT at the goal. Once at_goal() is True, not at_goal() is False and the loop stops."}, {"q": "You need to check pressure on each of 5 fittings in a list. Later, you need to keep pumping until a tank reads empty, but you don't know how long that takes. Which loops fit best?", "choices": ["while for the fittings, for for the tank", "for for the fittings, while for the tank", "for for both", "while for both, always"], "answer": 1, "explain": "for = each item in a list or a known count. while = repeat until a condition changes when you don't know how many times."}, {"q": "Why does this loop never stop?\n\ngallons = 10\nwhile gallons > 0:\n    print(gallons)", "choices": ["gallons > 0 is always False", "print() can't be used in a while loop", "gallons never changes, so gallons > 0 stays True forever", "The loop needs a for instead"], "answer": 2, "explain": "Nothing inside the loop changes gallons. Add something like gallons -= 1 so the condition can eventually become False."}, {"q": "In the maze, the robot starts in an open area with no walls nearby and runs the right-hand rule loop. What goes wrong, and what's a fix?\n\nwhile not at_goal():\n    if right_is_clear():\n        turn_right()\n        move()\n    elif front_is_clear():\n        move()\n    else:\n        turn_left()", "choices": ["Nothing goes wrong; the right-hand rule always works", "It crashes because turn_right() isn't built in, so delete it", "Right is always clear, so it circles a small square forever; first walk straight to a wall, then turn_left(), so a wall is on its right", "It moves too fast; add more move() calls"], "answer": 2, "explain": "With nothing to hug, right_is_clear() is always True, so it loops in a square. Walking to a wall and turning left puts a wall on the right before the loop starts."}]}, {"day": 7, "questions": [{"q": "What prints?\n\nprint(\"t\" in \"tee\")\nprint(\"x\" in [\"elbow\", \"tee\"])", "choices": ["True then True", "True then False", "False then True", "An error"], "answer": 1, "explain": "\"t\" is a letter in \"tee\". In a list, in checks whole items, and \"x\" isn't an item."}, {"q": "How many times does \"Guess!\" print?\n\ngame_over = False\nturns = 0\nwhile not game_over:\n    print(\"Guess!\")\n    turns += 1\n    if turns == 3:\n        game_over = True", "choices": ["0", "2", "3", "Forever"], "answer": 2, "explain": "Three passes run. After the third, game_over is True, so not game_over is False and the loop stops."}, {"q": "The player typed \"a\". What prints?\n\nguess = \"a\"\nfor guess in \"pipe\":\n    print(\"checking\")\nprint(guess)", "choices": ["a", "pipe", "e", "p"], "answer": 2, "explain": "The for loop overwrites guess each pass. It ends holding the last letter, \"e\". Your typed letter is gone, so use a different loop name like letter."}, {"q": "What prints on the second pass?\n\ndisplay = \"\"\nfor turn in range(2):\n    for letter in \"ab\":\n        display += \"_\"\n    print(display)", "choices": ["__", "____", "_", "ab"], "answer": 1, "explain": "display was only reset once, before the loop, so turn 2 adds two more blanks: ____. Put display = \"\" inside the outer loop."}, {"q": "What prints?\n\nlives = 0\nwon = True\nif won:\n    print(\"You win!\")\nelif lives == 0:\n    print(\"You lose!\")", "choices": ["You win!", "You lose!", "You win! then You lose!", "Nothing"], "answer": 0, "explain": "Only one branch of an if/elif chain runs. The first one matched, so the elif is skipped even though lives == 0 is true."}, {"q": "Which fix makes BOTH checks run every turn?", "choices": ["Use two separate if statements", "Add another elif", "Swap the order inside the elif chain", "Use else instead of elif"], "answer": 0, "explain": "Separate ifs are each checked on their own. Use elif only when you want exactly one choice."}, {"q": "The player guesses \"z\" (wrong) twice. How many lives are left?\n\nlives = 6\nguessed_letters = []\nfor guess in [\"z\", \"z\"]:\n    if guess not in \"drain\" and guess not in guessed_letters:\n        lives -= 1\n    guessed_letters.append(guess)\nprint(lives)", "choices": ["4", "5", "6", "0"], "answer": 1, "explain": "The first \"z\" costs a life and goes into guessed_letters. The second \"z\" is already in the list, so no life is lost: 5."}, {"q": "stages holds 7 pictures. stages[0] is the full hanged man and stages[6] is the empty gallows. With lives = 2, which picture shows?\n\nprint(stages[lives])", "choices": ["The third picture from the start (stages[2])", "The second picture (stages[1])", "The empty gallows", "An error"], "answer": 0, "explain": "Lists count from 0, so stages[2] is the third item. Fewer lives means a lower index and more of the drawing."}]}, {"day": 8, "questions": [{"q": "Decoding \"de\" with a shift of 3 gives \"ah\" instead of \"ab\". What's wrong?\n\nfor letter in original_text:\n    if encode_or_decode == \"decode\":\n        shift_amount *= -1\n    ...", "choices": ["The % 26 is missing", "The sign flip is inside the for loop, so it flips on every letter", "The shift should be 26", "alphabet is in the wrong order"], "answer": 1, "explain": "Inside the loop the shift goes -3, then +3, then -3... so every other letter goes the wrong way. Flip it once, above the loop."}, {"q": "In this code, which is the parameter and which is the argument?\n\ndef fix_leak(pipe):\n    print(f\"Fixing the {pipe}\")\n\nfix_leak(\"elbow\")", "choices": ["pipe is the parameter, \"elbow\" is the argument", "\"elbow\" is the parameter, pipe is the argument", "Both are parameters", "fix_leak is the parameter, \"elbow\" is the argument"], "answer": 0, "explain": "The parameter is the name in the def (the empty slot). The argument is the actual value you pass in the call."}, {"q": "What prints?\n\ndef greet_with(name, location):\n    print(f\"{name} lives in {location}\")\n\ngreet_with(\"Fresno\", \"John\")", "choices": ["John lives in Fresno", "Fresno lives in John", "An error, because the order is wrong", "name lives in location"], "answer": 1, "explain": "Positional arguments match by order: name gets \"Fresno\" and location gets \"John\". Python doesn't know it's nonsense."}, {"q": "Which call prints \"John lives in Fresno\" with the same function?\n\ndef greet_with(name, location):\n    print(f\"{name} lives in {location}\")", "choices": ["greet_with(\"Fresno\", \"John\")", "greet_with(location=\"Fresno\", name=\"John\")", "greet_with(name, location)", "greet_with(\"John\" + \"Fresno\")"], "answer": 1, "explain": "Keyword arguments go to the parameter you name, so order doesn't matter."}, {"q": "What prints?\n\nprint(2 + 25 % 26)", "choices": ["1", "27", "25", "An error"], "answer": 1, "explain": "% runs before +, just like *. So it's 2 + 25 = 27. Write (2 + 25) % 26 to get 1."}, {"q": "alphabet is the list of 26 lowercase letters. You want the position of \"c\" so you can shift it. Which line is right?\n\nletter = \"c\"\nshift_amount = 3", "choices": ["alphabet.index(shift_amount)", "alphabet.index(letter)", "alphabet[letter]", "alphabet.index(3)"], "answer": 1, "explain": ".index() takes the value you're looking for (the letter) and gives back its position. The shift is a count you add afterward."}, {"q": "Which line gives the shifted letter and wraps \"z\" + 3 around to \"c\"?\n\nposition = alphabet.index(letter)", "choices": ["alphabet[position + shift_amount % 26]", "alphabet[(position + shift_amount) % 26]", "alphabet[position] + shift_amount", "alphabet.index(position + shift_amount)"], "answer": 1, "explain": "Add first, then wrap: (25 + 3) % 26 is 2, which is \"c\". Without the parentheses, % only applies to shift_amount and you go past the end of the list."}, {"q": "What does this return for \"hi 5!\" with a shift of 1?\n\nfor letter in text:\n    if letter not in alphabet:\n        output += letter\n    else:\n        output += alphabet[(alphabet.index(letter) + 1) % 26]", "choices": ["\"ij 6!\"", "\"ij 5!\"", "\"ij\"", "An error on the space"], "answer": 1, "explain": "The space, 5 and ! aren't in alphabet, so they're added as-is. Only letters get shifted."}]}, {"day": 9, "questions": [{"q": "What does this print?\n\ntravel_log = {\"France\": [\"Paris\", \"Lille\", \"Dijon\"]}\nprint(travel_log[\"France\"][1])", "choices": ["Paris", "Lille", "France", "An error"], "answer": 1, "explain": "travel_log[\"France\"] gives the list, then [1] picks the second city: Lille."}, {"q": "What happens if you misspell the key?\n\nprogramming_dictionary[\"bug\"]", "choices": ["It returns None", "It returns an empty string", "KeyError", "IndexError"], "answer": 2, "explain": "Wrong or missing keys raise KeyError. Lists give IndexError for a bad index; dictionaries give KeyError for a bad key."}, {"q": "What does this loop print?\n\ncolors = {\"red\": 1, \"blue\": 2}\nfor key in colors:\n    print(key)", "choices": ["1 then 2", "red then blue", "(\"red\", 1) then (\"blue\", 2)", "An error"], "answer": 1, "explain": "for key in a dictionary walks the keys only. Use colors[key] if you also want each value."}, {"q": "What prints?\n\nnested_list = [\"A\", \"B\", [\"C\", \"D\"]]\nprint(nested_list[2][1])", "choices": ["B", "C", "D", "An error"], "answer": 2, "explain": "nested_list[2] is the inner list [\"C\", \"D\"], and [1] picks D."}, {"q": "Which line prints Stuttgart?\n\ntravel_log = {\n    \"Germany\": {\n        \"cities_visited\": [\"Berlin\", \"Hamburg\", \"Stuttgart\"],\n    },\n}", "choices": ["travel_log[\"Germany\"][2]", "travel_log[\"Germany\"][\"cities_visited\"][2]", "travel_log[\"cities_visited\"][\"Germany\"][2]", "travel_log[2][\"Germany\"][\"cities_visited\"]"], "answer": 1, "explain": "Go one layer at a time: country key, then inner key, then list index."}, {"q": "How do you add a new entry or change an existing one?\n\nprogramming_dictionary = {\"Bug\": \"An error...\"}", "choices": ["programming_dictionary.append(\"Loop\", \"...\")", "programming_dictionary[\"Loop\"] = \"The action of doing something over and over again.\"", "programming_dictionary.add(\"Loop\")", "programming_dictionary + {\"Loop\": \"...\"}"], "answer": 1, "explain": "Same syntax for both: dict[key] = value. If the key exists, the value is replaced; if not, a new entry is created."}, {"q": "This is meant to find the highest bid, but it prints a total. What's wrong?\n\nbids = {\"Ann\": 50, \"Bob\": 30}\nhighest_bid = 0\nfor bidder in bids:\n    highest_bid += bids[bidder]\nprint(highest_bid)", "choices": ["It should loop over bids.values()", "+= adds every bid; it should compare with if bids[bidder] > highest_bid:", "highest_bid should start at \"\"", "bidder holds the bid, not the name"], "answer": 1, "explain": "+= always adds, so you get 80. To keep the biggest, compare (if bids[bidder] > highest_bid:) and then set highest_bid = bids[bidder]."}, {"q": "Only some bids end up in the dictionary. Where should bids[name] = price go?\n\nwhile bidding:\n    name = input(\"Name? \")\n    price = int(input(\"Bid? \"))\n    other = input(\"Other bidders? \")\n    if other == \"no\":\n        bidding = False\n    else:\n        bids[name] = price", "choices": ["Inside the else, where it is now", "Inside the if, before bidding = False", "In the main body of the loop, before the if/else, so it runs for every bidder", "After the while loop ends"], "answer": 2, "explain": "Inside one branch it only runs sometimes; here the last bidder (who says \"no\") is never saved. Put it in the loop body so every pass saves a bid."}]}, {"day": 10, "questions": [{"q": "What is output?\n\ndef my_function():\n    result = 3 * 2\n    return result\n\noutput = my_function()", "choices": ["None", "6", "\"result\"", "3 * 2 as text"], "answer": 1, "explain": "return hands back the value of result (6), and that value replaces the call my_function()."}, {"q": "What does this print?\n\ndef add(a, b):\n    print(a + b)\n\ntotal = add(2, 3)\nprint(total)", "choices": ["5 then 5", "5 then None", "None then 5", "An error"], "answer": 1, "explain": "add() prints 5 but returns nothing, so total is None. print only shows a value; return is what hands it back for your code to store."}, {"q": "What does this print?\n\nprint(\"aNGela YU\".title())", "choices": ["ANGELA YU", "angela yu", "Angela Yu", "AnGeLa Yu"], "answer": 2, "explain": ".title() capitalizes the first letter of each word and lowercases the rest, giving back a new string."}, {"q": "What does this print?\n\ndef function_1(text):\n    return text + text\n\ndef function_2(text):\n    return text.title()\n\nprint(function_2(function_1(\"hello\")))", "choices": ["HelloHello", "Hellohello", "hellohello", "Hello hello"], "answer": 1, "explain": "The inner call runs first: function_1 gives \"hellohello\". Then .title() sees one word and capitalizes only its first letter: \"Hellohello\"."}, {"q": "Which line stores the number of characters in \"Angela\" so you can use it later?", "choices": ["len(\"Angela\")", "num_char = print(len(\"Angela\"))", "num_char = len(\"Angela\")", "num_char == len(\"Angela\")"], "answer": 2, "explain": "len() returns 6 and = stores it. print() returns None, so the second option stores None, and == only compares."}, {"q": "What does this print?\n\ndef format_name(f_name, l_name):\n    return f\"{f_name.title()} {l_name.title()}\"\n    print(\"Done\")\n\nprint(format_name(\"john\", \"SMITH\"))", "choices": ["Done then John Smith", "John Smith then Done", "John Smith", "john SMITH"], "answer": 2, "explain": "return ends the function right away, so the print(\"Done\") line after it never runs."}, {"q": "This should return the highest bid but returns a total. Which fix is right?\n\ndef find_highest(bids):\n    highest = 0\n    for bidder in bids:\n        highest += bids[bidder]\n    return highest", "choices": ["Change return highest to print(highest)", "Replace the += line with: if bids[bidder] > highest: highest = bids[bidder]", "Start highest at \"\"", "Move return highest inside the for loop"], "answer": 1, "explain": "+= adds every bid together. To keep the biggest, compare and replace. And keep return after the loop, or it would stop on the first bidder."}, {"q": "What does this print?\n\ndef check(name):\n    if name == \"\":\n        return\n    return name.title()\n\nprint(check(\"\"))", "choices": ["Nothing at all", "None", "An error", "\"\""], "answer": 1, "explain": "The empty return ends the function early and gives back None, so print shows None."}, {"q": "Where does a docstring go?", "choices": ["Above the def line", "On the first indented line right after the def line", "At the end of the function", "Anywhere inside the function"], "answer": 1, "explain": "The docstring is the first indented line after def ...:, written in triple quotes."}, {"q": "What does this print?\n\ndef is_leap(year):\n    if year % 4 == 0:\n        return True\n    return False\n\nprint(is_leap(2024))", "choices": ["False", "True", "None", "2024"], "answer": 1, "explain": "2024 % 4 == 0, so the first return runs and ends the function with True."}, {"q": "math = {\"+\": add, \"-\": subtract}. What does math[\"+\"](2, 3) do?", "choices": ["Prints \"+\"", "Looks up the add function and calls it with 2 and 3, giving 5", "Gives a KeyError", "Adds \"+\" to 2 and 3"], "answer": 1, "explain": "The key gets the function, then (2, 3) calls it. Same idea as the calculator."}, {"q": "In the calculator, why add result = new_result at the end of each loop pass?", "choices": ["To print the answer", "So the next calculation builds on the latest answer", "To stop the loop", "It isn't needed"], "answer": 1, "explain": "Without it, every pass keeps using the old result (5+3, *2, *2 gives 16 instead of 32)."}]}, {"day": 11, "questions": [{"q": "What does this do?\n\nuser_cards = [5, 6]\nuser_cards += 7", "choices": ["Adds 7 to the end of the list", "Gives TypeError: 'int' object is not iterable", "Adds 7 to each card", "Makes the list [12]"], "answer": 1, "explain": "+= on a list is shorthand for extend(), which needs a list. For one item use append()."}, {"q": "What does this print?\n\nprint(sum([11, 10]))", "choices": ["21", "[11, 10]", "2", "Blackjack"], "answer": 0, "explain": "sum() adds up all the items of an iterable."}, {"q": "Which check is a real Blackjack?", "choices": ["sum(cards) == 21", "sum(cards) == 21 and len(cards) == 2", "sum(cards) > 21", "11 in cards"], "answer": 1, "explain": "Blackjack is 21 on exactly two cards (an Ace and a 10). Drawing to 21 later doesn't count."}, {"q": "cards = [11, 5, 10]. Which lines fix the Ace when the score is over 21?", "choices": ["cards.remove(11) then cards.append(1)", "cards.remove(10)", "cards.append(11)", "sum(cards) = 21"], "answer": 0, "explain": "remove(11) deletes the first 11, then append(1) adds the Ace back as a 1. Recalculate the score after."}, {"q": "cards = [11, 11, 9]. What does cards.index(11) give?", "choices": ["0", "1", "2", "[0, 1]"], "answer": 0, "explain": ".index() finds only the FIRST match, so the second 11 is missed."}, {"q": "Why do you get an error if you call calculate_score(cards) on a line above its def?", "choices": ["Python reads top to bottom, so the function isn't defined yet", "The function needs a return", "cards must be a string", "Functions can't be called twice"], "answer": 0, "explain": "A function must be defined above the line that calls it."}, {"q": "The dealer loop is `while computer_score != 0 and computer_score < 17:`. Why the != 0 part?", "choices": ["0 means Blackjack, and 0 is less than 17, so without it the dealer would keep drawing", "0 means the dealer busted", "It stops the loop at 17", "It's not needed"], "answer": 0, "explain": "Blackjack is signalled by 0. Without the check, the dealer would draw on a Blackjack."}, {"q": "Why start computer_score = -1 before the loop instead of 0?", "choices": ["0 already means Blackjack", "-1 is faster", "0 gives a SyntaxError", "Python needs a negative number"], "answer": 0, "explain": "0 is the Blackjack signal, so use an obviously-wrong value like -1. It also makes debugging easier."}, {"q": "In compare(), the first branches are `if u_score == c_score` then `elif c_score == 0`. Why is the Blackjack check above `u_score > c_score`?", "choices": ["if/elif/else is checked top to bottom and the first match returns, so order matters", "Python sorts conditions", "It makes the code run faster", "It doesn't matter"], "answer": 0, "explain": "A Blackjack score of 0 would lose a greater-than comparison, so it must be checked first."}, {"q": "What does this print?\n\nx = 5\nif x > 3:\n    print(\"A\")\nif x > 1:\n    print(\"B\")", "choices": ["A", "B", "A then B", "Nothing"], "answer": 2, "explain": "Two separate ifs both run. With elif only the first match would run, so it would print just A."}, {"q": "What does 'Shadows the name from outer scope' warn about?", "choices": ["A function parameter reuses the name of an outer variable like user_score", "The variable is never used", "The loop never ends", "The function has no return"], "answer": 0, "explain": "Rename the parameter (u_score) with Refactor > Rename, which changes every use in that scope."}, {"q": "The Blackjack game is wrapped in def play_game(). A variable `play` made inside it is used outside, and Python says it is undefined. Why?", "choices": ["A variable made inside a function isn't visible outside it (scope)", "play is a reserved word", "Functions can't use variables", "The loop skipped it"], "answer": 0, "explain": "Scope: names created inside a function only exist inside that function."}]}, {"day": 12, "questions": [{"q": "What does this print?\n\nenemies = 1\ndef increase_enemies():\n    enemies = 2\nincrease_enemies()\nprint(enemies)", "choices": ["1", "2", "NameError", "None"], "answer": 0, "explain": "The function creates a new local enemies. The global one is unchanged."}, {"q": "What happens?\n\ndef drink_potion():\n    potion_strength = 2\ndrink_potion()\nprint(potion_strength)", "choices": ["Prints 2", "Prints None", "NameError: name 'potion_strength' is not defined", "Prints 0"], "answer": 2, "explain": "potion_strength has local scope, so it doesn't exist outside the function."}, {"q": "What does this print?\n\nplayer_health = 10\ndef drink_potion():\n    print(player_health)\ndrink_potion()", "choices": ["10", "NameError", "None", "0"], "answer": 0, "explain": "A global variable can be read from inside a function."}, {"q": "Which one of these has global scope?", "choices": ["A variable defined inside a function", "A variable defined outside every function", "A variable defined inside a nested function", "A function parameter"], "answer": 1, "explain": "Defined at the top level means not inside another function."}, {"q": "Does Python have block scope?", "choices": ["Yes, every indented block is a new scope", "Yes, but only for loops", "No, if/while/for blocks don't create a new scope", "Only inside functions"], "answer": 2, "explain": "A variable made in an if/while/for block is still usable outside that block."}, {"q": "What does this print?\n\ngame_level = 3\nif game_level < 5:\n    new_enemy = \"Skeleton\"\nprint(new_enemy)", "choices": ["Skeleton", "NameError", "None", "3"], "answer": 0, "explain": "No block scope, so new_enemy is available outside the if block."}, {"q": "The same code, but wrapped in a function, with print(new_enemy) outside it. What happens?", "choices": ["Prints Skeleton", "NameError", "Prints None", "Prints 3"], "answer": 1, "explain": "Inside a function, the variable has local scope and can't be seen outside."}, {"q": "What do you write to change a global variable inside a function?", "choices": ["global enemies", "local enemies", "public enemies", "enemies = global"], "answer": 0, "explain": "global enemies tells the function to use the global variable."}, {"q": "Which is the better way to increase a global enemies count?", "choices": ["Use global inside the function", "Return enemies + 1 and save it: enemies = increase_enemies()", "Make two variables with the same name", "Use a block scope"], "answer": 1, "explain": "Using return avoids modifying globals inside functions."}, {"q": "Which name follows the convention for a global constant?", "choices": ["pi", "Pi", "PI", "pI"], "answer": 2, "explain": "Constants are written in ALL UPPERCASE with underscores."}, {"q": "How do you silence the 'might be referenced before assignment' warning?", "choices": ["Create the variable before the if block, e.g. new_enemy = \"\"", "Delete the if", "Put the variable inside a function", "Use global"], "answer": 0, "explain": "Initialize the variable before the block, or ignore the warning if you know your code."}, {"q": "If drink_potion() is defined inside game(), where can you call it?", "choices": ["Anywhere in the file", "Only inside game()", "Only at the top level", "Nowhere"], "answer": 1, "explain": "It has local scope inside game()."}]}, {"day": 13, "questions": [{"q": "What does this print?\n\nfor i in range(1, 4):\n    print(i)", "choices": ["1 2 3 4", "1 2 3", "0 1 2 3", "1 2 3 (on one line)"], "answer": 1, "explain": "range stops before the end number, so it prints 1, 2, 3, each on its own line."}, {"q": "Which numbers can random.randint(1, 6) return?", "choices": ["1 to 5", "0 to 6", "1 to 6", "0 to 5"], "answer": 2, "explain": "randint includes both end numbers."}, {"q": "Why does this sometimes crash?\n\ndice = ['1','2','3','4','5','6']\nn = random.randint(1, 6)\nprint(dice[n])", "choices": ["randint can return 0", "When n is 6, index 6 doesn't exist", "The list has strings", "print can't show lists"], "answer": 1, "explain": "Indexes go 0 to 5, so dice[6] is an IndexError."}, {"q": "What prints when year = 1994?\n\nif year > 1980 and year < 1994:\n    print('Millennial')\nelif year > 1994:\n    print('Gen Z')", "choices": ["Millennial", "Gen Z", "Nothing", "An error"], "answer": 2, "explain": "Both conditions are False for 1994 itself, so nothing prints."}, {"q": "What error does int('twelve') raise?", "choices": ["TypeError", "NameError", "ValueError", "IndexError"], "answer": 2, "explain": "The text can't be turned into a whole number, so it's a ValueError."}, {"q": "Where does the risky line go?\n\n____:\n    age = int(input('Age? '))\nexcept ValueError:\n    print('Please type a number.')", "choices": ["if", "try", "while", "def"], "answer": 1, "explain": "The risky code goes under try:, and except handles the error."}, {"q": "What's the bug?\n\nage = 12\nprint('You are {age} years old')", "choices": ["age should be a string", "Missing f before the string", "Wrong quotes", "print needs a comma"], "answer": 1, "explain": "Without the f, Python prints {age} literally. It's a bug with no error message."}, {"q": "x = 0, then this line runs:\n\nx == 5\n\nWhat is x now?", "choices": ["5", "0", "True", "False"], "answer": 1, "explain": "== only compares, giving False. It doesn't change x."}, {"q": "In a debugger, which button runs just the next line without going inside functions?", "choices": ["Step Into", "Step Out", "Step Over", "Resume"], "answer": 2, "explain": "Step Over runs the next line as one step."}, {"q": "Why does b_list end up with only one item?\n\nfor item in a_list:\n    new_item = item * 2\nb_list.append(new_item)", "choices": ["append only takes one item", "The append is outside the loop", "item * 2 is wrong", "b_list wasn't defined"], "answer": 1, "explain": "The append runs once, after the loop, with the last value. Indent it into the loop."}]}, {"day": 14, "questions": [{"q": "What does this give back?\n\ndef check_answer(guess, a, b):\n    if a > b:\n        return guess == 'a'\n    else:\n        return guess == 'b'\n\ncheck_answer('b', 200, 700)", "choices": ["True", "False", "'b'", "700"], "answer": 0, "explain": "200 > 700 is False, so the else runs: 'b' == 'b' is True."}, {"q": "In the call check_answer('a', 500, 300), what does the parameter b hold?", "choices": ["'a'", "500", "300", "Nothing"], "answer": 2, "explain": "Arguments fill parameters in order: guess='a', a=500, b=300."}, {"q": "What does this print?\n\naccount = {'name': 'Ann', 'follower_count': 90}\nprint(account['follower_count'])", "choices": ["follower_count", "Ann", "90", "An error"], "answer": 2, "explain": "The key goes in square brackets and you get its value, 90."}, {"q": "What does random.choice(data) do?", "choices": ["Picks a random number", "Picks one random item from the list", "Shuffles the list", "Picks two items"], "answer": 1, "explain": "choice returns one item from the list you give it."}, {"q": "Where should score = 0 go so the score keeps adding up?\n\n# spot 1\nwhile not game_over:\n    # spot 2\n    if is_correct:\n        score += 1", "choices": ["Spot 1, before the loop", "Spot 2, inside the loop", "After the loop", "Inside the if"], "answer": 0, "explain": "Before the loop it runs once. Inside, it would reset to 0 every round."}, {"q": "What does this loop do?\n\nwhile account_a == account_b:\n    account_b = random.choice(data)", "choices": ["Runs forever", "Keeps re-picking B until it's different from A", "Picks A again", "Runs exactly once"], "answer": 1, "explain": "It only repeats while they match, so it stops once B is different."}, {"q": "How does this game loop end?\n\ngame_over = False\nwhile not game_over:\n    ...\n    else:\n        game_over = True", "choices": ["When score hits 10", "When game_over becomes True", "It never ends", "When the user types 'b'"], "answer": 1, "explain": "not True is False, so the while condition fails and the loop stops."}, {"q": "Day 13 review: why does dice[6] crash on a 6-item list?", "choices": ["Lists start at 1", "Indexes go 0 to 5", "6 is a string", "randint is broken"], "answer": 1, "explain": "A 6-item list's indexes are 0 to 5, so 6 is an IndexError."}]}, {"day": 15, "questions": [{"q": "What does this print?\n\nMENU = {'latte': {'ingredients': {'milk': 150}, 'cost': 2.5}}\nprint(MENU['latte']['ingredients']['milk'])", "choices": ["latte", "150", "2.5", "An error"], "answer": 1, "explain": "Each bracket goes one level deeper: latte -> ingredients -> milk = 150."}, {"q": "How many times is the coin question asked for a drink with 3 ingredients?\n\nfor item in order_ingredients:\n    if order_ingredients[item] > resources[item]:\n        print('Sorry')\n    payment = process_coins()", "choices": ["0", "1", "3", "Forever"], "answer": 2, "explain": "It's indented inside the for loop, so it runs every pass. Move it after the loop to ask once."}, {"q": "water is short, coffee is fine. What is is_enough at the end?\n\nis_enough = False\nfor item in ['water', 'coffee']:\n    if order[item] > resources[item]:\n        is_enough = False\n    is_enough = True", "choices": ["True", "False", "An error", "None"], "answer": 0, "explain": "The last line resets it to True every pass, hiding the water shortage. Start True and only flip to False in the if."}, {"q": "Which version correctly checks resources?", "choices": ["is_enough = True before the loop; is_enough = False inside the if", "is_enough = False before; True inside the if", "is_enough = True inside the loop every pass", "No flag needed"], "answer": 0, "explain": "Set True once, and only a shortage flips it to False. Nothing sets it back."}, {"q": "What's the problem here?\n\nprocess_coins()\ntotal = process_coins()", "choices": ["Nothing", "The user is asked for coins twice and the first result is thrown away", "total is always 0", "It's a syntax error"], "answer": 1, "explain": "Each call runs the function. Call it once and save it: total = process_coins()."}, {"q": "What does this return when water is short?\n\ndef is_resource_sufficient(order_ingredients):\n    for item in order_ingredients:\n        if order_ingredients[item] > resources[item]:\n            return False\n    return True", "choices": ["True", "False", "None", "It keeps looping"], "answer": 1, "explain": "return False runs as soon as a shortage is found. return True only runs after every item passed."}, {"q": "What does this print?\n\nresources = {'water': 300, 'milk': 200}\nfor key in resources:\n    print(key, resources[key])", "choices": ["water milk", "300 200", "water 300 then milk 200", "An error"], "answer": 2, "explain": "key is the name and resources[key] is its value, printed with a space between."}, {"q": "What is round(3.14159, 2)?", "choices": ["3.1", "3.14", "3.15", "3"], "answer": 1, "explain": "Rounds to 2 decimal places: 3.14."}, {"q": "Day 14 review: this buggy code gives back what for answers ['a','b'] and guesses ['a','a']?\n\ndef count_correct(answers, guesses):\n    count = 0\n    for i in range(len(answers)):\n        if answers[i] == guesses[i]:\n            count += 1\n    return count\n\nprint(count_correct(['a','b'], ['a','a']))", "choices": ["0", "1", "2", "Nothing prints"], "answer": 1, "explain": "Only the first pair matches, so count is 1. And print() is what shows the returned value."}, {"q": "bids = {'Ann': 50, 'Bob': 80}. Inside for bidder in bids, which compares the bid amount?", "choices": ["if bidder > highes t(drink.cost)", "money_machine.make_payment(user_choice)", "money_machine.make_payment()"], "answer": 1, "explain": "make_payment wants the price, drink.cost."}, {"q": "What does result hold?\n\nresult = coffee_maker.make_coffee(drink)", "choices": ["The coffee", "True", "None", "drink"], "answer": 2, "explain": "make_coffee doesn't return anything, so you get None. Just call it."}, {"q": "Where should drink = menu.find_drink(...) go?", "choices": ["Before the while loop", "Inside the loop, after input()", "After the loop", "In menu.py"], "answer": 1, "explain": "It needs this round's user_choice, so it goes after input() each pass."}]}, {"day": 17, "questions": [{"q": "q is a Question object. How do you get its text?", "choices": ["q[\"text\"]", "q.text", "q.text()", "text(q)"], "answer": 1, "explain": "Objects use dot-notation attributes, not dict keys. That was one of your Day 17 misses."}, {"q": "How should QuizBrain get the question list?", "choices": ["from main import question_bank inside quiz_brain", "As an __init__ parameter: self.question_list = q_list", "Read question_data from data.py directly", "Hardcode 12 questions"], "answer": 1, "explain": "Pass it in: quiz = QuizBrain(question_bank). Don't import question_bank into quiz_brain."}, {"q": "Best still_has_questions body?", "choices": ["return False", "return self.question_number < len(self.question_list)", "if True: return True", "return len(self.question_list)"], "answer": 1, "explain": "The comparison itself is True/False. Never hardcode return False."}, {"q": "Which loop keeps the quiz going?", "choices": ["while QuizBrain(question_bank).still_has_questions():", "while quiz.still_has_questions:", "while quiz.still_has_questions():", "has = quiz.still_has_questions()\nwhile has:"], "answer": 2, "explain": "Use the existing quiz object, call with (), and check every loop so it updates."}, {"q": "In def __init__(self, user_id, username), what is self?", "choices": ["The class name", "The object being created", "The first argument you pass", "A global variable"], "answer": 1, "explain": "self is the actual object being initialized. Attribute lines need self."}, {"q": "When is __init__ called?", "choices": ["Only once per class", "Every time a new object is created", "When a method is called", "Never automatically"], "answer": 1, "explain": "The constructor runs for each new object."}, {"q": "follow does user.followers += 1 and self.following += 1. After user_1.follow(user_2), user_2.followers is:", "choices": ["0", "1", "2", "Error"], "answer": 1, "explain": "user_2 is the one being followed, so its followers go up by 1."}, {"q": "Switching data to Open Trivia DB, which file needs the key-name changes?", "choices": ["quiz_brain.py", "question_model.py", "main.py", "All of them"], "answer": 2, "explain": "Only main.py knows the data format; QuizBrain stays untouched (modularity)."}]}, {"day": 18, "questions": [{"q": "Which range includes every side count from 3 through 10?", "choices": ["range(3, 10)", "range(3, 11)", "range(10, 3)", "range(11)"], "answer": 1, "explain": "The stop is excluded. Stop at 11 to include 10."}, {"q": "Why does range(360 / size_of_gap) fail, even when size_of_gap is 5?", "choices": ["A circle cannot have a 5-degree gap.", "range needs a string.", "360 / 5 returns a float; use range(int(360 / size_of_gap)).", "The gap must always be 10."], "answer": 2, "explain": "Division gives 72.0, but range needs an integer. int() makes it 72."}, {"q": "r, g, and b hold one extracted color. Which call adds it as ONE tuple?", "choices": ["rgb_colors.append((r, g, b))", "rgb_colors.append(r, g, b)", "rgb_colors = (r, g, b)", "rgb_colors.append(\"r, g, b\")"], "answer": 0, "explain": "The inner parentheses make one RGB tuple; append adds that one item."}, {"q": "In the lesson's Hirst loop, when should the row-change movements run?", "choices": ["After every dot.", "Before every forward(50).", "Only after all 100 dots.", "After each tenth dot: if dot_count es Fish's own methods", "Makes Animal inherit from Fish"], "answer": 1, "explain": "super refers to the superclass, so this initializes everything the superclass has in Fish."}, {"q": "Fish redefines breathe() as super().breathe() and then prints \"doing this underwater\". What does nemo.breathe() print?", "choices": ["Only \"doing this underwater\"", "Only \"Inhale, exhale\"", "\"Inhale, exhale\" then \"doing this underwater\"", "\"doing this underwater\" then \"Inhale, exhale\""], "answer": 2, "explain": "super().breathe() runs the parent's version first, then Fish adds its own twist."}, {"q": "How should the Food class get Turtle's abilities?", "choices": ["self.food = Turtle() in __init__", "class Food(Turtle): plus super().__init__()", "import Food from turtle", "class Turtle(Food):"], "answer": 1, "explain": "Food should be a turtle itself, so it inherits from Turtle and calls the superclass initializer."}, {"q": "A turtle is 20 by 20. How does the lesson make the food 10 by 10?", "choices": ["shapesize(stretch_len=2, stretch_wid=2)", "shapesize(stretch_len=0.5, stretch_wid=0.5)", "shape(\"10x10\")", "speed(\"fastest\")"], "answer": 1, "explain": "Stretching length and width by 0.5 halves the size."}, {"q": "Why does the food use speed(\"fastest\")?", "choices": ["So the snake moves faster", "So you don't see the food animate from the center to its spot", "So the food changes color", "So the food stays 10 by 10"], "answer": 1, "explain": "Without it, you'd watch the food get created at the center and then move."}, {"q": "Why pick the food's x and y with random.randint(-280, 280)?", "choices": ["The screen only goes to 280", "Food at the very edge is hard to reach and the snake would probably die on the wall", "randint can't go past 280", "The scoreboard is at 300"], "answer": 1, "explain": "The screen goes to 300, but staying in from the edge keeps the food reachable."}, {"q": "Which check detects the snake eating the food?", "choices": ["if snake.head == food let sel=new Set(['all']),list=[],i=0,seen=new Set();
const ck=k=>k.day+'|'+k.q;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/ \/ (?=<code>)/g,'<br>');
function buildDays(){const d=document.getElementById('days');d.innerHTML='';
 const mk=(label,key)=>{const b=document.createElement('button');b.textContent=label;b.className=sel.has(key)?'on':'';
  b.onclick=()=>{if(key==='all'){sel=new Set(['all'])}else{sel.delete('all');sel.has(key)?sel.delete(key):sel.add(key);if(!sel.size)sel.add('all')}buildDays();load()};d.appendChild(b)};
 mk('All days','all');DECKS.forEach(x=>mk('Day '+x.day,x.day));}
function load(){list=[];DECKS.forEach(x=>{if(sel.has('all')||sel.has(x.day))x.cards.forEach(c=>list.push({day:x.day,q:c[0],a:c[1]}))});i=0;show();}
function show(){const c=document.getElementById('card');c.classList.remove('flipped');
 if(!list.length){q.innerHTML='No cards yet';a.innerHTML='';return}
 const k=list[i];setTimeout(()=>{a.innerHTML=fmt(k.a)},150);q.innerHTML=fmt(k.q);
 tagF.textContent=tagB.textContent='Day '+k.day;
 count.textContent=`Card ${i+1} of ${list.length}`;bar.style.width=((i+1)/list.length*100)+'%';upd();}
function flip(){const c=document.getElementById('card');c.classList.toggle('flipped');if(c.classList.contains('flipped')&&list.length){seen.add(ck(list[i]));upd()}}
function upd(){done.textContent='Reviewed '+list.filter(k=>seen.has(ck(k))).length+' of '+list.length+' cards (a card counts once you flip it)'}
function resetDone(){seen=new Set();upd()}
function markAll(){list.forEach(k=>seen.add(ck(k)));upd()}
function copyDone(){const n=list.filter(k=>seen.has(ck(k))).length,days=sel.has('all')?'all days':'Day '+[...sel].sort((a,b)=>a-b).join(', ');const s=`Flashcards (${days}): ${n}/${list.length} reviewed\n`;navigator.clipboard.writeText(s).then(()=>alert('Copied! Paste it into the chat with Practice Coach.'),()=>prompt('Copy this:',s));}
function move(n){if(!list.length)return;i=(i+n+list.length)%list.length;show()}
function shuffle(){for(let j=list.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[list[j],list[r]]=[list[r],list[j]]}i=0;show()}
document.addEventListener('keydown',e=>{if(mode!=='f')return;if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key===' '){e.preventDefault();flip()}else if(e.key.toLowerCase()==='s')shuffle()});
let mode='f',qd=null,qi=0,qs=[],picked=null;
function tab(m){mode=m;tabF.className=m==='f'?'on':'';tabQ.className=m==='q'?'on':'';
 flashView.classList.toggle('hidden',m!=='f');days.classList.toggle('hidden',m!=='f');quizView.classList.toggle('hidden',m!=='q');
 sub.textContent=m==='f'?'Click the card (or press Space) to flip it':'Pick a day and test yourself';if(m==='q')quizDays();}
function best(d){return localStorage.getItem('best-day-'+d)}
function quizDays(){qdays.innerHTML='';if(!QUIZZES.length){quiz.innerHTML='<div class="qtext">No quizzes yet.</div>';return}
 QUIZZES.forEach(z=>{const b=document.createElement('button');b.className=qd===z.day?'on':'';
  const bs=best(z.day);b.innerHTML='Day '+z.day+(bs?'<span class="best">best '+bs+'</span>':'');b.onclick=()=>startQuiz(z.day);qdays.appendChild(b)});
 if(qd===null)startQuiz(QUIZZES[QUIZZES.length-1].day);}
function startQuiz(d){qd=d;qi=0;qs=[];quizDays();renderQ();}
function qtext(s){const parts=s.split('\n\n');let h='<div>'+fmt(parts[0])+'</div>';if(parts.length>1)h+='<pre>'+esc(parts.slice(1).join('\n\n'))+'</pre>';return h}
function renderQ(){const z=QUIZZES.find(x=>x.day===qd),Q=z.questions;picked=null;
 if(qi>=Q.length)return results(z);const k=Q[qi];
 let h=`<div class="qhead"><span>Day ${qd} pop quiz</span><span>Question ${qi+1} of ${Q.length}</span></div><div class="qtext">${qtext(k.q)}</div>`;
 k.choices.forEach((c,n)=>h+=`<button class="choice" onclick="pick(${n})">${String.fromCharCode(65+n)}. ${esc(c)}</button>`);
 h+='<div id="fb"></div><div class="qnav"><button id="nxt" class="hidden" onclick="qi++;renderQ()">Next &rarr;</button></div>';quiz.innerHTML=h;}
function pick(n){if(picked!==null)return;picked=n;const k=QUIZZES.find(x=>x.day===qd).questions[qi],ok=n===k.answer;
 const bs=quiz.querySelectorAll('.choice');bs.forEach((b,j)=>{b.disabled=true;if(j===k.answer)b.classList.add('right');else if(j===n)b.classList.add('wrong')});
 qs.push({q:k.q,ok,yours:k.choices[n],right:k.choices[k.answer]});
 fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct!':'Not quite.'}</b> ${fmt(k.explain||'')}</div>`;nxt.classList.remove('hidden');}
function results(z){const right=qs.filter(x=>x.ok).length,tot=qs.length,pct=right+'/'+tot;
 const prev=best(z.day);if(!prev||right>parseInt(prev))localStorage.setItem('best-day-'+z.day,pct);
 const misses=qs.filter(x=>!x.ok);let h=`<div class="qhead"><span>Day ${z.day} results</span><span></span></div><div class="score">${pct}</div>`;
 h+=`<div style="text-align:center;color:var(--muted);margin:6px 0 16px">${right===tot?'Perfect score!':right>=tot*.7?'Nice work. Review the misses below.':'Worth another pass on these.'}</div>`;
 misses.forEach(m=>h+=`<div class="miss">${qtext(m.q)}<div style="margin-top:6px">Your answer: <b>${esc(m.yours)}</b><br>Correct: <b>${esc(m.right)}</b></div></div>`);
 h+='<div class="qnav"><button class="ghost" onclick="copyRes()">Copy results for Practice Coach</button><button onclick="startQuiz(qd)">Retake</button></div>';
 quiz.innerHTML=h;quizDays();}
function copyRes(){const right=qs.filter(x=>x.ok).length;let s=`Day ${qd} pop quiz: ${right}/${qs.length}\n`;
 qs.filter(x=>!x.ok).forEach(m=>s+=`MISSED: ${m.q.replace(/\n+/g,' | ')} -> I said "${m.yours}", correct is "${m.right}"\n`);
 navigator.clipboard.writeText(s).then(()=>alert('Copied! Paste it into the chat with Practice Coach.'),()=>prompt('Copy this:',s));}
buildDays();load();
</script></body></html>
