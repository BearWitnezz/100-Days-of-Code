<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Snake Game</title>
  <meta name="description" content="Steer the snake to the blue food. Hitting the wall or your own tail ends the game.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='7' y='3' width='4' height='4' fill='%23fff'/%3E%3Crect x='3' y='7' width='8' height='4' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #111;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .stage { width: min(100%, 600px, calc(100vh - 230px)); }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
      border: 2px solid #555;
      touch-action: none;
    }
    .hint { margin: 0; font-size: 15px; color: #d0d0d0; text-align: center; }
    .pad { display: grid; justify-items: center; gap: 8px; }
    .row { display: flex; gap: 8px; }
    button {
      min-width: 76px;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid #888;
      border-bottom-width: 3px;
      border-radius: 8px;
      background: #f4f4f4;
      color: #111;
      font: 700 15px Arial, sans-serif;
      touch-action: manipulation;
      user-select: none;
    }
    button:active { border-bottom-width: 1px; transform: translateY(2px); }
    button:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>My Snake Game</h1>
  <div class="stage">
    <canvas id="screen" width="600" height="600" aria-label="Snake game"></canvas>
  </div>
  <p class="hint">Arrow keys steer. On a phone, use the buttons.</p>
  <div class="pad">
    <button type="button" id="up">Up</button>
    <div class="row">
      <button type="button" id="left">Left</button>
      <button type="button" id="down">Down</button>
      <button type="button" id="right">Right</button>
    </div>
  </div>
  <script>
    "use strict";

    var VIEW = 600;
    var STEP = 20;
    var UP = 90;
    var DOWN = 270;
    var LEFT = 180;
    var RIGHT = 0;
    var OPPOSITE = {};
    OPPOSITE[UP] = DOWN;
    OPPOSITE[DOWN] = UP;
    OPPOSITE[LEFT] = RIGHT;
    OPPOSITE[RIGHT] = LEFT;

    var canvas = document.getElementById("screen");
    var ctx = canvas.getContext("2d");
    var segments = [];
    var heading = RIGHT;
    var food = { x: 0, y: 0 };
    var score = 0;
    var alive = true;
    var timer = 0;

    function sx(x) { return VIEW / 2 + x; }
    function sy(y) { return VIEW / 2 - y; }

    function randint(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function placeFood() {
      food.x = randint(-250, 250);
      food.y = randint(-250, 250);
    }

    function createSnake() {
      segments = [
        { x: 0, y: 0 },
        { x: -20, y: 0 },
        { x: -40, y: 0 }
      ];
      heading = RIGHT;
    }

    function setHeading(next) {
      if (!alive) return;
      if (heading !== OPPOSITE[next]) heading = next;
    }

    function move() {
      var i, prev;
      for (i = segments.length - 1; i > 0; i -= 1) {
        prev = segments[i - 1];
        segments[i].x = prev.x;
        segments[i].y = prev.y;
      }
      if (heading === RIGHT) segments[0].x += STEP;
      else if (heading === LEFT) segments[0].x -= STEP;
      else if (heading === UP) segments[0].y += STEP;
      else segments[0].y -= STEP;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function tick() {
      var head, tail, i;
      if (!alive) return;
      move();
      head = segments[0];
      if (distance(head, food) < 15) {
        placeFood();
        tail = segments[segments.length - 1];
        segments.push({ x: tail.x, y: tail.y });
        score += 1;
      }
      if (head.x > 280 || head.x < -280 || head.y > 280 || head.y < -280) {
        alive = false;
      }
      for (i = 1; i < segments.length; i += 1) {
        if (distance(head, segments[i]) < 10) alive = false;
      }
      draw();
      if (alive) timer = window.setTimeout(tick, 100);
    }

    function draw() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(VIEW * dpr)) {
        canvas.width = Math.round(VIEW * dpr);
        canvas.height = Math.round(VIEW * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, VIEW, VIEW);
      ctx.fillStyle = "blue";
      ctx.beginPath();
      ctx.arc(sx(food.x), sy(food.y), 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      segments.forEach(function (segment) {
        ctx.fillRect(sx(segment.x) - 10, sy(segment.y) - 10, 20, 20);
      });
      ctx.font = "17pt Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("Score: " + score, sx(0), sy(270));
      if (!alive) ctx.fillText("GAME OVER", sx(0), sy(0));
    }

    function bindTap(id, headingValue) {
      var button = document.getElementById(id);
      button.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        setHeading(headingValue);
      });
    }

    createSnake();
    placeFood();
    draw();
    timer = window.setTimeout(tick, 100);

    window.addEventListener("keydown", function (event) {
      if (event.key === "ArrowUp") { event.preventDefault(); setHeading(UP); }
      else if (event.key === "ArrowDown") { event.preventDefault(); setHeading(DOWN); }
      else if (event.key === "ArrowLeft") { event.preventDefault(); setHeading(LEFT); }
      else if (event.key === "ArrowRight") { event.preventDefault(); setHeading(RIGHT); }
    });
    bindTap("up", UP);
    bindTap("down", DOWN);
    bindTap("left", LEFT);
    bindTap("right", RIGHT);
  </script>
</body>
</html>
